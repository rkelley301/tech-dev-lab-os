/* ---------- 3.2 Permissive Detective ---------- */
const PERM32 = [
  { id: 'es', tag: 'EStop_OK', ins: 'XIC', desc: 'E-stop chain healthy', field: 'E-stop PB-1', fixTxt: 'Reset E-stop', bad: 0 },
  { id: 'guard', tag: 'Guard_Closed', ins: 'XIC', desc: 'Guard door closed (ZS-12)', field: 'Guard door', fixTxt: 'Close guard door', bad: 0 },
  { id: 'lube', tag: 'Lube_Press_OK', ins: 'XIC', desc: 'Lube pressure above setpoint (PSL-14)', field: 'Lube pump P-3', fixTxt: 'Start lube pump', bad: 0, delay: 1800 },
  { id: 'dv', tag: 'Disch_Valve_ZSO', ins: 'XIC', desc: 'Discharge valve open limit (XV-20)', field: 'Discharge valve XV-20', fixTxt: 'Open discharge valve', bad: 0, delay: 2400 },
  { id: 'flt', tag: 'Motor_Fault', ins: 'XIO', desc: 'VFD fault active', field: 'VFD-7', fixTxt: 'Reset VFD fault', bad: 1 },
];
function newSession32() {
  const n = rint(1, 3); const blocked = shuffle(PERM32.map(p => p.id)).slice(0, n);
  const tags = {}; PERM32.forEach(p => { tags[p.tag] = blocked.includes(p.id) ? p.bad : 1 - p.bad; });
  return { tags, blocked, phase: 'diagnose', flags: [], run: false, pending: {} };
}
function PermissiveDetective() {
  const g = useGame();
  const [fb, report] = useFeedback('3.2');
  const [s, setS] = useState(newSession32);
  const [wins, setWins] = usePersist('3.2.wins', 0);
  const [startHeld, setStartHeld] = useState(false);
  const truth = p => p.ins === 'XIC' ? s.tags[p.tag] === 1 : s.tags[p.tag] === 0;
  const allTrue = PERM32.every(truth);
  const firstFalse = PERM32.findIndex(p => !truth(p));

  useEffect(() => {
    if (!allTrue && s.run) { setS(x => ({ ...x, run: false })); sfx('thunk'); }
  }, [allTrue, s.run]);
  useEffect(() => {
    if (startHeld && allTrue && !s.run) {
      setS(x => ({ ...x, run: true })); sfx('thunk');
      if (s.phase === 'fix') {
        const n = wins + 1; setWins(n);
        report({ kind: 'ok', xp: 30, key: 'run', title: 'Motor running and sealed in', text: 'All five permissives are true, start closes, and Motor_Run seals itself in through its own branch. Releasing start does not drop it. Losing any permissive would.' });
        setS(x => ({ ...x, phase: 'done' }));
        if (n >= 2) g.complete('3.2');
      }
    }
  }, [startHeld, allTrue]);

  const toggleFlag = id => { if (s.phase !== 'diagnose') return; sfx('click'); setS(x => ({ ...x, flags: x.flags.includes(id) ? x.flags.filter(f => f !== id) : [...x.flags, id] })); };
  const submit = () => {
    const want = [...s.blocked].sort().join(), got = [...s.flags].sort().join();
    if (want === got) {
      report({ kind: 'ok', xp: 25, key: 'diag', title: `Diagnosis correct: ${s.blocked.length} open`, text: 'Each contact is judged on its own: an XIC is true when its tag is 1, an XIO is true when its tag is 0. Motor_Fault = 1 on an XIO is false and blocks the rung. Now fix the field conditions. Never force a permissive to get a machine running.' });
      setS(x => ({ ...x, phase: 'fix' }));
    } else {
      const wrong = s.flags.find(f => !s.blocked.includes(f)); const missed = s.blocked.find(b => !s.flags.includes(b));
      const p = PERM32.find(x => x.id === (wrong || missed));
      report({ kind: 'bad', key: 'diag-miss', title: wrong ? `${p.tag} is not blocking` : `You missed one`,
        text: wrong ? `${p.tag} = ${s.tags[p.tag]} on an ${p.ins}, which makes the contact ${truth(p) ? 'true' : 'false'}. ${p.ins === 'XIO' ? 'An XIO passes power when its bit is 0.' : 'An XIC passes power when its bit is 1.'}`
          : `Check every contact, not just the first false one. Power flow stops at the first open contact, but anything after it can be open too, and you will find it the hard way after fixing the first.` });
    }
  };
  const fix = p => {
    if (s.phase !== 'fix' || truth(p) || s.pending[p.id]) return;
    sfx('click');
    const apply = () => setS(x => ({ ...x, tags: { ...x.tags, [p.tag]: 1 - p.bad }, pending: { ...x.pending, [p.id]: false } }));
    if (p.delay) { setS(x => ({ ...x, pending: { ...x.pending, [p.id]: true } })); setTimeout(apply, p.delay); } else apply();
  };
  const reset = () => { setS(newSession32()); report({ kind: 'info', title: 'New fault scenario', text: 'Start is blocked again. Read the rung.' }); };

  return (
    <div className="bay">
      <BayHeader id="3.2" title="Permissive detective" lede="A start command is blocked. Read the live rung, flag every open contact, then fix the field devices and start the motor."
        right={<div className="row"><span className="chip lime">{Math.min(2, wins)}/2 restored</span><button className="btn ghost sm" onClick={reset}>New scenario</button></div>} />
      <div className="ladder">
        <div className="mono tiny" style={{ color: '#6f7d91', marginBottom: 6 }}>MotorCtl rung 12 (online)</div>
        <div className="rung" style={{ minHeight: 110 }}>
          <div className="rail-l hot" />
          {PERM32.map((p, i) => {
            const powered = firstFalse === -1 || i <= firstFalse;
            return (
              <React.Fragment key={p.id}>
                <div className={'wireh' + (powered ? ' hot' : '')} />
                <button className={'ins' + (truth(p) ? ' true' : '') + (s.flags.includes(p.id) ? ' flag' : '')} onClick={() => toggleFlag(p.id)}
                  style={{ cursor: s.phase === 'diagnose' ? 'pointer' : 'default', background: 'transparent' }} aria-pressed={s.flags.includes(p.id)} title="Click to flag as open">
                  <span className="sym">{p.ins === 'XIC' ? '-| |-' : '-|/|-'}</span>
                  <span className="tag">{p.tag}</span>
                  <span className="mono tiny" style={{ color: s.tags[p.tag] ? 'var(--lime)' : '#6b7a8f' }}>{p.ins} = {s.tags[p.tag]}</span>
                </button>
              </React.Fragment>
            );
          })}
          <div className={'wireh' + (allTrue ? ' hot' : '')} />
          <div style={{ display: 'flex', flexDirection: 'column', gap: 4, borderLeft: `2px solid ${allTrue ? 'var(--cyan)' : '#39465a'}`, borderRight: `2px solid ${allTrue && (startHeld || s.run) ? 'var(--cyan)' : '#39465a'}`, padding: '0 6px' }}>
            <div className={'ins' + (startHeld ? ' true' : '')}><span className="sym">-| |-</span><span className="tag">Start_PB</span></div>
            <div className={'ins' + (s.run ? ' true' : '')}><span className="sym">-| |-</span><span className="tag">Motor_Run</span></div>
          </div>
          <div className={'wireh' + (s.run ? ' hot' : '')} />
          <div className={'ins' + (s.run ? ' true' : '')}><span className={'sym' + (s.run ? ' coil-on' : '')}>-( )-</span><span className="tag">Motor_Run</span></div>
          <div className="wireh" style={{ flex: '0 0 10px' }} />
          <div className="rail-r" />
        </div>
      </div>
      <div className="grid2">
        <div className="panel panel-pad stack">
          <div className="row" style={{ justifyContent: 'space-between' }}>
            <span className="sub" style={{ margin: 0 }}>{s.phase === 'diagnose' ? 'Step 1: flag every open contact' : s.phase === 'fix' ? 'Step 2: fix it in the field' : 'Running'}</span>
            <span className={'chip ' + (s.run ? 'lime' : 'rose')}>{s.run ? 'MOTOR RUNNING' : 'STOPPED'}</span>
          </div>
          {s.phase === 'diagnose' && <div className="row"><button className="btn cyan" onClick={submit} disabled={!s.flags.length}>Submit diagnosis ({s.flags.length} flagged)</button></div>}
          <div className="stack" style={{ gap: 8 }}>
            {PERM32.map(p => (
              <div key={p.id} className="row" style={{ justifyContent: 'space-between' }}>
                <span className="small"><span className="mono" style={{ color: 'var(--violet)' }}>{p.tag}</span> <span className="muted">{p.desc}</span></span>
                {s.phase !== 'diagnose' && !truth(p) && (
                  <button className="btn sm amber" onClick={() => fix(p)} disabled={!!s.pending[p.id]}>{s.pending[p.id] ? (p.id === 'lube' ? 'Building pressure...' : 'Valve stroking...') : p.fixTxt}</button>
                )}
                {s.phase !== 'diagnose' && truth(p) && <span className="chip lime">ok</span>}
              </div>
            ))}
          </div>
          <div className="row">
            <button className={'btn lime' + (startHeld ? ' lit' : '')} disabled={s.phase === 'diagnose'}
              onPointerDown={e => { e.preventDefault(); setStartHeld(true); }} onPointerUp={() => setStartHeld(false)} onPointerLeave={() => setStartHeld(false)}
              onKeyDown={e => { if ((e.key === ' ' || e.key === 'Enter') && !e.repeat) setStartHeld(true); }} onKeyUp={() => setStartHeld(false)}>Hold start</button>
            {s.phase === 'fix' && !allTrue && <span className="small muted">Start does nothing until every permissive is true.</span>}
          </div>
        </div>
        <Feedback fb={fb} placeholder="Online, each instruction highlights on its own truth. Power flow ends at the first false contact, but that does not mean it is the only one." />
      </div>
    </div>
  );
}

/* ---------- 3.3 Timer Trace ---------- */
function TimerTrace() {
  const g = useGame();
  const [fb, report] = useFeedback('3.3');
  const [type, setType] = useState('TON');
  const [pre, setPre] = useState(3000);
  const [src, setSrc] = useState('manual');
  const [hi, setHi] = useState(2000);
  const [lo, setLo] = useState(1500);
  const [held, setHeld] = useState(false);
  const [goals, setGoals] = usePersist('3.3.goals', {});
  const N = 200, DT = 50;
  const [hist, setHist] = useState(() => ({ in: Array(N).fill(0), en: Array(N).fill(0), tt: Array(N).fill(0), dn: Array(N).fill(0), acc: Array(N).fill(0) }));
  const [snap, setSnap] = useState({ acc: 0, dn: false, en: false, tt: false });
  const T = useRef({ acc: 0, dn: false, tt: false, en: false, edges: 0, prevIn: false, t: 0 });
  const cfg = useRef({}); cfg.current = { type, pre, src, hi, lo, held };
  const goalsRef = useRef(goals); goalsRef.current = goals;

  const award = useCallback((k, title, text) => {
    if (goalsRef.current[k]) return;
    const ng = { ...goalsRef.current, [k]: true }; goalsRef.current = ng; setGoals(ng);
    report({ kind: 'ok', xp: 30, key: k, title, text });
    if (ng.ton && ng.tof && ng.rto) g.complete('3.3');
  }, [report, g, setGoals]);

  useEffect(() => {
    const id = setInterval(() => {
      const c = cfg.current, t = T.current;
      t.t += DT;
      const input = c.src === 'manual' ? c.held : (t.t % (c.hi + c.lo)) < c.hi;
      if (input && !t.prevIn) t.edges++;
      t.prevIn = input; t.en = input;
      const P = Math.max(1, c.pre);
      if (c.type === 'TON') {
        if (input) { t.acc = Math.min(P, t.acc + DT); t.dn = t.acc >= P; t.tt = !t.dn; } else { t.acc = 0; t.dn = false; t.tt = false; }
        if (t.dn && P >= 3000) award('ton', 'TON: done bit after a full preset', `The input stayed true for ${(P / 1000).toFixed(1)} s without dropping, so ACC reached PRE and DN set. Any drop in the rung resets ACC to zero, which is why a TON filters out short blips.`);
      } else if (c.type === 'TOF') {
        if (input) { t.acc = 0; t.dn = true; t.tt = false; }
        else if (t.dn) { t.acc = Math.min(P, t.acc + DT); t.tt = t.acc < P; if (t.acc >= P) { t.dn = false; t.tt = false; } }
        else { t.tt = false; }
        if (!input && t.dn && t.tt) award('tof', 'TOF: output held after the input dropped', 'DN went true the instant the rung went true and stayed true while ACC timed after the rung went false. Classic use: keep a cooling fan running for a while after the motor stops.');
      } else {
        if (input) { t.acc = Math.min(P, t.acc + DT); t.dn = t.acc >= P; t.tt = !t.dn; } else { t.tt = false; }
        if (t.dn && t.edges >= 2) award('rto', 'RTO: accumulated across pulses', 'The retentive timer kept its ACC while the rung was false and picked up where it left off. It never resets by itself; only a RES instruction clears it, which is why RTOs track things like total run hours.');
      }
      setSnap({ acc: t.acc, dn: t.dn, en: t.en, tt: t.tt });
      setHist(h => ({
        in: [...h.in.slice(1), input ? 1 : 0], en: [...h.en.slice(1), t.en ? 1 : 0], tt: [...h.tt.slice(1), t.tt ? 1 : 0],
        dn: [...h.dn.slice(1), t.dn ? 1 : 0], acc: [...h.acc.slice(1), t.acc / P],
      }));
    }, DT);
    return () => clearInterval(id);
  }, [award]);

  const resetTimer = () => { T.current.acc = 0; T.current.dn = false; T.current.tt = false; T.current.edges = T.current.prevIn ? 1 : 0; sfx('click'); };
  const switchType = v => { setType(v); resetTimer(); T.current.edges = 0; };
  const pct = snap.acc / Math.max(1, pre);
  const addr = type === 'RTO' ? 'Run_Hours' : type === 'TON' ? 'Fill_Delay' : 'Fan_Rundown';
  return (
    <div className="bay">
      <BayHeader id="3.3" title="Timer trace" lede="Drive a timer with a held button or a pulse train. Watch EN, TT, DN and the accumulator on the scope. Clear the three observations below by making each behaviour happen."
        right={<span className="chip lime">{['ton', 'tof', 'rto'].filter(k => goals[k]).length}/3 observed</span>} />
      <div className="grid2">
        <div className="stack">
          <div className="panel panel-pad stack">
            <div className="row" style={{ gap: 12, alignItems: 'flex-end' }}>
              <div className="field"><label>Instruction</label><Seg value={type} onChange={switchType} options={['TON', 'TOF', 'RTO']} label="Timer type" /></div>
              <div className="field" style={{ width: 120 }}><label>PRE (ms)</label><input className="inp" value={pre} onChange={e => setPre(clamp(parseInt(e.target.value || '0', 10) || 0, 0, 60000))} inputMode="numeric" /></div>
              <div className="field"><label>Rung input</label><Seg value={src} onChange={setSrc} options={[{ v: 'manual', l: 'Hold button' }, { v: 'pulse', l: 'Pulse train' }]} label="Input source" /></div>
            </div>
            {src === 'pulse' ? (
              <div className="row" style={{ gap: 12 }}>
                <div className="field" style={{ width: 120 }}><label>High time (ms)</label><input className="inp" value={hi} onChange={e => setHi(clamp(parseInt(e.target.value || '0', 10) || 0, 100, 20000))} /></div>
                <div className="field" style={{ width: 120 }}><label>Low time (ms)</label><input className="inp" value={lo} onChange={e => setLo(clamp(parseInt(e.target.value || '0', 10) || 0, 100, 20000))} /></div>
              </div>
            ) : (
              <div className="row">
                <button className={'btn cyan' + (held ? ' lit' : '')} onPointerDown={e => { e.preventDefault(); setHeld(true); }} onPointerUp={() => setHeld(false)} onPointerLeave={() => setHeld(false)}
                  onKeyDown={e => { if ((e.key === ' ' || e.key === 'Enter') && !e.repeat) setHeld(true); }} onKeyUp={() => setHeld(false)}>Hold input</button>
                <span className="small muted">Input is {held ? 'true' : 'false'}</span>
              </div>
            )}
            {type === 'RTO' && <div className="row"><button className="btn rose sm" onClick={resetTimer}>RES {addr}</button><span className="small muted">Only a RES clears an RTO.</span></div>}
          </div>
          <div className="ladder">
            <div className="rung">
              <div className="rail-l hot" /><div className="wireh hot" style={{ flex: '0 0 20px' }} />
              <div className={'ins' + (snap.en ? ' true' : '')}><span className="sym">-| |-</span><span className="tag">Input</span></div>
              <div className={'wireh' + (snap.en ? ' hot' : '')} style={{ flex: '0 0 20px' }} />
              <div className="ins" style={{ border: '1px solid #3a4a60', borderRadius: 6, padding: '6px 10px', alignItems: 'flex-start', minWidth: 170 }}>
                <span className="mono small" style={{ color: 'var(--violet)' }}>{type} {addr}</span>
                <span className="mono tiny">PRE {pre}</span>
                <span className="mono tiny" style={{ color: 'var(--cyan)' }}>ACC {Math.round(snap.acc)}</span>
                <div style={{ width: '100%', height: 4, background: '#1c2633', borderRadius: 2 }}><div style={{ width: `${clamp(pct, 0, 1) * 100}%`, height: '100%', background: 'var(--cyan)', borderRadius: 2 }} /></div>
              </div>
              <div className="stack" style={{ gap: 3, marginLeft: 8 }}>
                {[['EN', snap.en], ['TT', snap.tt], ['DN', snap.dn]].map(([k, v]) => <span key={k} className="mono tiny row" style={{ gap: 5 }}><span className={'led ' + (v ? 'cy' : '')} />{k}</span>)}
              </div>
              <div className="wireh" />
              <div className="rail-r" />
            </div>
            <div className="rung" style={{ minHeight: 50 }}>
              <div className="rail-l hot" /><div className="wireh hot" style={{ flex: '0 0 20px' }} />
              <div className={'ins' + (snap.dn ? ' true' : '')}><span className="sym">-| |-</span><span className="tag">{addr}.DN</span></div>
              <div className={'wireh' + (snap.dn ? ' hot' : '')} />
              <div className={'ins' + (snap.dn ? ' true' : '')}><span className={'sym' + (snap.dn ? ' coil-on' : '')}>-( )-</span><span className="tag">Output</span></div>
              <div className="wireh" style={{ flex: '0 0 10px' }} /><div className="rail-r" />
            </div>
          </div>
          <Scope label="Timer bits" height={210} traces={[
            { name: 'IN', color: '#e2e8f0', data: hist.in }, { name: 'EN', color: '#a78bfa', data: hist.en }, { name: 'TT', color: '#f5a524', data: hist.tt },
            { name: 'DN / OUT', color: '#22d3ee', data: hist.dn }, { name: 'ACC/PRE', color: '#84cc16', data: hist.acc },
          ]} />
          <div className="tiny muted mono">10 s window, 1 s/div</div>
        </div>
        <div className="stack">
          <div className="panel panel-pad stack">
            <div className="sub" style={{ margin: 0 }}>Observations to make</div>
            {[['ton', 'TON', 'Get a TON done bit with PRE of 3000 ms or more.'], ['tof', 'TOF', 'Catch a TOF holding DN true after the input goes false.'], ['rto', 'RTO', 'Reach an RTO done bit using at least two separate input pulses.']].map(([k, t, d]) => (
              <div key={k} className="row small" style={{ alignItems: 'flex-start' }}><span className={'led ' + (goals[k] ? 'on' : '')} style={{ marginTop: 6 }} /><span><span className="mono" style={{ color: 'var(--violet)' }}>{t}</span> {d}</span></div>
            ))}
          </div>
          <div className="panel panel-pad small">
            <div className="sub">Bit behaviour</div>
            {type === 'TON' && <p style={{ margin: 0 }}>EN follows the rung. ACC counts while the rung is true. DN sets when ACC reaches PRE. TT is true while timing. Rung false resets everything, ACC included.</p>}
            {type === 'TOF' && <p style={{ margin: 0 }}>DN goes true immediately with the rung. When the rung goes false, ACC times up and DN stays true until ACC reaches PRE. Rung true again resets ACC.</p>}
            {type === 'RTO' && <p style={{ margin: 0 }}>Like a TON, but ACC is retained when the rung goes false. DN stays set once reached. Only RES clears ACC and DN.</p>}
            <p className="tiny muted" style={{ margin: '6px 0 0' }}>Bit names and timebases follow common Logix-style timers. Other platforms (IEC 61131-3 TON/TOF, SLC timebases) name things differently.</p>
          </div>
          <Feedback fb={fb} />
        </div>
      </div>
    </div>
  );
}

/* ---------- 4.1 Rung Editor ---------- */
const TAGDB41 = [
  { t: 'Start_PB', type: 'BOOL', desc: 'Start pushbutton, NO' },
  { t: 'Stop_PB', type: 'BOOL', desc: 'Stop pushbutton, wired NC: reads 1 when not pressed' },
  { t: 'Guard_Closed', type: 'BOOL', desc: 'Guard door switch, 1 = closed' },
  { t: 'Tank_High_LS', type: 'BOOL', desc: 'High level switch, 1 = level high' },
  { t: 'Ack_PB', type: 'BOOL', desc: 'Alarm acknowledge pushbutton' },
  { t: 'Fill_Valve', type: 'BOOL', desc: 'Fill valve solenoid output' },
  { t: 'Pump_Run', type: 'BOOL', desc: 'Pump run output' },
  { t: 'Alarm_Horn', type: 'BOOL', desc: 'Horn output' },
  { t: 'Fill_Timer', type: 'TIMER', desc: 'Timer structure (PRE, ACC, EN, TT, DN)' },
];
const GOALS41 = [
  { id: 'g1', text: 'Energize Fill_Valve while Tank_High_LS is off and Guard_Closed is on.', out: 'OTE', tag: 'Fill_Valve', vars: ['Tank_High_LS', 'Guard_Closed'], f: s => !s.Tank_High_LS && s.Guard_Closed },
  { id: 'g2', text: 'Energize Pump_Run while Start_PB is held, but never while the stop button is pressed. Stop_PB is wired NC.', out: 'OTE', tag: 'Pump_Run', vars: ['Start_PB', 'Stop_PB'], f: s => s.Start_PB && s.Stop_PB },
  { id: 'g3', text: 'Latch Alarm_Horn on when Tank_High_LS turns on, so it stays on after the level drops.', out: 'OTL', tag: 'Alarm_Horn', vars: ['Tank_High_LS'], f: s => s.Tank_High_LS },
  { id: 'g4', text: 'Unlatch Alarm_Horn when Ack_PB is pressed.', out: 'OTU', tag: 'Alarm_Horn', vars: ['Ack_PB'], f: s => s.Ack_PB },
  { id: 'g5', text: 'Time Fill_Timer as a 5 second on-delay whenever Fill_Valve is on and the guard is closed.', out: 'TON', tag: 'Fill_Timer', pre: 5000, vars: ['Fill_Valve', 'Guard_Closed'], f: s => s.Fill_Valve && s.Guard_Closed },
];
const OUTS41 = ['OTE', 'OTL', 'OTU', 'TON'];
const symFor = ins => ({ XIC: '-| |-', XIO: '-|/|-', OTE: '-( )-', OTL: '-(L)-', OTU: '-(U)-', TON: '[TON]' }[ins]);
function RungEditor() {
  const g = useGame();
  const [fb, report] = useFeedback('4.1');
  const [gi, setGi] = usePersist('4.1.goal', 0);
  const [solved, setSolved] = usePersist('4.1.solved', {});
  const [rung, setRung] = usePersist('4.1.rung', { conds: [], out: null });
  const [tags, setTags] = useState(() => Object.fromEntries(TAGDB41.filter(t => t.type === 'BOOL').map(t => [t.t, t.t === 'Stop_PB' ? 1 : 0])));
  const G = GOALS41[gi];
  const bools = TAGDB41.filter(t => t.type === 'BOOL');

  const condTrue = (c, s) => (c.ins === 'XIC' ? !!s[c.tag] : !s[c.tag]);
  const rungOn = s => rung.conds.every(c => condTrue(c, s));
  const live = rungOn(tags);

  useEffect(() => {
    if (!rung.out || rung.out.ins === 'TON' || !rung.out.tag) return;
    const t = rung.out.tag;
    setTags(s => {
      let v = s[t];
      if (rung.out.ins === 'OTE') v = live ? 1 : 0;
      if (rung.out.ins === 'OTL' && live) v = 1;
      if (rung.out.ins === 'OTU' && live) v = 0;
      return v === s[t] ? s : { ...s, [t]: v };
    });
  }, [live, rung]);

  const add = ins => {
    sfx('click');
    if (OUTS41.includes(ins)) setRung(r => ({ ...r, out: { ins, tag: ins === 'TON' ? 'Fill_Timer' : 'Fill_Valve', pre: ins === 'TON' ? 1000 : undefined } }));
    else setRung(r => ({ ...r, conds: [...r.conds, { ins, tag: 'Start_PB' }] }));
  };
  const setCond = (i, patch) => setRung(r => ({ ...r, conds: r.conds.map((c, k) => (k === i ? { ...c, ...patch } : c)) }));
  const move = (i, d) => setRung(r => { const c = r.conds.slice(); const j = i + d; if (j < 0 || j >= c.length) return r; [c[i], c[j]] = [c[j], c[i]]; return { ...r, conds: c }; });

  const validate = () => {
    if (!rung.out) { report({ kind: 'bad', key: 'noout', title: 'Rung has no output', text: 'A rung needs an output instruction on the right. Conditions on their own do nothing.' }); return; }
    if (rung.out.ins !== G.out) {
      const why = { OTE: 'An OTE follows the rung: on while true, off while false.', OTL: 'An OTL sets its bit and leaves it set after the rung goes false. It stays on through a power cycle on most platforms, until an OTU clears it.', OTU: 'An OTU only clears a bit that something else latched.', TON: 'A TON times while the rung is true and needs a TIMER tag and a preset.' };
      report({ kind: 'bad', key: 'outtype', title: `Wrong output: ${rung.out.ins}`, text: `The goal calls for ${G.out}. ${why[G.out]}` }); return;
    }
    if (rung.out.tag !== G.tag) { report({ kind: 'bad', key: 'outtag', title: `Output writes ${rung.out.tag}`, text: `The goal is about ${G.tag}. Writing the wrong tag is how you end up turning on a device nobody asked for.` }); return; }
    if (G.out === 'TON' && Number(rung.out.pre) !== G.pre) { report({ kind: 'bad', key: 'pre', title: `PRE is ${rung.out.pre}`, text: `Logix-style timers count milliseconds, so 5 seconds is PRE 5000. Other platforms use a timebase setting; check before you type a number.` }); return; }
    const vars = [...new Set([...G.vars, ...rung.conds.map(c => c.tag)])];
    const bad = combos(vars).find(s => rungOn(s) !== !!G.f(s));
    if (bad) {
      const cond = vars.map(v => `${v}=${bad[v] ? 1 : 0}`).join(', ');
      const stopHint = G.id === 'g2' && rung.conds.some(c => c.tag === 'Stop_PB' && c.ins === 'XIO')
        ? ' Stop_PB is wired NC, so it reads 1 when nobody is pressing it. XIO(Stop_PB) is false in that healthy state and blocks the rung. The fail-safe wiring flips the instruction: use XIC.' : '';
      report({ kind: 'bad', key: 'cond', title: `Fails with ${cond}`, text: `The goal wants the rung ${G.f(bad) ? 'true' : 'false'} here and yours is ${rungOn(bad) ? 'true' : 'false'}.${stopHint}` });
      return;
    }
    const ns = { ...solved, [G.id]: true }; setSolved(ns);
    report({ kind: 'ok', xp: 30, key: G.id, title: 'Rung meets the goal', text: 'Every combination of the inputs gives the required output. Order of series conditions does not change the logic, though putting the most likely false condition first makes online troubleshooting quicker to read.' });
    if (Object.keys(ns).length >= 3) g.complete('4.1');
  };

  return (
    <div className="bay">
      <BayHeader id="4.1" title="Rung editor" lede="Drop instructions onto the rung, assign tags from the tag database, then validate against the goal. Toggle tag states to preview what the rung does."
        right={<span className="chip lime">{Object.keys(solved).length}/3 goals</span>} />
      <div className="row">
        {GOALS41.map((x, i) => <button key={x.id} className={'btn sm ' + (i === gi ? 'violet' : 'ghost')} onClick={() => { setGi(i); setRung({ conds: [], out: null }); }}>{solved[x.id] && <span className="led on" />}Goal {i + 1}</button>)}
      </div>
      <div className="panel panel-pad" style={{ padding: '12px 16px' }}><span className="muted small">Goal: </span>{G.text}</div>
      <div className="grid2">
        <div className="stack">
          <div className="row">
            {['XIC', 'XIO'].map(i => <button key={i} className="btn sm violet" onClick={() => add(i)}><span className="mono">{symFor(i)} {i}</span></button>)}
            <span style={{ width: 10 }} />
            {OUTS41.map(i => <button key={i} className="btn sm" onClick={() => add(i)}><span className="mono">{symFor(i)} {i}</span></button>)}
          </div>
          <div className="ladder">
            <div className="rung" style={{ minHeight: 96 }}>
              <div className="rail-l hot" />
              {rung.conds.length === 0 && <div className="wireh hot" style={{ minWidth: 60 }} />}
              {rung.conds.map((c, i) => {
                const upTo = rung.conds.slice(0, i).every(x => condTrue(x, tags));
                return (
                  <React.Fragment key={i}>
                    <div className={'wireh' + (upTo ? ' hot' : '')} style={{ flex: '0 0 14px' }} />
                    <div className={'ins' + (condTrue(c, tags) ? ' true' : '')}>
                      <span className="sym">{symFor(c.ins)}</span>
                      <select className="inp" style={{ height: 24, fontSize: 11.5, padding: '0 4px', fontFamily: 'var(--mono)', color: 'var(--violet)' }} value={c.tag} onChange={e => setCond(i, { tag: e.target.value })} aria-label="Tag">
                        {bools.map(t => <option key={t.t}>{t.t}</option>)}
                      </select>
                      <div className="row" style={{ gap: 2 }}>
                        <button className="btn ghost sm" style={{ height: 20, padding: '0 5px', fontSize: 10 }} onClick={() => move(i, -1)} aria-label="Move left">‹</button>
                        <button className="btn ghost sm" style={{ height: 20, padding: '0 5px', fontSize: 10 }} onClick={() => setCond(i, { ins: c.ins === 'XIC' ? 'XIO' : 'XIC' })}>flip</button>
                        <button className="btn ghost sm" style={{ height: 20, padding: '0 5px', fontSize: 10 }} onClick={() => move(i, 1)} aria-label="Move right">›</button>
                      </div>
                      <button className="x" aria-label="Remove" onClick={() => setRung(r => ({ ...r, conds: r.conds.filter((_, k) => k !== i) }))}>×</button>
                    </div>
                  </React.Fragment>
                );
              })}
              <div className={'wireh' + (live ? ' hot' : '')} />
              {rung.out ? (
                <div className={'ins' + (live ? ' true' : '')}>
                  <span className={'sym' + (live ? ' coil-on' : '')}>{symFor(rung.out.ins)}</span>
                  <select className="inp" style={{ height: 24, fontSize: 11.5, padding: '0 4px', fontFamily: 'var(--mono)', color: 'var(--violet)' }} value={rung.out.tag}
                    onChange={e => setRung(r => ({ ...r, out: { ...r.out, tag: e.target.value } }))} aria-label="Output tag">
                    {TAGDB41.filter(t => (rung.out.ins === 'TON' ? t.type === 'TIMER' : t.type === 'BOOL')).map(t => <option key={t.t}>{t.t}</option>)}
                  </select>
                  {rung.out.ins === 'TON' && <input className="inp" style={{ height: 24, width: 90, fontSize: 11.5 }} value={rung.out.pre} onChange={e => setRung(r => ({ ...r, out: { ...r.out, pre: e.target.value } }))} aria-label="Preset ms" />}
                  <button className="x" aria-label="Remove output" onClick={() => setRung(r => ({ ...r, out: null }))}>×</button>
                </div>
              ) : <span className="mono tiny" style={{ color: 'var(--dim)', padding: '0 8px' }}>add an output</span>}
              <div className="wireh" style={{ flex: '0 0 10px' }} />
              <div className="rail-r" />
            </div>
          </div>
          <div className="row"><button className="btn cyan" onClick={validate}><Glyph n="check" />Validate rung</button><button className="btn ghost sm" onClick={() => setRung({ conds: [], out: null })}>Clear rung</button></div>
        </div>
        <div className="stack">
          <div className="panel panel-pad">
            <div className="sub">Tag database (live values)</div>
            <table className="io">
              <tbody>{TAGDB41.map(t => (
                <tr key={t.t} onClick={() => { if (t.type === 'BOOL') { setTags(s => ({ ...s, [t.t]: s[t.t] ? 0 : 1 })); sfx('click'); } }}>
                  <td className="mono small" style={{ color: 'var(--violet)' }}>{t.t}</td>
                  <td className="mono tiny muted">{t.type}</td>
                  <td className="mono small">{t.type === 'BOOL' ? <span style={{ color: tags[t.t] ? 'var(--lime)' : '#6b7a8f' }}>{tags[t.t]}</span> : '...'}</td>
                  <td className="tiny muted">{t.desc}</td>
                </tr>))}</tbody>
            </table>
            <p className="tiny muted" style={{ marginBottom: 0 }}>Click a BOOL row to toggle it. Outputs are written by the rung, so the preview overwrites them.</p>
          </div>
          <Feedback fb={fb} />
        </div>
      </div>
    </div>
  );
}

/* ---------- 4.2 HMI Tag Bind ---------- */
const TAGS42 = [
  { t: 'LT101_PV', v: 62.4, u: '%', desc: 'Tank T-101 level' },
  { t: 'TT101_PV', v: 145.0, u: '°F', desc: 'Tank T-101 temperature' },
  { t: 'P101_Run', v: 1, u: 'BOOL', desc: 'Pump P-101 running (aux contact)' },
  { t: 'FV101_Pos', v: 38.0, u: '%', desc: 'Valve FV-101 position feedback' },
  { t: 'FT101_PV', v: 212.5, u: 'gpm', desc: 'Outlet flow' },
  { t: 'P101_Fault', v: 0, u: 'BOOL', desc: 'Pump P-101 fault' },
];
const ELS42 = [
  { id: 'tank', label: 'T-101 level bar', expect: '%', correct: 'LT101_PV' },
  { id: 'pump', label: 'P-101 status', expect: 'BOOL', correct: 'P101_Run' },
  { id: 'valve', label: 'FV-101 position', expect: '%', correct: 'FV101_Pos' },
  { id: 'temp', label: 'Temperature display', expect: '°F', correct: 'TT101_PV' },
];
function HMIBind() {
  const g = useGame();
  const [fb, report] = useFeedback('4.2');
  const [bind, setBind] = usePersist('4.2.bind', {});
  const [armed, setArmed] = useState(null);
  const [over, setOver] = useState(null);
  const [jit, setJit] = useState({});
  useEffect(() => { const id = setInterval(() => setJit(Object.fromEntries(TAGS42.map(t => [t.t, t.u === 'BOOL' ? 0 : (Math.random() - 0.5) * (t.v * 0.01)]))), 900); return () => clearInterval(id); }, []);
  const val = t => { const tg = TAGS42.find(x => x.t === t); return tg ? tg.v + (jit[t] || 0) : null; };
  const unit = t => { const tg = TAGS42.find(x => x.t === t); return tg ? tg.u : null; };
  const doBind = (el, t) => { setBind(b => ({ ...b, [el]: t })); setArmed(null); sfx('snap'); };
  const implausible = el => { const t = bind[el.id]; if (!t) return false; const v = val(t); if (el.expect === '%') return v > 100 || v < 0 || unit(t) === 'BOOL'; return false; };

  const check = () => {
    const missing = ELS42.filter(e => !bind[e.id]);
    if (missing.length) { report({ kind: 'info', title: `${missing.length} element${missing.length > 1 ? 's' : ''} unbound`, text: 'Bind every element before you test the screen.' }); return; }
    const wrong = ELS42.find(e => bind[e.id] !== e.correct);
    if (!wrong) { report({ kind: 'ok', xp: 40, key: 'ok', title: 'Screen commissioned', text: 'Each element reads the tag whose engineering units and meaning match it. Checking units, ranges and tag descriptions catches the bad bindings; eyeballing whether the number "looks fine" does not.' }); g.complete('4.2'); return; }
    const t = bind[wrong.id], u = unit(t), tg = TAGS42.find(x => x.t === t);
    const plausible = u === wrong.expect || (wrong.expect === 'BOOL' && u !== 'BOOL');
    report({ kind: 'bad', key: plausible ? 'plausible' : 'units', title: `${wrong.label} is bound to ${t}`,
      text: plausible
        ? `${t} is "${tg.desc}". ${wrong.expect === 'BOOL' ? 'A status object treats any non-zero value as ON, so an analog tag makes the pump look permanently running.' : `It has the right units (${u}), so the display looks believable.`} That is the dangerous kind of bad binding: nothing looks wrong until an operator acts on it.`
        : `${t} is in ${u}, but the element expects ${wrong.expect}. ${wrong.expect === '%' && val(t) > 100 ? `That is why it shows ${val(t).toFixed(1)}%.` : 'The number on screen means nothing in these units.'}` });
  };

  const drop = el => ({
    onDragOver: e => { e.preventDefault(); setOver(el.id); }, onDragLeave: () => setOver(null),
    onDrop: e => { e.preventDefault(); setOver(null); const t = e.dataTransfer.getData('text/plain'); if (t) doBind(el.id, t); },
    onClick: () => { if (armed) doBind(el.id, armed); },
  });
  const disp = el => { const t = bind[el.id]; if (!t) return null; return val(t); };
  const tankV = disp(ELS42[0]), pumpV = disp(ELS42[1]), valveV = disp(ELS42[2]), tempV = disp(ELS42[3]);
  const col = el => implausible(el) ? 'var(--rose)' : 'var(--cyan)';

  return (
    <div className="bay">
      <BayHeader id="4.2" title="HMI tag bind" lede="Drag tags onto the screen elements, or tap a tag then tap an element. Watch what each binding displays, then commission the screen." />
      <div className="grid2">
        <div className="stack">
          <div className="svgwrap">
            <svg viewBox="0 0 760 330" role="img" aria-label="HMI screen mockup">
              <rect x="10" y="10" width="740" height="310" rx="10" fill="#0f1620" stroke="#23303f" />
              <text x="26" y="36" fill="#8b99ad" fontSize="13" fontFamily="Space Grotesk">T-101 transfer</text>
              {/* tank */}
              <rect x="60" y="60" width="130" height="200" rx="12" fill="#0a1017" stroke="#3a4a60" strokeWidth="2" />
              {tankV != null && <rect x="62" y={60 + 198 - clamp(tankV, 0, 100) * 1.96} width="126" height={clamp(tankV, 0, 100) * 1.96} rx="10" fill={implausible(ELS42[0]) ? 'rgba(244,63,94,.35)' : 'rgba(34,211,238,.28)'} />}
              <text x="125" y="285" textAnchor="middle" fill={tankV == null ? '#4f5e72' : col(ELS42[0])} fontSize="14" fontFamily="JetBrains Mono">{tankV == null ? '### %' : `${tankV.toFixed(1)} %`}</text>
              {/* pipe */}
              <path d="M190,230 H300 M360,230 H470 M530,230 H620" stroke="#3a4a60" strokeWidth="10" />
              {/* pump */}
              <circle cx="330" cy="230" r="30" fill="#0a1017" stroke={pumpV == null ? '#3a4a60' : pumpV ? 'var(--lime)' : '#6b7a8f'} strokeWidth="3" style={pumpV ? { filter: 'drop-shadow(0 0 6px var(--lime))' } : null} />
              <path d="M318,214 L346,230 L318,246 Z" fill={pumpV ? 'var(--lime)' : '#3a4a60'} />
              <text x="330" y="286" textAnchor="middle" fill="#8b99ad" fontSize="12" fontFamily="JetBrains Mono">P-101 {pumpV == null ? '###' : pumpV ? 'RUN' : 'STOP'}</text>
              {/* valve */}
              <path d="M470,212 L530,248 L530,212 L470,248 Z" fill="#0a1017" stroke={valveV == null ? '#3a4a60' : col(ELS42[2])} strokeWidth="2.5" />
              <line x1="500" y1="230" x2="500" y2="190" stroke="#3a4a60" strokeWidth="3" /><rect x="484" y="176" width="32" height="16" rx="3" fill="#18212d" stroke="#3a4a60" />
              <text x="500" y="286" textAnchor="middle" fill={valveV == null ? '#4f5e72' : col(ELS42[2])} fontSize="12" fontFamily="JetBrains Mono">FV-101 {valveV == null ? '###' : `${valveV.toFixed(1)} %`}</text>
              {/* temp */}
              <rect x="560" y="60" width="170" height="70" rx="8" fill="#071015" stroke="#16303a" />
              <text x="574" y="82" fill="#5d8390" fontSize="11" fontFamily="JetBrains Mono">Tank temp</text>
              <text x="574" y="116" fill={tempV == null ? '#4f5e72' : 'var(--cyan)'} fontSize="24" fontFamily="JetBrains Mono">{tempV == null ? '###.#' : tempV.toFixed(1)}</text>
              <text x="712" y="116" textAnchor="end" fill="#5d8390" fontSize="12" fontFamily="JetBrains Mono">°F</text>
              {implausible(ELS42[0]) && <text x="125" y="305" textAnchor="middle" fill="var(--rose)" fontSize="11" fontFamily="JetBrains Mono">implausible</text>}
              {implausible(ELS42[2]) && <text x="500" y="305" textAnchor="middle" fill="var(--rose)" fontSize="11" fontFamily="JetBrains Mono">implausible</text>}
            </svg>
          </div>
          <div className="grid2e">
            {ELS42.map(el => (
              <div key={el.id} className="field">
                <label>{el.label} <span className="mono" style={{ color: 'var(--dim)' }}>expects {el.expect}</span></label>
                <div className={'drop' + (over === el.id ? ' over' : '') + (armed ? ' armed' : '') + (bind[el.id] ? ' bound' : '')} {...drop(el)} role="button" tabIndex="0"
                  onKeyDown={e => { if ((e.key === 'Enter' || e.key === ' ') && armed) { e.preventDefault(); doBind(el.id, armed); } }}>
                  {bind[el.id] || (armed ? `drop ${armed} here` : 'drop a tag here')}
                </div>
              </div>
            ))}
          </div>
        </div>
        <div className="stack">
          <div className="panel panel-pad stack">
            <div className="sub" style={{ margin: 0 }}>Controller tags</div>
            {TAGS42.map(t => (
              <div key={t.t} className="row" style={{ justifyContent: 'space-between' }}>
                <span draggable className={'chip violet dnd-tag' + (armed === t.t ? ' picked' : '')} role="button" tabIndex="0"
                  onDragStart={e => { e.dataTransfer.setData('text/plain', t.t); e.dataTransfer.effectAllowed = 'copy'; }}
                  onClick={() => { setArmed(armed === t.t ? null : t.t); sfx('click'); }}
                  onKeyDown={e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); setArmed(armed === t.t ? null : t.t); } }}>{t.t}</span>
                <span className="tiny muted" style={{ textAlign: 'right' }}>{t.desc} <span className="mono">[{t.u}]</span></span>
              </div>
            ))}
            <div className="row"><button className="btn cyan" onClick={check}><Glyph n="check" />Commission screen</button><button className="btn ghost sm" onClick={() => setBind({})}>Unbind all</button></div>
          </div>
          <Feedback fb={fb} placeholder="A binding with the wrong units usually shows up as nonsense. A binding with the right units but the wrong tag looks perfectly normal, and that is the one that hurts." />
        </div>
      </div>
    </div>
  );
}

/* ---------- 4.3 Change Control Gate ---------- */
const STEPS43 = [
  { id: 'verify', t: 'Verify the running logic matches the last approved backup', ok: 'Comparing online to the approved copy tells you whether anyone changed it since. If they did, that has to be understood before you add your change on top.', wait: '' },
  { id: 'doc', t: 'Document the change: what, why, before and after values, risk', ok: 'The change record states the exact tag, the current value, the new value, the reason, and what could go wrong.', wait: 'You cannot write an accurate "before" until you have confirmed what is actually running. Online edits since the last backup are common.' },
  { id: 'approve', t: 'Get the change approved', ok: 'Approval means the people responsible for the process and its safety agree the change is justified and the risk is acceptable.', wait: 'Approvers sign off on a documented change. A verbal description is not something anyone can review.' },
  { id: 'backup', t: 'Back up the current program', ok: 'A fresh backup is your way back. If the change misbehaves you can restore exactly what was running.', wait: 'In this gate nothing is touched until the change is approved. Some sites take the backup earlier; the point is that it exists before any edit.' },
  { id: 'edit', t: 'Make the edit in an offline copy', ok: 'Editing offline lets you review the change without affecting the running process. Some sites allow controlled online edits instead; follow yours.', wait: 'Without a fresh backup there is no clean rollback if the edit goes wrong.' },
  { id: 'download', t: 'Download during the approved window, with the process in a safe state', ok: 'A download may stop the controller or reinitialize values. Doing it in the agreed window, with operations aware and the process safe, keeps a program change from becoming a process upset.', wait: 'There is nothing to download until the edit exists.' },
  { id: 'test', t: 'Verify the change works and nothing else changed', ok: 'Watch the timer run with the new preset, confirm the fill completes, and compare the program to make sure only the intended change went in.', wait: 'The new logic is not running yet, so there is nothing to verify.' },
  { id: 'update', t: 'Update documentation and close the change record', ok: 'Drawings, the program archive and the change record now match what is running, so the next tech starts from the truth.', wait: 'Documentation should describe what was proven to work, not what was intended.' },
];
const CRS43 = [
  'Change Fill_Timer.PRE from 5000 ms to 8000 ms on Line 2 fill timer.',
  'Raise the P-201 low-level permissive from 15% to 20% on the sump pump.',
  'Add a 2 second on-delay to the CV-101 zero-speed alarm to stop nuisance trips.',
];
function ChangeControl() {
  const g = useGame();
  const [fb, report] = useFeedback('4.3');
  const [cr, setCr] = useState(() => pick(CRS43));
  const [order, setOrder] = useState(() => shuffle(STEPS43.map(s => s.id)));
  const [done, setDone] = useState([]);
  const click = id => {
    if (done.includes(id)) return;
    const next = STEPS43[done.length]; const st = STEPS43.find(s => s.id === id);
    if (id === next.id) {
      const nd = [...done, id]; setDone(nd);
      if (nd.length === STEPS43.length) {
        report({ kind: 'ok', xp: 50, key: 'all', title: 'Change closed out', text: 'Verify, document, approve, back up, edit, download, verify, document. Each step protects the next one. Exact order and who signs what are site policy, so learn your site MOC procedure.' });
        g.complete('4.3');
      } else report({ kind: 'ok', xp: 8, key: id, title: st.t, text: st.ok });
    } else report({ kind: 'bad', key: `early-${id}`, title: `Not yet: ${st.t.toLowerCase()}`, text: `${st.wait} Next required step comes first.` });
  };
  const restart = () => { setCr(pick(CRS43)); setOrder(shuffle(STEPS43.map(s => s.id))); setDone([]); };
  return (
    <div className="bay">
      <BayHeader id="4.3" title="Change control gate" lede="Work the change request through the gate in the right order. Out-of-order steps are rejected with the reason."
        right={<button className="btn ghost sm" onClick={restart}>New request</button>} />
      <div className="panel panel-pad" style={{ padding: '12px 16px' }}>
        <span className="muted small">Change request CR-{String(2400 + CRS43.indexOf(cr) * 17).padStart(5, '0')}: </span>{cr}
      </div>
      <div className="grid2">
        <div className="steps">
          {order.map(id => {
            const s = STEPS43.find(x => x.id === id); const k = done.indexOf(id);
            return (
              <button key={id} className={'stepbtn' + (k >= 0 ? ' doneStep' : '')} onClick={() => click(id)} disabled={k >= 0}>
                <span className="n">{k >= 0 ? String(k + 1) : '.'}</span>
                <span className="small">{s.t}</span>
              </button>
            );
          })}
        </div>
        <div className="stack">
          <div className="panel panel-pad small">
            <div className="sub">Progress</div>
            <div className="row">{STEPS43.map((s, i) => <span key={s.id} className={'led ' + (i < done.length ? 'on' : '')} />)}</div>
            <p className="tiny muted" style={{ margin: '8px 0 0' }}>This follows a common management-of-change sequence. Your site may order approvals, backups and online edits differently. The site procedure wins.</p>
          </div>
          <Feedback fb={fb} />
        </div>
      </div>
    </div>
  );
}

/* ================= BOSS JOBS ================= */
const BOSS_TIME = 120;
const opt = (id, l) => ({ id, l });

function bossL1() {
  const sensor = pick(['PNP', 'NPN']), card = pick(['sinking', 'sourcing']);
  const works = (sensor === 'PNP' && card === 'sinking') || (sensor === 'NPN' && card === 'sourcing');
  const ans1 = !works ? 'x' : sensor === 'PNP' ? '0v' : '24v';
  const q1 = {
    tag: '1.2', prompt: `A ${sensor} proximity sensor lands on a ${card}-input PLC card. Where does the card's input common go?`,
    options: [opt('24v', '+24 VDC'), opt('0v', '0 V (DC common)'), opt('x', 'Neither works without an interposing relay or a different card')],
    answer: ans1,
    explain: works
      ? (sensor === 'PNP'
        ? 'A PNP output switches +24 V to its load. Current flows out of the sensor, into the input, through the input circuit and out the common, so the common must return to 0 V. That makes it a sinking input.'
        : 'An NPN output switches the load to 0 V. The input must supply the current, so its common goes to +24 V and current flows out of the input into the sensor. That makes it a sourcing input.')
      : `A ${sensor} output ${sensor === 'PNP' ? 'sources current' : 'sinks current'}, and a ${card} input ${card === 'sinking' ? 'also sinks' : 'also sources'}. Both ends want to push or pull current the same direction, so there is no complete path whichever way the common is landed.`,
  };
  const s = { A: rint(0, 1), B: rint(0, 1), C: rint(0, 1), D: rint(0, 1) };
  const out = s.A && !s.B && (s.C || s.D);
  const q2 = {
    tag: '1.3', prompt: `Rung: XIC(A) XIO(B) [XIC(C) OR XIC(D)] OTE(Out). Current states: A=${s.A} B=${s.B} C=${s.C} D=${s.D}. Is Out energized?`,
    options: [opt('y', 'Yes, Out = 1'), opt('n', 'No, Out = 0')], answer: out ? 'y' : 'n',
    explain: `XIC is true when its bit is 1, XIO is true when its bit is 0. A is ${s.A ? 'true' : 'false'}, XIO(B) is ${!s.B ? 'true' : 'false'}, and the C/D branch is ${(s.C || s.D) ? 'true because at least one leg is 1' : 'false because both legs are 0'}. Series means every element must be true, so Out = ${out ? 1 : 0}.`,
  };
  const faults = [
    { sym: 'The motor runs only while START is held and drops out the moment it is released.', a: 'seal', why: 'Nothing holds the coil after START opens. The CR auxiliary NO contact has to be wired in parallel with the START button so the coil feeds itself once it pulls in.' },
    { sym: 'The motor starts fine but pressing STOP does nothing. Only the overload trip stops it.', a: 'across', why: 'The seal-in contact is wired in parallel with STOP (or with STOP and START together), so it bypasses the stop button. The seal belongs across START only, downstream of STOP.' },
    { sym: 'The contactor pulls in the instant control power is turned on, with nobody touching START.', a: 'startnc', why: 'The START button is wired on its NC contact, which is closed at rest. It completes the coil circuit immediately and the seal-in latches it. START must be the NO contact.' },
    { sym: 'Pressing START does nothing, but holding STOP and START together briefly pulls the coil in.', a: 'stopno', why: 'STOP was landed on its NO contact, so the circuit is open at rest and only closes while STOP is pressed. STOP must be NC so the circuit is normally made and opens when pressed.' },
  ];
  const f = pick(faults);
  const q3 = {
    tag: '1.1', prompt: `3-wire start/stop call-out: ${f.sym} Most likely cause?`,
    options: shuffle([opt('seal', 'Seal-in contact missing'), opt('across', 'Seal-in wired across STOP'), opt('startnc', 'START wired on its NC contact'), opt('stopno', 'STOP wired on its NO contact')]),
    answer: f.a, explain: f.why,
  };
  return [q1, q2, q3];
}

function bossL2() {
  const urv = pick([150, 200, 250, 300, 400, 500]);
  const pv = Math.round(rnd(0.12, 0.9) * urv * 2) / 2;
  const mA = 4 + 16 * pv / urv;
  const q1 = {
    tag: '2.2', kind: 'num', unit: 'mA', tol: 0.02, answer: mA,
    prompt: `A transmitter is ranged 0 to ${urv} psig, direct acting. What loop current should you read at ${pv} psig?`,
    explain: `mA = 4 + (PV − LRV) × 16 / (URV − LRV) = 4 + (${pv} − 0) × 16 / ${urv} = ${mA.toFixed(3)} mA. The 16 is the live span of the signal (20 − 4); the 4 mA offset is the live zero.`,
  };
  const devs = [
    { d: 'a loop-powered pressure transmitter (power and signal share the same pair)', n: '2', why: 'A 2-wire transmitter takes its operating power from the loop itself and regulates the loop current to represent PV. One pair carries both.' },
    { d: 'a 3-wire RTD element', n: '3', why: 'The third lead lets the input measure and cancel lead resistance. It assumes both legs have equal resistance, which is why a mismatched or corroded lead shows up as a temperature error.' },
    { d: 'a line-powered analyzer with a separate 4-20 mA output pair', n: '4', why: 'A 4-wire device has its own power pair and a separate signal pair. The analyzer usually sources the loop current itself, so do not add an external loop supply unless the manual says the output is passive.' },
  ];
  const d = pick(devs);
  const q2 = {
    tag: '2.1', prompt: `How many field wires does ${d.d} need?`,
    options: [opt('2', '2-wire'), opt('3', '3-wire'), opt('4', '4-wire')], answer: d.n, explain: d.why,
  };
  const tolPct = 0.5, pt = pick([25, 50, 75]);
  const exp = 4 + 16 * pt / 100;
  const pass = Math.random() < 0.5;
  const errPct = pass ? rnd(0.08, 0.38) * pick([1, -1]) : rnd(0.62, 1.1) * pick([1, -1]);
  const read = exp + errPct / 100 * 16;
  const actual = (read - exp) / 16 * 100;
  const q3 = {
    tag: '2.3', prompt: `As-found check at ${pt}% input. Expected ${exp.toFixed(3)} mA, measured ${read.toFixed(3)} mA. Tolerance for this loop is ±${tolPct}% of span. Pass or fail?`,
    options: [opt('p', 'Pass'), opt('f', 'Fail')], answer: Math.abs(actual) <= tolPct ? 'p' : 'f',
    explain: `Error = (measured − expected) / 16 mA × 100 = ${actual.toFixed(2)}% of span. The limit is ±${tolPct}%, so it ${Math.abs(actual) <= tolPct ? 'passes' : 'fails and gets adjusted, then recorded again as-left'}. Tolerance is set by the site or loop spec, not a universal number.`,
  };
  return [q1, q2, q3];
}

function bossL3() {
  const pre = 10, a = rint(3, 5), gap = rint(1, 3), b = rint(2, 4);
  const type = pick(['TON', 'RTO']);
  const acc = type === 'TON' ? b : a + b;
  const q1 = {
    tag: '3.3', kind: 'num', unit: 's', tol: 0.05, answer: acc,
    prompt: `A ${type} with PRE = ${pre} s sees its rung go true for ${a} s, false for ${gap} s, then true for ${b} s. What is ACC at the end (in seconds)?`,
    explain: type === 'TON'
      ? `A TON resets ACC to 0 whenever the rung goes false. The first ${a} s is lost during the ${gap} s gap, so ACC only holds the last ${b} s. DN never set because ACC never reached ${pre}.`
      : `An RTO retains ACC when the rung goes false. It totals ${a} + ${b} = ${a + b} s, and only a RES instruction clears it. DN would set at ${pre} s.`,
  };
  const perms = ['EStop_OK', 'Guard_Closed', 'Lube_Press_OK', 'Disch_Vlv_Open'];
  const blockMode = pick(['fault', 'xic']);
  const blockXic = pick(perms);
  const q2 = {
    tag: '3.2',
    prompt: blockMode === 'fault'
      ? `Start rung: XIC(EStop_OK) XIC(Guard_Closed) XIC(Lube_Press_OK) XIC(Disch_Vlv_Open) XIO(Motor_Fault). All four permissive bits read 1 and Motor_Fault reads 1. Which element is blocking?`
      : `Start rung: XIC(EStop_OK) XIC(Guard_Closed) XIC(Lube_Press_OK) XIC(Disch_Vlv_Open) XIO(Motor_Fault). ${perms.filter(p => p !== blockXic).join(', ')} read 1, ${blockXic} reads 0, Motor_Fault reads 0. Which element is blocking?`,
    options: shuffle([...perms, 'Motor_Fault'].map(p => opt(p, (p === 'Motor_Fault' ? 'XIO(' : 'XIC(') + p + ')'))),
    answer: blockMode === 'fault' ? 'Motor_Fault' : blockXic,
    explain: blockMode === 'fault'
      ? 'An XIO is true only when its bit is 0. Motor_Fault = 1 makes XIO(Motor_Fault) false, which opens the rung even though every XIC is satisfied. Clear the cause of the fault, then reset it; do not force the bit.'
      : `XIC(${blockXic}) needs the bit at 1. It reads 0, so that contact is open. Go check the field device and its input wiring before touching logic.`,
  };
  const slot = rint(1, 7), pt = rint(0, 15), dir = pick(['I', 'O']);
  const q3 = {
    tag: '3.1', prompt: `What does the Logix address Local:${slot}:${dir}.Data.${pt} point to?`,
    options: shuffle([
      opt('ok', `Slot ${slot}, ${dir === 'I' ? 'input' : 'output'} point ${pt} in the local chassis`),
      opt('rev', `Slot ${pt}, ${dir === 'I' ? 'input' : 'output'} point ${slot}`),
      opt('dir', `Slot ${slot}, ${dir === 'I' ? 'output' : 'input'} point ${pt}`),
      opt('rack', `Rack ${slot}, word ${pt} of a remote adapter`),
    ]),
    answer: 'ok',
    explain: `Local means the controller's own chassis, the number after it is the slot, I or O is the direction of the data, and the number after Data is the bit (point). Remote chassis tags carry the adapter's name instead of Local. Other PLC families address differently, so check the platform.`,
  };
  return [q1, q2, q3];
}

function bossL4() {
  const q1 = {
    tag: '4.1',
    prompt: 'Stop_PB is a hardwired NC pushbutton on an input card. The start rung reads XIC(Start_PB) [branch XIC(Motor)] XIO(Stop_PB) OTE(Motor). What happens when someone presses START?',
    options: shuffle([
      opt('never', 'Nothing. The motor never starts.'),
      opt('works', 'Motor starts and seals in normally.'),
      opt('nostop', 'Motor starts but STOP will not stop it.'),
      opt('jog', 'Motor runs only while START is held.'),
    ]),
    answer: 'never',
    explain: 'An NC button holds the input bit at 1 while nobody touches it. XIO(Stop_PB) is only true when the bit is 0, so the rung is false at rest. The usual pattern for an NC stop is XIC(Stop_PB): true while the circuit is healthy, false when pressed or when the wire breaks, which is the fail-safe part.',
  };
  const q2 = {
    tag: '4.2',
    prompt: 'You are binding the "valve position" readout on an HMI faceplate (0–100%). Which tag belongs there?',
    options: shuffle([
      opt('pos', 'FV_101.Pos_Fbk (REAL, %)'),
      opt('cmd', 'FV_101.Open_Cmd (BOOL)'),
      opt('tt', 'TT_101.PV (REAL, °F)'),
      opt('lim', 'FV_101.ZSO (BOOL, open limit)'),
    ]),
    answer: 'pos',
    explain: 'Position feedback is the analog value from the positioner or position transmitter, in percent open. The command is what the logic asked for, not what the valve did. A limit switch only says open or not open. A temperature tag would read in °F and look like 145% on a 0–100 display.',
  };
  const seq = ['Verify current logic online', 'Document the change request', 'Get approval', 'Back up the current program', 'Edit offline', 'Download at an approved time', 'Verify operation', 'Update drawings and records'];
  const k = rint(1, 6);
  const nextOpts = shuffle([seq[k], ...shuffle(seq.filter((_, i) => i !== k && i >= k - 1)).slice(0, 3)]);
  const q3 = {
    tag: '4.3',
    prompt: `Change: raise the Line 2 fill timer PRE from 5 s to 8 s. Done so far: ${seq.slice(0, k).join(' → ')}. What comes next?`,
    options: nextOpts.map((s, i) => opt(s, s)), answer: seq[k],
    explain: `The sequence runs: ${seq.join(' → ')}. Each step protects the next one: approval before touching anything, a backup before editing so you can roll back, verification before records are closed. Your site's MOC procedure may order or combine steps differently, and it wins.`,
  };
  return [q1, q2, q3];
}

const BOSS_GEN = { 1: bossL1, 2: bossL2, 3: bossL3, 4: bossL4 };
const BOSS_BRIEF = {
  1: 'Mixed call: sensor-to-card compatibility, rung evaluation, and a 3-wire start/stop fault.',
  2: 'Mixed call: loop current math, wire count, and an as-found pass/fail decision.',
  3: 'Mixed call: timer behavior, a blocked permissive, and reading an I/O address.',
  4: 'Mixed call: NC stop logic, HMI binding, and a change-control step.',
};

function BossJob({ layer }) {
  const g = useGame();
  const [phase, setPhase] = useState('brief');
  const [qs, setQs] = useState([]);
  const [idx, setIdx] = useState(0);
  const [answers, setAnswers] = useState([]);
  const [numIn, setNumIn] = useState('');
  const [left, setLeft] = useState(BOSS_TIME);
  const endRef = useRef(false);

  useEffect(() => { setPhase('brief'); }, [layer]);
  useEffect(() => {
    if (phase !== 'run') return;
    const t = setInterval(() => setLeft(l => {
      if (l <= 1) { clearInterval(t); setPhase('done'); return 0; }
      return l - 1;
    }), 1000);
    return () => clearInterval(t);
  }, [phase]);

  const start = () => {
    setQs(BOSS_GEN[layer]()); setIdx(0); setAnswers([]); setNumIn(''); setLeft(BOSS_TIME); endRef.current = false;
    setPhase('run'); sfx('snap');
  };
  const q = qs[idx];
  const answered = answers[idx];

  const submit = val => {
    if (!q || answered) return;
    let ok;
    if (q.kind === 'num') {
      const v = parseFloat(val);
      if (!Number.isFinite(v)) return;
      ok = Math.abs(v - q.answer) <= q.tol;
    } else ok = val === q.answer;
    const rec = { val, ok };
    setAnswers(a => { const n = a.slice(); n[idx] = rec; return n; });
    if (ok) g.correct(20); else g.miss();
    g.note(`boss${layer}:${q.tag}:${q.prompt.slice(0, 40)}`, `Boss Job L${layer}: ${TOOLS[q.tag].name}`, q.explain, layer);
  };
  const next = () => {
    if (idx < qs.length - 1) { setIdx(idx + 1); setNumIn(''); }
    else setPhase('done');
  };

  const allOk = answers.length === qs.length && answers.every(a => a && a.ok);
  const won = phase === 'done' && allOk && left > 0;
  useEffect(() => {
    if (phase === 'done' && !endRef.current) {
      endRef.current = true;
      if (won) { g.completeBoss(layer); sfx('level'); }
    }
  }, [phase, won]); // eslint-disable-line

  const L = LAYERS[layer - 1];
  const mm = String(Math.floor(left / 60)), ss = String(left % 60).padStart(2, '0');

  return (
    <div className="bay">
      <BayHeader id={`${layer}.B`} title="Boss Job" lede={BOSS_BRIEF[layer]}
        right={<div className="row">
          {g.game.boss[layer] && <span className="chip lime">Layer cleared</span>}
          {phase === 'run' && <span className={'boss-timer'} style={left <= 20 ? { color: 'var(--rose)' } : null} aria-live="off">{mm}:{ss}</span>}
        </div>} />

      {phase === 'brief' && (
        <div className="panel panel-pad stack" style={{ maxWidth: 720 }}>
          <div className="sub">Work order</div>
          <p style={{ margin: 0 }}>Three questions, one from each tool in the {L.name} layer, {BOSS_TIME} seconds on the clock. Get all three right before time runs out to clear the layer. Wrong answers cost nothing except the clear, and every explanation lands in Field Notes.</p>
          <p className="tiny muted" style={{ margin: 0 }}>Questions are randomized, so a rerun is a different job.</p>
          <div className="row"><button className="btn amber" onClick={start}><Glyph n="bolt" />Start the job</button></div>
        </div>
      )}

      {phase === 'run' && q && (
        <div className="grid2">
          <div className="panel panel-pad stack">
            <div className="row" style={{ justifyContent: 'space-between' }}>
              <span className="sub">Question {idx + 1} of {qs.length}</span>
              <span className="chip violet">{q.tag} {TOOLS[q.tag].name}</span>
            </div>
            <p style={{ margin: 0, fontSize: 15.5 }}>{q.prompt}</p>
            {q.kind === 'num' ? (
              <div className="row">
                <input className="inp" style={{ width: 140 }} inputMode="decimal" value={numIn} disabled={!!answered}
                  onChange={e => setNumIn(e.target.value)} onKeyDown={e => { if (e.key === 'Enter') submit(numIn); }} aria-label="Your answer" />
                <span className="mono muted">{q.unit}</span>
                <button className="btn cyan" disabled={!!answered} onClick={() => submit(numIn)}>Submit</button>
              </div>
            ) : (
              <div className="steps">
                {q.options.map(o => {
                  const chosen = answered && answered.val === o.id;
                  const isAns = answered && o.id === q.answer;
                  const style = isAns ? { borderColor: 'rgba(132,204,22,.55)' } : chosen ? { borderColor: 'rgba(244,63,94,.55)' } : null;
                  return <button key={o.id} className="stepbtn" style={style} disabled={!!answered} onClick={() => submit(o.id)}>
                    <span className="n">{isAns ? <Glyph n="check" s={12} /> : chosen ? <Glyph n="x" s={12} /> : '·'}</span><span>{o.l}</span>
                  </button>;
                })}
              </div>
            )}
            {answered && <div className="row"><button className="btn" onClick={next}>{idx < qs.length - 1 ? 'Next question' : 'Close out job'}</button></div>}
          </div>
          <div className="stack">
            <div className="panel panel-pad small">
              <div className="sub">Job progress</div>
              <div className="row">{qs.map((_, i) => <span key={i} className={'led ' + (answers[i] ? (answers[i].ok ? 'on' : 'ro') : '')} />)}</div>
            </div>
            {answered && (
              <div className={'fb ' + (answered.ok ? 'ok' : 'bad')}>
                <div className="fb-t">{answered.ok ? 'Correct' : q.kind === 'num' ? `Not quite. Expected ${fmt(q.answer, 3)} ${q.unit}` : 'Not quite'}</div>
                <div>{q.explain}</div>
              </div>
            )}
          </div>
        </div>
      )}

      {phase === 'done' && (
        <div className="panel panel-pad stack" style={{ maxWidth: 760 }}>
          <div className="sub">Job closed</div>
          <h3 style={{ color: won ? 'var(--lime)' : 'var(--amber)' }}>
            {won ? `Layer ${layer} cleared` : left === 0 ? 'Out of time' : `${answers.filter(a => a && a.ok).length} of ${qs.length} correct`}
          </h3>
          <p style={{ margin: 0 }} className="muted">
            {won ? 'All three right with time on the clock. The layer is marked complete on the rail and the radar.' : 'Read through the explanations below, then run a fresh job. The questions change every time.'}
          </p>
          {qs.map((qq, i) => (
            <div key={i} className="note">
              <div className="meta">{qq.tag} · {answers[i] ? (answers[i].ok ? 'correct' : 'missed') : 'not answered'}</div>
              <h4 style={{ fontFamily: 'var(--sans)', fontWeight: 500 }}>{qq.prompt}</h4>
              <p>{qq.explain}</p>
            </div>
          ))}
          <div className="row"><button className="btn amber" onClick={start}>Run another job</button></div>
        </div>
      )}
    </div>
  );
}

function SkillRadar({ game, size = 64 }) {
  const c = size / 2, r = size / 2 - 9;
  const axes = LAYERS.map((L, i) => ({ L, a: -Math.PI / 2 + i * Math.PI / 2, v: skillFor(game, L.id) / 100 }));
  const pt = (a, v) => `${c + Math.cos(a) * r * v},${c + Math.sin(a) * r * v}`;
  const poly = axes.map(x => pt(x.a, Math.max(0.04, x.v))).join(' ');
  const label = axes.map(x => `${x.L.axis} ${Math.round(x.v * 100)}%`).join(', ');
  return (
    <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`} role="img" aria-label={`Skill radar: ${label}`}>
      <title>{label}</title>
      {[0.33, 0.66, 1].map(k => <polygon key={k} points={axes.map(x => pt(x.a, k)).join(' ')} fill="none" stroke="#1e2836" strokeWidth="1" />)}
      {axes.map(x => <line key={x.L.id} x1={c} y1={c} x2={c + Math.cos(x.a) * r} y2={c + Math.sin(x.a) * r} stroke="#1e2836" />)}
      <polygon points={poly} fill="rgba(34,211,238,.18)" stroke="#22d3ee" strokeWidth="1.3" style={{ transition: 'all .28s ease-out' }} />
      {axes.map(x => <circle key={x.L.id} cx={c + Math.cos(x.a) * r * Math.max(0.04, x.v)} cy={c + Math.sin(x.a) * r * Math.max(0.04, x.v)} r="2" fill={x.L.color} />)}
      {axes.map(x => <text key={'t' + x.L.id} x={c + Math.cos(x.a) * (r + 6)} y={c + Math.sin(x.a) * (r + 6) + 3} fontSize="7" fill="#6b7a8f" textAnchor="middle" fontFamily="JetBrains Mono, monospace">{x.L.axis[0]}</text>)}
    </svg>
  );
}

function FieldNotes({ open, onClose, notes }) {
  const [q, setQ] = useState('');
  const [lf, setLf] = useState(0);
  const list = notes.filter(n => (!lf || n.layer === lf) && (!q || (n.title + ' ' + n.text).toLowerCase().includes(q.toLowerCase())));
  useEffect(() => {
    if (!open) return;
    const k = e => { if (e.key === 'Escape') onClose(); };
    window.addEventListener('keydown', k); return () => window.removeEventListener('keydown', k);
  }, [open, onClose]);
  return (
    <>
      <div className={'scrim ' + (open ? 'open' : '')} onClick={onClose} />
      <aside className={'drawer ' + (open ? 'open' : '')} aria-hidden={!open} aria-label="Field Notes">
        <div className="drawer-h">
          <Glyph n="book" s={16} />
          <h3 style={{ fontSize: 17 }}>Field Notes</h3>
          <span className="chip">{notes.length}</span>
          <span style={{ flex: 1 }} />
          <button className="icon-btn" onClick={onClose} aria-label="Close Field Notes"><Glyph n="x" /></button>
        </div>
        <div style={{ padding: '12px 18px 0' }} className="stack">
          <input className="inp" placeholder="Search notes" value={q} onChange={e => setQ(e.target.value)} aria-label="Search notes" />
          <Seg value={lf} onChange={setLf} label="Filter by layer" options={[{ v: 0, l: 'All' }, ...LAYERS.map(L => ({ v: L.id, l: 'L' + L.id }))]} />
        </div>
        <div className="drawer-b">
          {notes.length === 0 && <p className="muted small">Every explanation you trigger gets filed here: right answers, wrong answers, and diagnoses. Over time this becomes your own reference.</p>}
          {notes.length > 0 && list.length === 0 && <p className="muted small">No notes match.</p>}
          {list.map(n => (
            <div key={n.key} className="note">
              <div className="meta">{n.layer ? `L${n.layer} ${LAYERS[n.layer - 1].short}` : 'General'} · {new Date(n.ts).toLocaleDateString()}</div>

              <p>{n.text}</p>
            </div>
          ))}
        </div>
      </aside>
    </>
  );
}

function App() {
  const g = useGame();
  const { game, setGame } = g;
  const [notesOpen, setNotesOpen] = useState(false);
  const [confirmReset, setConfirmReset] = useState(false);
  const layer = game.layer || 1;
  const L = LAYERS[layer - 1];
  const tool = (game.tool && game.tool[layer]) || `${layer}.1`;
  const lv = levelFor(game.xp);
  const toolIds = Object.keys(TOOLS).filter(k => TOOLS[k].layer === layer);

  const setLayer = id => { sfx('click'); setGame(s => ({ ...s, layer: id })); window.scrollTo({ top: 0, behavior: prefersReduced() ? 'auto' : 'smooth' }); };
  const setTool = id => { sfx('click'); setGame(s => ({ ...s, tool: { ...s.tool, [layer]: id } })); };
  const toggleMute = () => setGame(s => { SOUND_ON = s.muted; if (s.muted) setTimeout(() => sfx('click'), 0); return { ...s, muted: !s.muted }; });
  const doReset = () => { try { localStorage.removeItem(STORE_KEY); } catch (e) { } location.reload(); };
  const closeNotes = useCallback(() => setNotesOpen(false), []);
  const layerDone = id => !!game.boss[id];

  const Comp = tool === 'boss' ? null : TOOL_COMPONENTS[tool];

  return (
    <div className="app" style={{ '--c': L.color }}>
      <header className="status">
        <div className="brand">
          <div className="brand-mark"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#22d3ee" strokeWidth="1.6" aria-hidden="true"><path d="M1 9h3l2-5 3 9 2-6 1 2h3" /></svg></div>
          <div><h1>Tech Dev Lab</h1><small className="hide-m">I&amp;C test bench</small></div>
        </div>
        <div className="status-sep hide-m" />
        <div className="stat hide-m"><span className="k">Layer</span><span className="v" style={{ color: L.color }}>L{layer} {L.name}</span></div>
        <div className="status-sep hide-m" />
        <div className="stat">
          <span className="k">{lv.name}{lv.next ? <span className="hide-m"> · {lv.toNext} XP to {lv.next}</span> : ''}</span>
          <span className="v">{game.xp} XP</span>
          <div className="xpbar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow={Math.round(lv.pct * 100)}><i style={{ width: `${lv.pct * 100}%` }} /></div>
        </div>
        <div className="stat hide-m"><span className="k">Streak</span><span className="v" style={{ color: game.streak >= 3 ? 'var(--amber)' : undefined }}>{game.streak} <span className="muted" style={{ fontSize: 11 }}>best {game.best}</span></span></div>
        <div className="grow" />
        <div className="hide-m" title="Skill radar"><SkillRadar game={game} size={56} /></div>
        <button className="icon-btn" onClick={() => setNotesOpen(true)} aria-label="Open Field Notes"><Glyph n="book" /><span className="hide-m">Notes</span><span className="mono" style={{ fontSize: 11 }}>{game.notes.length}</span></button>
        <button className={'icon-btn ' + (game.muted ? '' : 'on')} onClick={toggleMute} aria-label={game.muted ? 'Unmute sound' : 'Mute sound'} aria-pressed={!game.muted}><Glyph n={game.muted ? 'mute' : 'sound'} /></button>
        <button className="icon-btn" onClick={() => setConfirmReset(true)} aria-label="Reset progress"><Glyph n="reset" /></button>
      </header>

      <nav className="rail" aria-label="Layers">
        <div className="rail-h">LAYERS</div>
        {LAYERS.map(x => {
          const n = Object.keys(TOOLS).filter(k => TOOLS[k].layer === x.id && game.done[k]).length;
          return (
            <button key={x.id} className={'layer-btn ' + (x.id === layer ? 'active' : '')} style={{ '--c': x.color }} onClick={() => setLayer(x.id)} aria-current={x.id === layer ? 'page' : undefined}>
              <span className="num">{x.id}</span>
              <span className="lb"><b>{x.name}</b><span>{n}/3 tools{layerDone(x.id) ? ' · boss' : ''}</span></span>
              {layerDone(x.id) && <span className="chk"><Glyph n="check" s={13} /></span>}
            </button>
          );
        })}
        <div className="panel panel-pad" style={{ marginTop: 14, padding: 12 }}>
          <div className="rail-h" style={{ padding: '0 0 6px' }}>SKILL RADAR</div>
          <div style={{ display: 'flex', justifyContent: 'center' }}><SkillRadar game={game} size={120} /></div>
          <div className="stack" style={{ gap: 4, marginTop: 6 }}>
            {LAYERS.map(x => <div key={x.id} className="row tiny" style={{ justifyContent: 'space-between' }}><span className="muted">{x.axis}</span><span className="mono" style={{ color: x.color }}>{skillFor(game, x.id)}</span></div>)}
          </div>
        </div>
        <div className="spacer" />
        <button className="btn ghost sm rail-notes" onClick={() => setNotesOpen(true)}><Glyph n="book" />Field Notes ({game.notes.length})</button>
      </nav>

      <main className="main">
        <div className="layer-head">
          <div>
            <Plate>Layer {layer}</Plate>
            <h2 style={{ marginTop: 8 }}>{L.name}</h2>
            <p>{L.blurb}</p>
          </div>
          {layerDone(layer) && <span className="chip lime"><Glyph n="check" s={12} />Layer complete</span>}
        </div>

        <div className="tabs" role="tablist" aria-label={`${L.name} tools`}>
          {toolIds.map(id => (
            <button key={id} role="tab" aria-selected={tool === id} className={'tab ' + (tool === id ? 'active' : '')} onClick={() => setTool(id)}>
              <span className="t-id">{id}</span>
              <span className="t-n">{TOOLS[id].name}{game.done[id] && <i className="done-dot" aria-label="complete" />}</span>
            </button>
          ))}
          <button role="tab" aria-selected={tool === 'boss'} className={'tab boss ' + (tool === 'boss' ? 'active' : '')} onClick={() => setTool('boss')}>
            <span className="t-id">{layer}.B</span>
            <span className="t-n">Boss Job{layerDone(layer) && <i className="done-dot" aria-label="complete" />}</span>
          </button>
        </div>

        <section key={layer + ':' + tool} role="tabpanel">
          {tool === 'boss' ? <BossJob layer={layer} /> : Comp ? <Comp /> : null}
        </section>

        <footer className="footer">
          Skill-building simulator only. It is not a substitute for site procedures, OEM manuals, NFPA 70 / NFPA 70E, or a qualified person's judgment. No real equipment is energized. Tolerances and sequences shown are sensible defaults; your site's values and policies take precedence.
        </footer>
      </main>

      <nav className="mobile-bar" aria-label="Layers">
        {LAYERS.map(x => (
          <button key={x.id} className={x.id === layer ? 'active' : ''} onClick={() => setLayer(x.id)} style={x.id === layer ? { color: x.color } : null}>
            <b style={layerDone(x.id) ? { color: 'var(--lime)' } : null}>L{x.id}</b>{x.short}
          </button>
        ))}
        <button onClick={() => setNotesOpen(true)}><b>{game.notes.length}</b>Notes</button>
      </nav>

      <FieldNotes open={notesOpen} onClose={closeNotes} notes={game.notes} />

      {confirmReset && (
        <div className="modal" role="dialog" aria-modal="true" aria-label="Confirm reset" onClick={e => { if (e.target === e.currentTarget) setConfirmReset(false); }}>
          <div className="panel panel-pad stack">
            <h3>Reset all progress?</h3>
            <p className="muted" style={{ margin: 0 }}>This clears XP, level, completed tools, Boss Jobs, saved tool state, and every Field Note stored in this browser. It cannot be undone.</p>
            <div className="row" style={{ justifyContent: 'flex-end' }}>
              <button className="btn ghost" onClick={() => setConfirmReset(false)} autoFocus>Cancel</button>
              <button className="btn rose" onClick={doReset}><Glyph n="reset" />Reset everything</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<GameProvider><App /></GameProvider>);

</script>
</body>
</html>
