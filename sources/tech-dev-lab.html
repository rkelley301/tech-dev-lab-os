<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tech Dev Lab | I&amp;C Test Bench</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<style>
:root{
  --bg:#0a0e14; --panel:#121821; --panel2:#0e141c; --line:#1e2836; --line2:#2a3647;
  --text:#d7dee8; --muted:#8391a5; --dim:#4f5c6e;
  --cyan:#22d3ee; --amber:#f5a524; --lime:#84cc16; --rose:#f43f5e; --violet:#a78bfa;
  --mono:'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --sans:'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --head:'Space Grotesk', 'Inter', system-ui, sans-serif;
  --ease:cubic-bezier(.2,.8,.2,1);
  --spring:cubic-bezier(.34,1.36,.64,1);
}
*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{margin:0;min-height:100%}
body{
  background-color:var(--bg);
  background-image:
    radial-gradient(ellipse 900px 380px at 50% -120px, rgba(34,211,238,.13), transparent 70%),
    linear-gradient(rgba(255,255,255,.022) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,.022) 1px, transparent 1px);
  background-size:100% 100%, 24px 24px, 24px 24px;
  background-attachment:fixed;
  color:var(--text); font-family:var(--sans); font-size:15px; line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px;border-radius:4px}
.mono{font-family:var(--mono)}
h1,h2,h3,h4{font-family:var(--head);font-weight:600;margin:0;letter-spacing:-.01em}
p{margin:.3em 0 .7em}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:232px 1fr;grid-template-rows:auto 1fr;min-height:100vh}
.status{grid-column:1/-1;position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:18px;
  padding:10px 18px;background:rgba(10,14,20,.86);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand-mark{width:30px;height:30px;border-radius:7px;border:1px solid var(--line2);display:grid;place-items:center;
  background:linear-gradient(180deg,#16202c,#0f151d);box-shadow:inset 0 1px 0 rgba(255,255,255,.05)}
.brand h1{font-size:16px;white-space:nowrap}
.brand small{display:block;color:var(--muted);font-size:11.5px;font-family:var(--mono);margin-top:-2px}
.status-sep{width:1px;align-self:stretch;background:var(--line)}
.stat{display:flex;flex-direction:column;min-width:0}
.stat .k{font-size:11px;color:var(--muted)}
.stat .v{font-family:var(--mono);font-size:13.5px;white-space:nowrap}
.xpbar{height:4px;background:#1a2330;border-radius:3px;overflow:hidden;margin-top:4px;width:150px}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--cyan),#67e8f9);box-shadow:0 0 8px rgba(34,211,238,.6);transition:width .28s var(--ease)}
.status .grow{flex:1}
.icon-btn{background:var(--panel);border:1px solid var(--line);border-radius:8px;height:34px;min-width:34px;padding:0 10px;
  display:inline-flex;align-items:center;gap:6px;cursor:pointer;color:var(--muted);font-size:13px;transition:border-color .16s,color .16s,box-shadow .16s}
.icon-btn:hover{color:var(--text);border-color:var(--line2)}
.icon-btn.on{color:var(--cyan);border-color:rgba(34,211,238,.45);box-shadow:0 0 0 3px rgba(34,211,238,.08)}

.rail{border-right:1px solid var(--line);padding:18px 12px;display:flex;flex-direction:column;gap:6px;position:sticky;top:57px;height:calc(100vh - 57px);overflow:auto}
.rail-h{font-size:11.5px;color:var(--dim);padding:0 10px 6px;font-family:var(--mono)}
.layer-btn{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:transparent;border:1px solid transparent;
  border-radius:10px;padding:10px;cursor:pointer;color:var(--muted);transition:background .16s,border-color .16s,color .16s}
.layer-btn:hover{background:rgba(255,255,255,.025);color:var(--text)}
.layer-btn.active{background:var(--panel);border-color:var(--line);color:var(--text);box-shadow:inset 0 1px 0 rgba(255,255,255,.04)}
.layer-btn .num{font-family:var(--mono);font-size:12px;width:24px;height:24px;border-radius:6px;display:grid;place-items:center;border:1px solid var(--line2);flex:none}
.layer-btn.active .num{border-color:var(--c);color:var(--c);box-shadow:0 0 10px color-mix(in srgb,var(--c) 35%,transparent)}
.layer-btn .lb{display:flex;flex-direction:column;line-height:1.25;min-width:0}
.layer-btn .lb b{font-weight:500;font-size:14px}
.layer-btn .lb span{font-size:11.5px;color:var(--dim);font-family:var(--mono)}
.layer-btn .chk{margin-left:auto;color:var(--lime);font-family:var(--mono);font-size:11px}
.rail .spacer{flex:1}
.rail-notes{margin-top:8px}

.main{padding:22px 26px 40px;min-width:0}
.layer-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:14px}
.layer-head h2{font-size:26px;font-weight:600}
.layer-head p{color:var(--muted);margin:2px 0 0;max-width:68ch}
.tabs{display:flex;gap:4px;padding:4px;background:var(--panel2);border:1px solid var(--line);border-radius:12px;margin-bottom:16px;overflow-x:auto}
.tab{flex:1;min-width:140px;background:transparent;border:1px solid transparent;border-radius:9px;padding:8px 12px;cursor:pointer;color:var(--muted);
  text-align:left;display:flex;flex-direction:column;line-height:1.3;transition:background .16s,color .16s,border-color .16s}
.tab:hover{color:var(--text)}
.tab.active{background:var(--panel);border-color:var(--line2);color:var(--text)}
.tab .t-id{font-family:var(--mono);font-size:11px;color:var(--dim)}
.tab.active .t-id{color:var(--c)}
.tab .t-n{font-size:13.5px;font-weight:500;display:flex;align-items:center;gap:6px}
.tab .done-dot{width:6px;height:6px;border-radius:50%;background:var(--lime);box-shadow:0 0 6px var(--lime)}
.tab.boss .t-n{color:var(--amber)}

/* ---------- panels ---------- */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;position:relative;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.045), 0 10px 30px -18px rgba(0,0,0,.8)}
.panel-pad{padding:18px}
.bay{display:flex;flex-direction:column;gap:14px}
.bay-top{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap}
.plate{display:inline-flex;align-items:center;gap:8px;font-family:var(--mono);font-size:11.5px;color:#9aa8ba;
  padding:4px 10px;border-radius:5px;border:1px solid #273243;
  background:linear-gradient(180deg,#1b2431,#131a24);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.06), inset 0 -1px 0 rgba(0,0,0,.5), 0 1px 0 rgba(0,0,0,.4);
  text-shadow:0 -1px 0 rgba(0,0,0,.8)}
.plate .screw{width:6px;height:6px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#5b6778,#232c38);box-shadow:inset 0 0 0 .5px #000}
.bay h3{font-size:19px;margin-top:8px}
.lede{color:var(--muted);max-width:72ch;margin:4px 0 0}
.grid2{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(280px,1fr);gap:14px}
.grid2e{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.stack{display:flex;flex-direction:column;gap:12px;min-width:0}
.grid2>*,.grid2e>*{min-width:0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sub{font-family:var(--head);font-size:14px;font-weight:600;color:#c3ccd8;margin-bottom:8px}
.muted{color:var(--muted)}
.small{font-size:13px}
.tiny{font-size:12px}
.hr{height:1px;background:var(--line);margin:4px 0}
.svgwrap{width:100%;overflow-x:auto;border-radius:10px;background:var(--panel2);border:1px solid var(--line)}
.svgwrap svg{display:block;width:100%;min-width:640px;height:auto;touch-action:none;user-select:none;-webkit-user-select:none}
.svgwrap.fit svg{min-width:0}

/* ---------- controls ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:36px;padding:0 14px;border-radius:9px;cursor:pointer;
  background:#18212d;border:1px solid var(--line2);color:var(--text);font-size:13.5px;font-weight:500;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.05);transition:border-color .14s var(--ease),box-shadow .14s var(--ease),background .14s,transform .12s var(--ease)}
.btn:hover{border-color:#3a4a60}
.btn:active{transform:translateY(1px)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.cyan{border-color:rgba(34,211,238,.55);color:#a5f3fc;background:linear-gradient(180deg,rgba(34,211,238,.16),rgba(34,211,238,.06))}
.btn.cyan:hover{box-shadow:0 0 0 3px rgba(34,211,238,.12),0 0 18px -4px rgba(34,211,238,.6)}
.btn.amber{border-color:rgba(245,165,36,.55);color:#fcd58a;background:linear-gradient(180deg,rgba(245,165,36,.16),rgba(245,165,36,.05))}
.btn.amber:hover{box-shadow:0 0 0 3px rgba(245,165,36,.12)}
.btn.rose{border-color:rgba(244,63,94,.55);color:#fda4af;background:linear-gradient(180deg,rgba(244,63,94,.15),rgba(244,63,94,.05))}
.btn.lime{border-color:rgba(132,204,22,.55);color:#bef264;background:linear-gradient(180deg,rgba(132,204,22,.15),rgba(132,204,22,.05))}
.btn.violet{border-color:rgba(167,139,250,.55);color:#ddd6fe;background:linear-gradient(180deg,rgba(167,139,250,.16),rgba(167,139,250,.05))}
.btn.ghost{background:transparent}
.btn.sm{height:30px;padding:0 10px;font-size:12.5px;border-radius:7px}
.btn.lit{box-shadow:0 0 0 3px rgba(34,211,238,.14),0 0 22px -4px rgba(34,211,238,.75)}
.seg{display:inline-flex;background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:3px;gap:3px}
.seg button{border:0;background:transparent;border-radius:6px;padding:5px 11px;cursor:pointer;color:var(--muted);font-size:13px;transition:background .14s,color .14s}
.seg button.on{background:#1d2735;color:var(--text);box-shadow:inset 0 1px 0 rgba(255,255,255,.06)}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:12px;color:var(--muted)}
.inp{height:34px;background:#0c1118;border:1px solid var(--line2);border-radius:8px;padding:0 10px;font-family:var(--mono);font-size:13.5px;min-width:0}
.inp:focus{border-color:rgba(34,211,238,.6);outline:none;box-shadow:0 0 0 3px rgba(34,211,238,.12)}
select.inp{font-family:var(--sans);padding-right:6px}
.chip{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:12px;padding:3px 8px;border-radius:6px;border:1px solid var(--line2);background:#0f151d;color:#b6c2d1}
.chip.cyan{color:var(--cyan);border-color:rgba(34,211,238,.4)}
.chip.lime{color:var(--lime);border-color:rgba(132,204,22,.4)}
.chip.rose{color:var(--rose);border-color:rgba(244,63,94,.45)}
.chip.amber{color:var(--amber);border-color:rgba(245,165,36,.45)}
.chip.violet{color:var(--violet);border-color:rgba(167,139,250,.45)}
.led{width:9px;height:9px;border-radius:50%;background:#2a3442;display:inline-block;flex:none;box-shadow:inset 0 1px 1px rgba(0,0,0,.6)}
.led.on{background:var(--lime);box-shadow:0 0 8px var(--lime)}
.led.cy{background:var(--cyan);box-shadow:0 0 8px var(--cyan)}
.led.am{background:var(--amber);box-shadow:0 0 8px var(--amber)}
.led.ro{background:var(--rose);box-shadow:0 0 8px var(--rose)}

/* readouts */
.readout{position:relative;overflow:hidden;background:#071015;border:1px solid #16303a;border-radius:10px;padding:10px 14px;
  font-family:var(--mono);box-shadow:inset 0 0 24px rgba(34,211,238,.06)}
.readout::after{content:"";position:absolute;left:0;right:0;height:1px;top:0;background:linear-gradient(90deg,transparent,rgba(34,211,238,.55),transparent);
  animation:scan 2.8s linear infinite;pointer-events:none}
@keyframes scan{from{transform:translateY(0)}to{transform:translateY(140px)}}
.readout .rk{font-size:11px;color:#5d8390}
.readout .rv{font-size:28px;color:var(--cyan);text-shadow:0 0 12px rgba(34,211,238,.45);letter-spacing:.02em;line-height:1.2}
.readout .rv.bad{color:var(--rose);text-shadow:0 0 12px rgba(244,63,94,.45)}
.readout .rv.warn{color:var(--amber);text-shadow:0 0 12px rgba(245,165,36,.4)}
.readout .rv.ok{color:var(--lime);text-shadow:0 0 12px rgba(132,204,22,.4)}
.readout .ru{font-size:13px;color:#6b8b96;margin-left:6px}

.fb{border-radius:10px;padding:12px 14px;border:1px solid var(--line2);background:#0f151d;font-size:14px;animation:fbIn .22s var(--ease)}
.fb .fb-t{font-family:var(--head);font-weight:600;margin-bottom:2px;display:flex;align-items:center;gap:8px}
.fb.ok{border-color:rgba(132,204,22,.45);background:linear-gradient(180deg,rgba(132,204,22,.08),rgba(132,204,22,.02))}
.fb.ok .fb-t{color:#bef264}
.fb.bad{border-color:rgba(244,63,94,.45);background:linear-gradient(180deg,rgba(244,63,94,.08),rgba(244,63,94,.02))}
.fb.bad .fb-t{color:#fda4af}
.fb.info{border-color:rgba(34,211,238,.3)}
.fb.info .fb-t{color:#a5f3fc}
@keyframes fbIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

.math{font-family:var(--mono);font-size:13px;background:#0b1017;border:1px solid var(--line);border-radius:8px;padding:10px 12px;color:#b9c6d6;overflow-x:auto;white-space:pre}
.math b{color:var(--cyan);font-weight:500}
.math i{color:var(--amber);font-style:normal}

table.tt{border-collapse:collapse;font-family:var(--mono);font-size:12.5px;width:100%}
table.tt th,table.tt td{padding:4px 8px;border-bottom:1px solid var(--line);text-align:center}
table.tt th{color:var(--muted);font-weight:500}
table.tt tr.pass td{color:#cfe8a8}
table.tt tr.fail td{color:#fda4af;background:rgba(244,63,94,.06)}
table.io{border-collapse:collapse;width:100%;font-size:13px}
table.io th,table.io td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
table.io th{color:var(--muted);font-weight:500;font-size:12px}
table.io tr.sel td{background:rgba(34,211,238,.06)}
table.io tr{cursor:pointer}

/* svg shared */
.term{cursor:crosshair}
.term circle.hit{fill:transparent}
.term:hover circle.vis{stroke:var(--cyan)}
.wire{fill:none;stroke-width:3;stroke-linecap:round;cursor:pointer}
.wire.flow{stroke-dasharray:7 9;animation:flow .7s linear infinite}
@keyframes flow{to{stroke-dashoffset:-16}}
.coil-on{animation:coilPulse 1.4s ease-in-out infinite}
@keyframes coilPulse{0%,100%{filter:drop-shadow(0 0 2px rgba(34,211,238,.5))}50%{filter:drop-shadow(0 0 9px rgba(34,211,238,.95))}}
.path-flow{stroke-dasharray:6 8;animation:flow .6s linear infinite}

/* ladder */
.ladder{background:#0b1017;border:1px solid var(--line);border-radius:10px;padding:14px 12px;overflow-x:auto}
.rung{display:flex;align-items:center;min-height:64px;position:relative}
.rail-l,.rail-r{width:3px;align-self:stretch;background:var(--violet);opacity:.7;border-radius:2px;flex:none}
.rail-l.hot{background:var(--cyan);opacity:1;box-shadow:0 0 8px var(--cyan)}
.wireh{height:2px;background:#39465a;flex:1;min-width:14px}
.wireh.hot{background:var(--cyan);box-shadow:0 0 6px rgba(34,211,238,.7)}
.ins{font-family:var(--mono);font-size:12px;display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 6px;border-radius:8px;border:1px solid transparent;position:relative;flex:none}
.ins .sym{font-size:15px;letter-spacing:-.5px;color:#9fb0c4;white-space:nowrap}
.ins .tag{font-size:11.5px;color:var(--violet);white-space:nowrap}
.ins.true .sym{color:var(--cyan);text-shadow:0 0 8px rgba(34,211,238,.6)}
.ins.true{background:rgba(34,211,238,.06);border-color:rgba(34,211,238,.25)}
.ins.sel{border-color:var(--amber)}
.ins.flag{border-color:var(--rose);background:rgba(244,63,94,.08)}
.ins button.x{position:absolute;top:-8px;right:-8px;width:18px;height:18px;border-radius:50%;border:1px solid var(--line2);background:#161e29;color:var(--muted);font-size:11px;line-height:1;cursor:pointer;padding:0}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(3,6,10,.55);z-index:60;opacity:0;pointer-events:none;transition:opacity .2s var(--ease)}
.scrim.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100vw);z-index:61;background:#0e141c;border-left:1px solid var(--line);
  transform:translateX(104%);transition:transform .28s var(--spring);display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.drawer.open{transform:none}
.drawer-h{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.drawer-b{padding:14px 18px;overflow:auto;flex:1;display:flex;flex-direction:column;gap:10px}
.note{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--panel)}
.note h4{font-size:14px;margin-bottom:3px}
.note p{margin:0;font-size:13.5px;color:#b8c3d1}
.note .meta{font-family:var(--mono);font-size:11px;color:var(--dim);margin-bottom:4px}

/* modal + toast */
.modal{position:fixed;inset:0;z-index:80;display:grid;place-items:center;background:rgba(3,6,10,.6);padding:20px}
.modal .panel{max-width:420px;width:100%}
.toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:24px;z-index:90;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:#101822;border:1px solid var(--line2);border-radius:10px;padding:10px 16px;font-size:14px;box-shadow:0 12px 30px -10px rgba(0,0,0,.8);animation:toastIn .26s var(--spring)}
.toast.level{border-color:rgba(245,165,36,.6);color:#fcd58a;box-shadow:0 0 30px -6px rgba(245,165,36,.5)}
.toast.done{border-color:rgba(132,204,22,.5);color:#d9f99d}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes toastIn{from{opacity:0;transform:translateY(10px) scale(.97)}to{opacity:1;transform:none}}

/* slider */
input[type=range].slider{-webkit-appearance:none;appearance:none;width:100%;height:28px;background:transparent;cursor:pointer}
input[type=range].slider::-webkit-slider-runnable-track{height:6px;border-radius:4px;background:linear-gradient(90deg,var(--cyan) var(--p,0%),#1c2633 var(--p,0%));box-shadow:inset 0 1px 2px rgba(0,0,0,.6)}
input[type=range].slider::-moz-range-track{height:6px;border-radius:4px;background:#1c2633}
input[type=range].slider::-moz-range-progress{height:6px;border-radius:4px;background:var(--cyan)}
input[type=range].slider::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;margin-top:-6px;background:#e6f7fb;border:3px solid var(--cyan);box-shadow:0 0 12px rgba(34,211,238,.7)}
input[type=range].slider::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:#e6f7fb;border:3px solid var(--cyan);box-shadow:0 0 12px rgba(34,211,238,.7)}

.dnd-tag{cursor:grab;user-select:none}
.dnd-tag.picked{border-color:var(--amber);color:var(--amber);box-shadow:0 0 0 3px rgba(245,165,36,.12)}
.drop{border:1px dashed #33425a;border-radius:8px;padding:6px 8px;min-height:32px;font-family:var(--mono);font-size:12px;color:var(--dim);transition:border-color .14s,background .14s}
.drop.over,.drop.armed{border-color:var(--amber);background:rgba(245,165,36,.06)}
.drop.bound{border-style:solid;border-color:rgba(167,139,250,.5);color:var(--violet)}

.steps{display:flex;flex-direction:column;gap:6px}

<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef, useMemo, useCallback, createContext, useContext } = React;

/* ================= persistence ================= */
const STORE_KEY = 'techDevLab.v1';
function loadStore() { try { return JSON.parse(localStorage.getItem(STORE_KEY)) || {}; } catch (e) { return {}; } }
let STORE = loadStore();
let _saveT = null;
function saveStore() {
  clearTimeout(_saveT);
  _saveT = setTimeout(() => { try { localStorage.setItem(STORE_KEY, JSON.stringify(STORE)); } catch (e) {} }, 150);
}
function usePersist(key, init) {
  const [v, setV] = useState(() => {
    if (STORE.tools && Object.prototype.hasOwnProperty.call(STORE.tools, key)) return STORE.tools[key];
    return typeof init === 'function' ? init() : init;
  });
  useEffect(() => { STORE.tools = STORE.tools || {}; STORE.tools[key] = v; saveStore(); }, [key, v]);
  return [v, setV];
}

/* ================= helpers ================= */
const rnd = (a, b) => a + Math.random() * (b - a);
const rint = (a, b) => Math.floor(rnd(a, b + 1));
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const shuffle = arr => { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const fmt = (v, d = 2) => (Number.isFinite(v) ? v.toFixed(d) : '---');
const prefersReduced = () => window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ================= sound (WebAudio, default muted) ================= */
let SOUND_ON = false;
const Sound = (() => {
  let ctx = null;
  const ac = () => {
    if (!ctx) { const C = window.AudioContext || window.webkitAudioContext; if (!C) return null; ctx = new C(); }
    if (ctx.state === 'suspended') ctx.resume();
    return ctx;
  };
  function tone({ f = 800, d = 0.05, type = 'square', g = 0.05, slide = 0, delay = 0 }) {
    const c = ac(); if (!c) return;
    const t = c.currentTime + delay;
    const o = c.createOscillator(), gn = c.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f + slide), t + d);
    gn.gain.setValueAtTime(g, t); gn.gain.exponentialRampToValueAtTime(0.0001, t + d);
    o.connect(gn).connect(c.destination); o.start(t); o.stop(t + d + 0.02);
  }
  function noise(d, g, freq) {
    const c = ac(); if (!c) return;
    const len = Math.floor(c.sampleRate * d), buf = c.createBuffer(1, len, c.sampleRate), data = buf.getChannelData(0);
    for (let i = 0; i < len; i++) data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3);
    const s = c.createBufferSource(), f = c.createBiquadFilter(), gn = c.createGain();
    f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = 0.9; gn.gain.value = g;
    s.buffer = buf; s.connect(f).connect(gn).connect(c.destination); s.start();
  }
  const fx = {
    click() { tone({ f: 2200, d: 0.012, g: 0.025 }); },
    snap() { noise(0.035, 0.35, 2600); tone({ f: 320, d: 0.03, g: 0.03 }); },
    thunk() { noise(0.09, 0.6, 260); tone({ f: 90, d: 0.14, type: 'sine', g: 0.25, slide: -40 }); },
    good() { tone({ f: 660, d: 0.08, type: 'triangle', g: 0.06 }); tone({ f: 990, d: 0.1, type: 'triangle', g: 0.06, delay: 0.07 }); },
    bad() { tone({ f: 190, d: 0.16, type: 'sawtooth', g: 0.035, slide: -70 }); },
    level() { [523, 659, 784, 1046].forEach((f, i) => tone({ f, d: 0.14, type: 'triangle', g: 0.06, delay: i * 0.09 })); },
  };
  return { play(n) { if (SOUND_ON && fx[n]) { try { fx[n](); } catch (e) {} } } };
})();
const sfx = n => Sound.play(n);

/* ================= catalog ================= */
const LAYERS = [
  { id: 1, name: 'Electrical Controls', short: 'Electrical', color: 'var(--cyan)', axis: 'Electrical',
    blurb: '24 VDC distribution, relays, NO/NC logic, sourcing and sinking, contactors, overloads.' },
  { id: 2, name: 'Instrumentation', short: 'Instrument', color: 'var(--lime)', axis: 'Instrumentation',
    blurb: '2/3/4-wire devices, analog scaling, RTDs, transmitters, calibration records.' },
  { id: 3, name: 'PLC Troubleshooting', short: 'PLC', color: 'var(--amber)', axis: 'PLC',
    blurb: 'I/O maps, permissives, interlocks, timers, and tracing faults through logic.' },
  { id: 4, name: 'Programming', short: 'Program', color: 'var(--violet)', axis: 'Programming',
    blurb: 'Ladder edits, tags, HMI bindings, and change control.' },
];
const TOOLS = {
  '1.1': { layer: 1, name: 'Wire It Live' }, '1.2': { layer: 1, name: 'Sourcing or Sinking?' }, '1.3': { layer: 1, name: 'Contact Logic Puzzle' },
  '2.1': { layer: 2, name: 'Wire Count Detective' }, '2.2': { layer: 2, name: 'Scaling Bench' }, '2.3': { layer: 2, name: 'Calibration Record' },
  '3.1': { layer: 3, name: 'I/O Map Inspector' }, '3.2': { layer: 3, name: 'Permissive Detective' }, '3.3': { layer: 3, name: 'Timer Trace' },
  '4.1': { layer: 4, name: 'Rung Editor' }, '4.2': { layer: 4, name: 'HMI Tag Bind' }, '4.3': { layer: 4, name: 'Change Control Gate' },
};
const LEVELS = [
  { n: 'Helper', xp: 0 }, { n: 'Apprentice', xp: 300 }, { n: 'Technician', xp: 800 },
  { n: 'Senior Tech', xp: 1600 }, { n: 'Lead Tech', xp: 2600 }, { n: 'Controls Engineer', xp: 3800 },
];
function levelFor(xp) {
  let i = 0; LEVELS.forEach((l, k) => { if (xp >= l.xp) i = k; });
  const cur = LEVELS[i], nxt = LEVELS[i + 1];
  return { i, name: cur.n, next: nxt ? nxt.n : null, pct: nxt ? (xp - cur.xp) / (nxt.xp - cur.xp) : 1, toNext: nxt ? nxt.xp - xp : 0 };
}
function skillFor(game, layer) {
  const tools = Object.keys(TOOLS).filter(k => TOOLS[k].layer === layer && game.done[k]).length;
  return Math.min(100, tools * 28 + (game.boss[layer] ? 16 : 0));
}

/* ================= game context ================= */
const GameCtx = createContext(null);
const useGame = () => useContext(GameCtx);
const DEFAULT_GAME = { xp: 0, streak: 0, best: 0, muted: true, done: {}, boss: {}, notes: [], layer: 1, tool: { 1: '1.1', 2: '2.1', 3: '3.1', 4: '4.1' } };

function GameProvider({ children }) {
  const [game, setGame] = useState(() => ({ ...DEFAULT_GAME, ...(STORE.game || {}) }));
  const [toasts, setToasts] = useState([]);
  const lvlRef = useRef(levelFor(game.xp).i);

  useEffect(() => { STORE.game = game; saveStore(); SOUND_ON = !game.muted; }, [game]);
  const toast = useCallback((text, kind = '') => {
    const id = Math.random().toString(36).slice(2);
    setToasts(t => [...t, { id, text, kind }]);
    setTimeout(() => setToasts(t => t.filter(x => x.id !== id)), 3200);
  }, []);
  useEffect(() => {
    const l = levelFor(game.xp);
    if (l.i > lvlRef.current) { toast(`Level up: ${l.name}`, 'level'); sfx('level'); }
    lvlRef.current = l.i;
  }, [game.xp, toast]);

  const api = useMemo(() => ({
    game, setGame, toast,
    correct(xp = 10) {
      setGame(g => { const s = g.streak + 1; const bonus = s >= 5 ? 5 : s >= 3 ? 2 : 0; return { ...g, xp: g.xp + xp + bonus, streak: s, best: Math.max(g.best, s) }; });
      sfx('good');
    },
    miss() { setGame(g => ({ ...g, streak: 0 })); sfx('bad'); },
    note(key, title, text, layer) {
      if (!key || !text) return;
      setGame(g => g.notes.some(n => n.key === key) ? g : { ...g, notes: [{ key, title, text, layer, ts: Date.now() }, ...g.notes] });
    },
    complete(id) {
      setGame(g => {
        if (g.done[id]) return g;
        setTimeout(() => toast(`${id} ${TOOLS[id].name} complete. Skill radar updated.`, 'done'), 0);
        return { ...g, xp: g.xp + 80, done: { ...g.done, [id]: true } };
      });
    },
    completeBoss(layer) {
      setGame(g => {
        if (g.boss[layer]) return { ...g, xp: g.xp + 40 };
        setTimeout(() => toast(`Layer ${layer} complete. Boss Job cleared.`, 'level'), 0);
        return { ...g, xp: g.xp + 200, boss: { ...g.boss, [layer]: true } };
      });
    },
  }), [game, toast]);

  return (
    <GameCtx.Provider value={api}>
      {children}
      <div className="toasts" aria-live="polite">{toasts.map(t => <div key={t.id} className={'toast ' + t.kind}>{t.text}</div>)}</div>
    </GameCtx.Provider>
  );
}

/* feedback hook: sets local message, awards XP or resets streak, files a field note */
function useFeedback(toolId) {
  const g = useGame();
  const [fb, setFb] = useState(null);
  const report = useCallback(({ kind = 'info', title, text, key, xp = 0 }) => {
    setFb({ kind, title, text, id: Math.random() });
    if (kind === 'ok') g.correct(xp);
    if (kind === 'bad') g.miss();
    if (key && text) g.note(`${toolId}:${key}`, title, text, TOOLS[toolId] ? TOOLS[toolId].layer : 0);
  }, [g, toolId]);
  return [fb, report, setFb];
}

function Feedback({ fb, placeholder }) {
  if (!fb) return placeholder ? <div className="fb info"><div className="fb-t">Bench notes</div><div className="muted small">{placeholder}</div></div> : null;
  const icon = fb.kind === 'ok' ? <Glyph n="check" /> : fb.kind === 'bad' ? <Glyph n="x" /> : <Glyph n="info" />;
  return (
    <div key={fb.id} className={'fb ' + fb.kind} role="status">
      <div className="fb-t">{icon}{fb.title}</div>
      {fb.text && <div className="small" style={{ color: '#c4cedb' }}>{fb.text}</div>}
    </div>
  );
}

function Glyph({ n, s = 14 }) {
  const p = { width: s, height: s, viewBox: '0 0 16 16', fill: 'none', stroke: 'currentColor', strokeWidth: 1.6, strokeLinecap: 'round', strokeLinejoin: 'round', 'aria-hidden': true };
  switch (n) {
    case 'check': return <svg {...p}><path d="M3 8.5l3 3 7-7" /></svg>;
    case 'x': return <svg {...p}><path d="M4 4l8 8M12 4l-8 8" /></svg>;
    case 'info': return <svg {...p}><circle cx="8" cy="8" r="6" /><path d="M8 7.2v4M8 4.8v.1" /></svg>;
    case 'book': return <svg {...p}><path d="M3 3h4a2 2 0 012 2v8a1.5 1.5 0 00-1.5-1.5H3zM13 3H9a2 2 0 00-2 2v8a1.5 1.5 0 011.5-1.5H13z" /></svg>;
    case 'sound': return <svg {...p}><path d="M3 6h2.5L9 3v10L5.5 10H3zM11.5 5.5a3.5 3.5 0 010 5M13 3.8a6 6 0 010 8.4" /></svg>;
    case 'mute': return <svg {...p}><path d="M3 6h2.5L9 3v10L5.5 10H3zM11.5 6l3 4M14.5 6l-3 4" /></svg>;
    case 'reset': return <svg {...p}><path d="M3 8a5 5 0 105-5H5.5M5.5 1.5V3.5H7.5" /></svg>;
    case 'bolt': return <svg {...p}><path d="M9 1.5L3.5 9H8l-1 5.5L12.5 7H8z" /></svg>;
    case 'wave': return <svg {...p}><path d="M1 8h2l1.5-4 3 8 3-8 1.5 4H15" /></svg>;
    case 'chip': return <svg {...p}><rect x="4" y="4" width="8" height="8" rx="1" /><path d="M6 1.5v2.5M10 1.5v2.5M6 12v2.5M10 12v2.5M1.5 6H4M1.5 10H4M12 6h2.5M12 10h2.5" /></svg>;
    case 'code': return <svg {...p}><path d="M5.5 4.5L2 8l3.5 3.5M10.5 4.5L14 8l-3.5 3.5" /></svg>;
    case 'copy': return <svg {...p}><rect x="5" y="5" width="8.5" height="8.5" rx="1.5" /><path d="M11 5V3.5A1.5 1.5 0 009.5 2h-6A1.5 1.5 0 002 3.5v6A1.5 1.5 0 003.5 11H5" /></svg>;
    default: return null;
  }
}

function Plate({ children }) { return <span className="plate"><i className="screw" />{children}<i className="screw" /></span>; }

function BayHeader({ id, title, lede, right }) {
  return (
    <div className="bay-top">
      <div>
        <Plate>Bay {id}</Plate>
        <h3>{title}</h3>
        {lede && <p className="lede">{lede}</p>}
      </div>
      {right}
    </div>
  );
}

function Seg({ value, options, onChange, label }) {
  return (
    <div className="seg" role="radiogroup" aria-label={label}>
      {options.map(o => {
        const v = typeof o === 'object' ? o.v : o, l = typeof o === 'object' ? o.l : o;
        return <button key={String(v)} role="radio" aria-checked={value === v} className={value === v ? 'on' : ''} onClick={() => { sfx('click'); onChange(v); }}>{l}</button>;
      })}
    </div>
  );
}

function Readout({ label, value, unit, tone = '' }) {
  return (
    <div className="readout">
      <div className="rk">{label}</div>
      <div><span className={'rv ' + tone}>{value}</span>{unit && <span className="ru">{unit}</span>}</div>
    </div>
  );
}

/* generic multi-trace scope. traces: [{name,color,data:[0..1 values], digital?}] */
function Scope({ traces, height = 150, label, grid = 10 }) {
  const W = 600, H = height, pad = 6;
  const rowH = (H - pad * 2) / traces.length;
  return (
    <div className="svgwrap fit" style={{ background: '#050b0f', borderColor: '#14303a' }}>
      <svg viewBox={`0 0 ${W} ${H}`} role="img" aria-label={label || 'Scope trace'}>
        {Array.from({ length: grid + 1 }).map((_, i) => <line key={'v' + i} x1={(i * W) / grid} x2={(i * W) / grid} y1={0} y2={H} stroke="#0f2530" strokeWidth="1" />)}
        {traces.map((t, k) => {
          const top = pad + k * rowH, bot = top + rowH - 8;
          const n = t.data.length;
          const pts = t.data.map((v, i) => `${(i / Math.max(1, n - 1)) * W},${bot - clamp(v, -1.2, 1.2) * (bot - top)}`).join(' ');
          return (
            <g key={t.name}>
              <line x1="0" x2={W} y1={bot} y2={bot} stroke="#123241" strokeDasharray="3 4" />
              <polyline points={pts} fill="none" stroke={t.color} strokeWidth="1.8" strokeLinejoin="round" style={{ filter: `drop-shadow(0 0 3px ${t.color})` }} />
              <text x="6" y={top + 11} fill={t.color} fontFamily="JetBrains Mono" fontSize="11">{t.name}</text>
            </g>
          );
        })}
      </svg>
    </div>
  );
}

/* ================= LAYER 1 ================= */
/* ---------- 1.1 Wire It Live ---------- */
const T11 = {
  'PS+': { x: 130, y: 236, l: '+24V', d: 'r' }, 'PS-': { x: 130, y: 306, l: '0V', d: 'r' },
  OL95: { x: 208, y: 112, l: '95', d: 'd' }, OL96: { x: 272, y: 112, l: '96', d: 'd' },
  STP11: { x: 350, y: 112, l: '11', d: 'd' }, STP12: { x: 392, y: 112, l: '12', d: 'd' }, STP13: { x: 440, y: 112, l: '13', d: 'd' }, STP14: { x: 482, y: 112, l: '14', d: 'd' },
  STR11: { x: 540, y: 112, l: '11', d: 'd' }, STR12: { x: 582, y: 112, l: '12', d: 'd' }, STR13: { x: 630, y: 112, l: '13', d: 'd' }, STR14: { x: 672, y: 112, l: '14', d: 'd' },
  CRA1: { x: 750, y: 112, l: 'A1', d: 'd' }, CRA2: { x: 822, y: 112, l: 'A2', d: 'd' },
  CR13: { x: 450, y: 318, l: '13', d: 'u' }, CR14: { x: 500, y: 318, l: '14', d: 'u' }, CR23: { x: 572, y: 318, l: '23', d: 'u' }, CR24: { x: 622, y: 318, l: '24', d: 'u' },
  MA1: { x: 724, y: 318, l: 'A1', d: 'u' }, MA2: { x: 794, y: 318, l: 'A2', d: 'u' },
};
const SW11 = [
  { a: 'OL95', b: 'OL96', c: s => !s.ol },
  { a: 'STP11', b: 'STP12', c: s => !s.stop }, { a: 'STP13', b: 'STP14', c: s => !!s.stop },
  { a: 'STR11', b: 'STR12', c: s => !s.start }, { a: 'STR13', b: 'STR14', c: s => !!s.start },
  { a: 'CR13', b: 'CR14', c: s => !!s.cr }, { a: 'CR23', b: 'CR24', c: s => !!s.cr },
];
const COILS11 = [{ id: 'cr', a: 'CRA1', b: 'CRA2' }, { id: 'm', a: 'MA1', b: 'MA2' }];
const SOLUTION11 = [['PS+', 'OL95'], ['OL96', 'STP11'], ['STP12', 'STR13'], ['STR14', 'CRA1'], ['CRA2', 'PS-'], ['CR13', 'STP12'], ['CR14', 'STR14'], ['PS+', 'CR23'], ['CR24', 'MA1'], ['MA2', 'PS-']];

function groups11(wires) {
  const parent = {}; Object.keys(T11).forEach(k => (parent[k] = k));
  const f = x => (parent[x] === x ? x : (parent[x] = f(parent[x])));
  wires.forEach(([a, b]) => { parent[f(a)] = f(b); });
  return f;
}
function net11(wires, s) {
  const f = groups11(wires);
  if (!s.power) return { hot: new Set(), cold: new Set(), coil: { cr: false, m: false }, short: false, f };
  const adj = {}; const add = (a, b) => { (adj[a] = adj[a] || []).push(b); (adj[b] = adj[b] || []).push(a); };
  SW11.forEach(w => { if (w.c(s)) add(f(w.a), f(w.b)); });
  const reach = st => { const seen = new Set([st]); const q = [st]; while (q.length) { const x = q.pop(); (adj[x] || []).forEach(y => { if (!seen.has(y)) { seen.add(y); q.push(y); } }); } return seen; };
  const hot = reach(f('PS+')), cold = reach(f('PS-'));
  const short = hot.has(f('PS-'));
  const coil = {};
  COILS11.forEach(c => { const A = f(c.a), B = f(c.b); coil[c.id] = !short && ((hot.has(A) && cold.has(B)) || (hot.has(B) && cold.has(A))); });
  return { hot, cold, coil, short, f };
}
function solve11(wires, inp, prev) {
  let st = { cr: !!prev.cr, m: !!prev.m }, r = null;
  for (let i = 0; i < 8; i++) {
    r = net11(wires, { ...inp, ...st });
    const ns = { cr: r.coil.cr, m: r.coil.m };
    if (ns.cr === st.cr && ns.m === st.m) break;
    st = ns;
  }
  return { cr: r.coil.cr, m: r.coil.m, short: r.short, net: r };
}
function check11(wires) {
  const f = groups11(wires);
  const same = (a, b) => f(a) === f(b);
  const touches = t => wires.some(w => w.includes(t));
  const steps = [
    { id: 'idle', inp: { start: 0, stop: 0, ol: 0 }, exp: [0, 0], say: 'Power on, nothing pressed' },
    { id: 'start', inp: { start: 1, stop: 0, ol: 0 }, exp: [1, 1], say: 'Press start' },
    { id: 'seal', inp: { start: 0, stop: 0, ol: 0 }, exp: [1, 1], say: 'Release start' },
    { id: 'stop', inp: { start: 0, stop: 1, ol: 0 }, exp: [0, 0], say: 'Press stop' },
    { id: 'stopRel', inp: { start: 0, stop: 0, ol: 0 }, exp: [0, 0], say: 'Release stop' },

          <Feedback fb={fb} placeholder="Every series device in a control circuit has a job. Stops are NC so a broken wire stops the machine. The seal-in holds the relay after start is released. The overload has to break the seal, or a reset turns into a surprise restart." />
        </div>
      </div>
    </div>
  );
}

/* ---------- 1.2 Sourcing or Sinking ---------- */
function ss12Works(sensor, card, com) {
  return (sensor === 'PNP' && card === 'sinking' && com === '0V') || (sensor === 'NPN' && card === 'sourcing' && com === '24V');
}
function ss12Answer(sensor, card) {
  if (sensor === 'PNP' && card === 'sinking') return '0V';
  if (sensor === 'NPN' && card === 'sourcing') return '24V';
  return 'none';
}
function SourcingSinking() {
  const g = useGame();
  const [fb, report] = useFeedback('1.2');
  const [st, setSt] = usePersist('1.2.state', () => ({ sensor: pick(['PNP', 'NPN']), card: pick(['sinking', 'sourcing']), wins: 0 }));
  const [side, setSide] = useState(null);
  const [com, setCom] = useState(null);
  const [target, setTarget] = useState(true);

  const { sensor, card } = st;
  const works = com && ss12Works(sensor, card, com);
  const flowing = works && target;
  const outHigh = sensor === 'PNP' && target;
  const outLow = sensor === 'NPN' && target;

  const newRound = () => { setSt(s => ({ ...s, sensor: pick(['PNP', 'NPN']), card: pick(['sinking', 'sourcing']) })); setSide(null); setCom(null); };

  const check = () => {
    if (!side || !com) { report({ kind: 'info', title: 'Two answers needed', text: 'Pick how the sensor switches, then where the card common lands.' }); return; }
    const sideOk = (sensor === 'PNP' && side === 'high') || (sensor === 'NPN' && side === 'low');
    const ans = ss12Answer(sensor, card);
    const comOk = com === ans;
    const devTxt = sensor === 'PNP'
      ? 'A PNP sensor switches the + side. When it sees the target it connects its output (black) to +24 V and pushes current out: it sources.'
      : 'An NPN sensor switches the 0 V side. When it sees the target it pulls its output (black) to 0 V and lets current flow in: it sinks.';
    const cardTxt = card === 'sinking'
      ? 'A sinking input takes current in at the input terminal, through the opto LED, and out the common to 0 V. It needs a device that sources.'
      : 'A sourcing input has its common tied to +24 V and pushes current out of the input terminal. It needs a device that sinks that current to 0 V.';
    if (sideOk && comOk) {
      const n = st.wins + 1;
      setSt(s => ({ ...s, wins: n }));
      report({ kind: 'ok', xp: 20, key: `${sensor}-${card}`, title: ans === 'none' ? 'Correct: this pairing cannot work' : `Correct: COM to ${ans === '0V' ? '0 V' : '+24 V'}`,
        text: ans === 'none'
          ? `${devTxt} ${cardTxt} Both ends of the input end up at the same polarity, so there is no voltage across the opto and no current. You would need the other card type, an interposing relay, or a pull-up/pull-down arrangement the manufacturer approves.`
          : `${devTxt} ${cardTxt} The loop closes through the opto and the input turns on.` });
      if (n >= 4) g.complete('1.2');
    } else {
      report({ kind: 'bad', key: `miss-${sensor}-${card}`, title: !sideOk ? 'Check how the sensor switches' : 'That common will not complete the loop',
        text: !sideOk ? devTxt : `${cardTxt} ${ans === 'none' ? 'With this sensor, neither common choice creates a voltage across the input. The honest answer is that this pairing is incompatible.' : `With a ${sensor} sensor the current path only closes with COM at ${ans === '0V' ? '0 V' : '+24 V'}.`}` });
    }
  };

  const cyan = 'var(--cyan)', dead = '#4d5b6e', rose = 'var(--rose)';

  return (
    <div className="bay">

        lede="A 3-wire DC prox is landed on input 0. Decide how the sensor switches and where the card common goes. Flip the card type to see how the answer changes."
        right={<span className="chip lime">{Math.min(4, st.wins)}/4 correct</span>} />
      <div className="grid2">
        <div className="stack">
          <div className="svgwrap">
            <svg viewBox="0 0 760 360" role="img" aria-label="Sensor and input card wiring">
              <line x1="30" x2="730" y1="40" y2="40" stroke="#b8484f" strokeWidth="3" />
              <text x="36" y="30" fill="#e0868c" fontSize="12" fontFamily="JetBrains Mono">+24 VDC</text>
              <line x1="30" x2="730" y1="320" y2="320" stroke="#4a6fa8" strokeWidth="3" />
              <text x="36" y="342" fill="#86a6d8" fontSize="12" fontFamily="JetBrains Mono">0 VDC</text>
              {/* sensor */}
              <rect x="70" y="130" width="140" height="100" rx="14" fill="#161f2b" stroke="#2c3a50" />
              <rect x="40" y="160" width="34" height="40" rx="6" fill="#1d2836" stroke="#2c3a50" />
              <circle cx="190" cy="148" r="5" fill={target ? 'var(--amber)' : '#3a3325'} style={target ? { filter: 'drop-shadow(0 0 4px var(--amber))' } : null} />
              <text x="140" y="222" textAnchor="middle" fill="#8b99ad" fontSize="11" fontFamily="JetBrains Mono">{sensor} prox</text>
              {/* brown and blue */}
              <path d="M100,130 V40" stroke={flowing && sensor === 'PNP' ? cyan : '#8a5a2b'} strokeWidth="3" className={flowing && sensor === 'PNP' ? 'path-flow' : ''} />
              <text x="106" y="96" fill="#b07a45" fontSize="11" fontFamily="JetBrains Mono">BN</text>
              <path d="M100,230 V320" stroke={flowing && sensor === 'NPN' ? cyan : '#3b62a8'} strokeWidth="3" className={flowing && sensor === 'NPN' ? 'path-flow' : ''} />
              <text x="106" y="282" fill="#6f95d8" fontSize="11" fontFamily="JetBrains Mono">BU</text>
              {/* internal switch */}
              {sensor === 'PNP' ? (
                <g stroke={target ? cyan : '#7c8a9e'} strokeWidth="2" fill="none">
                  <path d="M100,150 H130" /><path d={target ? 'M130,150 L160,150' : 'M130,150 L155,138'} /><path d="M160,150 V180 H210" />
                </g>
              ) : (
                <g stroke={target ? cyan : '#7c8a9e'} strokeWidth="2" fill="none">
                  <path d="M210,180 H160 V200" /><path d={target ? 'M160,200 L130,200' : 'M160,200 L135,188'} /><path d="M130,200 H100 V230" />

              {/* black output to card */}
              <path d="M210,180 H480" stroke={flowing ? cyan : '#1a1d22'} strokeWidth="5" />

              <text x="330" y="170" fill="#9aa3ad" fontSize="11" fontFamily="JetBrains Mono">BK  output  {target ? (outHigh ? '+24 V' : outLow ? '0 V' : '') : 'off'}</text>
              {/* card */}
              <rect x="460" y="96" width="230" height="190" rx="10" fill="#141c27" stroke="#27344a" />
              <rect x="470" y="86" width="150" height="18" rx="4" fill="#1b2431" stroke="#2c394d" />
              <text x="478" y="99" fill="#a9b6c8" fontSize="11" fontFamily="JetBrains Mono">DC IN  {card}</text>
              <circle cx="480" cy="180" r="7" fill="#0d131b" stroke="#8a98ab" strokeWidth="2" />
              <text x="494" y="184" fill="#8b99ad" fontSize="11" fontFamily="JetBrains Mono">IN0</text>
              <circle cx="480" cy="250" r="7" fill="#0d131b" stroke="#8a98ab" strokeWidth="2" />
              <text x="494" y="254" fill="#8b99ad" fontSize="11" fontFamily="JetBrains Mono">COM</text>
              {/* opto */}
              <path d="M487,180 H560 V196 M560,234 V250 H487" stroke={flowing ? cyan : '#7c8a9e'} strokeWidth="2" fill="none" className={flowing ? 'path-flow' : ''} />
              <rect x="552" y="196" width="16" height="10" fill="none" stroke="#7c8a9e" />
              {card === 'sinking'
                ? <path d="M548,212 H572 L560,228 Z M548,228 H572" fill={flowing ? 'rgba(34,211,238,.4)' : 'none'} stroke={flowing ? cyan : '#7c8a9e'} strokeWidth="1.6" />
                : <path d="M548,228 H572 L560,212 Z M548,212 H572" fill={flowing ? 'rgba(34,211,238,.4)' : 'none'} stroke={flowing ? cyan : '#7c8a9e'} strokeWidth="1.6" />}

              <text x="575" y="272" textAnchor="middle" fill="#4f5e72" fontSize="10" fontFamily="JetBrains Mono">opto (one direction)</text>
              {/* common wire */}

                <path d={`M473,250 H400 V${comY}`} stroke={flowing ? cyan : com === '24V' ? '#b8484f' : '#4a6fa8'} strokeWidth="3" fill="none" className={flowing ? 'path-flow' : ''} />
              ) : <path d="M473,250 H430" stroke="#4d5b6e" strokeWidth="3" strokeDasharray="4 4" />}
              {com && com !== 'none' && target && !works && (

/* ---------- 1.3 Contact Logic Puzzle ---------- */
const P13 = [
  { id: 'p1', text: 'Output energizes only when A is on, B is off, and either C or D is on.', vars: ['A', 'B', 'C', 'D'], f: s => s.A && !s.B && (s.C || s.D) },
  { id: 'p2', text: 'Output energizes when A or B is on, but never while C is on.', vars: ['A', 'B', 'C'], f: s => (s.A || s.B) && !s.C },
  { id: 'p3', text: 'Output energizes when exactly one of A and B is on.', vars: ['A', 'B'], f: s => s.A !== s.B },
  { id: 'p4', text: 'Output energizes when A and B are both on, or when C is on and D is off.', vars: ['A', 'B', 'C', 'D'], f: s => (s.A && s.B) || (s.C && !s.D) },
  { id: 'p5', text: 'Output energizes only when A, B and C are all off.', vars: ['A', 'B', 'C'], f: s => !s.A && !s.B && !s.C },
];
const TAGS13 = ['A', 'B', 'C', 'D'];
const cTrue = (c, s) => (c.t === 'XIC' ? !!s[c.v] : !s[c.v]);
const branchTrue = (b, s) => b.every(c => cTrue(c, s));
const groupTrue = (gp, s) => gp.some(b => branchTrue(b, s));
const rungTrue = (r, s) => r.every(gp => groupTrue(gp, s));
const combos = vars => Array.from({ length: 1 << vars.length }, (_, i) => { const s = {}; vars.forEach((v, k) => { s[v] = !!(i & (1 << (vars.length - 1 - k))); }); return s; });

function ContactLogic() {
  const g = useGame();
  const [fb, report] = useFeedback('1.3');
  const [pi, setPi] = usePersist('1.3.puzzle', 0);
  const [solved, setSolved] = usePersist('1.3.solved', {});
  const [rung, setRung] = usePersist('1.3.rung', [[[{ t: 'XIC', v: 'A' }]]]);
  const [io, setIo] = useState({ A: false, B: false, C: false, D: false });
  const P = P13[pi];

  const rows = combos(P.vars).map(s => {
    const others = TAGS13.filter(t => !P.vars.includes(t));
    const variants = combos(others).map(o => ({ ...s, ...o }));
    const target = P.f(s);
    const ok = variants.every(v => rungTrue(rung, v) === target);
    return { s, target, yours: rungTrue(rung, { ...s, ...Object.fromEntries(others.map(o => [o, false])) }), ok };
  });
  const allOk = rows.every(r => r.ok);

  const upd = fn => setRung(r => { const c = JSON.parse(JSON.stringify(r)); fn(c); return c; });
  const check = () => {
    if (allOk) {
      report({ kind: 'ok', xp: 25, key: P.id, title: 'Every row matches',
        text: 'Series contacts are AND: power only passes if every one is true. Parallel branches are OR: any one true branch carries power. XIO passes power when its bit is 0, which is how you build a NOT.' });
      const ns = { ...solved, [P.id]: true }; setSolved(ns);
      if (Object.keys(ns).length >= 3) g.complete('1.3');
    } else {
      const bad = rows.find(r => !r.ok);
      const cond = P.vars.map(v => `${v}=${bad.s[v] ? 1 : 0}`).join(' ');
      report({ kind: 'bad', key: 'rowfail', title: `Row ${cond} is wrong`,
        text: `The goal wants the output ${bad.target ? 'ON' : 'OFF'} here, and your rung ${bad.target ? 'blocks power' : 'passes power'}. Remember: an XIC contact is true when its bit is 1, an XIO when its bit is 0. Contacts in series all have to be true; only one parallel branch has to be.` });
    }
  };

  const liveTrue = rungTrue(rung, io);
  return (
    <div className="bay">
      <BayHeader id="1.3" title="Contact logic puzzle"
        lede="Build a rung that matches the stated condition. Click a contact to flip it between XIC and XIO, change its tag, add contacts in series, or add parallel branches."
        right={<span className="chip lime">{Object.keys(solved).length}/3 solved</span>} />
      <div className="row">
        {P13.map((p, i) => (
          <button key={p.id} className={'btn sm ' + (i === pi ? 'violet' : 'ghost')} onClick={() => { setPi(i); setRung([[[{ t: 'XIC', v: 'A' }]]]); }}>
            {solved[p.id] && <span className="led on" />}Puzzle {i + 1}
          </button>
        ))}
      </div>
      <div className="panel panel-pad" style={{ padding: '12px 16px' }}><span className="muted small">Goal: </span>{P.text}</div>
      <div className="grid2">
        <div className="stack">
          <div className="ladder">
            <div className="rung" style={{ minHeight: 80 }}>
              <div className="rail-l hot" />
              {rung.map((gp, gi) => {
                const gTrue = rung.slice(0, gi + 1).every(x => groupTrue(x, io));
                const inTrue = rung.slice(0, gi).every(x => groupTrue(x, io));
                return (
                  <React.Fragment key={gi}>
                    <div className={'wireh' + (inTrue ? ' hot' : '')} style={{ flex: '0 0 16px' }} />
                    <div style={{ display: 'flex', flexDirection: 'column', gap: 6, borderLeft: `2px solid ${inTrue ? 'var(--cyan)' : '#39465a'}`, borderRight: `2px solid ${gTrue ? 'var(--cyan)' : '#39465a'}`, padding: '6px 0', position: 'relative' }}>
                      {gp.map((b, bi) => {
                        const bT = inTrue && branchTrue(b, io);
                        return (
                          <div key={bi} style={{ display: 'flex', alignItems: 'center', minHeight: 50 }}>
                            {b.length === 0 && <div className={'wireh' + (inTrue ? ' hot' : '')} style={{ minWidth: 40 }} />}
                            {b.map((c, ci) => {
                              const upTo = inTrue && b.slice(0, ci).every(x => cTrue(x, io));
                              return (
                                <React.Fragment key={ci}>
                                  <div className={'wireh' + (upTo ? ' hot' : '')} style={{ flex: '0 0 12px' }} />
                                  <div className={'ins' + (cTrue(c, io) ? ' true' : '')}>
                                    <button className="btn ghost sm" style={{ height: 26, padding: '0 6px', fontFamily: 'var(--mono)' }} title="Flip XIC / XIO"
                                      onClick={() => { upd(r => { r[gi][bi][ci].t = c.t === 'XIC' ? 'XIO' : 'XIC'; }); sfx('click'); }}>
                                      <span className="sym">{c.t === 'XIC' ? '-| |-' : '-|/|-'}</span>
                                    </button>
                                    <select className="inp" style={{ height: 24, fontSize: 12, padding: '0 4px', fontFamily: 'var(--mono)', color: 'var(--violet)' }} value={c.v}
                                      onChange={e => upd(r => { r[gi][bi][ci].v = e.target.value; })} aria-label="Tag">
                                      {TAGS13.map(t => <option key={t}>{t}</option>)}
                                    </select>
                                    <button className="x" aria-label="Remove contact" onClick={() => upd(r => { r[gi][bi].splice(ci, 1); })}>×</button>
                                  </div>
                                </React.Fragment>
                              );
                            })}
                            <div className={'wireh' + (bT ? ' hot' : '')} style={{ flex: '0 0 10px' }} />
                            <button className="btn ghost sm" style={{ height: 24, padding: '0 6px' }} title="Add contact in series on this branch" onClick={() => upd(r => { r[gi][bi].push({ t: 'XIC', v: 'A' }); })}>+</button>
                            {gp.length > 1 && <button className="btn ghost sm" style={{ height: 24, padding: '0 6px', color: 'var(--rose)' }} title="Delete branch" onClick={() => upd(r => { r[gi].splice(bi, 1); })}>−</button>}
                            <div className={'wireh' + (bT ? ' hot' : '')} style={{ flex: 1, minWidth: 8 }} />
                          </div>
                        );
                      })}
                      <div className="row" style={{ gap: 4, paddingLeft: 8 }}>
                        <button className="btn ghost sm" style={{ height: 22, fontSize: 11 }} onClick={() => upd(r => { r[gi].push([{ t: 'XIC', v: 'A' }]); })}>+ parallel branch</button>
                        {rung.length > 1 && <button className="btn ghost sm" style={{ height: 22, fontSize: 11, color: 'var(--rose)' }} onClick={() => upd(r => { r.splice(gi, 1); })}>remove block</button>}
                      </div>
                    </div>
                  </React.Fragment>
                );
              })}
              <div className={'wireh' + (liveTrue ? ' hot' : '')} style={{ flex: '0 0 16px' }} />
              <button className="btn ghost sm" style={{ height: 26 }} title="Add a series block" onClick={() => upd(r => { r.push([[{ t: 'XIC', v: 'B' }]]); })}>+ series</button>
              <div className={'wireh' + (liveTrue ? ' hot' : '')} />
              <div className={'ins' + (liveTrue ? ' true' : '')}><span className={'sym' + (liveTrue ? ' coil-on' : '')}>-( )-</span><span className="tag">OUT</span></div>
              <div className="wireh" style={{ flex: '0 0 10px' }} />
              <div className="rail-r" />
            </div>
          </div>
          <div className="row">
            <span className="small muted">Test inputs:</span>
            {TAGS13.map(t => (
              <button key={t} className={'btn sm ' + (io[t] ? 'cyan lit' : '')} onClick={() => { setIo(s => ({ ...s, [t]: !s[t] })); sfx('click'); }} aria-pressed={io[t]}>
                <span className="mono">{t}={io[t] ? 1 : 0}</span>
              </button>
            ))}
            <span className={'chip ' + (liveTrue ? 'cyan' : '')}>OUT {liveTrue ? 'ON' : 'OFF'}</span>
          </div>
          <div className="row"><button className="btn cyan" onClick={check}><Glyph n="check" />Check rung</button>
            <button className="btn ghost sm" onClick={() => setRung([[[{ t: 'XIC', v: 'A' }]]])}>Reset rung</button></div>
        </div>
        <div className="stack">
          <div className="panel panel-pad">
            <div className="sub">Live truth table</div>
            <table className="tt">
              <thead><tr>{P.vars.map(v => <th key={v}>{v}</th>)}<th>goal</th><th>rung</th><th></th></tr></thead>
              <tbody>{rows.map((r, i) => (
                <tr key={i} className={r.ok ? 'pass' : 'fail'}>
                  {P.vars.map(v => <td key={v}>{r.s[v] ? 1 : 0}</td>)}
                  <td>{r.target ? 1 : 0}</td><td>{r.ok ? (r.target ? 1 : 0) : (r.target ? 0 : 1)}</td>
                  <td>{r.ok ? <span style={{ color: 'var(--lime)' }}>ok</span> : <span style={{ color: 'var(--rose)' }}>x</span>}</td>
                </tr>
              ))}</tbody>
            </table>
            <p className="tiny muted" style={{ marginBottom: 0 }}>A row only passes if it holds for every state of tags the goal ignores. An empty parallel branch passes power unconditionally, which is a real bypass on a live rung.</p>
          </div>
          <Feedback fb={fb} />
        </div>
      </div>
    </div>
  );
}

/* ---------- 2.1 Wire Count Detective ---------- */
const FUNCS21 = [
  { v: 'P+', l: 'Power +' }, { v: 'P-', l: 'Power −' }, { v: 'S+', l: 'Signal +' }, { v: 'S-', l: 'Signal −' },
  { v: 'L+', l: 'Loop + (power and signal)' }, { v: 'L-', l: 'Loop −' }, { v: 'COM', l: 'Common (shared −)' },
  { v: 'EA', l: 'RTD element, end A' }, { v: 'EB', l: 'RTD element, end B' }, { v: 'SENSE', l: 'Lead compensation (sense)' },
];
const NODE21 = { 'P+': '24', 'L+': '24', 'P-': '0', 'COM': '0', 'S-': '0', 'S+': 'AI', 'L-': 'AI', EA: 'RA', EB: 'RB', SENSE: 'RS' };
const D21 = [
  { id: 'PIT-110', name: 'Loop-powered pressure transmitter', count: 2, hint: 'Two terminals marked + and − inside the housing. No separate supply terminals.',
    wires: [{ n: '+', c: '#e05555' }, { n: '−', c: '#1c1c1c' }], ok: [['L+', 'P+'], ['L-', 'S+']],
    countWhy: 'Loop-powered: the same two conductors carry power and signal. The transmitter regulates the current it draws from the loop between 4 and 20 mA, and that current is the signal.' },

    if (n[0] === '24' && n[1] === '0') return { state: 'short', read: '0.00 mA', text: 'The transmitter is across the supply with no input resistor in the loop. It runs, but its current bypasses the card, so the input reads 0 mA while a clamp meter shows current.' };

/* ---------- 2.2 Scaling Bench ---------- */
const euFromMa = (ma, lrv, urv, rev) => rev ? urv - (ma - 4) * (urv - lrv) / 16 : lrv + (ma - 4) * (urv - lrv) / 16;

  if (first) return { kind: 'toMa', lrv: 0, urv: 300, u: 'psig', val: 137.5, rev: false, tag: 'PT-101' };

    { lrv: 0, urv: 300, u: 'psig', tag: 'PT-101' }, { lrv: -50, urv: 150, u: '°C', tag: 'TT-220' }, { lrv: 0, urv: 120, u: 'inH2O', tag: 'LT-310' },
    { lrv: 0, urv: 500, u: 'gpm', tag: 'FT-405' }, { lrv: 0, urv: 14, u: 'pH', tag: 'AT-512' }, { lrv: 20, urv: 80, u: '%', tag: 'LT-118' },

function ScalingBench() {
  const g = useGame();
  const [fb, report] = useFeedback('2.2');
  const [cfg, setCfg] = usePersist('2.2.cfg', { lrv: 0, urv: 300, u: 'psig', rev: false });
  const [mode, setMode] = useState('drive');
  const [ma, setMa] = useState(12);
  const [euTxt, setEuTxt] = useState('150');
  const [wins, setWins] = usePersist('2.2.wins', 0);
  const [q, setQ] = useState(() => makeQ22(true));
  const [ans, setAns] = useState('');
  const lrv = parseFloat(cfg.lrv), urv = parseFloat(cfg.urv);
  const valid = Number.isFinite(lrv) && Number.isFinite(urv) && urv !== lrv;
  const eu = mode === 'drive' ? (valid ? euFromMa(ma, lrv, urv, cfg.rev) : NaN) : parseFloat(euTxt);
  const mA = mode === 'drive' ? ma : (valid ? maFromEu(parseFloat(euTxt), lrv, urv, cfg.rev) : NaN);
  const pct = (mA - 4) / 16 * 100;
  const status = !Number.isFinite(mA) ? 'bad' : mA < 3.6 || mA > 21 ? 'bad' : mA < 3.8 || mA > 20.5 ? 'warn' : 'ok';
  const statusTxt = !Number.isFinite(mA) ? 'invalid range' : mA < 3.6 ? 'below 3.6 mA: failure signal' : mA > 21 ? 'above 21 mA: failure signal' : mA < 3.8 ? 'under-range' : mA > 20.5 ? 'over-range' : 'in measuring range';
  const sp = urv - lrv;

  const checkQ = () => {
    const a = parseFloat(ans);
    if (!Number.isFinite(a)) { report({ kind: 'info', title: 'Enter a number', text: '' }); return; }
    const span = q.urv - q.lrv;
    const correct = q.kind === 'toMa' ? maFromEu(q.val, q.lrv, q.urv, q.rev) : euFromMa(q.val, q.lrv, q.urv, q.rev);
    const tol = q.kind === 'toMa' ? 0.02 : Math.abs(span) * 0.001 + 0.005;
    const unit = q.kind === 'toMa' ? 'mA' : q.u;
    const work = q.kind === 'toMa'
      ? `mA = 4 + 16 × (${q.rev ? `${q.urv} − ${q.val}` : `${q.val} − ${q.lrv}`}) / ${span} = ${correct.toFixed(3)} mA`

      <BayHeader id="2.2" title="Scaling bench" lede="Set the range, then drive the loop in mA or type an engineering value and see the current it takes. The formula updates with your numbers."
        right={<span className="chip lime">{Math.min(3, wins)}/3 checks</span>} />
      <div className="grid2">
        <div className="stack">
          <div className="panel panel-pad stack">
            <div className="row" style={{ gap: 12, alignItems: 'flex-end' }}>
              <div className="field" style={{ width: 110 }}><label>LRV</label><input className="inp" value={cfg.lrv} onChange={e => setCfg(c => ({ ...c, lrv: e.target.value }))} inputMode="decimal" /></div>
              <div className="field" style={{ width: 110 }}><label>URV</label><input className="inp" value={cfg.urv} onChange={e => setCfg(c => ({ ...c, urv: e.target.value }))} inputMode="decimal" /></div>
              <div className="field" style={{ width: 100 }}><label>Units</label><input className="inp" value={cfg.u} onChange={e => setCfg(c => ({ ...c, u: e.target.value }))} /></div>
              <label className="row small" style={{ gap: 6, cursor: 'pointer', height: 34 }}><input type="checkbox" checked={cfg.rev} onChange={e => setCfg(c => ({ ...c, rev: e.target.checked }))} /> Reverse-acting</label>
              <Seg value={mode} onChange={setMode} options={[{ v: 'drive', l: 'Drive mA' }, { v: 'eu', l: 'Enter EU' }]} label="Mode" />
            </div>
            <div className="grid2e">
              <Readout label="DMM  DC mA" value={fmt(mA, 3)} unit="mA" tone={status === 'ok' ? '' : status} />
              <Readout label="Process value" value={Number.isFinite(eu) ? fmt(eu, Math.abs(sp) < 20 ? 3 : 2) : '---'} unit={cfg.u} tone={status === 'bad' ? 'bad' : ''} />
            </div>
            {mode === 'drive' ? (
              <div>
                <input type="range" className="slider" min="3" max="21" step="0.01" value={ma} style={{ '--p': `${((ma - 3) / 18) * 100}%` }}
                  onChange={e => setMa(parseFloat(e.target.value))} aria-label="Loop current in mA" />
                <svg viewBox="0 0 600 22" style={{ width: '100%', display: 'block' }} aria-hidden="true">
                  {ticks.map(v => { const x = ((v - 3) / 18) * 588 + 6; const major = v % 4 === 0; return (<g key={v}><line x1={x} x2={x} y1="0" y2={major ? 9 : 5} stroke={major ? '#6c7b90' : '#34404f'} />{major && <text x={x} y="20" textAnchor="middle" fill="#6c7b90" fontSize="10" fontFamily="JetBrains Mono">{v}</text>}</g>); })}
                </svg>
              </div>
            ) : (
              <div className="field" style={{ maxWidth: 220 }}><label>Process value ({cfg.u})</label><input className="inp" value={euTxt} onChange={e => setEuTxt(e.target.value)} inputMode="decimal" /></div>
            )}
            <div className="row small">
              <span className={'chip ' + (status === 'ok' ? 'lime' : status === 'warn' ? 'amber' : 'rose')}>{statusTxt}</span>
              <span className="chip mono">{Number.isFinite(pct) ? pct.toFixed(1) : '---'} % of span</span>
            </div>
            <div className="math">{cfg.rev ? 'EU = URV − (mA − 4) × (URV − LRV) / 16' : 'EU = LRV + (mA − 4) × (URV − LRV) / 16'}{'\n'}
              {valid ? (cfg.rev
                ? <>   = {urv} − (<b>{fmt(mA, 3)}</b> − 4) × {fmt(sp, 2)} / 16 = <i>{fmt(eu, 3)}</i> {cfg.u}</>
                : <>   = {lrv} + (<b>{fmt(mA, 3)}</b> − 4) × {fmt(sp, 2)} / 16 = <i>{fmt(eu, 3)}</i> {cfg.u}</>) : '   Set URV different from LRV'}</div>
            <p className="tiny muted" style={{ margin: 0 }}>Range limits shown follow NAMUR NE 43 (3.8 to 20.5 mA measuring range, below 3.6 or above 21 mA as failure). Many sites and devices use it, but alarm thresholds are configurable and site-specific.</p>
          </div>
        </div>
        <div className="stack">
          <div className="panel panel-pad stack">
            <div className="sub" style={{ margin: 0 }}>Check yourself</div>
            <p className="small" style={{ margin: 0 }}>
              <span className="mono" style={{ color: 'var(--violet)' }}>{q.tag}</span> is ranged <span className="mono">{q.lrv} to {q.urv} {q.u}</span>{q.rev ? ', reverse-acting' : ''}.{' '}
              {q.kind === 'toMa' ? <>What mA corresponds to <span className="mono" style={{ color: 'var(--amber)' }}>{q.val} {q.u}</span>?</> : <>The loop reads <span className="mono" style={{ color: 'var(--amber)' }}>{q.val} mA</span>. What is the process value in {q.u}?</>}
            </p>
            <div className="row">
              <input className="inp" style={{ width: 140 }} value={ans} onChange={e => setAns(e.target.value)} onKeyDown={e => e.key === 'Enter' && checkQ()} placeholder={q.kind === 'toMa' ? 'mA' : q.u} inputMode="decimal" aria-label="Answer" />
              <button className="btn cyan" onClick={checkQ}>Check</button>
              <button className="btn ghost sm" onClick={() => { setQ(makeQ22(false)); setAns(''); }}>Skip</button>
            </div>
            <span className="tiny muted">Tolerance: ±0.02 mA, or ±0.1% of span for engineering units.</span>
          </div>
          <Feedback fb={fb} />
        </div>
      </div>
    </div>
  );

const PTS23 = [0, 25, 50, 75, 100];
function newDev23() {

        <div className="stack">
          <div className="panel panel-pad stack">
            <div className="sub" style={{ margin: 0 }}>Downstream motors</div>
            {Object.entries(MOTORS31).map(([id, mo]) => (
              <div key={id} className="row" style={{ justifyContent: 'space-between' }}>
                <span className="row small"><span className={'led ' + (motorOn(id) ? 'on' : 'ro')} />{mo.name}</span>
                <span className="mono tiny" style={{ color: '#8fa0b5' }}>Local:3:O.Data.{mo.out}</span>

            ))}

          </div>
