/* --------------------------------------------------------------------------
   Tool 2.2: Scaling Bench
   Drive a loop current and watch % span and engineering units follow, with
   the sheet's formulas worked out live. Check Mode asks for the mA at a
   value on a real range from Input Library p.16.
   Formulas: Calculators Start Here C10. Reverse acting is the same formula
   run from URV down; the tool derives it and labels it as derived.
   -------------------------------------------------------------------------- */

const SB_KEY = STORAGE_KEY + ".scalingBench";
const SB_XP_FIRST = 15;
const SB_XP_RETRY = 5;
const SB_RADAR = 0.4;
const SB_TOL_MA = 0.02;
const SB_MIN_MA = 3.0;
const SB_MAX_MA = 21.5;

// One challenge per p.16 range, at a random % of span in 2.5% steps.
function sbDeck() {
  return shuffled(LRV_URV.items.map((_, r) => ({ r, pct: 2.5 * (1 + Math.floor(Math.random() * 39)) })));
}

function sbLoad() {
  const t = loadTool(SB_KEY) || {};
  const deckOk = Array.isArray(t.deck) && t.deck.length && t.deck.every(c => LRV_URV.items[c.r] && Number.isFinite(c.pct));
  return {
    mA: Number.isFinite(t.mA) ? Math.min(SB_MAX_MA, Math.max(SB_MIN_MA, t.mA)) : 12,
    lrv: typeof t.lrv === "string" ? t.lrv : "0",
    urv: typeof t.urv === "string" ? t.urv : "100",
    units: typeof t.units === "string" ? t.units : CALC.calRecord.exampleValues.units,
    reverse: !!t.reverse,
    deck: deckOk ? t.deck : sbDeck(),
    pos: deckOk && Number.isInteger(t.pos) ? t.pos : 0,
    tries: deckOk && Number.isInteger(t.tries) ? t.tries : 0,
    solved: deckOk && !!t.solved,
    answer: typeof t.answer === "string" ? t.answer : "",
    last: t.last || null,
    played: Array.isArray(t.played) ? t.played : [],
  };
}

function sbChallenge(c) {
  const range = LRV_URV.items[c.r];
  const eu = Number((range.lrv + (c.pct / 100) * (range.urv - range.lrv)).toFixed(2));
  const mA = 4 + (16 * (eu - range.lrv)) / (range.urv - range.lrv); // Start Here C10: I = 4 + 16 x (EU - LRV) / (URV - LRV)
  return { range, eu, mA };
}

function Formula({ text, work }) {
  const C = useC();
  return (
    <div style={{ fontFamily: MONO_FONT, fontSize: 13, lineHeight: 1.6, overflowX: "auto" }}>
      <div style={{ color: C.text_mute }}>{text}</div>
      <div style={{ color: C.signal_cyan, whiteSpace: "nowrap" }}>{work}</div>
    </div>
  );
}

function ScalingBench({ onResult, onStep }) {
  const C = useC();
  const [t, setT] = useState(sbLoad);
  const inputRef = useRef(null);
  useEffect(() => saveTool(SB_KEY, t), [t]);
  const set = patch => setT(s => ({ ...s, ...patch }));

  const I = t.mA;
  const lrv = parseFloat(t.lrv);
  const urv = parseFloat(t.urv);
  const rangeOk = Number.isFinite(lrv) && Number.isFinite(urv) && urv !== lrv;
  const pct = t.reverse ? ((20 - I) / 16) * 100 : ((I - 4) / 16) * 100;
  const eu = rangeOk ? (t.reverse ? urv - ((I - 4) / 16) * (urv - lrv) : lrv + ((I - 4) / 16) * (urv - lrv)) : NaN;
  const [fPct, fEU, fI] = CALC.mAConverter.formulas;

  const card = t.pos < t.deck.length ? t.deck[t.pos] : null;
  const ch = card ? sbChallenge(card) : null;
  const ribbonStep = t.solved ? 5 : 1;
  useEffect(() => {
    if (onStep) onStep(ribbonStep);
  }, [ribbonStep]);

  const check = e => {
    e.preventDefault();
    if (!ch || t.solved) return;
    const given = parseFloat(t.answer);
    if (!Number.isFinite(given)) return;
    const tries = t.tries + 1;
    const ok = Math.abs(given - ch.mA) <= SB_TOL_MA;
    let { played } = t;
    if (ok) {
      const fresh = !played.includes(card.r);
      if (fresh) played = [...played, card.r];
      onResult({
        xp: fresh ? (tries === 1 ? SB_XP_FIRST : SB_XP_RETRY) : 0,
        firstTry: tries === 1,
        firstPass: fresh && tries === 1,
        radar: SB_RADAR,
        note: {
          tool: "2.2",
          text: `Scaling Bench: ${euText(ch.eu)} ${ch.range.units} on a ${euText(ch.range.lrv)} to ${euText(ch.range.urv)} ${ch.range.units} range = ${num2(ch.mA)} mA — ${fI}`,
        },
      });
    }
    set({ tries, solved: ok, played, last: { given, ok } });
  };

  const next = () => {
    const done = t.pos + 1 >= t.deck.length;
    set({ deck: done ? sbDeck() : t.deck, pos: done ? 0 : t.pos + 1, tries: 0, solved: false, answer: "", last: null });
    setTimeout(() => inputRef.current && inputRef.current.focus(), 0);
  };

  const field = (id, label, value, key, width = 110) => (
    <label htmlFor={id} style={{ display: "grid", gap: 4, fontSize: 12, color: C.text_mute }}>
      {label}
      <input
        id={id}
        value={value}
        onChange={e => set({ [key]: e.target.value })}
        inputMode={key === "units" ? "text" : "decimal"}
        style={{ width, minHeight: TOUCH_MIN, background: C.bg, color: C.text, border: `1px solid ${C.border}`, borderRadius: 4, padding: "0 10px", fontFamily: MONO_FONT, fontSize: 14 }}
      />
    </label>
  );

  const readout = (label, value, unit) => (
    <div style={{ position: "relative", overflow: "hidden", padding: "10px 14px", border: `1px solid ${C.border}`, borderRadius: 4, background: C.bg, minWidth: 150 }}>
      <Scanline />
      <div style={{ fontSize: 11, letterSpacing: "2px", color: C.text_dim, fontFamily: HEAD_FONT, fontWeight: 700, textTransform: "uppercase" }}>{label}</div>
      <div style={{ fontFamily: MONO_FONT, fontSize: 24, fontWeight: 700, color: C.signal_cyan }}>
        {value} <span style={{ fontSize: 13, color: C.text_mute }}>{unit}</span>
      </div>
    </div>
  );

  const work = t.reverse
    ? [
        ["% span = (20 - I) / 16 x 100 (reverse acting, derived)", `= (20 - ${num2(I)}) / 16 x 100 = ${num2(pct)} %`],
        ["EU = URV - ((I - 4) / 16) x (URV - LRV) (reverse acting, derived)", `= ${euText(urv)} - ((${num2(I)} - 4) / 16) x (${euText(urv)} - ${euText(lrv)}) = ${euText(eu)} ${t.units}`],
      ]
    : [
        [fPct, `= (${num2(I)} - 4) / 16 x 100 = ${num2(pct)} %`],
        [fEU, `= ${euText(lrv)} + ((${num2(I)} - 4) / 16) x (${euText(urv)} - ${euText(lrv)}) = ${euText(eu)} ${t.units}`],
      ];

  return (
    <div style={{ display: "grid", gap: 24 }}>
      <section aria-labelledby="sb-bench" style={{ display: "grid", gap: 16 }}>
        <H as="h3">
          <span id="sb-bench">Bench</span>
        </H>
        <div style={{ display: "flex", flexWrap: "wrap", gap: 12, alignItems: "flex-end" }}>
          {field("sb-lrv", "LRV", t.lrv, "lrv")}
          {field("sb-urv", "URV", t.urv, "urv")}
          {field("sb-units", "Units", t.units, "units", 90)}
          <Btn variant="ghost" color={C.amber} pressed={t.reverse} onClick={() => set({ reverse: !t.reverse })} ariaLabel="Reverse acting">
            Reverse acting: {t.reverse ? "on" : "off"}
          </Btn>
        </div>
        {!rangeOk && <p style={{ margin: 0, color: C.rose, fontSize: 13 }}>LRV and URV must be numbers, and not equal.</p>}

        <div>
          <label htmlFor="sb-ma" style={{ fontSize: 12, color: C.text_mute }}>
            Loop current (mA): arrow keys step 0.01
          </label>
          <div style={{ display: "flex", gap: 12, alignItems: "center", flexWrap: "wrap" }}>
            <input
              id="sb-ma"
              type="range"
              min={SB_MIN_MA}
              max={SB_MAX_MA}
              step="0.01"
              value={I}
              onChange={e => set({ mA: parseFloat(e.target.value) })}
              aria-valuetext={`${num2(I)} milliamps`}
              style={{ flex: "1 1 260px", minHeight: TOUCH_MIN, accentColor: C.signal_cyan }}
            />
            <input
              type="number"
              min={SB_MIN_MA}
              max={SB_MAX_MA}
              step="0.01"
              value={num2(I)}
              aria-label="Loop current in milliamps"
              onChange={e => {
                const v = parseFloat(e.target.value);
                if (Number.isFinite(v)) set({ mA: Math.min(SB_MAX_MA, Math.max(SB_MIN_MA, v)) });
              }}
              style={{ width: 100, minHeight: TOUCH_MIN, background: C.bg, color: C.text, border: `1px solid ${C.border}`, borderRadius: 4, padding: "0 10px", fontFamily: MONO_FONT, fontSize: 14 }}
            />
          </div>
        </div>

        <div style={{ display: "flex", flexWrap: "wrap", gap: 10 }} aria-live="polite">
          {readout("Current", num2(I), "mA")}
          {readout("% span", num2(pct), "%")}
          {readout("EU", euText(eu), t.units)}
        </div>

        <div style={{ display: "grid", gap: 10 }}>
          {work.map(([text, w]) => (
            <Formula key={text} text={text} work={w} />
          ))}
          <Cites cites={[CALC.mAConverter.formulasSource]} />
        </div>
      </section>

      <section aria-labelledby="sb-check" style={{ display: "grid", gap: 12 }}>
        <div style={{ display: "flex", flexWrap: "wrap", gap: 8, alignItems: "center" }}>
          <H as="h3" color={C.amber}>
            <span id="sb-check">Check Mode</span>
          </H>
          <Chip color={C.signal_cyan}>CHALLENGE {Math.min(t.pos + 1, t.deck.length)} / {t.deck.length}</Chip>
          <Chip color={C.lime}>RANGES SOLVED {t.played.length} / {LRV_URV.items.length}</Chip>
        </div>
        {ch && (
          <>
            <p style={{ margin: 0, fontFamily: HEAD_FONT, fontWeight: 700, fontSize: 20, color: C.text }}>
              What mA corresponds to {euText(ch.eu)} {ch.range.units} on a {euText(ch.range.lrv)} to {euText(ch.range.urv)} {ch.range.units} transmitter?
            </p>
            <Cites cites={[`${LRV_URV.source} (${ch.range.row})`]} />
            <form onSubmit={check} style={{ display: "flex", flexWrap: "wrap", gap: 8, alignItems: "center" }}>
              <input
                ref={inputRef}
                value={t.answer}
                onChange={e => set({ answer: e.target.value })}
                onKeyDown={e => {
                  if (e.key === "Enter") check(e);
                }}
                inputMode="decimal"
                aria-label="Your answer in milliamps"
                placeholder="mA"
                disabled={t.solved}
                style={{ width: 120, minHeight: TOUCH_MIN, background: C.bg, color: C.text, border: `1px solid ${C.border}`, borderRadius: 4, padding: "0 10px", fontFamily: MONO_FONT, fontSize: 15 }}
              />
              <span style={{ fontFamily: MONO_FONT, color: C.text_mute }}>mA</span>
              {!t.solved && <Btn onClick={check} ariaLabel="Check answer">Check</Btn>}
              {t.solved && (
                <Btn onClick={next} ariaLabel="Next challenge">
                  Next challenge
                </Btn>
              )}
              <span style={{ fontSize: 12, color: C.text_dim }}>Tolerance ±{SB_TOL_MA} mA. Enter checks.</span>
            </form>
            <div aria-live="polite">
              {t.last && (
                <Verdict key={t.tries} ok={t.last.ok} title={t.last.ok ? (t.tries === 1 ? "Within tolerance, first try." : `Within tolerance on try ${t.tries}.`) : `Off by ${num2(Math.abs(t.last.given - ch.mA))} mA.`}>
                  {(!t.last.ok || t.solved) && (
                    <Formula
                      text={fI}
                      work={`= 4 + 16 x (${euText(ch.eu)} - ${euText(ch.range.lrv)}) / (${euText(ch.range.urv)} - ${euText(ch.range.lrv)}) = ${num2(ch.mA)} mA`}
                    />
                  )}
                  <Cites cites={[CALC.mAConverter.formulasSource]} />
                  {!t.last.ok && <p style={{ margin: "8px 0 0", fontWeight: 600 }}>Work it again and re-check.</p>}
                </Verdict>
              )}
            </div>
          </>
        )}
      </section>

      <details>
        <summary style={{ cursor: "pointer", minHeight: TOUCH_MIN, display: "flex", alignItems: "center", fontFamily: HEAD_FONT, fontWeight: 700, fontSize: 11, letterSpacing: "2px", textTransform: "uppercase", color: C.text_mute }}>
          Reference table (5% steps)
        </summary>
        <div style={{ overflowX: "auto", marginTop: 8 }}>
          <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 13 }}>
            <thead>
              <tr style={{ color: C.text_dim, textAlign: "left" }}>
                {["% span", "mA", `EU (${euText(lrv)} to ${euText(urv)} ${t.units})`].map(h => (
                  <th key={h} scope="col" style={{ padding: "4px 8px", fontWeight: 600, borderBottom: `1px solid ${C.border}` }}>{h}</th>
                ))}
              </tr>
            </thead>
            <tbody>
              {CALC.mAConverter.referenceTable.map(row => (
                <tr key={row.pct}>
                  <td style={{ padding: "3px 8px", fontFamily: MONO_FONT, color: C.text_mute }}>{row.pct}</td>
                  <td style={{ padding: "3px 8px", fontFamily: MONO_FONT, color: C.signal_cyan }}>{num2(row.mA)}</td>
                  <td style={{ padding: "3px 8px", fontFamily: MONO_FONT, color: C.text }}>{rangeOk ? euText(lrv + (row.pct / 100) * (urv - lrv)) : "--"}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
        <p style={{ margin: "6px 0 0", fontSize: 12, color: C.text_dim }}>% span and mA from the sheet; EU worked for the bench range with the sheet's formula.</p>
        <Cites cites={[CALC.mAConverter.referenceSource]} />
      </details>
    </div>
  );
}

/* --------------------------------------------------------------------------
   Tool 2.3: Cal Record Builder
   A virtual bench: apply the 7 test points, let each settle, record the
   as-found. Touch a trim before all 7 are recorded and the evidence is gone.
   Then read the errors, pick the corrective action, and print a Form 5.
   Content: calculators.calRecord (points, tolerance, formulas, action list,
   PT-101 example), calScenarios, calRecordForm (Template Pack p.7).
   -------------------------------------------------------------------------- */

const CR_KEY = STORAGE_KEY + ".calRecord";
const CR_XP_FIRST = 25;
const CR_XP_RETRY = 10;
const CR_RADAR = 0.6;
const CR_SETTLE_MS = 900;
// The gate's choices, as worded in the sheet's "Action taken" list.
const CR_ACTIONS = ["No adjustment", "Zero trim", "Span trim", "Sensor trim", "Replaced"];
const CR_TRIMS = ["Zero trim", "Span trim", "Sensor trim"];
// Tool convention (constructed, see toolConventions in the library): up-scale
// errors within this spread count as "same size at every point".
const CR_SAME_SIZE = TOOL_CONVENTIONS.calRecord.sameSizeSpreadPct.value;

const CR_POINTS = CALC.calRecord.pointDefinitions.map(p => ({ label: String(p), pct: parseFloat(p), down: /down/.test(String(p)) }));

function crRound(idx) {
  const s = CAL_SCENARIOS[idx];
  return {
    idx,
    lrv: String(s.lrv),
    urv: String(s.urv),
    tol: String(CALC.calRecord.toleranceDefaultPct),
    applied: null,
    recorded: CR_POINTS.map(() => null),
    destroyed: false,
    picks: [],
  };
}

function crLoad() {
  const t = loadTool(CR_KEY) || {};
  const r = t.round;
  const ok = r && CAL_SCENARIOS[r.idx] && Array.isArray(r.recorded) && r.recorded.length === CR_POINTS.length && Array.isArray(r.picks);
  return {
    round: ok ? { ...r, applied: null } : crRound(0),
    played: Array.isArray(t.played) ? t.played : [],
    forfeit: Array.isArray(t.forfeit) ? t.forfeit : [],
  };
}

// The sheet's math: ideal mA, error % span, in-tolerance, hysteresis.
function crAnalyze(recorded, tol) {
  const ideal = CR_POINTS.map(p => 4 + 0.16 * p.pct);
  const err = recorded.map((m, i) => (m === null ? null : ((m - ideal[i]) / 16) * 100));
  const inTol = err.map(e => (e === null ? null : Math.abs(e) <= tol + 1e-9));
  const known = err.filter(e => e !== null);
  const max = known.length ? Math.max(...known.map(Math.abs)) : null;
  const hys50 = recorded[5] !== null && recorded[2] !== null ? (Math.abs(recorded[5] - recorded[2]) / 16) * 100 : null;
  const hys0 = recorded[6] !== null && recorded[0] !== null ? (Math.abs(recorded[6] - recorded[0]) / 16) * 100 : null;
  const up = err.slice(0, 5);
  const spread = up.every(e => e !== null) ? Math.max(...up) - Math.min(...up) : null;
  const pass = max !== null && max <= tol + 1e-9;
  let pattern = null;
  if (spread !== null) pattern = pass ? "in tolerance" : spread <= CR_SAME_SIZE ? "zero" : "span";
  return { ideal, err, inTol, max, hys50, hys0, spread, pass, pattern };
}

function crPrint(s, round, a, action, asLeft) {
  const esc = v => String(v).replace(/&/g, "&amp;").replace(/</g, "&lt;");
  const lrv = parseFloat(round.lrv);
  const urv = parseFloat(round.urv);
  const tol = parseFloat(round.tol);
  const f = CAL_FORM;
  const inputFor = p => euText(lrv + (p.pct / 100) * (urv - lrv));
  const rows = CR_POINTS.map((p, i) =>
    `<tr><td>${esc(p.label)}</td><td>${esc(inputFor(p))} ${esc(s.units)}</td><td>${a.ideal[i].toFixed(2)}</td><td>${round.recorded[i].toFixed(2)}</td><td>${signed(a.err[i])}</td><td>${a.inTol[i] ? "PASS" : "FAIL"}</td></tr>`
  ).join("");
  const formAction = { "No adjustment": "No adjustment needed", Replaced: "Replaced:" }[action] || action;
  const actions = f.actions.map(x => `${x === formAction ? "&#9746;" : "&#9744;"} ${esc(x)}`).join(" &nbsp; ");
  const leftRows = asLeft
    .map(r => `<tr><td>${esc(r.p.label)}</td><td>${esc(inputFor(r.p))} ${esc(s.units)}</td><td>${r.ideal.toFixed(2)}</td><td>${r.mA.toFixed(2)}</td><td>${signed(r.err)}</td><td>${r.ok ? "PASS" : "FAIL"}</td></tr>`)
    .join("");
  const leftMax = Math.max(...asLeft.map(r => Math.abs(r.err)));
  const hys = Math.max(a.hys50, a.hys0);
  const th = cols => `<tr>${cols.map(c => `<th>${esc(c)}</th>`).join("")}</tr>`;
  const html = `<!doctype html><html><head><meta charset="utf-8"><title>${esc(s.tag)} calibration record</title>
<style>body{font:12px Arial,Helvetica,sans-serif;margin:24px;color:#000}table{border-collapse:collapse;width:100%;margin:6px 0 12px}td,th{border:1px solid #444;padding:4px 6px;text-align:left}h1{font-size:16px;margin:0 0 10px}h2{font-size:13px;margin:12px 0 4px}p{margin:4px 0}.src{color:#555;font-size:10px;margin-top:16px}</style></head><body>
<h1>${esc(f.title)}</h1>
<p>${esc(f.header[0])} ${esc(s.tag)} &nbsp; ${esc(f.header[1])} ${esc(s.device)} &nbsp; ${esc(f.header[2])} ________ &nbsp; ${esc(f.header[3])} ${esc(s.type)}</p>
<p>${esc(f.header[4])} ${esc(round.lrv)} to ${esc(round.urv)} &nbsp; ${esc(f.header[5])} ${esc(s.units)} &nbsp; ${esc(f.header[6])} ${esc(tol)} ${esc(f.header[7])}</p>
<p>${esc(f.header[8])} ________ &nbsp; ${esc(f.header[9])} ________ &nbsp; ${esc(f.header[10])} ________ &nbsp; ${esc(f.header[11])} ${new Date().toISOString().slice(0, 10)} &nbsp; ${esc(f.header[12])} ________</p>
<p>${esc(f.header[13])} ________ &deg;F / &deg;C</p>
<h2>${esc(f.asFoundHeading)}</h2>
<table>${th(f.columns)}${rows}</table>
<p>${esc(f.summaryFound[0])} ${a.max.toFixed(3)} % span &nbsp; ${esc(f.summaryFound[1])} ${hys.toFixed(3)} % span</p>
<h2>${esc(f.actionHeading)}</h2><p>${actions}</p>
<table>${th(f.asLeftColumns)}${leftRows}</table>
<p>${esc(f.summaryLeft[0])} ${leftMax.toFixed(3)} % span &nbsp; Result: ${leftMax <= tol + 1e-9 ? "PASS" : "FAIL"}</p>
<h2>${esc(f.notes)}</h2><p>As-found pattern: ${esc(s.pattern)}.${s.constructed ? " Training scenario: " + esc(s.constructed) : ""}</p>
<p>${esc(f.signoff[0])} ____________________ &nbsp; ${esc(f.signoff[1])} ____________________</p>
<p class="src">Form layout: ${esc(f.source)}. Math: ${esc(CALC.calRecord.source)}. Scenario: ${esc(s.source)}. Generated by Tech Dev Lab, tool 2.3.</p>
</body></html>`;
  const w = window.open("", "_blank");
  if (!w) return false;
  w.document.write(html);
  w.document.close();
  w.focus();
  w.print();
  return true;
}

function CalRecordBuilder({ onResult, onStep }) {
  const C = useC();
  const reduced = useReducedMotion();
  const [t, setT] = useState(crLoad);
  const [shown, setShown] = useState(null); // output reading on the bench, mA
  const [settled, setSettled] = useState(false);
  const [flash, setFlash] = useState(0);
  const [printMsg, setPrintMsg] = useState("");
  const [tolTouched, setTolTouched] = useState(false);
  const shownRef = useRef(null);
  const r = t.round;
  const s = CAL_SCENARIOS[r.idx];

  useEffect(() => saveTool(CR_KEY, t), [t]);
  useEffect(() => {
    shownRef.current = shown;
  }, [shown]);

  const lrv = parseFloat(r.lrv);
  const urv = parseFloat(r.urv);
  const tol = parseFloat(r.tol);
  const rangeOk = Number.isFinite(lrv) && Number.isFinite(urv) && urv !== lrv;
  const tolOk = Number.isFinite(tol) && tol > 0;
  const nextPoint = r.recorded.findIndex(v => v === null);
  const allRecorded = nextPoint === -1;
  const a = crAnalyze(r.recorded, tolOk ? tol : CALC.calRecord.toleranceDefaultPct);
  const correct = allRecorded ? (a.pass ? "No adjustment" : s.action) : null;
  const solved = r.picks.includes(correct);
  const ribbonStep = solved ? 6 : allRecorded && !r.destroyed ? 5 : 3;
  useEffect(() => {
    if (onStep) onStep(ribbonStep);
  }, [ribbonStep]);
  const setRound = patch => setT(x => ({ ...x, round: { ...x.round, ...patch } }));

  // Output settles toward the transmitter's as-found reading for the applied point.
  useEffect(() => {
    if (r.applied === null) return undefined;
    const target = s.asFoundMA[r.applied];
    const start = shownRef.current === null ? 4 + 0.16 * CR_POINTS[r.applied].pct : shownRef.current;
    if (reduced) {
      setShown(target);
      setSettled(true);
      return undefined;
    }
    setSettled(false);
    const t0 = performance.now();
    let raf;
    const step = now => {
      const k = Math.min(1, (now - t0) / CR_SETTLE_MS);
      setShown(start + (target - start) * (1 - Math.pow(1 - k, 3)));
      if (k < 1) raf = requestAnimationFrame(step);
      else setSettled(true);
    };
    raf = requestAnimationFrame(step);
    return () => cancelAnimationFrame(raf);
  }, [r.applied, r.idx]);

  const apply = i => {
    if (r.destroyed || i !== nextPoint) return;
    setRound({ applied: i });
  };

  const record = () => {
    if (r.applied === null || !settled || r.destroyed) return;
    const recorded = r.recorded.slice();
    recorded[r.applied] = s.asFoundMA[r.applied];
    setRound({ recorded, applied: null });
  };

  const trim = name => {
    if (allRecorded || r.destroyed) return;
    setFlash(f => f + 1);
    setT(x => ({
      ...x,
      forfeit: x.forfeit.includes(s.id) ? x.forfeit : [...x.forfeit, s.id],
      round: { ...x.round, destroyed: name, applied: null },
    }));
  };

  const pick = action => {
    if (!allRecorded || solved || r.picks.includes(action)) return;
    const picks = [...r.picks, action];
    if (action === correct) {
      const fresh = !t.played.includes(s.id) && !t.forfeit.includes(s.id);
      const played = t.played.includes(s.id) ? t.played : [...t.played, s.id];
      onResult({
        xp: fresh ? (picks.length === 1 ? CR_XP_FIRST : CR_XP_RETRY) : 0,
        firstTry: picks.length === 1,
        firstPass: fresh,
        radar: CR_RADAR,
        note: { tool: "2.3", tag: s.tag, text: `Cal Record Builder ${s.tag}: ${action} — ${patternText}` },
      });
      setT(x => ({ ...x, played, round: { ...x.round, picks } }));
    } else {
      setRound({ picks });
    }
  };

  const go = idx => {
    setShown(null);
    setSettled(false);
    setPrintMsg("");
    setT(x => ({ ...x, round: crRound(idx) }));
  };

  const asLeft = solved
    ? CR_POINTS.slice(0, 5).map((p, i) => {
        const mA = correct === "No adjustment" ? r.recorded[i] : s.asLeftMA[i];
        const ideal = 4 + 0.16 * p.pct;
        const err = ((mA - ideal) / 16) * 100;
        return { p, mA, ideal, err, ok: Math.abs(err) <= tol + 1e-9 };
      })
    : [];
  const loopRule = CALC.loopCheck.readingTheResult[2].replace(/^3\.\s*/, "");
  const patternText = { zero: "The error is the same size at every point: zero/offset error.", span: "The error grows with signal: span error.", "in tolerance": "Every point is inside tolerance." }[a.pattern];
  const inputFor = p => (rangeOk ? euText(lrv + (p.pct / 100) * (urv - lrv)) : "--");
  const cell = { padding: "4px 8px" };

  return (
    <div style={{ display: "grid", gap: 20 }}>
      <div style={{ display: "flex", flexWrap: "wrap", gap: 8, alignItems: "center" }}>
        {CAL_SCENARIOS.map((sc, i) => (
          <Btn key={sc.id} variant="ghost" pressed={i === r.idx} onClick={() => go(i)} ariaLabel={`Scenario ${sc.tag}`}>
            {sc.tag}
            {t.played.includes(sc.id) ? " (done)" : ""}
          </Btn>
        ))}
      </div>

      <section aria-labelledby="cr-dev">
        <div style={{ display: "flex", flexWrap: "wrap", gap: 8, alignItems: "center" }}>
          <Chip color={C.signal_cyan}>{s.tag}</Chip>
          <span id="cr-dev" style={{ fontSize: 14, color: C.text }}>{s.device}</span>
          <Chip color={C.text_mute}>{s.type.toUpperCase()}</Chip>
          {s.constructed && <Chip color={C.text_dim}>TRAINING SCENARIO</Chip>}
          {t.forfeit.includes(s.id) && <Chip color={C.rose}>EVIDENCE DESTROYED: 0 XP</Chip>}
        </div>
        <Cites cites={[s.source]} />
        <div style={{ display: "flex", flexWrap: "wrap", gap: 12, marginTop: 12, alignItems: "flex-end" }}>
          {[
            ["cr-lrv", "LRV", "lrv"],
            ["cr-urv", "URV", "urv"],
            ["cr-tol", "Tolerance ± % span", "tol"],
          ].map(([id, label, key]) => (
            <label key={id} htmlFor={id} style={{ display: "grid", gap: 4, fontSize: 12, color: C.text_mute }}>
              {label}
              <input
                id={id}
                value={r[key]}
                inputMode="decimal"
                onChange={e => setRound({ [key]: e.target.value })}
                onFocus={key === "tol" ? () => setTolTouched(true) : undefined}
                style={{ width: 120, minHeight: TOUCH_MIN, background: C.bg, color: C.text, border: `1px solid ${C.border}`, borderRadius: 4, padding: "0 10px", fontFamily: MONO_FONT, fontSize: 14 }}
              />
            </label>
          ))}
          <span style={{ fontFamily: MONO_FONT, color: C.text_mute, paddingBottom: 12 }}>{s.units}</span>
        </div>
        {tolTouched && (
          <p role="note" style={{ margin: "10px 0 0", padding: "8px 12px", borderLeft: `3px solid ${C.amber}`, background: `${C.amber}12`, fontSize: 13, color: C.text }}>
            Tolerance is a site judgement call. Different plants set different windows. Watch how the PASS/FAIL verdict changes as you widen or
            narrow it.
          </p>
        )}
        <Cites cites={[`${CALC.calRecord.source} C10 (default tolerance)`]} />
      </section>

      <section
        aria-labelledby="cr-bench"
        style={{
          display: "grid",
          gap: 12,
          padding: 16,
          border: `1px solid ${r.destroyed ? C.rose : C.border}`,
          borderRadius: 6,
          background: r.destroyed ? `${C.rose}10` : "transparent",
          animation: flash && !reduced ? `shake ${DUR_SLOW}ms ease-out` : "none",
        }}
        key={flash}
      >
        <H as="h3">
          <span id="cr-bench">Bench</span>
        </H>
        <div style={{ display: "flex", flexWrap: "wrap", gap: 8 }}>
          {CR_POINTS.map((p, i) => (
            <Btn
              key={p.label}
              variant="ghost"
              pressed={r.applied === i}
              disabled={r.destroyed || i !== nextPoint}
              onClick={() => apply(i)}
              ariaLabel={`Apply test point ${p.pct} percent${p.down ? " going down" : ""}${r.recorded[i] !== null ? ", recorded" : ""}`}
            >
              {p.down ? `${p.pct}% (down)` : `${p.pct}%`}
              {r.recorded[i] !== null ? " REC" : ""}
            </Btn>
          ))}
        </div>
        <div style={{ display: "flex", flexWrap: "wrap", gap: 10, alignItems: "stretch" }}>
          <div style={{ padding: "10px 14px", border: `1px solid ${C.border}`, borderRadius: 4, minWidth: 150 }}>
            <div style={{ fontSize: 11, letterSpacing: "2px", color: C.text_dim, fontFamily: HEAD_FONT, fontWeight: 700 }}>INPUT APPLIED</div>
            <div style={{ fontFamily: MONO_FONT, fontSize: 18, color: C.amber }}>
              {r.applied === null ? "--" : `${inputFor(CR_POINTS[r.applied])} ${s.units}`}
            </div>
          </div>
          <div style={{ padding: "10px 14px", border: `1px solid ${C.border}`, borderRadius: 4, minWidth: 150 }}>
            <div style={{ fontSize: 11, letterSpacing: "2px", color: C.text_dim, fontFamily: HEAD_FONT, fontWeight: 700 }}>IDEAL OUTPUT</div>
            <div style={{ fontFamily: MONO_FONT, fontSize: 18, color: C.text }}>{r.applied === null ? "--" : `${num2(4 + 0.16 * CR_POINTS[r.applied].pct)} mA`}</div>
          </div>
          <div style={{ position: "relative", overflow: "hidden", padding: "10px 14px", border: `1px solid ${C.border}`, borderRadius: 4, minWidth: 170, background: C.bg }}>
            <Scanline />
            <div style={{ fontSize: 11, letterSpacing: "2px", color: C.text_dim, fontFamily: HEAD_FONT, fontWeight: 700 }}>
              OUTPUT {r.applied !== null && (settled ? "(SETTLED)" : "(SETTLING)")}
            </div>
            <div aria-live="polite" style={{ fontFamily: MONO_FONT, fontSize: 24, fontWeight: 700, color: C.signal_cyan }}>
              {r.applied === null || shown === null ? "--" : `${num2(shown)} mA`}
            </div>
          </div>
        </div>
        <div style={{ display: "flex", flexWrap: "wrap", gap: 8, alignItems: "center" }}>
          <Btn onClick={record} disabled={r.applied === null || !settled || r.destroyed} ariaLabel="Record as-found reading">
            Record as-found
          </Btn>
          <span style={{ fontSize: 12, color: C.text_dim }}>
            {allRecorded ? "All 7 as-found readings recorded." : `Recorded ${r.recorded.filter(v => v !== null).length} / ${CR_POINTS.length}. Let each point settle.`}
          </span>
        </div>
        <div>
          <H as="h4" style={{ marginBottom: 8 }}>Adjustments</H>
          <div style={{ display: "flex", flexWrap: "wrap", gap: 8 }}>
            {CR_TRIMS.map(name => (
              <Btn key={name} variant="ghost" color={C.rose} disabled={allRecorded || !!r.destroyed} onClick={() => trim(name)} ariaLabel={name}>
                {name}
              </Btn>
            ))}
          </div>
          {allRecorded && !r.destroyed && <p style={{ margin: "6px 0 0", fontSize: 12, color: C.text_dim }}>As-found is on record. Choose the corrective action below.</p>}
        </div>
        {r.destroyed && (
          <div aria-live="assertive">
            <Verdict ok={false} title="Helper: You just destroyed the evidence.">
              <p style={{ margin: 0 }}>
                {r.destroyed} before the as-found was recorded. Nobody can say now whether {s.tag} was in tolerance when you found it.
              </p>
              <p style={{ margin: "8px 0 0", color: C.text_mute }}>{CALC.calRecord.failureMode}</p>
              <Cites cites={[`${CALC.calRecord.source} B40`]} />
              <div style={{ marginTop: 10 }}>
                <Btn onClick={() => go(r.idx)} ariaLabel="Restart this scenario">Restart scenario (0 XP)</Btn>
              </div>
            </Verdict>
          </div>
        )}
      </section>

      <div>
        <H as="h3">{CAL_FORM.asFoundHeading}</H>
        <div style={{ overflowX: "auto", marginTop: 8 }}>
          <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 13 }}>
            <thead>
              <tr style={{ color: C.text_dim, textAlign: "left" }}>
                {CAL_FORM.columns.map(h => (
                  <th key={h} scope="col" style={{ ...cell, fontWeight: 600, borderBottom: `1px solid ${C.border}` }}>{h}</th>
                ))}
              </tr>
            </thead>
            <tbody>
              {CR_POINTS.map((p, i) => (
                <tr key={p.label}>
                  <td style={{ ...cell, fontFamily: MONO_FONT, color: C.text_mute }}>{p.label}</td>
                  <td style={{ ...cell, fontFamily: MONO_FONT, color: C.text }}>{inputFor(p)} {s.units}</td>
                  <td style={{ ...cell, fontFamily: MONO_FONT, color: C.text }}>{num2(a.ideal[i])}</td>
                  <td style={{ ...cell, fontFamily: MONO_FONT, color: C.signal_cyan }}>{r.recorded[i] === null ? "" : num2(r.recorded[i])}</td>
                  <td style={{ ...cell, fontFamily: MONO_FONT, color: C.text }}>{allRecorded ? signed(a.err[i]) : ""}</td>
                  <td style={{ ...cell, color: a.inTol[i] ? C.lime : C.rose }}>{allRecorded ? (a.inTol[i] ? "PASS" : "FAIL") : ""}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
        {allRecorded && (
          <p style={{ margin: "6px 0 0", fontSize: 13, color: C.text }}>
            Max as-found error <span style={{ fontFamily: MONO_FONT }}>{a.max.toFixed(3)}</span> % span &middot; Hysteresis at 50%{" "}
            <span style={{ fontFamily: MONO_FONT }}>{a.hys50.toFixed(3)}</span>, at 0% <span style={{ fontFamily: MONO_FONT }}>{a.hys0.toFixed(3)}</span> % span &middot; Result{" "}
            <span style={{ color: a.pass ? C.lime : C.rose, fontWeight: 600 }}>{a.pass ? "PASS" : "FAIL"}</span> at ±{tolOk ? tol : CALC.calRecord.toleranceDefaultPct}%
          </p>
        )}
        <Cites cites={[`${CAL_FORM.source} (columns)`, `${CALC.calRecord.source} (error, PASS/FAIL, and hysteresis formulas)`]} />
      </div>

      {allRecorded && !r.destroyed && (
        <div role="group" aria-labelledby="cr-gate" style={{ display: "grid", gap: 10 }}>
          <H as="h3" color={C.amber}>
            <span id="cr-gate">Corrective action</span>
          </H>
          <div style={{ display: "grid", gap: 8 }}>
            {CR_ACTIONS.map((act, i) => {
              const state = solved ? (act === correct ? "hit" : "locked") : r.picks.includes(act) ? "miss" : "idle";
              return <OptionButton key={act} n={i + 1} option={{ text: act }} state={state} onPick={() => pick(act)} />;
            })}
          </div>
          <Cites cites={[`${CALC.calRecord.source} C27 (Action taken list)`]} />
          {r.picks.length > 0 && (
            <div aria-live="polite">
              <Verdict key={r.picks.length} ok={solved} title={solved ? (r.picks.length === 1 ? `${correct}, first try.` : `${correct}, on try ${r.picks.length}.`) : `Not ${r.picks[r.picks.length - 1]}.`}>
                <p style={{ margin: 0 }}>
                  Up-scale errors:{" "}
                  <span style={{ fontFamily: MONO_FONT }}>{a.err.slice(0, 5).map(e => signed(e)).join(", ")}</span> % span. {patternText}
                </p>
                <p style={{ margin: "6px 0 0", color: C.text_mute }}>{loopRule}</p>
                <p style={{ margin: "6px 0 0" }}>
                  Hysteresis {a.hys50.toFixed(3)}% at 50% and {a.hys0.toFixed(3)}% at 0%: the gap between the up and down readings at the same point.
                </p>
                {s.id === "PT-101" && solved && <p style={{ margin: "6px 0 0", color: C.text_mute }}>The sheet's own record for this example: {CALC.calRecord.exampleValues.actionTaken}. {CALC.calRecord.actionNote}</p>}
                <Cites cites={[`${CALC.loopCheck.source} B23`, `${CALC.calRecord.source} E23:E24`]} />
                {!solved && <p style={{ margin: "8px 0 0", fontWeight: 600 }}>Read the pattern and pick again.</p>}
              </Verdict>
            </div>
          )}
        </div>
      )}

      {solved && (
        <div style={{ display: "grid", gap: 10 }}>
          <H as="h3">As-left</H>
          <div style={{ overflowX: "auto" }}>
            <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 13 }}>
              <thead>
                <tr style={{ color: C.text_dim, textAlign: "left" }}>
                  {CAL_FORM.asLeftColumns.map(h => (
                    <th key={h} scope="col" style={{ ...cell, fontWeight: 600, borderBottom: `1px solid ${C.border}` }}>{h}</th>
                  ))}
                </tr>
              </thead>
              <tbody>
                {asLeft.map(row => (
                  <tr key={row.p.label}>
                    <td style={{ ...cell, fontFamily: MONO_FONT, color: C.text_mute }}>{row.p.label}</td>
                    <td style={{ ...cell, fontFamily: MONO_FONT, color: C.text }}>{inputFor(row.p)} {s.units}</td>
                    <td style={{ ...cell, fontFamily: MONO_FONT }}>{num2(row.ideal)}</td>
                    <td style={{ ...cell, fontFamily: MONO_FONT, color: C.signal_cyan }}>{num2(row.mA)}</td>
                    <td style={{ ...cell, fontFamily: MONO_FONT }}>{signed(row.err)}</td>
                    <td style={{ ...cell, color: row.ok ? C.lime : C.rose }}>{row.ok ? "PASS" : "FAIL"}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
          <p style={{ margin: 0, fontSize: 12, color: C.text_dim }}>
            {s.constructed ? "As-left readings are simulated for this training scenario." : "As-left readings are the sheet's own as-left values."}
          </p>
          <div style={{ display: "flex", flexWrap: "wrap", gap: 8, alignItems: "center" }}>
            <Btn onClick={() => setPrintMsg(crPrint(s, r, a, correct, asLeft) ? "" : "The print window was blocked. Allow pop-ups for this file and try again.")} ariaLabel="Print the Form 5 calibration record">
              Print Form 5 record
            </Btn>
            <Btn variant="ghost" onClick={() => go((r.idx + 1) % CAL_SCENARIOS.length)} ariaLabel="Next scenario">
              Next scenario
            </Btn>
            {printMsg && <span style={{ fontSize: 13, color: C.rose }}>{printMsg}</span>}
          </div>
          <Cites cites={[`${CAL_FORM.source} (record layout)`]} />
        </div>
      )}
    </div>
  );
}

/* --------------------------------------------------------------------------
   Tool 3.1: I/O Map Inspector
   A CompactLogix local chassis. Inject a fault, then trace it the way the
   Field Learning Plan's block 5 describes: from the stopped output back
   through its rung to the input that dropped, and mark both ends.
   -------------------------------------------------------------------------- */

const IOM_KEY = STORAGE_KEY + ".ioMap";
const IOM_XP_FIRST = 20;
const IOM_XP_RETRY = 8;
const IOM_RADAR = 0.5;

const IOM_POINTS = IOM.slots.flatMap(s => s.points.map(p => ({ ...p, slot: s.slot, kind: s.kind })));
const IOM_BY_TAG = Object.fromEntries(IOM_POINTS.map(p => [p.tag, p]));

function iomAddr(p) {
  return IOM.addressFormat[p.kind].replace("{slot}", p.slot).replace("{n}", p.n);
}

function iomUses(tag) {
  return IOM.rungs.filter(r => r.conditions.some(([, t]) => t === tag));
}

// Inputs a fault can land on: permissive inputs examined by exactly one rung.
const IOM_CANDIDATES = IOM_POINTS.filter(p => (p.kind === "DI" || p.kind === "AI") && p.role === "permissive" && iomUses(p.tag).length === 1).map(
  p => p.tag
);

function iomCondTrue([ins, tag], fault) {
  if (fault === tag) return false; // faulted channel = unsafe state (tool convention)
  if (ins === "OK") return true;
  const on = IOM_BY_TAG[tag].normalOn;
  return ins === "XIC" ? on : !on;
}

function iomOutputs(fault) {
  const out = {};
  IOM.rungs.forEach(r => {
    out[r.output] = r.conditions.every(c => iomCondTrue(c, fault));
  });
  return out;
}

function iomState(p, fault, outs) {
  if (fault === p.tag) return "FAULTED";
  if (p.kind === "DO") return outs[p.tag] ? "ON" : "OFF";
  if (p.role === "feedback") return outs[IOM.motors.find(m => m.id === p.motor).output] ? "ON" : "OFF";
  if (p.kind === "AI") return "Signal OK";
  if (p.kind === "AO") return "Active";
  return p.normalOn ? "ON" : "OFF";
}

function iomLoad() {
  const t = loadTool(IOM_KEY) || {};
  const tag = v => (v && IOM_BY_TAG[v] ? v : null);
  return {
    fault: t.fault && IOM_CANDIDATES.includes(t.fault) ? t.fault : null,
    slot: Number.isInteger(t.slot) && IOM.slots[t.slot] ? t.slot : 1,
    src: tag(t.src),
    out: tag(t.out),
    firstSrc: tag(t.firstSrc),
    tries: Number.isInteger(t.tries) ? t.tries : 0,
    solved: !!t.solved,
    last: t.last || null,
    played: Array.isArray(t.played) ? t.played : [],
    log: Array.isArray(t.log) ? t.log : [],
  };
}

function IOMapInspector({ onResult, onStep }) {
  const C = useC();
  const [t, setT] = useState(iomLoad);
  useEffect(() => saveTool(IOM_KEY, t), [t]);
  const set = patch => setT(s => ({ ...s, ...patch }));

  const outs = iomOutputs(t.fault);
  const faultRung = t.fault ? iomUses(t.fault)[0] : null;
  const slot = IOM.slots[t.slot];
  const cardFault = s => s.points.some(p => p.tag === t.fault);
  const ribbonStep = t.solved ? 5 : t.fault && (t.src || t.out) ? 4 : 3;
  useEffect(() => {
    if (onStep) onStep(ribbonStep);
  }, [ribbonStep]);

  const inject = () => {
    const pool = IOM_CANDIDATES.filter(c => c !== t.fault);
    const fault = pool[Math.floor(Math.random() * pool.length)];
    set({ fault, src: null, out: null, firstSrc: null, tries: 0, solved: false, last: null });
  };

  const mark = (kind, tag) => {
    if (!t.fault || t.solved) return;
    if (kind === "src") set({ src: t.src === tag ? null : tag });
    else set({ out: t.out === tag ? null : tag });
  };

  const check = () => {
    if (!t.fault || t.solved || !t.src || !t.out) return;
    const tries = t.tries + 1;
    const firstSrc = t.firstSrc || t.src;
    const srcOk = t.src === t.fault;
    const outOk = t.out === faultRung.output;
    if (srcOk && outOk) {
      const fresh = !t.played.includes(t.fault);
      onResult({
        xp: fresh ? (tries === 1 ? IOM_XP_FIRST : IOM_XP_RETRY) : 0,
        firstTry: tries === 1,
        firstPass: fresh && tries === 1,
        radar: IOM_RADAR,
        note: {
          tool: "3.1",
          tag: t.fault,
          text: `I/O Map Inspector ${t.fault}: ${t.fault} (${iomAddr(IOM_BY_TAG[t.fault])}) faulted, ${faultRung.output} dropped — rung ${faultRung.rung} examines ${t.fault} and drives ${faultRung.output}`,
        },
      });
      setT(s => ({
        ...s,
        tries,
        firstSrc,
        solved: true,
        last: null,
        played: fresh ? [...s.played, s.fault] : s.played,
        log: [{ id: s.fault, output: faultRung.output, attempts: tries, first: firstSrc, at: new Date().toISOString() }, ...s.log],
      }));
      return;
    }
    const msgs = [];
    if (!srcOk) {
      const p = IOM_BY_TAG[t.src];
      msgs.push(
        p.role === "feedback"
          ? `${t.src} is off because ${p.motor} stopped. It is run feedback: a symptom, not the cause.`
          : `${t.src} reads ${iomState(p, t.fault, outs)}. That input is healthy.`
      );
    }
    if (!outOk) {
      msgs.push(outs[t.out] ? `${t.out} is still ON. It didn't drop.` : `${t.out} isn't driven by a rung that examines the faulted input.`);
    }
    set({ tries, firstSrc, last: { msgs } });
  };

  useEffect(() => {
    const onKey = e => {
      if (e.altKey || e.ctrlKey || e.metaKey) return;
      const tag = e.target.tagName;
      if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT") return;
      if (/^[0-7]$/.test(e.key)) {
        e.preventDefault();
        set({ slot: Number(e.key) });
      }
    };
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  });

  const cell = { padding: "4px 8px", verticalAlign: "top" };
  const stateColor = st => (st === "FAULTED" ? C.rose : st === "ON" || st === "Signal OK" || st === "Active" ? C.lime : C.text_mute);

  return (
    <div style={{ display: "grid", gap: 20 }}>
      <div style={{ display: "flex", flexWrap: "wrap", gap: 8, alignItems: "center" }}>
        <TrainingBadge />
        <Chip color={C.signal_cyan}>{IOM.platform.toUpperCase()}</Chip>
        <Chip color={C.lime}>FAULTS TRACED {t.played.length} / {IOM_CANDIDATES.length}</Chip>
        <span style={{ fontSize: 12, color: C.text_dim }}>Keys: 0-7 select a slot</span>
      </div>
      <ConstructedNote source={IOM.source} />

      <div aria-live="polite">
        {!t.fault && (
          <Verdict ok title="All motors running.">
            <p style={{ margin: 0 }}>Inject a fault, then trace it from the stopped output back to the input that dropped.</p>
          </Verdict>
        )}
        {t.fault && !t.solved && (
          <Verdict ok={false} title="Operations: a motor on this rack stopped.">
            <p style={{ margin: 0 }}>Find the faulted input and the output it dropped. Mark both, then check your trace.</p>
          </Verdict>
        )}
      </div>
      <div style={{ display: "flex", flexWrap: "wrap", gap: 8 }}>
        <Btn onClick={inject} ariaLabel={t.fault ? "Inject a new fault" : "Inject a fault"} disabled={t.fault && !t.solved}>
          {t.fault ? "Inject next fault" : "Inject fault"}
        </Btn>
      </div>

      <div>
        <H as="h3">Chassis</H>
        <div style={{ overflowX: "auto", marginTop: 8 }}>
          <div role="group" aria-label="Chassis slots" style={{ display: "grid", gridTemplateColumns: "repeat(8, minmax(84px, 1fr))", gap: 6, minWidth: 700 }}>
            {IOM.slots.map(s => {
              const empty = s.kind === "EMPTY";
              const flt = cardFault(s);
              const on = t.slot === s.slot;
              return (
                <button
                  key={s.slot}
                  type="button"
                  onClick={() => set({ slot: s.slot })}
                  aria-label={`Slot ${s.slot}: ${s.name}${flt ? ", channel fault" : ""}`}
                  aria-pressed={on}
                  style={{
                    minHeight: 120,
                    padding: "8px 6px",
                    textAlign: "left",
                    border: `1px solid ${on ? C.signal_cyan : flt ? C.rose : C.border}`,
                    borderRadius: 4,
                    background: empty ? "transparent" : on ? `${C.signal_cyan}12` : C.bg,
                    boxShadow: on ? glow(C.signal_cyan) : "none",
                    opacity: empty ? 0.45 : 1,
                    cursor: "pointer",
                    color: C.text,
                  }}
                >
                  <div style={{ fontFamily: MONO_FONT, fontSize: 10, color: C.text_dim }}>SLOT {s.slot}</div>
                  <div style={{ fontFamily: HEAD_FONT, fontWeight: 700, fontSize: 18, color: empty ? C.text_dim : s.kind === "CPU" ? C.violet : C.text }}>{s.kind}</div>
                  <div style={{ fontSize: 11, color: C.text_mute, marginTop: 4 }}>{s.name}</div>
                  {!empty && s.kind !== "CPU" && (
                    <div style={{ marginTop: 8, fontFamily: MONO_FONT, fontSize: 10, color: flt ? C.rose : C.lime }}>{flt ? "FLT" : "OK"}</div>
                  )}
                </button>
              );
            })}
          </div>
        </div>
      </div>

      <div>
        <H as="h3">
          Slot {slot.slot}: {slot.name}
        </H>
        {slot.points.length === 0 ? (
          <p style={{ margin: "8px 0 0", fontSize: 13, color: C.text_mute }}>{slot.kind === "EMPTY" ? "No module in this slot." : "The controller has no I/O points."}</p>
        ) : (
          <div style={{ overflowX: "auto", marginTop: 8 }}>
            <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 13 }}>
              <thead>
                <tr style={{ color: C.text_dim, textAlign: "left" }}>
                  {["Pt", "Address", "Tag", "Device", "Description", "State", "Rung", "Mark"].map(h => (
                    <th key={h} scope="col" style={{ ...cell, fontWeight: 600, borderBottom: `1px solid ${C.border}` }}>{h}</th>
                  ))}
                </tr>
              </thead>
              <tbody>
                {slot.points.map(p => {
                  const st = iomState({ ...p, slot: slot.slot, kind: slot.kind }, t.fault, outs);
                  const rungs = slot.kind === "DO" ? IOM.rungs.filter(r => r.output === p.tag) : iomUses(p.tag);
                  const isIn = slot.kind === "DI" || slot.kind === "AI";
                  const isOut = slot.kind === "DO";
                  const markedHere = (isIn && t.src === p.tag) || (isOut && t.out === p.tag);
                  return (
                    <tr key={p.tag} style={{ background: markedHere ? `${C.amber}14` : "transparent" }}>
                      <td style={{ ...cell, fontFamily: MONO_FONT, color: C.text_mute }}>{p.n}</td>
                      <td style={{ ...cell, fontFamily: MONO_FONT, color: C.signal_cyan, whiteSpace: "nowrap" }}>{iomAddr({ ...p, slot: slot.slot, kind: slot.kind })}</td>
                      <td style={{ ...cell, fontFamily: MONO_FONT, color: C.text, whiteSpace: "nowrap" }}>{p.tag}</td>
                      <td style={{ ...cell, fontFamily: MONO_FONT, color: C.text_mute }}>{p.device || ""}</td>
                      <td style={{ ...cell, color: C.text }}>{p.desc}</td>
                      <td style={{ ...cell, fontFamily: MONO_FONT, color: stateColor(st), whiteSpace: "nowrap" }}>{st}</td>
                      <td style={{ ...cell, fontFamily: MONO_FONT, color: C.text_mute }}>{rungs.map(r => r.rung).join(", ")}</td>
                      <td style={cell}>
                        {(isIn || isOut) && (
                          <Btn
                            variant="ghost"
                            color={C.amber}
                            pressed={markedHere}
                            disabled={!t.fault || t.solved}
                            onClick={() => mark(isIn ? "src" : "out", p.tag)}
                            ariaLabel={`Mark ${p.tag} as the ${isIn ? "faulted input" : "dropped output"}`}
                            style={{ padding: "0 10px", fontSize: 12 }}
                          >
                            {isIn ? "Source" : "Output"}
                          </Btn>
                        )}
                      </td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
        )}
        <ConstructedNote source={`${IOM.source}. ${IOM.conventions[0]}`} />
      </div>

      <div>
        <H as="h3">Ladder cross-reference</H>
        <div style={{ display: "grid", gap: 6, marginTop: 8, overflowX: "auto" }}>
          {IOM.rungs.map(r => {
            const on = outs[r.output];
            return (
              <div key={r.rung} style={{ fontFamily: MONO_FONT, fontSize: 12, whiteSpace: "nowrap", color: C.text_mute }}>
                <span style={{ color: C.text_dim }}>Rung {r.rung}: </span>
                {r.conditions.map(([ins, tag]) => {
                  const ok = iomCondTrue([ins, tag], t.fault);
                  return (
                    <span key={tag} style={{ color: ok ? C.lime : C.rose, marginRight: 10 }}>
                      {ins === "OK" ? `${tag}.ChOK` : `${ins} ${tag}`}
                    </span>
                  );
                })}
                <span style={{ color: on ? C.signal_cyan : C.rose }}>
                  &rarr; OTE {r.output} ({on ? "ON" : "OFF"})
                </span>
              </div>
            );
          })}
        </div>
        <ConstructedNote source={`${IOM.source}. ${IOM.conventions[1]} ${IOM.conventions[2]}`} />
      </div>

      {t.fault && (
        <div style={{ display: "grid", gap: 10 }}>
          <div style={{ display: "flex", flexWrap: "wrap", gap: 8, alignItems: "center" }}>
            <Chip color={t.src ? C.amber : C.text_dim}>SOURCE: {t.src || "not marked"}</Chip>
            <Chip color={t.out ? C.amber : C.text_dim}>OUTPUT: {t.out || "not marked"}</Chip>
            {!t.solved && (
              <Btn onClick={check} disabled={!t.src || !t.out} ariaLabel="Check your trace">
                Check trace
              </Btn>
            )}
          </div>
          <div aria-live="polite">
            {t.last && !t.solved && (
              <Verdict key={t.tries} ok={false} title="Not quite. Trace it again.">
                {t.last.msgs.map(m => (
                  <p key={m} style={{ margin: "0 0 6px" }}>{m}</p>
                ))}
                <p style={{ margin: "6px 0 0", fontWeight: 600 }}>A retry is worth {IOM_XP_RETRY} XP.</p>
              </Verdict>
            )}
            {t.solved && (
              <Verdict ok title={t.tries === 1 ? "Traced, first try." : `Traced on try ${t.tries}.`}>
                <p style={{ margin: 0, fontFamily: MONO_FONT, fontSize: 13 }}>
                  {t.fault} ({iomAddr(IOM_BY_TAG[t.fault])}) FAULTED &rarr; rung {faultRung.rung} false &rarr; {faultRung.output} ({iomAddr(IOM_BY_TAG[faultRung.output])}) OFF
                </p>
                <p style={{ margin: "8px 0 0" }}>{PLC_LESSONS.ioMapBlock.output}</p>
                <Cites cites={[PLC_LESSONS.ioMapBlock.source]} />
                <p style={{ margin: "8px 0 0", color: C.text_mute }}>{PLC_LESSONS.checkPlc.text}</p>
                <Cites cites={[PLC_LESSONS.checkPlc.source]} />
              </Verdict>
            )}
          </div>
        </div>
      )}

      <DecisionLog
        title="Trace log"
        headers={["Faulted input", "Output dropped"]}
        log={t.log}
        cells={r => [r.id, r.output]}
        empty="Each traced fault is logged here and in Field Notes."
      />
    </div>
  );
}

/* --------------------------------------------------------------------------
   Tool 3.2: Permissive Detective
   A motor start rung with 5 permissives in series. Read the field, decide
   which contacts are open, then fix the field until the output energizes.
   Force one open again and watch what happens (Field Learning Plan block 6).
   -------------------------------------------------------------------------- */

const PD_KEY = STORAGE_KEY + ".permissiveDetective";
const PD_XP_FIRST = 20;
const PD_XP_RETRY = 8;
const PD_RADAR = 0.5;
const PD_BY_ID = Object.fromEntries(PERM.permissives.map(p => [p.id, p]));

function pdSession() {
  const n = 1 + Math.floor(Math.random() * 3);
  const blocked = shuffled(PERM.permissives.map(p => p.id)).slice(0, n);
  const good = {};
  PERM.permissives.forEach(p => {
    good[p.id] = !blocked.includes(p.id);
  });
  return { blocked, good, pending: {}, marks: [], firstMarks: null, tries: 0, phase: "diagnose", last: null };
}

function pdLoad() {
  const t = loadTool(PD_KEY) || {};
  const s = t.session;
  const ok = s && Array.isArray(s.blocked) && s.blocked.every(id => PD_BY_ID[id]) && s.good && Array.isArray(s.marks);
  return {
    session: ok ? { pending: {}, ...s } : pdSession(),
    played: Array.isArray(t.played) ? t.played : [],
    log: Array.isArray(t.log) ? t.log : [],
  };
}

// Input bit the PLC sees for a permissive's field device.
function pdInput(p, good) {
  return good ? p.inputWhenGood : !p.inputWhenGood;
}

function pdContact(p, good) {
  const bit = pdInput(p, good);
  return p.ins === "XIC" ? bit : !bit;
}

function RungContact({ p, n, phase, marked, closed, bit, onClick }) {
  const C = useC();
  const showTruth = phase !== "diagnose";
  const color = showTruth ? (closed ? C.lime : C.rose) : marked ? C.amber : C.text;
  return (
    <button
      type="button"
      onClick={onClick}
      disabled={phase !== "diagnose"}
      aria-pressed={phase === "diagnose" ? marked : undefined}
      aria-label={`Contact ${n}: ${p.ins} ${p.tag}, ${p.label}${showTruth ? (closed ? ", true" : ", false") : marked ? ", marked open" : ""}`}
      style={{
        display: "grid",
        justifyItems: "center",
        gap: 4,
        minWidth: 108,
        minHeight: 96,
        padding: "6px 4px",
        border: `1px solid ${phase === "diagnose" && marked ? C.amber : "transparent"}`,
        borderRadius: 4,
        background: phase === "diagnose" && marked ? `${C.amber}14` : "transparent",
        cursor: phase === "diagnose" ? "pointer" : "default",
        color: C.text,
      }}
    >
      <span style={{ fontFamily: MONO_FONT, fontSize: 11, color: C.text }}>{p.tag}</span>
      <span style={{ fontFamily: MONO_FONT, fontSize: 18, color, letterSpacing: "1px" }}>{p.ins === "XIC" ? "] [" : "]/["}</span>

function PermissiveDetective({ onResult, onStep }) {
  const C = useC();
  const [t, setT] = useState(pdLoad);
  useEffect(() => saveTool(PD_KEY, t), [t]);
  const s = t.session;
  const setS = patch => setT(x => ({ ...x, session: { ...x.session, ...patch } }));

  const closed = p => pdContact(p, s.good[p.id]);
  const allTrue = PERM.permissives.every(closed);
  const openIds = PERM.permissives.filter(p => !closed(p)).map(p => p.id);
  const key = [...s.blocked].sort().join("+");
  const ribbonStep = s.phase === "diagnose" ? 3 : 5;
  useEffect(() => {
    if (onStep) onStep(ribbonStep);
  }, [ribbonStep]);

  // Lube pressure builds for the permissive's delay after the pump starts.
  useEffect(() => {
    const ids = Object.keys(s.pending || {});
    if (!ids.length) return undefined;
    const timers = ids.map(id => {
      const wait = Math.max(0, s.pending[id] - Date.now());
      return setTimeout(() => {
        setT(x => {
          if (!x.session.pending[id]) return x;
          const pending = { ...x.session.pending };
          delete pending[id];
          return { ...x, session: { ...x.session, pending, good: { ...x.session.good, [id]: true } } };
        });
      }, wait);
    });
    return () => timers.forEach(clearTimeout);
  }, [s.pending]);

  const toggleMark = id => {
    if (s.phase !== "diagnose") return;
    setS({ marks: s.marks.includes(id) ? s.marks.filter(m => m !== id) : [...s.marks, id] });
  };

  const check = () => {
    if (s.phase !== "diagnose") return;
    const tries = s.tries + 1;
    const firstMarks = s.firstMarks || [...s.marks];
    const right = s.marks.length === s.blocked.length && s.marks.every(m => s.blocked.includes(m));
    if (right) {
      const fresh = !t.played.includes(key);
      onResult({
        xp: fresh ? (tries === 1 ? PD_XP_FIRST : PD_XP_RETRY) : 0,
        firstTry: tries === 1,
        firstPass: fresh && tries === 1,
        radar: PD_RADAR,
        note: {
          tool: "3.2",
          tag: PERM.motor.id,
          text: `Permissive Detective ${PERM.motor.id}: open contacts ${s.blocked.map(id => `${PD_BY_ID[id].ins} ${PD_BY_ID[id].tag}`).join(", ")} — XIC is ${PERM.instructionConvention.XIC}; XIO is ${PERM.instructionConvention.XIO}`,
        },
      });
      setT(x => ({
        ...x,
        played: fresh ? [...x.played, key] : x.played,
        log: [
          { id: `Rung ${PERM.motor.rung}`, open: s.blocked.map(id => PD_BY_ID[id].tag).join(", "), attempts: tries, first: firstMarks.map(id => PD_BY_ID[id].tag).join(", ") || "none", at: new Date().toISOString() },
          ...x.log,
        ],
        session: { ...x.session, tries, firstMarks, phase: "fix", last: null },
      }));
      return;
    }
    const wrong = s.marks.filter(m => !s.blocked.includes(m)).map(id => PD_BY_ID[id].tag);
    const missed = s.blocked.filter(b => !s.marks.includes(b)).length;
    setS({ tries, firstMarks, last: { wrong, missed } });
  };

  const operate = id => {
    if (s.phase === "diagnose") return;
    const p = PD_BY_ID[id];
    if (s.pending[id]) return;
    if (!s.good[id] && p.delayMs) {
      setS({ pending: { ...s.pending, [id]: Date.now() + p.delayMs } });
      return;
    }
    setS({ good: { ...s.good, [id]: !s.good[id] } });
  };

  const newSession = () => setT(x => ({ ...x, session: pdSession() }));

  useEffect(() => {
    const onKey = e => {
      if (e.altKey || e.ctrlKey || e.metaKey) return;
      const tag = e.target.tagName;
      if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT") return;
      if (/^[1-5]$/.test(e.key)) {
        const p = PERM.permissives[Number(e.key) - 1];
        e.preventDefault();
        if (s.phase === "diagnose") toggleMark(p.id);
        else operate(p.id);
      } else if (e.key === "Enter" && s.phase === "diagnose" && tag !== "BUTTON") {
        e.preventDefault();
        check();
      }
    };
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  });

  const running = s.phase !== "diagnose" && allTrue;
  const firstOpen = PERM.permissives.findIndex(p => !closed(p));
  const rail = { width: 3, alignSelf: "stretch", background: C.text_mute, borderRadius: 1 };

  return (
    <div style={{ display: "grid", gap: 20 }}>
      <div style={{ display: "flex", flexWrap: "wrap", gap: 8, alignItems: "center" }}>
        <TrainingBadge />
        <Chip color={C.signal_cyan}>RUNG {PERM.motor.rung}</Chip>
        <Chip color={C.lime}>SESSIONS SOLVED {t.played.length}</Chip>
        <span style={{ fontSize: 12, color: C.text_dim }}>
          Keys: 1-5 {s.phase === "diagnose" ? "mark a contact open, Enter check" : "operate a field device"}
        </span>
      </div>

      <section aria-labelledby="pd-brief">
        <H as="h3">Motor start rung</H>
        <p id="pd-brief" style={{ margin: "6px 0 0", fontFamily: HEAD_FONT, fontWeight: 700, fontSize: 20, color: C.text }}>
          {PERM.motor.name} won't start. Which permissives are open?
        </p>
        <ConstructedNote source={PERM.source} />
      </section>

      <div style={{ overflowX: "auto", border: `1px solid ${C.border}`, borderRadius: 4, background: C.bg, padding: "12px 10px" }}>
        <div style={{ display: "flex", alignItems: "center", minWidth: 760 }}>
          <div style={rail} aria-hidden="true" />
          {PERM.permissives.map((p, i) => {
            const powered = s.phase !== "diagnose" && (firstOpen === -1 || i < firstOpen);
            return (
              <React.Fragment key={p.id}>
                <div aria-hidden="true" style={{ flex: 1, minWidth: 10, height: 2, background: powered ? C.signal_cyan : C.text_dim }} />
                <RungContact
                  p={p}
                  n={i + 1}
                  phase={s.phase}
                  marked={s.marks.includes(p.id)}
                  closed={closed(p)}
                  bit={pdInput(p, s.good[p.id])}
                  onClick={() => toggleMark(p.id)}
                />
              </React.Fragment>
            );
          })}
          <div aria-hidden="true" style={{ flex: 1, minWidth: 10, height: 2, background: running ? C.signal_cyan : C.text_dim }} />
          <div style={{ display: "grid", justifyItems: "center", gap: 4, minWidth: 96 }}>
            <span style={{ fontFamily: MONO_FONT, fontSize: 11, color: C.text }}>{PERM.motor.output}</span>
            <span style={{ fontFamily: MONO_FONT, fontSize: 18, color: running ? C.signal_cyan : C.text }}>( )</span>
            <span style={{ fontFamily: MONO_FONT, fontSize: 10, color: running ? C.signal_cyan : C.text_dim }}>OTE {running ? "ON" : "OFF"}</span>
          </div>
          <div aria-hidden="true" style={{ flex: 0, minWidth: 10, height: 2, background: C.text_dim }} />
          <div style={rail} aria-hidden="true" />
        </div>
      </div>

      <div>
        <H as="h3">Field panel</H>
        <div style={{ display: "grid", gap: 8, marginTop: 8 }}>
          {PERM.permissives.map((p, i) => {
            const pend = !!s.pending[p.id];
            const good = s.good[p.id];
            const txt = pend ? p.pending : good ? p.good : p.bad;
            return (
              <div
                key={p.id}
                style={{ display: "flex", flexWrap: "wrap", gap: 10, alignItems: "center", padding: "8px 12px", border: `1px solid ${C.border}`, borderRadius: 4 }}
              >
                <span style={{ fontFamily: MONO_FONT, fontSize: 12, color: C.text_dim, minWidth: 16 }}>{i + 1}</span>
                <div style={{ flex: "1 1 220px" }}>
                  <div style={{ fontSize: 13, color: C.text_mute }}>{p.device}</div>
                  <div style={{ fontSize: 14, color: pend ? C.amber : C.text }}>{txt}</div>
                </div>
                <Btn
                  variant="ghost"
                  color={good ? C.rose : C.lime}
                  disabled={s.phase === "diagnose" || pend}
                  onClick={() => operate(p.id)}
                  ariaLabel={`${good ? p.break : p.fix}: ${p.device}`}
                >
                  {pend ? "Waiting…" : good ? p.break : p.fix}
                </Btn>
              </div>
            );
          })}
        </div>
        {s.phase === "diagnose" && <p style={{ margin: "8px 0 0", fontSize: 12, color: C.text_dim }}>Read the field first. You can operate devices after you name the open contacts.</p>}
        <ConstructedNote source={PERM.source} />
      </div>

      <div aria-live="polite" style={{ display: "grid", gap: 12 }}>
        {s.phase === "diagnose" && (
          <div style={{ display: "flex", flexWrap: "wrap", gap: 8, alignItems: "center" }}>
            <Btn onClick={check} ariaLabel="Check which contacts are open">
              Check: {s.marks.length} marked open
            </Btn>
          </div>
        )}
        {s.phase === "diagnose" && s.last && (
          <Verdict key={s.tries} ok={false} title="Not quite. Read the field again.">
            {s.last.wrong.length > 0 && <p style={{ margin: 0 }}>Marked open but actually true: {s.last.wrong.join(", ")}.</p>}
            {s.last.missed > 0 && <p style={{ margin: "4px 0 0" }}>{s.last.missed} open contact{s.last.missed === 1 ? "" : "s"} not marked.</p>}
            <p style={{ margin: "6px 0 0", fontWeight: 600 }}>A retry is worth {PD_XP_RETRY} XP.</p>
          </Verdict>
        )}
        {s.phase !== "diagnose" && (
          <Verdict ok title={s.tries === 1 ? "Open contacts named, first try." : `Open contacts named on try ${s.tries}.`}>
            <p style={{ margin: 0 }}>
              Open: {s.blocked.map(id => `${PD_BY_ID[id].ins} ${PD_BY_ID[id].tag}`).join(", ")}. XIC is {PERM.instructionConvention.XIC}; XIO is {PERM.instructionConvention.XIO}.
            </p>

// A built tool renders from TOOLS; every other slot is a placeholder.
function ToolSlot({ layer, tool, onTestXP, onResult }) {
  const C = useC();
  const reduced = useReducedMotion();
  const built = TOOLS[tool.id];
  const Tool = built && built.component;
  const [rib, setRib] = useState({ active: null, visited: [] });
  // A step lower than one already reached means the tool started a new round.
  const onStep = n =>
    setRib(r => {
      if (n === r.active) return r;
      if (n === null) return { active: null, visited: [] };
      const newRound = r.visited.length && n < Math.max(...r.visited);
      const visited = newRound ? [n] : r.visited.includes(n) ? r.visited : [...r.visited, n];
      return { active: n, visited };
    });
  return (
    <Panel
      aria-label={`Tool ${tool.id}: ${tool.name}`}
      source={built ? built.source : "pending (tool not built)"}
      style={{ animation: reduced ? "none" : `fadeIn ${DUR_SLOW}ms ease-out` }}
    >
      <header style={{ display: "flex", alignItems: "baseline", gap: 12, flexWrap: "wrap" }}>
        <Chip color={C[layer.accent]}>TOOL {tool.id}</Chip>
        <h3 style={{ margin: 0, fontFamily: HEAD_FONT, fontWeight: 700, fontSize: 22, letterSpacing: "-0.02em", color: C.text }}>
          {tool.name}
        </h3>
        {tool.sub && <span style={{ fontFamily: MONO_FONT, fontSize: 12, color: C.text_mute }}>{tool.sub}</span>}
      </header>
      {Tool ? (
        <div style={{ marginTop: 24 }}>
          {built.ribbon && <DiagnosticRibbon active={rib.active} visited={rib.visited} />}
          <Tool layer={layer} onResult={onResult} onStep={built.ribbon ? onStep : undefined} />
        </div>
      ) : (
        <>
          <p style={{ margin: "28px 0", color: C.text_mute, fontSize: 15 }}>Not yet built.</p>
          <div style={{ display: "flex", alignItems: "center", gap: 10, flexWrap: "wrap" }}>
            <Btn onClick={onTestXP} ariaLabel="Test: add 25 XP">Test: +25 XP</Btn>
            <Chip color={C.amber}>DEV ONLY</Chip>
          </div>
        </>
      )}
    </Panel>
  );
}

/* --------------------------------------------------------------------------
   Field Notes: every correct decision in every tool writes one line here.
   Stored oldest first under techDevLab.v3.fieldNotes; shown newest first.
   -------------------------------------------------------------------------- */

const FIELD_NOTES_KEY = STORAGE_KEY + ".fieldNotes";
const NOTES_EVENT = "techdevlab:fieldnotes";
// Template Pack form that matches each tool's work, for the Markdown export.
const TOOL_FORM = { "2.2": 3, "2.3": 5, "2.4": 2, "3.4": 7 };

function loadNotes() {
  const n = loadTool(FIELD_NOTES_KEY);
  return Array.isArray(n) ? n.filter(x => x && typeof x.text === "string") : [];
}

function toolNameOf(id) {
  for (const l of LAYERS) {
    const t = l.tools.find(x => x.id === id);
    if (t) return t.name;
  }
  return id || "Tool";
}

function logFieldNote(entry) {
  if (!entry || !entry.text) return;
  const note = { at: new Date().toISOString(), tool: entry.tool, toolName: toolNameOf(entry.tool), tag: entry.tag || null, text: entry.text };
  saveTool(FIELD_NOTES_KEY, [...loadNotes(), note]);
  try {
    window.dispatchEvent(new Event(NOTES_EVENT));
  } catch (e) {
    // no event support; the drawer reloads when opened
  }
}

function noteTime(iso) {
  const d = new Date(iso);
  const p = n => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}

function notesMarkdown(notes, state) {
  const today = noteTime(new Date().toISOString()).slice(0, 10);
  const lines = ["# Tech Dev Lab — Field Notes", "", `- Date: ${today}`, `- Level: ${state.level} (${titleOf(state.level)})`, `- XP: ${state.xp}`, ""];
  const ids = [...new Set(notes.map(n => n.tool))].sort((a, b) => String(a).localeCompare(String(b), undefined, { numeric: true }));
  ids.forEach(id => {
    lines.push(`## ${id} ${toolNameOf(id)}`);
    const form = TEMPLATE_FORMS.find(f => f.n === TOOL_FORM[id]);
    if (form) lines.push("", `Template Pack form: ${form.n}. ${form.title} (${form.source})`);
    lines.push("");
    notes.filter(n => n.tool === id).forEach(n => lines.push(`- ${noteTime(n.at)}${n.tag ? ` · ${n.tag}` : ""} · ${n.text}`));
    lines.push("");
  });
  if (!notes.length) lines.push("Nothing logged yet.", "");
  return lines.join("\n");
}
