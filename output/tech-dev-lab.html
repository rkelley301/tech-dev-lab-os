          <Verdict ok title={s.tries === 1 ? "Goal met, first test." : `Goal met on test ${s.tries}.`}>
            <p style={{ margin: 0 }}>{s.rungs.map((r, i) => `Rung ${i}: ${reRungText(r)}`).join(". ")}.</p>
            <p style={{ margin: "6px 0 0", color: C.text_mute }}>
              {[...new Set(s.rungs.flatMap(r => [...r.cond.filter(Boolean), r.out].filter(Boolean).map(x => x.ins)))].map(ins => `${ins}: ${RE_INS[ins].behavior}`).join("; ")}.
            </p>
            <ConstructedNote source={`${RUNG.source}. ${RUNG.instructionNote}`} />
            <p style={{ margin: "8px 0 0", color: C.text_mute }}>Concepts: {PROG_LESSONS.concepts.items.slice(0, 6).join("; ")}.</p>
            <Cites cites={[PROG_LESSONS.concepts.source]} />
          </Verdict>
        )}
        {locked && (
          <div>
            <Btn onClick={next} ariaLabel="Next challenge">Next challenge</Btn>
          </div>
        )}
      </div>

      <div>
        <H as="h3">Tag database</H>
        <div className="tool-scroll" style={{ marginTop: 8 }}>
          <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 13 }}>
            <thead>
              <tr style={{ color: C.text_dim, textAlign: "left" }}>
                {["Tag", "Type", "Use"].map(h => (
                  <th key={h} scope="col" style={{ padding: "4px 8px", fontWeight: 600, borderBottom: `1px solid ${C.border}` }}>{h}</th>
                ))}
              </tr>
            </thead>
            <tbody>
              {RUNG.tags.map(tg => (
                <tr key={tg.tag}>
                  <td style={{ padding: "3px 8px", fontFamily: MONO_FONT, color: C.signal_cyan }}>{tg.tag}</td>
                  <td style={{ padding: "3px 8px", fontFamily: MONO_FONT, color: C.text_mute }}>{tg.type}</td>
                  <td style={{ padding: "3px 8px", color: C.text_mute }}>
                    {tg.role === "timer" ? `members ${tg.members.map(m => `.${m}`).join(" ")}; PRE ${tg.preS} ${tg.units}` : tg.role}
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
        <ConstructedNote source={RUNG.source} />
      </div>

      <DecisionLog
        title="Rung log"
        headers={["Goal", "Rung"]}
        log={t.log}
        cells={r => [r.id, r.rung]}
        empty="Each goal you meet is logged here and in Field Notes."
      />
    </div>
  );
}

/* --------------------------------------------------------------------------
   Tool 4.2: HMI Tag Bind
   Bind each HMI element to the tag that feeds it. A wrong tag still shows a
   number; the field panel shows what the plant is really doing.
   -------------------------------------------------------------------------- */

const HB_KEY = STORAGE_KEY + ".hmiTagBind";
const HB_TAG = Object.fromEntries(HMI.tags.map(t => [t.tag, t]));

function hbFmt(v) {
  return (Math.round(v * 10) / 10).toFixed(1);
}

function hbRange(tg) {
  return tg.type === "BOOL" ? "BOOL, 0 or 1" : `${tg.min} to ${tg.max} ${tg.units}`;
}

// What the element shows when fed this tag.
function hbShow(el, tg) {
  const v = tg.value;
  if (el.expects === "bool") {
    if (tg.type === "BOOL") return v ? el.on : el.off;
    return el.shape === "valve" ? `POS ${hbFmt(v)} %` : `STATE ${hbFmt(v)}`;
  }
  return `${hbFmt(v)} ${el.units}`;
}

function hbWhy(el, tg) {
  const shows = hbShow(el, tg);
  if (el.expects === "bool" && tg.type !== "BOOL")
    return `${tg.tag} is an analog value (${hbRange(tg)}), not an on/off state. The indicator shows ${shows}, which means nothing for this device. Field: ${el.field}.`;
  if (el.expects === "analog" && tg.type === "BOOL")
    return `${tg.tag} is a BOOL: only 0 or 1. The ${el.label.toLowerCase()} shows ${shows}. It looks like a reading, but it's a state bit. Field: ${el.field}.`;
  if (el.expects === "bool")
    return `${tg.tag} is a real on/off bit, so the indicator looks normal, but it's the wrong device: it shows ${shows}. Field: ${el.field}.`;
  const outside = tg.value < el.min || tg.value > el.max;
  return `${tg.tag} is ${hbRange(tg)}. The ${el.label.toLowerCase()} is scaled ${el.min} to ${el.max} ${el.units}, so it shows ${shows}${
    outside ? ": outside anything the element can show." : ". That's inside the scale, so only the field reading exposes it."
  } Field: ${el.field}.`;
}

function hbSession() {
  return { idx: 0, binds: {}, tries: {}, firsts: {}, last: null };
}

function hbLoad() {
  const t = loadTool(HB_KEY) || {};
  const s = t.session;
  const ok = s && typeof s.idx === "number" && s.idx >= 0 && s.idx <= HMI.elements.length && s.binds && s.tries;
  return {
    session: ok ? { firsts: {}, ...s } : hbSession(),
    played: Array.isArray(t.played) ? t.played : [],
    log: Array.isArray(t.log) ? t.log : [],
  };
}

function HbTrend({ tg, el }) {
  const C = useC();
  const W = 220;
  const HT = 90;
  const span = el.max - el.min;
  const pts = Array.from({ length: 12 }, (_, i) => {
    const v = tg ? (tg.type === "BOOL" ? tg.value : tg.value + Math.sin(i * 0.9) * 0.01 * (tg.max - tg.min)) : null;
    return v;
  });
  const y = v => Math.max(2, Math.min(HT - 2, HT - ((v - el.min) / span) * HT));
  return (
    <svg viewBox={`0 0 ${W} ${HT}`} width="100%" height={HT} role="img" aria-label={tg ? `Trend of ${tg.tag}` : "Trend, unbound"} style={{ display: "block" }}>
      <rect x="0" y="0" width={W} height={HT} fill="none" stroke={C.border} />
      {[0.25, 0.5, 0.75].map(f => (
        <line key={f} x1="0" x2={W} y1={HT * f} y2={HT * f} stroke={C.border} strokeDasharray="2 4" />
      ))}
      {tg && <polyline fill="none" stroke={C.signal_cyan} strokeWidth="2" points={pts.map((v, i) => `${(i / 11) * W},${y(v)}`).join(" ")} />}
    </svg>
  );
}

function HbElement({ el, tg, target, done, sel, onBind }) {
  const C = useC();
  const [over, setOver] = useState(false);
  const correct = tg && tg.tag === el.answer;
  const state = !tg ? "unbound" : correct ? "ok" : "bad";
  const edge = target ? (over ? C.signal_cyan : C.violet) : C.border;
  const valueColor = state === "bad" ? C.rose : state === "ok" ? C.text : C.text_dim;
  const shows = tg ? hbShow(el, tg) : "####";
  let pic = null;
  if (el.shape === "tank") {
    const pct = tg ? Math.max(0, Math.min(100, tg.value)) : 0;
    pic = (
      <div aria-hidden="true" style={{ width: 44, height: 90, border: `2px solid ${C.text_mute}`, borderRadius: "4px 4px 6px 6px", position: "relative", overflow: "hidden" }}>
        <div style={{ position: "absolute", left: 0, right: 0, bottom: 0, height: `${pct}%`, background: `${state === "bad" ? C.rose : C.signal_cyan}55` }} />
      </div>
    );
  } else if (el.shape === "pump") {
    const on = tg && tg.type === "BOOL" && tg.value;
    pic = (
      <svg aria-hidden="true" width="64" height="64" viewBox="0 0 64 64">
        <circle cx="32" cy="32" r="22" fill="none" stroke={C.text_mute} strokeWidth="2" />
        <path d="M32 10 L54 32 L32 54" fill="none" stroke={C.text_mute} strokeWidth="2" />
        <circle cx="32" cy="32" r="7" fill={on ? C.lime : "transparent"} stroke={C.text_mute} />
      </svg>
    );
  } else if (el.shape === "valve") {
    const open = tg && tg.type === "BOOL" && tg.value;
    pic = (
      <svg aria-hidden="true" width="72" height="48" viewBox="0 0 72 48">
        <path d="M8 8 L36 24 L8 40 Z M64 8 L36 24 L64 40 Z" fill={open ? `${C.lime}55` : "transparent"} stroke={C.text_mute} strokeWidth="2" />
        <line x1="36" y1="24" x2="36" y2="4" stroke={C.text_mute} strokeWidth="2" />
      </svg>
    );
  } else if (el.shape === "trend") {
    pic = <HbTrend tg={tg} el={el} />;
  }
  return (
    <div
      onDragOver={e => {
        if (!target) return;
        e.preventDefault();
        setOver(true);
      }}
      onDragLeave={() => setOver(false)}
      onDrop={e => {
        e.preventDefault();
        setOver(false);
        if (target) onBind(e.dataTransfer.getData("text/plain"));
      }}
      style={{ display: "grid", gap: 6, alignContent: "start", justifyItems: "center", padding: 10, border: `${target ? 2 : 1}px ${target ? "dashed" : "solid"} ${edge}`, borderRadius: 4, background: over ? `${C.signal_cyan}10` : C.panel }}
    >
      <span style={{ fontSize: 12, color: C.text_mute, textAlign: "center" }}>{el.label}</span>
      {pic}
      <span style={{ fontFamily: MONO_FONT, fontSize: el.shape === "numeric" ? 26 : 15, fontWeight: 700, color: valueColor }}>{shows}</span>
      <span style={{ fontFamily: MONO_FONT, fontSize: 10, color: C.text_dim }}>{tg ? tg.tag : done ? "" : "no tag"}</span>
      {target && (
        <button
          type="button"
          onClick={() => onBind(sel)}
          aria-label={`Bind ${sel || "the selected tag"} to ${el.label}`}
          style={{ minHeight: TOUCH_MIN, padding: "0 10px", border: `1px solid ${C.violet}`, borderRadius: 4, background: "transparent", color: C.violet, fontFamily: UI_FONT, fontSize: 12, fontWeight: 600, cursor: "pointer" }}
        >
          {sel ? `Bind ${sel}` : "Drop a tag here"}
        </button>
      )}
    </div>
  );
}

function HmiTagBind({ onResult }) {
  const C = useC();
  const [t, setT] = useState(hbLoad);
  const [sel, setSel] = useState(null);
  const [msg, setMsg] = useState(null);
  useEffect(() => saveTool(HB_KEY, t), [t]);
  const s = t.session;
  const el = HMI.elements[s.idx];
  const solved = el && s.binds[el.id] === el.answer;
  const finished = s.idx >= HMI.elements.length;

  const bind = tag => {
    if (!el || solved) return;
    if (!tag || !HB_TAG[tag]) {
      setMsg({ text: "Pick a tag first (keys 1-6), or drag one onto the element.", bad: true });
      return;
    }
    const tries = (s.tries[el.id] || 0) + 1;
    const firsts = s.firsts[el.id] ? s.firsts : { ...s.firsts, [el.id]: tag };
    const right = tag === el.answer;
    setMsg(null);
    if (right) {
      const fresh = !t.played.includes(el.id);
      onResult({
        xp: l4Xp(fresh, tries === 1),
        firstTry: tries === 1,
        firstPass: fresh && tries === 1,
        radar: L4_RADAR,
        note: { tool: "4.2", tag, text: `HMI Tag Bind ${el.label}: ${tag} (${hbRange(HB_TAG[tag])}) — ${el.field}` },
      });
      setT(x => ({
        ...x,
        played: fresh ? [...x.played, el.id] : x.played,
        log: [{ id: tag, el: el.label, attempts: tries, first: firsts[el.id], at: new Date().toISOString() }, ...x.log],
        session: { ...x.session, binds: { ...x.session.binds, [el.id]: tag }, tries: { ...x.session.tries, [el.id]: tries }, firsts, last: { ok: true, tag } },
      }));
    } else {
      setT(x => ({
        ...x,
        session: { ...x.session, binds: { ...x.session.binds, [el.id]: tag }, tries: { ...x.session.tries, [el.id]: tries }, firsts, last: { ok: false, tag } },
      }));
    }
    setSel(null);
  };

  const next = () => setT(x => ({ ...x, session: { ...x.session, idx: x.session.idx + 1, last: null } }));
  const again = () => setT(x => ({ ...x, session: hbSession() }));

  useEffect(() => {
    const onKey = e => {
      const tag = l4KeyTarget(e);
      if (tag === null) return;
      if (/^[1-6]$/.test(e.key) && el && !solved) {
        e.preventDefault();
        const tg = HMI.tags[Number(e.key) - 1].tag;
        setSel(v => (v === tg ? null : tg));
      } else if (e.key === "Enter" && tag !== "BUTTON") {
        e.preventDefault();
        if (finished) again();
        else if (solved) next();
        else bind(sel);
      }
    };
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  });

  const elTries = el ? s.tries[el.id] || 0 : 0;

  return (
    <div style={{ display: "grid", gap: 20 }}>
      <div style={{ display: "flex", flexWrap: "wrap", gap: 8, alignItems: "center" }}>
        <TrainingBadge />
        <Chip color={C.violet}>ELEMENT {Math.min(s.idx + 1, HMI.elements.length)} / {HMI.elements.length}</Chip>
        <Chip color={C.lime}>BOUND {t.played.length} / {HMI.elements.length}</Chip>
        <span style={{ fontSize: 12, color: C.text_dim }}>Keys: 1-6 pick a tag, Enter binds it</span>
      </div>

      <section aria-labelledby="hb-brief">
        <H as="h3">Binding</H>
        <p id="hb-brief" style={{ margin: "6px 0 0", fontFamily: HEAD_FONT, fontWeight: 700, fontSize: 20, color: C.text }}>
          {finished ? "Every element is bound." : `Bind the ${el.label.toLowerCase()}. Then check it against the field.`}
        </p>
        <ConstructedNote source={HMI.source} />
      </section>

      <div>
        <H as="h3">Tags</H>
        <div role="group" aria-label="PLC tags" style={{ display: "flex", flexWrap: "wrap", gap: 8, marginTop: 8 }}>
          {HMI.tags.map((tg, i) => (
            <button
              key={tg.tag}
              type="button"
              draggable={!finished && !solved}
              disabled={finished || solved}
              onDragStart={e => {
                e.dataTransfer.setData("text/plain", tg.tag);
                setSel(tg.tag);
              }}
              onClick={() => setSel(v => (v === tg.tag ? null : tg.tag))}
              aria-pressed={sel === tg.tag}
              aria-label={`${i + 1}: ${tg.tag}, ${hbRange(tg)}`}
              style={{
                minHeight: TOUCH_MIN,
                padding: "4px 10px",
                display: "grid",
                justifyItems: "start",
                border: `1px solid ${sel === tg.tag ? C.signal_cyan : C.border}`,
                borderRadius: 4,
                background: sel === tg.tag ? `${C.signal_cyan}14` : C.bg,
                color: C.text,
                cursor: finished || solved ? "default" : "grab",
                opacity: finished || solved ? 0.5 : 1,
                textAlign: "left",
              }}
            >
              <span style={{ fontFamily: MONO_FONT, fontSize: 13, color: sel === tg.tag ? C.signal_cyan : C.text }}>
                {i + 1} {tg.tag}
              </span>
              <span style={{ fontFamily: MONO_FONT, fontSize: 10, color: C.text_dim }}>{hbRange(tg)}</span>
            </button>
          ))}
        </div>
        <L4Status msg={msg} />
      </div>

      <div>
        <H as="h3">HMI screen</H>
        <div className="tool-scroll" style={{ marginTop: 8, border: `1px solid ${C.border}`, borderRadius: 4, background: C.bg, padding: 10 }}>
          <div style={{ display: "grid", gridTemplateColumns: "repeat(4, minmax(120px, 1fr)) minmax(220px, 1.6fr)", gap: 8, minWidth: 760 }}>
            {HMI.elements.map((e, i) => {
              const bound = s.binds[e.id];
              return (
                <HbElement
                  key={e.id}
                  el={e}
                  tg={bound ? HB_TAG[bound] : null}
                  target={!finished && i === s.idx && !solved}
                  done={i < s.idx}
                  sel={sel}
                  onBind={bind}
                />
              );
            })}
          </div>
        </div>
        <ConstructedNote source={HMI.source} />
      </div>

      <div>
        <H as="h3">Field</H>
        <ul style={{ margin: "8px 0 0", padding: 0, listStyle: "none", display: "grid", gap: 4 }}>
          {HMI.elements.map(e => (
            <li key={e.id} style={{ fontSize: 14, color: C.text, padding: "6px 10px", border: `1px solid ${C.border}`, borderRadius: 4 }}>
              {e.field}
            </li>
          ))}
        </ul>
        <ConstructedNote source={HMI.source} />
      </div>

      <div aria-live="polite" style={{ display: "grid", gap: 12 }}>
        {el && s.last && !s.last.ok && (
          <Verdict key={elTries} ok={false} title={`${s.last.tag} doesn't belong on the ${el.label.toLowerCase()}.`}>
            <p style={{ margin: 0 }}>{hbWhy(el, HB_TAG[s.last.tag])}</p>
            <ConstructedNote source={HMI.source} />
            <p style={{ margin: "6px 0 0", fontWeight: 600 }}>Bind another tag. A retry is worth {L4_XP_RETRY} XP.</p>
          </Verdict>
        )}
        {el && solved && (
          <Verdict ok title={elTries === 1 ? "Bound, first try." : `Bound on try ${elTries}.`}>
            <p style={{ margin: 0 }}>
              {el.answer} is {hbRange(HB_TAG[el.answer])}, and the {el.label.toLowerCase()} now matches the field: {el.field}.
            </p>
            <ConstructedNote source={HMI.source} />
            <p style={{ margin: "8px 0 0", color: C.text_mute }}>The binding is the last link: {PROG_LESSONS.hmiChain.text}.</p>
            <Cites cites={[PROG_LESSONS.hmiChain.source]} />
            <div style={{ marginTop: 10 }}>
              <Btn onClick={next} ariaLabel={s.idx + 1 < HMI.elements.length ? "Next element" : "Finish"}>
                {s.idx + 1 < HMI.elements.length ? "Next element" : "Finish"}
              </Btn>
            </div>
          </Verdict>
        )}
        {finished && (
          <Verdict ok title="Screen bound and checked against the field.">
            <p style={{ margin: 0 }}>Symptom: "{PROG_LESSONS.hmiSymptom.text}."</p>
            <Cites cites={[PROG_LESSONS.hmiSymptom.source]} />
            <p style={{ margin: "8px 0 0" }}>Documented wrong move: {PROG_LESSONS.scalingFailure.text}</p>
            <Cites cites={[PROG_LESSONS.scalingFailure.source]} />
            <p style={{ margin: "8px 0 0", color: C.text_mute }}>A wrong tag binding is one way an HMI value goes wrong while the transmitter is fine.</p>
            <div style={{ marginTop: 10 }}>
              <Btn onClick={again} ariaLabel="Bind the screen again">Bind again</Btn>
            </div>
          </Verdict>
        )}
      </div>

      <DecisionLog
        title="Binding log"
        headers={["Tag", "Element"]}
        log={t.log}
        cells={r => [r.id, r.el]}
        empty="Each element you bind is logged here and in Field Notes."
      />
    </div>
  );
}

/* --------------------------------------------------------------------------
   Tool 4.3: Change Control Gate
   Put the 8 change steps in order for a change request. A step placed before
   a step it needs is rejected with the reason.
   -------------------------------------------------------------------------- */

const CCG_KEY = STORAGE_KEY + ".changeControlGate";
const CCG_STEP = Object.fromEntries(CCG.steps.map(s => [s.n, s]));

// Sourced lesson shown when each request is completed.
function ccgLesson(id) {
  if (id === "r1") return { text: `${RE_TIMER.tag} is the same timer tag you used in the Rung Editor (4.1).`, cites: [] };
  if (id === "r2") return { text: `${PLC_LESSONS.permissiveBlock.task} ${PLC_LESSONS.permissiveBlock.output}`, cites: [PLC_LESSONS.permissiveBlock.source] };
  return { text: `Symptom: "${PROG_LESSONS.hmiSymptom.text}." Documented wrong move: ${PROG_LESSONS.scalingFailure.text}`, cites: [PROG_LESSONS.hmiSymptom.source, PROG_LESSONS.scalingFailure.source] };
}

function ccgSession(i) {
  return { idx: i, bank: shuffled(CCG.steps.map(s => s.n)), plan: [], misses: 0, firstMiss: null, last: null, done: false };
}

function ccgLoad() {
  const t = loadTool(CCG_KEY) || {};
  const s = t.session;
  const ok = s && CCG.requests[s.idx] && Array.isArray(s.bank) && Array.isArray(s.plan) && s.bank.length + s.plan.length === CCG.steps.length;
  return {
    session: ok ? s : ccgSession(0),
    played: Array.isArray(t.played) ? t.played : [],
    log: Array.isArray(t.log) ? t.log : [],
  };
}

function ChangeControlGate({ onResult }) {
  const C = useC();
  const [t, setT] = useState(ccgLoad);
  const [over, setOver] = useState(false);
  useEffect(() => saveTool(CCG_KEY, t), [t]);
  const s = t.session;
  const req = CCG.requests[s.idx];
  const bankLeft = s.bank.filter(n => !s.plan.includes(n));

  const add = n => {
    if (s.done || !CCG_STEP[n] || s.plan.includes(n)) return;
    const step = CCG_STEP[n];
    const missing = step.needs.filter(x => !s.plan.includes(x.step));
    if (missing.length) {
      setT(x => ({
        ...x,
        session: { ...x.session, misses: x.session.misses + 1, firstMiss: x.session.firstMiss || step.text, last: { ok: false, step: n, need: missing[0].step, why: missing[0].why } },
      }));
      return;
    }
    const plan = [...s.plan, n];
    if (plan.length < CCG.steps.length) {
      setT(x => ({ ...x, session: { ...x.session, plan, last: { ok: true, step: n } } }));
      return;
    }
    const fresh = !t.played.includes(req.id);
    const clean = s.misses === 0;
    const backup = CCG_STEP[6].needs.find(x => x.step === 4);
    onResult({
      xp: l4Xp(fresh, clean),
      firstTry: clean,
      firstPass: fresh && clean,
      radar: L4_RADAR,
      note: { tool: "4.3", tag: req.id.toUpperCase(), text: `Change Control Gate: "${req.text}" — ${plan.join("-")}, ${s.misses} rejected. ${backup.why}` },
    });
    setT(x => ({
      ...x,
      played: fresh ? [...x.played, req.id] : x.played,
      log: [{ id: req.id.toUpperCase(), order: plan.join("-"), attempts: s.misses + 1, first: s.firstMiss ? `rejected: ${s.firstMiss}` : "clean", at: new Date().toISOString() }, ...x.log],
      session: { ...x.session, plan, done: true, last: null },
    }));
  };

  const next = () => setT(x => ({ ...x, session: ccgSession((x.session.idx + 1) % CCG.requests.length) }));
  const restart = () => setT(x => ({ ...x, session: { ...ccgSession(x.session.idx), misses: x.session.misses, firstMiss: x.session.firstMiss } }));

  useEffect(() => {
    const onKey = e => {
      const tag = l4KeyTarget(e);
      if (tag === null) return;
      if (/^[1-8]$/.test(e.key) && !s.done) {
        const n = bankLeft[Number(e.key) - 1];
        if (n) {
          e.preventDefault();
          add(n);
        }
      } else if (e.key === "Enter" && s.done && tag !== "BUTTON") {
        e.preventDefault();
        next();
      }
    };
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  });

  const lesson = ccgLesson(req.id);

  return (
    <div style={{ display: "grid", gap: 20 }}>
      <div style={{ display: "flex", flexWrap: "wrap", gap: 8, alignItems: "center" }}>
        <TrainingBadge />
        <Chip color={C.violet}>REQUEST {s.idx + 1} / {CCG.requests.length}</Chip>
        <Chip color={C.lime}>CLEARED {t.played.length} / {CCG.requests.length}</Chip>
        <span style={{ fontSize: 12, color: C.text_dim }}>Keys: 1-8 add the numbered step to the plan</span>
      </div>

      <section aria-labelledby="ccg-req">
        <H as="h3">Change request</H>
        <p id="ccg-req" style={{ margin: "6px 0 0", fontFamily: HEAD_FONT, fontWeight: 700, fontSize: 20, color: C.text }}>
          {req.text}
        </p>
        <ConstructedNote source={req.source} />
      </section>

      <div style={{ display: "grid", gap: 16, gridTemplateColumns: "repeat(auto-fit, minmax(240px, 1fr))" }}>
        <div>
          <H as="h3">Steps</H>
          <ol role="list" aria-label="Unplaced steps" style={{ margin: "8px 0 0", padding: 0, listStyle: "none", display: "grid", gap: 6 }}>
            {bankLeft.map((n, i) => (
              <li key={n}>
                <button
                  type="button"
                  draggable={!s.done}
                  onDragStart={e => e.dataTransfer.setData("text/plain", String(n))}
                  onClick={() => add(n)}
                  aria-label={`${i + 1}: ${CCG_STEP[n].text}. Add to plan`}
                  style={{ width: "100%", minHeight: TOUCH_MIN, display: "flex", gap: 10, alignItems: "center", padding: "6px 10px", border: `1px solid ${s.last && !s.last.ok && s.last.step === n ? C.rose : C.border}`, borderRadius: 4, background: C.bg, color: C.text, cursor: "grab", textAlign: "left", fontFamily: UI_FONT, fontSize: 14 }}
                >
                  <span style={{ fontFamily: MONO_FONT, fontSize: 11, color: C.text_dim, minWidth: 14 }}>{i + 1}</span>
                  {CCG_STEP[n].text}
                </button>
              </li>
            ))}
            {bankLeft.length === 0 && <li style={{ fontSize: 13, color: C.text_mute }}>All steps placed.</li>}
          </ol>
        </div>
        <div>
          <H as="h3">Plan</H>
          <ol
            aria-label="Change plan, in order"
            onDragOver={e => {
              if (s.done) return;
              e.preventDefault();
              setOver(true);
            }}
            onDragLeave={() => setOver(false)}
            onDrop={e => {
              e.preventDefault();
              setOver(false);
              add(Number(e.dataTransfer.getData("text/plain")));
            }}
            style={{ margin: "8px 0 0", padding: 8, listStyle: "none", display: "grid", gap: 6, minHeight: 120, border: `1px dashed ${over ? C.signal_cyan : C.border}`, borderRadius: 4, background: over ? `${C.signal_cyan}10` : "transparent" }}
          >
            {s.plan.map((n, i) => (
              <li key={n} style={{ display: "flex", gap: 10, alignItems: "center", padding: "6px 10px", border: `1px solid ${C.border}`, borderRadius: 4, fontSize: 14, color: C.text }}>
                <span style={{ fontFamily: MONO_FONT, fontSize: 11, color: C.lime, minWidth: 14 }}>{i + 1}</span>
                {CCG_STEP[n].text}
              </li>
            ))}
            {s.plan.length === 0 && <li style={{ fontSize: 13, color: C.text_mute, padding: 6 }}>Drop or click steps in the order you would do them.</li>}
          </ol>
        </div>
      </div>

      <div aria-live="polite" style={{ display: "grid", gap: 12 }}>
        {s.last && !s.last.ok && (
          <Verdict key={s.misses} ok={false} title={`Not yet: ${CCG_STEP[s.last.step].text}.`}>
            <p style={{ margin: 0 }}>{s.last.why}</p>
            <p style={{ margin: "4px 0 0", color: C.text_mute }}>It needs "{CCG_STEP[s.last.need].text}" first.</p>
            <ConstructedNote source={CCG.source} />
            <p style={{ margin: "6px 0 0", fontWeight: 600 }}>Finishing now is worth {t.played.includes(req.id) ? 0 : L4_XP_RETRY} XP.</p>
          </Verdict>
        )}
        {s.done && (
          <Verdict ok title={s.misses === 0 ? "Gate cleared, no rejected steps." : `Gate cleared with ${s.misses} rejected step${s.misses === 1 ? "" : "s"}.`}>
            <p style={{ margin: 0 }}>Order: {s.plan.map(n => CCG_STEP[n].text).join(" → ")}.</p>
            <ConstructedNote source={`${CCG.source}. ${CCG.orderRule}`} />
            <p style={{ margin: "8px 0 0" }}>{lesson.text}</p>
            {lesson.cites.length > 0 && <Cites cites={lesson.cites} />}
            <p style={{ margin: "8px 0 0", color: C.text_mute }}>The same checkpoints on a loop check form:</p>
            <ul style={{ margin: "4px 0 0", paddingLeft: 18, color: C.text_mute, fontSize: 13 }}>
              <li>{PROG_LESSONS.approved.text}</li>
              <li>{PROG_LESSONS.revision.text}</li>
              <li>{PROG_LESSONS.documentation.text}</li>
            </ul>
            <Cites cites={[...new Set([PROG_LESSONS.approved.source, PROG_LESSONS.documentation.source])]} />
            <div style={{ marginTop: 10 }}>
              <Btn onClick={next} ariaLabel="Next change request">Next request</Btn>
            </div>
          </Verdict>
        )}
        {!s.done && s.plan.length > 0 && (
          <div>
            <Btn variant="ghost" onClick={restart} ariaLabel="Clear the plan and start this request over">Clear plan</Btn>
          </div>
        )}
      </div>

      <DecisionLog
        title="Change log"
        headers={["Request", "Order"]}
        log={t.log}
        cells={r => [r.id, r.order]}
        empty="Each request you clear is logged here and in Field Notes."
      />
    </div>
  );
}

/* --------------------------------------------------------------------------
   Tool 5.1: The Bench
   Randomized practice across the 18 Drill Pack templates. Each run draws its
   inputs from the Drill Input Library banks, walks the drill's steps one at a
   time (answer before moving on), and only then shows why the drill works.
   Repeats are suggested on 1 / 3 / 7 day spacing.
   -------------------------------------------------------------------------- */

const BENCH_KEY = STORAGE_KEY + ".drill";
const BENCH_RADAR = 0.5;
const RADAR_AXES = ["electrical", "instrumentation", "plc", "programming"];
const DRILL_BY_ID = Object.fromEntries(DRILLS.map(d => [d.id, d]));
const DAY_MS = 24 * 60 * 60 * 1000;
// Upper-case words that are signals or units in step text, not answer fields.
const BENCH_NOT_FIELDS = ["PLC", "HMI", "VDC", "RTD", "DP", "PID", "LRV", "URV", "I/O", "ISA", "HART"];

function pickOne(list) {
  return list[Math.floor(Math.random() * list.length)];
}

function benchDevice(cats) {
  const pool = DRILL_INPUTS.device.filter(d => !cats || cats.includes(d.category));
  const d = pickOne(pool);
  return { bracket: "[device]", text: d.text, note: d.category, source: d.source };
}

function benchLoop(cats) {
  const pool = DRILL_INPUTS.loop.filter(l => !cats || cats.includes(l.category));
  const l = pickOne(pool);
  return { bracket: "[loop]", text: l.text, note: l.category, source: l.source };
}

// Draw a fresh input for each bank the drill uses.
function benchInputs(id) {
  const cfg = BENCH.drills[id];
  return cfg.inputs.map(kind => {
    if (kind === "fundamental") {
      const f = pickOne(DRILL_INPUTS.fundamental);
      return { bracket: "[fundamental]", text: f.text, note: f.category, source: f.source };
    }
    if (kind === "concept") {
      const c = pickOne(DRILL_INPUTS.concept);
      return { bracket: "[concept]", text: c.text, source: c.source };
    }
    if (kind === "conceptPair") {
      const p = pickOne(DRILL_INPUTS.conceptPairs);
      return { bracket: "[concept A] vs [concept B]", text: `${p.a} vs ${p.b}`, a: p.a, b: p.b, source: p.source };
    }
    if (kind === "device") return benchDevice(cfg.deviceCats);
    if (kind === "loop") return benchLoop(cfg.loopCats);
    if (kind === "deviceOrLoop") return Math.random() < 0.5 ? benchDevice(cfg.deviceCats) : benchLoop(cfg.loopCats);
    if (kind === "drawing") {
      const d = pickOne(DRILL_INPUTS.drawing);
      return { bracket: "[drawing]", text: d.text, source: d.source };
    }
    if (kind === "symptom") {
      const s = pickOne(DRILL_SYMPTOMS);
      return { bracket: "[symptom]", text: s.symptom, source: s.source };
    }
    if (kind === "rotation") {
      const r = pickOne(DRILL_INPUTS.rotation);
      return { bracket: "[fundamental 1] through [fundamental 5]", text: r.items.join(", "), items: r.items, source: r.source };
    }
    if (kind === "tagRange") {
      const letters = pickOne(Object.keys(BENCH.tagRange));
      const tag = DRILL_INPUTS.tag.find(t => t.letters === letters);
      const range = pickOne(LRV_URV.items.filter(r => r.measurement === BENCH.tagRange[letters]));
      const n = BENCH.tagNumber.min + Math.floor(Math.random() * (BENCH.tagNumber.max - BENCH.tagNumber.min + 1));
      return {
        bracket: "[tag] + [LRV] / [URV]",
        text: `${letters}-${n}, ${tag.meaning.toLowerCase()}, ${range.lrv} to ${range.urv} ${range.units}`,
        source: `${tag.source} (letters and meaning); ${LRV_URV.source} (range)`,
        constructed: `${BENCH.tagNumber.rule} Tag-to-range pairing: ${BENCH.source}`,
      };
    }
    return null;
  }).filter(Boolean);
}

// Put the drawn inputs into the step text where the drill has brackets.
function benchFill(text, inputs) {
  let out = text;
  inputs.forEach(i => {
    if (i.a) out = out.replace("[concept A]", i.a).replace("[concept B]", i.b);
    else out = out.replace(i.bracket, i.text);
  });
  return out;
}

// Upper-case labels the step itself names (KNOWN, MISSING, WRONG) become answer fields.
function benchFields(step) {
  const found = (step.match(/\b[A-Z]{3,}(?: [A-Z]{2,})*\b/g) || []).filter(w => !BENCH_NOT_FIELDS.includes(w));
  const uniq = [...new Set(found)];
  return uniq.length >= 3 ? uniq : null;
}

function benchStatus(c, now) {
  if (!c) return { label: "New", due: true, days: 0 };
  const gap = BENCH.spacingDays[Math.min(c.count, BENCH.spacingDays.length) - 1];
  const dueAt = new Date(c.last).getTime() + gap * DAY_MS;
  const days = Math.ceil((dueAt - now) / DAY_MS);
  return days <= 0 ? { label: `Due · done ${c.count}×`, due: true, days: 0 } : { label: `Review in ${days} day${days === 1 ? "" : "s"} · done ${c.count}×`, due: false, days };
}

function benchNewSession(id) {
  return { id, inputs: benchInputs(id), step: 0, answers: {}, done: null };
}

function benchLoad() {
  const t = loadTool(BENCH_KEY) || {};
  const s = t.session;
  const ok = s && DRILL_BY_ID[s.id] && Array.isArray(s.inputs) && typeof s.step === "number" && s.answers;
  return {
    session: ok ? s : null,
    completions: t.completions && typeof t.completions === "object" ? t.completions : {},
    log: Array.isArray(t.log) ? t.log : [],
  };
}

function BenchRef({ kind, inputs }) {
  const C = useC();
  if (kind === "loop") {
    const l = inputs.find(i => i.bracket === "[loop]");
    return (
      <div>
        <p style={{ margin: 0, fontFamily: MONO_FONT, fontSize: 14, color: C.signal_cyan }}>{l.text}</p>
        <Cites cites={[l.source]} />
      </div>
    );
  }
  if (kind === "calRecord") {
    const cal = CAL_SCENARIOS.find(c => c.id === "PT-101");
    const pts = ["0%", "25%", "50%", "75%", "100%", "50% (down)", "0% (down)"];
    return (
      <div>
        <p style={{ margin: "0 0 6px", fontSize: 13, color: C.text_mute }}>
          {cal.tag}, {cal.lrv} to {cal.urv} {cal.units}, as-found:
        </p>
        <div className="tool-scroll">
          <table style={{ borderCollapse: "collapse", fontSize: 13 }}>
            <tbody>
              <tr>
                {pts.map(p => (
                  <th key={p} scope="col" style={{ padding: "3px 8px", fontWeight: 600, color: C.text_dim, whiteSpace: "nowrap" }}>{p}</th>
                ))}
              </tr>
              <tr>
                {cal.asFoundMA.map((v, i) => (
                  <td key={i} style={{ padding: "3px 8px", fontFamily: MONO_FONT, color: C.text }}>{v.toFixed(2)} mA</td>
                ))}
              </tr>
            </tbody>
          </table>
        </div>
        <Cites cites={[cal.source]} />
      </div>
    );
  }
  if (kind === "pocketTable") {
    return (
      <div>
        <div className="tool-scroll">
          <table style={{ borderCollapse: "collapse", fontSize: 13 }}>
            <tbody>
              <tr>
                <th scope="row" style={{ padding: "3px 8px", color: C.text_dim, textAlign: "left" }}>% span</th>
                {CALC.mAConverter.referenceTable.filter(r => r.pct % 25 === 0).map(r => (
                  <td key={r.pct} style={{ padding: "3px 8px", fontFamily: MONO_FONT, color: C.text_mute }}>{r.pct}</td>
                ))}
              </tr>
              <tr>
                <th scope="row" style={{ padding: "3px 8px", color: C.text_dim, textAlign: "left" }}>mA</th>
                {CALC.mAConverter.referenceTable.filter(r => r.pct % 25 === 0).map(r => (
                  <td key={r.pct} style={{ padding: "3px 8px", fontFamily: MONO_FONT, color: C.signal_cyan }}>{r.mA.toFixed(2)}</td>
                ))}
              </tr>
            </tbody>
          </table>
        </div>
        <p style={{ margin: "6px 0 0", fontSize: 13, color: C.text_mute }}>Formulas: {CALC.mAConverter.formulas.slice(0, 3).join(" ")}</p>
        <Cites cites={[CALC.mAConverter.referenceSource, CALC.mAConverter.formulasSource]} />
      </div>
    );
  }
  return null;
}

function BenchInputs({ inputs }) {
  const C = useC();
  return (
    <ul style={{ margin: "8px 0 0", padding: 0, listStyle: "none", display: "grid", gap: 6 }}>
      {inputs.map(i => (
        <li key={i.bracket} style={{ padding: "8px 12px", border: `1px solid ${C.border}`, borderRadius: 4, background: C.bg }}>
          <span style={{ fontFamily: MONO_FONT, fontSize: 11, color: C.text_dim }}>{i.bracket}</span>
          <div style={{ fontFamily: MONO_FONT, fontSize: 14, color: C.signal_cyan, marginTop: 2 }}>{i.text}</div>
          {i.note && <div style={{ fontSize: 12, color: C.text_mute }}>{i.note}</div>}
          <Cites cites={[i.source]} />
          {i.constructed && <ConstructedNote source={i.constructed} />}
        </li>
      ))}
    </ul>
  );
}

function TheBench({ onResult, onStep }) {
  const C = useC();
  const [t, setT] = useState(benchLoad);
  const [msg, setMsg] = useState(null);
  const headRef = useRef(null);
  useEffect(() => saveTool(BENCH_KEY, t), [t]);
  const s = t.session;
  const drill = s && DRILL_BY_ID[s.id];
  const cfg = s && BENCH.drills[s.id];
  const now = Date.now();

  const ribbonStep = s && cfg.ribbon ? cfg.ribbon : null;
  useEffect(() => {
    if (onStep) onStep(ribbonStep);
  }, [ribbonStep, s && s.id]);
  useEffect(() => {
    if (headRef.current) headRef.current.focus();
  }, [s && s.id, s && s.step, s && !!s.done]);

  const start = id => {
    setT(x => ({ ...x, session: benchNewSession(id) }));
    setMsg(null);
  };
  const random = () => {
    const due = DRILLS.filter(d => benchStatus(t.completions[d.id], now).due);
    start(pickOne(due.length ? due : DRILLS).id);
  };
  const leave = () => {
    setT(x => ({ ...x, session: null }));
    setMsg(null);
  };

  const stepText = s && !s.done ? drill.steps[s.step] : "";
  const fields = s && !s.done ? benchFields(stepText) : null;
  const classify = s && !s.done && cfg.classify && cfg.classify[String(s.step + 1)];
  const rotation = s && s.inputs.find(i => i.items);
  const ans = (s && s.answers[s.step]) || {};
  const setAns = (k, v) => setT(x => ({ ...x, session: { ...x.session, answers: { ...x.session.answers, [x.session.step]: { ...(x.session.answers[x.session.step] || {}), [k]: v } } } }));

  const answered = () => {
    if (classify && rotation) return rotation.items.every(it => ans[it]);
    return Object.values(ans).some(v => typeof v === "string" && v.trim().length >= 2);
  };

  const finish = () => {
    const prev = t.completions[s.id];
    const count = (prev ? prev.count : 0) + 1;
    const first = !prev;
    const gap = BENCH.spacingDays[Math.min(count, BENCH.spacingDays.length) - 1];
    const xp = first ? BENCH.xp.first : BENCH.xp.repeat;
    const inputText = s.inputs.map(i => i.text).join("; ") || "no input";
    const note = `The Bench ${drill.id.replace("drill-", "Drill ")}: ${drill.name} — ${inputText}. Run ${count}; next review in ${gap} day${gap === 1 ? "" : "s"}.`;
    onResult({ xp, firstPass: first, radar: BENCH_RADAR, radarAxes: RADAR_AXES, note: { tool: "5.1", tag: null, text: note } });
    const at = new Date().toISOString();
    setT(x => ({
      ...x,
      completions: { ...x.completions, [s.id]: { count, last: at } },
      log: [{ id: drill.id, name: drill.name, input: inputText, run: count, next: gap, at }, ...x.log].slice(0, 30),
      session: { ...x.session, done: { xp, count, gap, note } },
    }));
  };

  const next = () => {
    if (!answered()) {
      setMsg(classify ? `Classify all ${rotation.items.length} items first.` : "Write your answer before moving on. Answer first, then check.");
      return;
    }
    setMsg(null);
    if (s.step + 1 < drill.steps.length) setT(x => ({ ...x, session: { ...x.session, step: x.session.step + 1 } }));
    else finish();
  };
  const back = () => setT(x => ({ ...x, session: { ...x.session, step: Math.max(0, x.session.step - 1) } }));

  useEffect(() => {
    const onKey = e => {
      if (!s || s.done) return;
      if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) {
        e.preventDefault();
        next();
      }
    };
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  });

  const badgeRow = (
    <div style={{ display: "flex", flexWrap: "wrap", gap: 8, alignItems: "center" }}>
      <Chip color={C.lime}>DRILLS DONE {Object.keys(t.completions).length} / {DRILLS.length}</Chip>
      <Chip color={C.amber}>DUE {DRILLS.filter(d => t.completions[d.id] && benchStatus(t.completions[d.id], now).due).length}</Chip>
      {s && !s.done && <Chip color={C.signal_cyan}>STEP {s.step + 1} / {drill.steps.length}</Chip>}
    </div>
  );

  // ---- picker ----
  if (!s) {
    return (
      <div style={{ display: "grid", gap: 20 }}>
        {badgeRow}
        <section aria-labelledby="bench-pick">
          <H as="h3">Pick a drill</H>
          <p id="bench-pick" ref={headRef} tabIndex={-1} style={{ margin: "6px 0 0", fontFamily: HEAD_FONT, fontWeight: 700, fontSize: 20, color: C.text, outline: "none" }}>
            {DRILLS.length} drills. Inputs are drawn at random each run.
          </p>
          <p style={{ margin: "6px 0 0", fontSize: 13, color: C.text_mute }}>{DRILL_INPUTS.howToUse.text}</p>
          <Cites cites={[DRILL_INPUTS.howToUse.source]} />
          <div style={{ marginTop: 12 }}>
            <Btn onClick={random} ariaLabel="Random drill: picks a due or new drill">Random</Btn>
          </div>
        </section>
        <ol aria-label="Drills" style={{ margin: 0, padding: 0, listStyle: "none", display: "grid", gap: 8 }}>
          {DRILLS.map((d, i) => {
            const st = benchStatus(t.completions[d.id], now);
            return (
              <li key={d.id}>
                <button
                  type="button"
                  onClick={() => start(d.id)}
                  aria-label={`Drill ${i + 1}: ${d.name}. ${st.label}`}
                  style={{ width: "100%", minHeight: TOUCH_MIN, display: "grid", gridTemplateColumns: "auto 1fr auto", gap: 12, alignItems: "center", padding: "10px 12px", border: `1px solid ${C.border}`, borderRadius: 4, background: C.bg, color: C.text, cursor: "pointer", textAlign: "left" }}
                >
                  <span style={{ fontFamily: MONO_FONT, fontSize: 12, color: C.text_dim }}>{String(i + 1).padStart(2, "0")}</span>
                  <span>
                    <span style={{ display: "block", fontFamily: HEAD_FONT, fontWeight: 700, fontSize: 15 }}>{d.name}</span>
                    <span style={{ display: "block", fontSize: 13, color: C.text_mute }}>{d.whenToUse}</span>
                    <span style={{ display: "block", fontFamily: MONO_FONT, fontSize: 10, color: C.text_dim, marginTop: 2 }}>SOURCE: {d.source}</span>
                  </span>
                  <span style={{ fontFamily: MONO_FONT, fontSize: 11, color: !t.completions[d.id] ? C.signal_cyan : st.due ? C.amber : C.text_dim, whiteSpace: "nowrap" }}>{st.label}</span>
                </button>
              </li>
            );
          })}
        </ol>
        <ConstructedNote source={`Review spacing ${BENCH.spacingDays.join(" / ")} days: ${BENCH.spacingSource}.`} />
        {t.log.length > 0 && (
          <div>
            <H as="h3">Bench log</H>
            <div className="tool-scroll" style={{ marginTop: 8 }}>
              <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 13 }}>
                <thead>
                  <tr style={{ color: C.text_dim, textAlign: "left" }}>
                    {["Drill", "Input", "Run", "Next review"].map(h => (
                      <th key={h} scope="col" style={{ padding: "4px 8px", fontWeight: 600, borderBottom: `1px solid ${C.border}` }}>{h}</th>
                    ))}
                  </tr>
                </thead>
                <tbody>
                  {t.log.slice(0, 8).map(r => (
                    <tr key={r.at}>
                      <td style={{ padding: "4px 8px", color: C.text }}>{r.name}</td>
                      <td style={{ padding: "4px 8px", color: C.text_mute }}>{r.input}</td>
                      <td style={{ padding: "4px 8px", fontFamily: MONO_FONT, color: r.run === 1 ? C.lime : C.amber }}>{r.run}</td>
                      <td style={{ padding: "4px 8px", fontFamily: MONO_FONT, color: C.text_mute, whiteSpace: "nowrap" }}>{r.next} d</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </div>
        )}
      </div>
    );
  }

  const refKind = cfg.refs && cfg.refs[String(s.step + 1)];
  const selfDirected = cfg.self && cfg.self.includes(s.step + 1);
  const fieldStyle = { width: "100%", boxSizing: "border-box", minHeight: 88, padding: 10, background: C.bg, color: C.text, border: `1px solid ${C.border}`, borderRadius: 4, fontFamily: UI_FONT, fontSize: 14, resize: "vertical" };

  // ---- done ----
  if (s.done) {
    return (
      <div style={{ display: "grid", gap: 20 }}>
        {badgeRow}
        <section aria-labelledby="bench-done">
          <H as="h3">{drill.name}</H>
          <p id="bench-done" ref={headRef} tabIndex={-1} style={{ margin: "6px 0 0", fontFamily: HEAD_FONT, fontWeight: 700, fontSize: 20, color: C.text, outline: "none" }}>
            Drill complete. Run {s.done.count}.
          </p>
        </section>
        <Verdict ok title={`+${s.done.xp} XP${s.done.count === 1 ? ", first completion" : ", repeat"}`}>
          <p style={{ margin: 0, fontWeight: 600 }}>Why it works</p>
          <p style={{ margin: "4px 0 0" }}>{drill.whyItWorks || "The Drill Pack gives no \"why it works\" for this drill."}</p>
          <Cites cites={[drill.source]} />
          <p style={{ margin: "10px 0 0", fontWeight: 600 }}>Field Notes</p>
          <p style={{ margin: "4px 0 0", fontFamily: MONO_FONT, fontSize: 13 }}>{s.done.note}</p>
          <p style={{ margin: "10px 0 0", color: C.text_mute }}>
            Next review in {s.done.gap} day{s.done.gap === 1 ? "" : "s"} ({BENCH.spacingDays.join(" / ")} day spacing).
          </p>
          <Cites cites={[BENCH.spacingSource]} />
        </Verdict>
        <div style={{ display: "flex", flexWrap: "wrap", gap: 8 }}>
          <Btn onClick={leave} ariaLabel="Back to the drill list">Back to drills</Btn>
          <Btn variant="ghost" onClick={() => start(s.id)} ariaLabel="Run this drill again with new inputs">Run again</Btn>
        </div>
      </div>
    );
  }

  // ---- run ----
  return (
    <div style={{ display: "grid", gap: 20 }}>
      {badgeRow}
      <section aria-label={`Drill: ${drill.name}`}>
        <H as="h3">{drill.name}</H>
        <p style={{ margin: "4px 0 0", fontSize: 13, color: C.text_mute }}>{drill.whenToUse}</p>
        <Cites cites={[drill.source]} />
        {s.inputs.length > 0 && (
          <div style={{ marginTop: 12 }}>
            <span style={{ fontFamily: HEAD_FONT, fontWeight: 700, fontSize: 11, letterSpacing: "2px", textTransform: "uppercase", color: C.text_mute }}>Your input</span>
            <BenchInputs inputs={s.inputs} />
            <ConstructedNote source={`Which bank feeds this drill: ${cfg.basis}.`} />
          </div>
        )}
      </section>

      <section aria-labelledby="bench-step" style={{ borderLeft: `3px solid ${C.signal_cyan}`, paddingLeft: 14 }}>
        <span style={{ fontFamily: MONO_FONT, fontSize: 11, color: C.text_dim }}>
          STEP {s.step + 1} OF {drill.steps.length}
        </span>
        <p id="bench-step" ref={headRef} tabIndex={-1} style={{ margin: "4px 0 0", fontSize: 17, lineHeight: 1.5, color: C.text, outline: "none" }}>
          {benchFill(stepText, s.inputs)}
        </p>
        <Cites cites={[drill.source]} />
        {selfDirected && (
          <div style={{ marginTop: 10, padding: "8px 12px", border: `1px solid ${C.amber}`, borderRadius: 4 }}>
            <span style={{ fontSize: 13, color: C.text }}>{BENCH.selfDirectedNote}</span>
            <ConstructedNote source={BENCH.source} />
          </div>
        )}
        {refKind && (
          <div style={{ marginTop: 10, padding: "8px 12px", border: `1px solid ${C.border}`, borderRadius: 4 }}>
            <span style={{ fontFamily: HEAD_FONT, fontWeight: 700, fontSize: 11, letterSpacing: "2px", textTransform: "uppercase", color: C.text_mute }}>Reference</span>
            <div style={{ marginTop: 6 }}>
              <BenchRef kind={refKind} inputs={s.inputs} />
            </div>
          </div>
        )}
      </section>

      <div style={{ display: "grid", gap: 10 }}>
        <H as="h3">Your answer</H>
        {classify && rotation ? (
          rotation.items.map((it, i) => (
            <label key={it} style={{ display: "flex", flexWrap: "wrap", gap: 10, alignItems: "center", fontSize: 14, color: C.text }}>
              <span style={{ flex: "1 1 200px" }}>
                {i + 1}. {it}
              </span>
              <select
                value={ans[it] || ""}
                onChange={e => setAns(it, e.target.value)}
                aria-label={`Classify ${it}`}
                style={{ minHeight: TOUCH_MIN, minWidth: 140, background: C.bg, color: C.text, border: `1px solid ${C.border}`, borderRadius: 4, fontFamily: MONO_FONT, fontSize: 13 }}
              >
                <option value="">choose…</option>
                {classify.map(o => (
                  <option key={o} value={o}>{o}</option>
                ))}
              </select>
            </label>
          ))
        ) : fields ? (
          fields.map(f => (
            <label key={f} style={{ display: "grid", gap: 4 }}>
              <span style={{ fontFamily: MONO_FONT, fontSize: 12, color: C.text_mute }}>{f}</span>
              <textarea value={ans[f] || ""} onChange={e => setAns(f, e.target.value)} aria-label={`${f}: your answer for step ${s.step + 1}`} style={{ ...fieldStyle, minHeight: 64 }} />
            </label>
          ))
        ) : (
          <textarea value={ans.text || ""} onChange={e => setAns("text", e.target.value)} aria-label={`Your answer for step ${s.step + 1}`} style={fieldStyle} />
        )}
        <p aria-live="polite" style={{ margin: 0, minHeight: 20, fontSize: 13, color: C.rose }}>{msg || ""}</p>
        <div style={{ display: "flex", flexWrap: "wrap", gap: 8, alignItems: "center" }}>
          <Btn onClick={next} ariaLabel={s.step + 1 < drill.steps.length ? "Next step" : "Finish the drill"}>
            {s.step + 1 < drill.steps.length ? "Next step" : "Finish drill"}
          </Btn>
          {s.step > 0 && (
            <Btn variant="ghost" onClick={back} ariaLabel="Previous step">
              Back
            </Btn>
          )}
          <Btn variant="ghost" onClick={leave} ariaLabel="Leave this drill and return to the list">
            Leave
          </Btn>
          <span style={{ fontSize: 12, color: C.text_dim }}>Ctrl/Cmd + Enter: next step</span>
        </div>
        <p style={{ margin: 0, fontSize: 12, color: C.text_dim }}>Answers are yours to check: the Drill Pack gives no answer key, so The Bench records your work without grading it.</p>
      </div>
    </div>
  );
}

/* --------------------------------------------------------------------------
   Tool 2.1: Wire Count Detective
   The Input Library p.22 drill: one device, one loop topology, then change a
   single variable. Count the conductors, land each one on a panel terminal,
   and check where the current goes. A miswire is named by its p.21 Tier 5
   fault where one applies, and the chain marks where the current stops.
   Only open return conductor and missing 24 VDC supply show a reading
   (0.0 mA, Template Pack p.4); every other fault shows no mA value.
   -------------------------------------------------------------------------- */

const WC_KEY = STORAGE_KEY + ".wireCount";
const WC_XP_FIRST = 20;
const WC_XP_RETRY = 8;
const WC_RADAR = 0.5;
const WC_COUNTS = [2, 4];
const WC_OFF = "OFF";
const WC_TERMS = WCD.terminals.items;
const WC_OUT = WCD.outcomes;

// Electrical node of a panel terminal: a jumper merges its two terminals.
function wcNode(ch, term) {
  if (!term || term === WC_OFF) return WC_OFF;
  const j = ch.jumpers.find(([a]) => a === term);
  return j ? j[1] : term;
}

// Where the loop goes, from the landed conductors. Returns the outcome id and
// where to mark it: "supply", "tx", "input", "com", or a conductor id.
function wcCheck(ch, as) {
  if (ch.count === 2) {
    const a = as["T+"], b = as["T-"];
    const na = wcNode(ch, a), nb = wcNode(ch, b);
    if (a !== WC_OFF && a === b) return { id: "sameTerminal", at: "tx" };
    if (na === "PWR+" && nb === "SIG+") return { id: "ok" };
    if (na !== "PWR+" && nb !== "PWR+") return { id: "missingSupply", at: "supply" };
    if (nb === "PWR+") {
      if (a === WC_OFF) return { id: "openTerminal", at: "T+" };
      if (a === "COM") return { id: "badCommon", at: "com" };
      return { id: "reversedTx", at: "tx" };
    }
    if (b === WC_OFF) return { id: "openReturn", at: "T-" };
    if (b === "COM") return { id: "badCommon", at: "com" };
    return { id: "bypass", at: "input" };
  }
  const sP = as["S+"], sN = as["S-"], oP = as["O+"], oN = as["O-"];
  if (sP !== WC_OFF && sP === sN) return { id: "sameTerminal", at: "tx" };
  if (!(sP === "PWR+" && sN === "PWR-")) {
    if (sP === "PWR-" && sN === "PWR+") return { id: "reversedTx", at: "tx" };
    if (sP !== "PWR+" && sN !== "PWR+") return { id: "missingSupply", at: "supply" };
    if (sN === "PWR+") {
      if (sP === WC_OFF) return { id: "openTerminal", at: "S+" };
      if (sP === "COM") return { id: "badCommon", at: "com" };
      return { id: "reversedTx", at: "tx" };
    }
    if (sN === WC_OFF) return { id: "openReturn", at: "S-" };
    if (sN === "COM") return { id: "badCommon", at: "com" };
    return { id: "wrongTerminal", at: "S-" };
  }
  if (oP !== WC_OFF && oP === oN) return { id: "sameTerminal", at: "tx" };
  if (oP === "SIG+" && oN === "SIG-") return { id: "ok" };
  if (oP === "SIG-" && oN === "SIG+") return { id: "reversedAi", at: "input" };
  if (oN === WC_OFF) return { id: "openReturn", at: "O-" };
  if (oP === WC_OFF) return { id: "openTerminal", at: "O+" };
  if (oP === "COM" || oN === "COM") return { id: "badCommon", at: "com" };
  if (["PWR+", "PWR-"].includes(oP) && ["PWR+", "PWR-"].includes(oN)) return { id: "bypass", at: "input" };
  return { id: "wrongTerminal", at: ["PWR+", "PWR-"].includes(oP) ? "O+" : "O-" };
}

// Current path for a closed loop, in the order the current meets each termination.
function wcPath(ch) {
  const input = ch.isolator ? "galvanic isolator input" : "PLC analog input";
  if (ch.count === 2) return `24 VDC supply + → PWR+ → transmitter + → transmitter − → SIG+ → ${input} → SIG− → DC return (PWR−)`;
  return "Supply pair: PWR+ → SUPPLY + → transmitter → SUPPLY − → PWR−. Output pair: OUT + → SIG+ → PLC analog input → SIG− → OUT −";
}

function wcSession(i) {
  return { idx: i, count: null, countMiss: null, assign: {}, checks: 0, misses: 0, firstMiss: null, result: null, done: false };
}

function wcLoad() {
  const t = loadTool(WC_KEY) || {};
  const s = t.session;
  const ok = s && WCD.challenges[s.idx] && s.assign && typeof s.assign === "object";
  return {
    session: ok ? s : wcSession(0),
    played: Array.isArray(t.played) ? t.played : [],
    log: Array.isArray(t.log) ? t.log : [],
  };
}

function WcHousing({ ch, show }) {
  const C = useC();
  return (
    <div
      role="img"
      aria-label={`Transmitter housing with ${ch.conductors.length} terminals: ${ch.conductors.map(c => c.housing).join(", ")}`}
      style={{ display: "inline-flex", gap: 10, padding: "10px 14px", border: `1px solid ${C.border}`, borderRadius: 6, background: C.bg }}
    >
      {ch.conductors.map(c => (
        <div key={c.id} style={{ display: "grid", justifyItems: "center", gap: 4 }}>
          <span aria-hidden="true" style={{ width: 18, height: 18, borderRadius: "50%", border: `2px solid ${C.text_mute}`, boxSizing: "border-box" }} />
          <span style={{ fontFamily: MONO_FONT, fontSize: 11, color: show ? C.text : C.text_mute, whiteSpace: "nowrap" }}>{c.housing}</span>
        </div>
      ))}
    </div>
  );
}

function WcChain({ ch, result }) {
  const C = useC();
  const reduced = useReducedMotion();
  const isoIdx = ch.chain.findIndex(n => /isolator/i.test(n));
  const inputIdx = isoIdx >= 0 ? isoIdx : ch.chain.findIndex(n => /analog input/i.test(n));
  const out = result && WC_OUT[result.id];
  const markIdx = !result || result.id === "ok" ? -1 : result.at === "supply" ? 0 : result.at === "input" ? inputIdx : result.at === "com" ? -1 : 1;
  const flowing = result && result.id === "ok";
  const bypass = result && result.id === "bypass";
  return (
    <ol aria-label="Loop chain" style={{ display: "flex", flexWrap: "wrap", gap: 6, alignItems: "center", margin: 0, padding: 0, listStyle: "none" }}>
      {ch.chain.map((name, i) => {
        const stop = i === markIdx;
        // A bypass still carries current through the supply, the transmitter, and DC return.
        const lit = flowing || (bypass && i !== inputIdx && (i < inputIdx || name === "DC return"));
        const color = stop ? C.rose : lit ? C.signal_cyan : C.text_dim;
        const tag = stop ? (bypass ? "no current reaches the input" : "current stops here") : lit ? "current" : result ? "no current" : "";
        return (
          <li key={name} aria-label={`${name}${tag ? `: ${tag}` : ""}`} style={{ display: "flex", alignItems: "center", gap: 6 }}>
            {i > 0 && (
              <svg width="26" height="10" aria-hidden="true">
                <line x1="0" y1="5" x2="26" y2="5" stroke={lit ? C.signal_cyan : C.border} strokeWidth="2" strokeDasharray={flowing ? "6 10" : "none"} style={{ animation: flowing && !reduced ? "flow 0.8s linear infinite" : "none" }} />
              </svg>
            )}
            <span style={{ display: "grid", gap: 2, padding: "6px 10px", border: `1px solid ${color}`, borderRadius: 4, background: stop || lit ? `${color}12` : "transparent" }}>
              <span style={{ fontSize: 13, color: C.text, whiteSpace: "nowrap" }}>{name}</span>
              {tag && <span style={{ fontFamily: MONO_FONT, fontSize: 10, color, whiteSpace: "nowrap" }}>{tag.toUpperCase()}</span>}
              {stop && out && out.zeroMa && <span style={{ fontFamily: MONO_FONT, fontSize: 12, color: C.rose }}>{WCD.zeroMa.reading}</span>}
            </span>
          </li>
        );
      })}
      {result && result.at === "com" && (
        <li aria-label="COM terminal: current stops here" style={{ padding: "6px 10px", border: `1px solid ${C.rose}`, borderRadius: 4, background: `${C.rose}12`, fontFamily: MONO_FONT, fontSize: 11, color: C.rose }}>
          COM: CURRENT STOPS HERE
        </li>
      )}
    </ol>
  );
}

function WcTerminalStrip({ ch, assign, result }) {
  const C = useC();
  const mark = result && result.id !== "ok" ? result.at : null;
  return (
    <div className="tool-scroll">
      <table style={{ borderCollapse: "collapse", fontSize: 13, minWidth: 420 }}>
        <thead>
          <tr style={{ color: C.text_dim, textAlign: "left" }}>
            {["Terminal", "Function", "Landed"].map(h => (
              <th key={h} scope="col" style={{ padding: "4px 8px", fontWeight: 600, borderBottom: `1px solid ${C.border}` }}>{h}</th>
            ))}
          </tr>
        </thead>
        <tbody>
          {WC_TERMS.map(term => {
            const landed = ch.conductors.filter(c => assign[c.id] === term.id).map(c => c.housing);
            const jumper = ch.jumpers.find(j => j.includes(term.id));
            const hot = mark === "com" && term.id === "COM";
            return (
              <tr key={term.id}>
                <td style={{ padding: "4px 8px", fontFamily: MONO_FONT, color: hot ? C.rose : C.signal_cyan, whiteSpace: "nowrap" }}>{term.id.replace("-", "−")}</td>
                <td style={{ padding: "4px 8px", color: C.text }}>
                  {term.fn}: {ch.isolator && term.id.startsWith("SIG") ? `isolator ${term.label}` : term.label}
                  {jumper && <span style={{ color: C.text_mute }}> (jumper {jumper.map(x => x.replace("-", "−")).join(" – ")})</span>}
                </td>
                <td style={{ padding: "4px 8px", fontFamily: MONO_FONT, color: landed.length ? C.text : C.text_dim, whiteSpace: "nowrap" }}>{landed.length ? landed.join(", ") : "—"}</td>
              </tr>
            );
          })}
        </tbody>
      </table>
    </div>
  );
}

function WireCount({ onResult }) {
  const C = useC();
  const [t, setT] = useState(wcLoad);
  useEffect(() => saveTool(WC_KEY, t), [t]);
  const s = t.session;
  const ch = WCD.challenges[s.idx];
  const countOk = s.count === ch.count;
  const allLanded = ch.conductors.every(c => s.assign[c.id]);
  const set = patch => setT(x => ({ ...x, session: { ...x.session, ...patch } }));

  const pickCount = n => {
    if (countOk || s.done) return;
    if (n === ch.count) set({ count: n, countMiss: null });
    else set({ countMiss: n, misses: s.misses + 1, firstMiss: s.firstMiss || `${n} conductors` });
  };

  const land = (id, term) => {
    if (s.done) return;
    set({ assign: { ...s.assign, [id]: term }, result: null });
  };

  const check = () => {
    if (!countOk || !allLanded || s.done) return;
    const r = wcCheck(ch, s.assign);
    if (r.id !== "ok") {
      set({ result: r, checks: s.checks + 1, misses: s.misses + 1, firstMiss: s.firstMiss || WC_OUT[r.id].title.replace(/\.$/, "").toLowerCase() });
      return;
    }
    const fresh = !t.played.includes(ch.id);
    const clean = s.misses === 0;
    const landing = ch.conductors.map(c => `${c.housing} → ${s.assign[c.id].replace("-", "−")}`).join(", ");
    onResult({
      xp: fresh ? (clean ? WC_XP_FIRST : WC_XP_RETRY) : 0,
      firstTry: clean,
      firstPass: fresh && clean,
      radar: WC_RADAR,
      note: { tool: "2.1", tag: null, text: `Wire Count Detective: ${ch.device.name}, ${ch.count} conductors, ${landing} — ${WCD.mentalModel.text}` },
    });
    setT(x => ({
      ...x,
      played: fresh ? [...x.played, ch.id] : x.played,
      log: [{ id: `${ch.count}-WIRE`, landing: `${ch.title}: ${landing}`, attempts: s.misses + 1, first: s.firstMiss || "clean", at: new Date().toISOString() }, ...x.log],
      session: { ...x.session, result: r, done: true },
    }));
  };

  const next = () => setT(x => ({ ...x, session: wcSession((x.session.idx + 1) % WCD.challenges.length) }));

  useEffect(() => {
    const onKey = e => {
      const tag = l4KeyTarget(e);
      if (tag === null) return;
      if (!countOk && /^[1-2]$/.test(e.key)) {
        e.preventDefault();
        pickCount(WC_COUNTS[Number(e.key) - 1]);
      } else if (e.key === "Enter" && tag !== "BUTTON") {
        if (s.done) {
          e.preventDefault();
          next();
        } else if (countOk && allLanded) {
          e.preventDefault();
          check();
        }
      }
    };
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  });

  const out = s.result && WC_OUT[s.result.id];
  const markedConductor = s.result && ch.conductors.find(c => c.id === s.result.at);

  return (
    <div style={{ display: "grid", gap: 20 }}>
      <div style={{ display: "flex", flexWrap: "wrap", gap: 8, alignItems: "center" }}>
        <TrainingBadge />
        <Chip color={C.signal_cyan}>CHALLENGE {s.idx + 1} / {WCD.challenges.length}</Chip>
        <Chip color={C.lime}>CLEARED {t.played.length} / {WCD.challenges.length}</Chip>
        <span style={{ fontSize: 12, color: C.text_dim }}>Keys: 1-2 wire count, Enter checks the wiring</span>
      </div>

      <section aria-labelledby="wc-device" style={{ display: "grid", gap: 10 }}>
        <H as="h3">Device</H>
        <p id="wc-device" style={{ margin: 0, fontFamily: HEAD_FONT, fontWeight: 700, fontSize: 20, color: C.text }}>
          {countOk ? ch.device.name : ch.shownAs}
        </p>
        {countOk && <Cites cites={[ch.device.source]} />}
        <div><WcHousing ch={ch} show={countOk} /></div>
        {countOk ? (
          <>
            <p style={{ margin: 0, fontSize: 14, color: C.text }}>
              Loop: <span style={{ fontFamily: MONO_FONT, fontSize: 13 }}>{ch.loop.text}</span>
            </p>
            {ch.loop.constructed ? <ConstructedNote source={ch.loop.source} /> : <Cites cites={[ch.loop.source, ...(ch.topologyStep ? [ch.topologyStep.source] : [])]} />}
            <ConstructedNote source={`${ch.source}. ${ch.constructedFields}`} />
          </>
        ) : (
          <p style={{ margin: 0, fontSize: 13, color: C.text_mute }}>The loop drawing opens once you have counted the conductors.</p>
        )}
      </section>

      <section aria-labelledby="wc-count-h" style={{ display: "grid", gap: 8 }}>
        <H as="h3"><span id="wc-count-h">1. How many conductors do you run to this device?</span></H>
        <div role="group" aria-labelledby="wc-count-h" style={{ display: "flex", flexWrap: "wrap", gap: 8 }}>
          {WC_COUNTS.map((n, i) => (
            <Btn
              key={n}
              variant={s.count === n ? "primary" : "ghost"}
              color={s.countMiss === n ? C.rose : undefined}
              pressed={s.count === n}
              disabled={countOk}
              onClick={() => pickCount(n)}
              ariaLabel={`${i + 1}: ${n} wires`}
            >
              {i + 1}: {n} wires
            </Btn>
          ))}
        </div>
        <div aria-live="polite">
          {s.countMiss && !countOk && (
            <Verdict key={s.misses} ok={false} title={`${s.countMiss} conductors for ${ch.conductors.length} housing terminals.`}>
              <p style={{ margin: 0 }}>
                {s.countMiss > ch.conductors.length
                  ? `${s.countMiss - ch.conductors.length} cores have nowhere to land on this housing.`
                  : `${ch.conductors.length - s.countMiss} housing terminals are left with nothing on them.`}
              </p>
              <p style={{ margin: "4px 0 0", color: C.text_mute }}>Count the terminals and pick again. Finishing now is worth {t.played.includes(ch.id) ? 0 : WC_XP_RETRY} XP.</p>
            </Verdict>
          )}
        </div>
      </section>

      {countOk && (
        <section aria-labelledby="wc-land-h" style={{ display: "grid", gap: 10 }}>
          <H as="h3"><span id="wc-land-h">2. Land each conductor on its terminal</span></H>
          <div style={{ display: "grid", gap: 8, gridTemplateColumns: "repeat(auto-fit, minmax(220px, 1fr))" }}>
            {ch.conductors.map((c, i) => (
              <label key={c.id} style={{ display: "grid", gap: 4, fontSize: 13, color: C.text }}>
                <span>Conductor {i + 1}, from housing <span style={{ fontFamily: MONO_FONT, color: markedConductor && markedConductor.id === c.id ? C.rose : C.signal_cyan }}>{c.housing}</span></span>
                <select
                  value={s.assign[c.id] || ""}
                  disabled={s.done}
                  onChange={e => land(c.id, e.target.value)}
                  aria-label={`Conductor ${i + 1}, from housing ${c.housing}: terminal`}
                  style={{ minHeight: TOUCH_MIN, padding: "0 8px", background: C.bg, color: C.text, border: `1px solid ${C.border}`, borderRadius: 4, fontFamily: MONO_FONT, fontSize: 13 }}
                >
                  <option value="" disabled>Choose a terminal</option>
                  {WC_TERMS.map(term => (
                    <option key={term.id} value={term.id}>{term.id.replace("-", "−")} ({term.fn})</option>
                  ))}
                  <option value={WC_OFF}>Not landed</option>
                </select>
              </label>
            ))}
          </div>
          <WcTerminalStrip ch={ch} assign={s.assign} result={s.result} />
          <ConstructedNote source={`${WCD.terminals.source}. ${WCD.terminals.note}`} />
          {!s.done && (
            <div>
              <Btn onClick={check} disabled={!allLanded} ariaLabel="Check the wiring">Check wiring</Btn>
            </div>
          )}
        </section>
      )}

      <div aria-live="polite" style={{ display: "grid", gap: 12 }}>
        {s.result && (
          <>
            <H as="h3">Where the current goes</H>
            <WcChain ch={ch} result={s.result} />
          </>
        )}
        {s.result && !s.done && out && (
          <Verdict key={s.checks} ok={false} title={out.title}>
            <p style={{ margin: 0 }}>
              {out.text}
              {markedConductor && ` (conductor from housing ${markedConductor.housing}).`}
            </p>
            {out.tier5 !== undefined && (
              <>
                <p style={{ margin: "6px 0 0", color: C.text_mute }}>Drill loop: "{WCD.tier5.items[out.tier5]}"</p>
                <Cites cites={[WCD.tier5.source]} />
              </>
            )}
            {out.zeroMa && (
              <>
                <p style={{ margin: "6px 0 0" }}>
                  Reading: <span style={{ fontFamily: MONO_FONT }}>{WCD.zeroMa.reading}</span>. Most likely meaning: {WCD.zeroMa.meaning}. Next check: {WCD.zeroMa.nextCheck}.
                </p>
                <Cites cites={[WCD.zeroMa.source]} />
                {ch.count === 2 && (
                  <>
                    <p style={{ margin: "4px 0 0", color: C.text_mute }}>{WCD.zeroMa.trap.text}</p>
                    <Cites cites={[WCD.zeroMa.trap.source]} />
                  </>
                )}
              </>
            )}
            <ConstructedNote source={WC_OUT.source} />
            <p style={{ margin: "6px 0 0", fontWeight: 600 }}>Move a conductor and check again. Finishing now is worth {t.played.includes(ch.id) ? 0 : WC_XP_RETRY} XP.</p>
          </Verdict>
        )}
        {s.done && (
          <Verdict ok title={s.misses === 0 ? "Loop closed on the first try." : `Loop closed after ${s.misses} miss${s.misses === 1 ? "" : "es"}.`}>
            <p style={{ margin: 0 }}>{WC_OUT.ok.text}</p>
            <dl style={{ margin: "10px 0 0", display: "grid", gridTemplateColumns: "minmax(120px, max-content) 1fr", gap: "4px 12px", fontSize: 13 }}>
              <dt style={{ color: C.text_mute }}>Wiring type</dt><dd style={{ margin: 0, fontFamily: MONO_FONT }}>{ch.count}-wire</dd>
              <dt style={{ color: C.text_mute }}>Power source</dt><dd style={{ margin: 0 }}>External 24 VDC supply</dd>
              <dt style={{ color: C.text_mute }}>Supply voltage</dt><dd style={{ margin: 0 }}>{WCD.supplyCheck.text}</dd>
              <dt style={{ color: C.text_mute }}>Current flow</dt><dd style={{ margin: 0, fontFamily: MONO_FONT, fontSize: 12 }}>{wcPath(ch)}</dd>
              <dt style={{ color: C.text_mute }}>Receiver terminals</dt><dd style={{ margin: 0 }}>SIG+ / SIG− on the {ch.receiver}</dd>
              <dt style={{ color: C.text_mute }}>Meter test location</dt><dd style={{ margin: 0 }}>{WCD.meterLocation.text}</dd>
            </dl>
            <p style={{ margin: "8px 0 0", color: C.text_mute }}>Fields from drill 010: "{WCD.answerFields.text}"</p>
            <Cites cites={[WCD.answerFields.source, WCD.supplyCheck.source, WCD.meterLocation.source]} />
            <p style={{ margin: "8px 0 0" }}>The reusable model: {WCD.mentalModel.text}</p>
            <Cites cites={[WCD.mentalModel.source]} />
            <ConstructedNote source={`${ch.source}. Current path follows the constructed terminal convention.`} />
            <div style={{ marginTop: 10 }}>
              <Btn onClick={next} ariaLabel="Next challenge">Next challenge</Btn>
            </div>
          </Verdict>
        )}
      </div>

      <DecisionLog
        title="Wiring log"
        headers={["Device", "Landing"]}
        log={t.log}
        cells={r => [r.id, r.landing]}
        empty="Each loop you close is logged here and in Field Notes."
      />
    </div>
  );
}

/* --------------------------------------------------------------------------
   Tool 1.2: Sourcing or Sinking?
   One renderer, two module definitions. Every terminal number, role, channel
   pairing, marking, and on-state voltage comes from the module's own POINT_IO
   object (transcribed from the Rockwell installation instructions); nothing in this code knows which
   module it is drawing. A module that fails validation stops the tool with
   the reason instead of falling back to another module or a guess.
   Sensors, challenges, outcomes, and current-path wording are constructed
   (SSK). The current path follows the module's input_topology.
   -------------------------------------------------------------------------- */

const SS_KEY = STORAGE_KEY + ".sourcingSinking";
const SS_XP_FIRST = 20;
const SS_XP_RETRY = 8;
const SS_RADAR = 0.5;
const SS_TOPOLOGIES = ["sinking", "sourcing"];
const SS_TYPES = ["PNP", "NPN"];
// The teaching point: a PNP output needs a sinking input, an NPN output a sourcing input.
const SS_PAIR = { PNP: "sinking", NPN: "sourcing" };
const SS_SENSOR = Object.fromEntries(SSK.sensors.items.map(s => [s.id, s]));
const SS_LEADS = SSK.leads.items;
const SS_OUT = SSK.outcomes.items;
const SS_CH = SSK.challenges.items;
const SS_ROLE_TEXT = { input: "input", supply: "+24 VDC (V)", common: "DC common (C)" };

// Exact lookup only: a missing module is an error, never another module's data.
function ssModule(id) {
  return POINT_IO.modules.find(m => m.module === id) || null;
}

// Terminal list built from this module's JSON: input terminals from its
// channels, V and C from its power object. A terminal with two roles is kept
// with both so validation can reject it.
function ssTerminals(mod) {
  const map = new Map();
  const add = (n, role, channel) => {
    if (!map.has(n)) map.set(n, []);
    map.get(n).push({ role, channel });
  };
  mod.channels.forEach(c => add(c.input_terminal, "input", c.channel));
  mod.power.field_positive_terminal.forEach(n => add(n, "supply"));
  mod.power.field_common_terminal.forEach(n => add(n, "common"));
  return [...map.entries()].sort((a, b) => a[0] - b[0]).map(([n, roles]) => ({ n, role: roles[0].role, channel: roles[0].channel, roles }));
}

// Renderer rule 10: every channel needs an input terminal, a field-power (V)
// terminal, and a common (C) terminal that the module's power object lists.
function ssValidate(mod, id) {
  if (!mod) return [`No module definition for ${id} in POINT_IO.`];
  const bad = [];
  const num = v => Number.isInteger(v);
  const p = mod.power || {};
  const pos = p.field_positive_terminal, com = p.field_common_terminal;
  if (!SS_TOPOLOGIES.includes(mod.input_topology)) bad.push(`input_topology is ${JSON.stringify(mod.input_topology)}.`);
  if (!Array.isArray(pos) || !pos.length || !pos.every(num)) bad.push(`power.field_positive_terminal is ${JSON.stringify(pos)}.`);
  if (!Array.isArray(com) || !com.length || !com.every(num)) bad.push(`power.field_common_terminal is ${JSON.stringify(com)}.`);
  if (!Array.isArray(mod.channels) || !mod.channels.length) bad.push("No channels defined.");
  else
    mod.channels.forEach(c => {
      if (!num(c.input_terminal)) bad.push(`Channel ${c.channel}: input_terminal is ${JSON.stringify(c.input_terminal)}.`);
      if (!num(c.supply_terminal) || !Array.isArray(pos) || !pos.includes(c.supply_terminal)) bad.push(`Channel ${c.channel}: supply_terminal ${JSON.stringify(c.supply_terminal)} is not a field-power terminal.`);
      if (!num(c.common_terminal) || !Array.isArray(com) || !com.includes(c.common_terminal)) bad.push(`Channel ${c.channel}: common_terminal ${JSON.stringify(c.common_terminal)} is not a common terminal.`);
    });
  if (!bad.length) ssTerminals(mod).forEach(t => t.roles.length > 1 && bad.push(`Terminal ${t.n} has ${t.roles.length} roles.`));
  return bad;
}

function ssFill(text, fill) {
  return text.replace(/\{(\w+)\}/g, (m, k) => (fill && fill[k] !== undefined ? String(fill[k]) : m));
}

// Where current goes for leads landed on terminals as = { pos, out, neg }.
// want: the channel the challenge asks for.
function ssCheck(mod, sensor, want, as) {
  const terms = Object.fromEntries(ssTerminals(mod).map(t => [t.n, t]));
  const role = n => (terms[n] ? terms[n].role : null);
  const { pos, out, neg } = as;
  const same = pos === out || pos === neg ? pos : out === neg ? out : null;
  if (same !== null) return { id: "sameTerminal", fill: { t: same } };
  if (role(pos) !== "supply" || role(neg) !== "common")
    return { id: "unpowered", at: role(pos) !== "supply" ? "pos" : "neg", fill: { pos, neg, posRole: SS_ROLE_TEXT[role(pos)], negRole: SS_ROLE_TEXT[role(neg)] } };
  if (role(out) !== "input") return { id: "outNotInput", at: "out", fill: { out, outRole: SS_ROLE_TEXT[role(out)] } };
  const ch = terms[out].channel;
  if (SS_PAIR[sensor.type] !== mod.input_topology) return { id: sensor.type === "PNP" ? "pnpOnSourcing" : "npnOnSinking", ch, pairing: true };
  const row = mod.channels.find(c => c.channel === ch);
  if (neg !== row.common_terminal) return { id: "tableMismatch", at: "neg", ch, fill: { ch, what: "common", want: row.common_terminal, got: neg } };
  if (pos !== row.supply_terminal) return { id: "tableMismatch", at: "pos", ch, fill: { ch, what: "supply", want: row.supply_terminal, got: pos } };
  if (ch !== want) return { id: "wrongChannel", lit: ch, ch, fill: { out, got: ch, want } };
  return { id: "ok", lit: ch, ch };
}

// Table landing for a channel: what challenge 3 pre-wires.
function ssTableLanding(mod, ch) {
  const row = mod.channels.find(c => c.channel === ch);
  return { pos: row.supply_terminal, out: row.input_terminal, neg: row.common_terminal };
}

function ssPath(mod, ch) {
  const row = mod.channels.find(c => c.channel === ch);
  const fill = { ch, in: row.input_terminal, com: row.common_terminal, sup: row.supply_terminal };
  return { steps: SSK.paths.items[mod.input_topology].map(s => ssFill(s, fill)), power: ssFill(SSK.paths.items.sensorPower, fill) };
}

function ssCite(mod) {
  return `${mod.source_publication} (${mod.source_revision}) p.${mod.source_page}, ${mod.source_figure}; ${mod.source_table}; marking ${mod.source_marking}; specifications p.${mod.source_spec_page}`;
}

function ssSession(i) {
  return { idx: i, type: null, typeMiss: null, topo: null, topoMiss: null, assign: {}, armed: null, pairs: {}, checks: 0, misses: 0, firstMiss: null, result: null, done: false };
}

function ssLoad() {
  const t = loadTool(SS_KEY) || {};
  const s = t.session;
  const ok = s && SS_CH[s.idx] && s.assign && typeof s.assign === "object" && s.pairs && typeof s.pairs === "object";
  return {
    session: ok ? s : ssSession(0),
    played: Array.isArray(t.played) ? t.played : [],
    log: Array.isArray(t.log) ? t.log : [],
  };
}

function SsHalt({ problems }) {

// The one module renderer. landed: { terminal: lead label }. lit: the channel

function SsSensor({ sensor, showType, assign = {}, armed, onArm, draggable, onDragSensor, disabled }) {
