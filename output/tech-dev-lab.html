/* ==========================================================================
   TECH DEV LAB
   Single-file build. React 18 UMD + Babel Standalone. No server required.

   Storage: app state lives in localStorage under "techDevLab.v3", tool
   state under "techDevLab.v3.<tool>". One exception, set by request:
   Trap Spotter uses "techDevLab.v2.trapSpotter" (see EXTRA_TOOL_KEYS;
   Reset clears it too). The reference build in sources/tech-dev-lab.html
   uses "techDevLab.v1". Browsers often share localStorage across files
   opened from disk, so these keys stay clear of it and the two builds
   can't overwrite each other's progress.
   ========================================================================== */

const { useState, useEffect, useRef, createContext, useContext } = React;

/* ==========================================================================
   1. CONSTANTS & DATA
   ========================================================================== */

/* --------------------------------------------------------------------------
   Persistence layer
   -------------------------------------------------------------------------- */

const STORAGE_KEY = "techDevLab.v3"; // v3, not v2: see header comment

const DEFAULT_STATE = {
  xp: 0, level: 1, streak: 0, bestStreak: 0,
  muted: true, activeLayer: "electrical", fieldNotes: [],
  skillRadar: { electrical: 0, instrumentation: 0, plc: 0, programming: 0 },
};

function num(v, fallback) {
  return typeof v === "number" && Number.isFinite(v) ? v : fallback;
}

function load() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return DEFAULT_STATE;
    const p = JSON.parse(raw) || {};
    const xp = Math.max(0, num(p.xp, 0));
    const radar = p.skillRadar || {};
    return {
      ...DEFAULT_STATE,
      xp,
      level: levelOf(xp),
      streak: num(p.streak, 0),
      bestStreak: num(p.bestStreak, 0),
      muted: typeof p.muted === "boolean" ? p.muted : true,
      activeLayer: LAYERS.some(l => l.id === p.activeLayer) ? p.activeLayer : "electrical",
      fieldNotes: Array.isArray(p.fieldNotes) ? p.fieldNotes : [],
      skillRadar: {
        electrical: num(radar.electrical, 0),
        instrumentation: num(radar.instrumentation, 0),
        plc: num(radar.plc, 0),
        programming: num(radar.programming, 0),
      },
    };
  } catch (e) {
    return DEFAULT_STATE;
  }
}

function save(state) {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  } catch (e) {
    // Storage full or blocked: the session keeps working in memory.
  }
}

// Per-tool state lives under dotted sub-keys of STORAGE_KEY (techDevLab.v3.<tool>).
// Tool keys outside that prefix are listed here so Reset clears them too.
const EXTRA_TOOL_KEYS = ["techDevLab.v2.trapSpotter"];

function loadTool(key) {
  try {
    const raw = localStorage.getItem(key);
    return raw ? JSON.parse(raw) : null;
  } catch (e) {
    return null;
  }
}

function saveTool(key, value) {
  try {
    localStorage.setItem(key, JSON.stringify(value));
  } catch (e) {
    // Same as save(): keep working in memory.
  }
}

function clearToolStorage() {
  try {
    Object.keys(localStorage)
      .filter(k => k !== THEME_KEY && (k.startsWith(STORAGE_KEY + ".") || EXTRA_TOOL_KEYS.includes(k)))
      .forEach(k => localStorage.removeItem(k));
  } catch (e) {
    // Nothing stored, or storage blocked.
  }
}

/* --------------------------------------------------------------------------
   Game math
   -------------------------------------------------------------------------- */

// Minimum XP for levels 1-6.
const LEVEL_XP = [0, 150, 400, 800, 1300, 1900];
const TITLES = ["Helper", "Apprentice", "Technician", "Senior Tech", "Lead Tech", "Controls Engineer"];

function levelOf(xp) {
  let level = 1;
  for (let i = 0; i < LEVEL_XP.length; i++) {
    if (xp >= LEVEL_XP[i]) level = i + 1;
  }
  return level;
}

function titleOf(level) {
  const i = Math.min(Math.max(level, 1), TITLES.length) - 1;
  return TITLES[i];
}

// Skill radar gain per first-pass correct answer (radar axes run 0-100).
const RADAR_STEP = 0.4;

function awardXP(state, n) {
  const xp = Math.max(0, state.xp + n);
  return { ...state, xp, level: levelOf(xp) };
}

function addFieldNote(state, entry) {
  const note = { ...entry, at: new Date().toISOString() };
  return { ...state, fieldNotes: [note, ...state.fieldNotes] };
}

/* ==========================================================================
   2. SHARED UI COMPONENTS
   ========================================================================== */

const MotionCtx = createContext(false); // true = prefers-reduced-motion

function useReducedMotion() {
  return useContext(MotionCtx);
}

function useMediaQuery(query) {
  const get = () => (window.matchMedia ? window.matchMedia(query).matches : false);
  const [matches, setMatches] = useState(get);
  useEffect(() => {
    if (!window.matchMedia) return;
    const mql = window.matchMedia(query);
    const onChange = () => setMatches(mql.matches);
    onChange();
    if (mql.addEventListener) mql.addEventListener("change", onChange);
    else mql.addListener(onChange);
    return () => {
      if (mql.removeEventListener) mql.removeEventListener("change", onChange);
      else mql.removeListener(onChange);
    };
  }, [query]);
  return matches;
}

function transition(reduced, props) {
  if (reduced) return "none";
  return props.map(p => `${p} ${DUR_SLOW - 80}ms ease-out`).join(", ");
}

function glow(color) {
  return `0 0 0 1px ${color}, 0 0 14px ${color}40`;
}

function Panel({ children, source, style, ...rest }) {
  const C = useC();
  return (
    <section
      {...rest}
      style={{
        background: C.panel,
        border: `1px solid ${C.border}`,
        borderRadius: 6,
        padding: 20,

    >
      {children}
      {source !== undefined && (
        <footer
          style={{
            marginTop: 20,

            fontFamily: MONO_FONT,
            fontSize: 11,
            color: C.text_dim,

      )}

}

// Engraved label plate: uppercase, letter-spacing 2px.
function H({ children, as: Tag = "h2", color: colorProp, style }) {
  const C = useC();
  const color = colorProp ?? C.text_mute;
  return (
    <Tag
      style={{
        margin: 0,
        fontFamily: HEAD_FONT,
        fontWeight: 700,
        fontSize: 11,
        letterSpacing: "2px",
        textTransform: "uppercase",
        color,
        ...style,
      }}
    >
      {children}
    </Tag>
  );
}

function Btn({ children, onClick, variant = "primary", color: colorProp, ariaLabel, pressed, style, ...rest }) {
  const C = useC();
  const color = colorProp ?? C.signal_cyan;
  const reduced = useReducedMotion();
  const [hover, setHover] = useState(false);
  const primary = variant === "primary";
  const active = pressed === true;
  return (
    <button
      type="button"
      onClick={onClick}
      aria-label={ariaLabel}
      aria-pressed={pressed}
      onMouseEnter={() => setHover(true)}
      onMouseLeave={() => setHover(false)}
      style={{
        minHeight: TOUCH_MIN,
        minWidth: TOUCH_MIN,
        padding: "0 16px",
        borderRadius: 4,
        border: `1px solid ${primary || active ? color : C.border}`,
        background: primary ? `${color}1a` : active ? `${color}14` : "transparent",
        color: primary || active ? color : C.text_mute,
        fontFamily: UI_FONT,
        fontWeight: 600,
        fontSize: 13,
        cursor: rest.disabled ? "default" : "pointer",
        opacity: rest.disabled ? 0.5 : 1,
        boxShadow: active || (hover && primary && !rest.disabled) ? glow(color) : "none",
        transition: transition(reduced, ["box-shadow", "background", "border-color", "color"]),
        ...style,
      }}
      {...rest}
    >
      {children}
    </button>
  );
}

function Radar({ values, size = 56 }) {
  const C = useC();
  const axes = ["electrical", "instrumentation", "plc", "programming"];
  const labels = { electrical: "Electrical", instrumentation: "Instrumentation", plc: "PLC", programming: "Programming" };
  const c = size / 2;
  const r = c - 4;
  // Axis order: up, right, down, left.
  const dirs = [[0, -1], [1, 0], [0, 1], [-1, 0]];
  const pt = (i, frac) => `${c + dirs[i][0] * r * frac},${c + dirs[i][1] * r * frac}`;
  const ring = frac => axes.map((_, i) => pt(i, frac)).join(" ");
  const shape = axes.map((a, i) => pt(i, Math.min(Math.max(values[a] || 0, 0), 100) / 100)).join(" ");
  const summary = axes.map(a => `${labels[a]} ${values[a] || 0}`).join(", ");
  return (
    <svg width={size} height={size} role="img" aria-label={`Skill radar: ${summary}`}>
      <title>{`Skill radar: ${summary}`}</title>
      {[1 / 3, 2 / 3, 1].map(f => (
        <polygon key={f} points={ring(f)} fill="none" stroke={C.border} strokeWidth="1" />
      ))}
      {axes.map((_, i) => (
        <line key={i} x1={c} y1={c} x2={c + dirs[i][0] * r} y2={c + dirs[i][1] * r} stroke={C.border} strokeWidth="1" />
      ))}
      <polygon points={shape} fill={`${C.signal_cyan}40`} stroke={C.signal_cyan} strokeWidth="1.5" />
    </svg>
  );
}

/* --------------------------------------------------------------------------
   Tool 3.4: Symptom -> First Move
   One operator report, four first moves. Pick, see the consequence, retry.
   Content: output/content-library.json (symptoms with sourced options).
   Tags and services are constructed for training (tagDerived); everything
   else is quoted from the cited source.
   -------------------------------------------------------------------------- */

const CHAIN = ["Process", "Sensor", "Transmitter", "Wiring", "Card", "Controller", "Display"];

// content library's cost tags, not field facts.
const COST_CONSEQUENCE = {

  endnode: { title: "Far end checked first.", text: "Everything between this point and the fault is still unproven." },
  premature: { title: "Right check, wrong time.", text: "Earlier checks would have cut the chain first." },

};

 {

const SFM_BY_ID = Object.fromEntries(SFM_SYMPTOMS.map(s => [s.id, s]));

function shuffled(list) {
  const a = list.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function capFirst(text) {
  return text.charAt(0).toUpperCase() + text.slice(1);
}

// Round-robin across answer patterns, so a pattern comes back a few cards later
// in a different symptom instead of back-to-back.
function sfmDeck() {
  const groups = {};
  SFM_SYMPTOMS.forEach(s => {
    (groups[s.pattern] = groups[s.pattern] || []).push(s.id);
  });
  const lists = shuffled(Object.values(groups)).map(shuffled);
  const deck = [];
  while (lists.some(l => l.length)) {
    lists.forEach(l => {
      if (l.length) deck.push(l.shift());
    });
  }
  return deck;
}

function sfmDeal(deck, pos) {
  const s = SFM_BY_ID[deck[pos]];
  return { deck, pos, order: s ? shuffled(s.options.map((_, i) => i)) : [], tried: [], solved: false };
}

// "played" holds every card id already solved, so a replay (a new deck, or a
// recalled card) is detectable and earns no XP. Reset progress clears it.
function sfmFresh(log, played) {
  return { ...sfmDeal(sfmDeck(), 0), log: log || [], played: played || [], stats: { played: 0, firstTry: 0 } };
}

function sfmLoad() {
  const t = loadTool(SFM_KEY);
  const valid =
    t && Array.isArray(t.deck) && t.deck.length && t.deck.every(id => SFM_BY_ID[id]) &&
    typeof t.pos === "number" && Array.isArray(t.order) && Array.isArray(t.tried);
  const log = t && Array.isArray(t.log) ? t.log : [];
  const played = t && Array.isArray(t.played) ? t.played : [];
  if (!valid) return sfmFresh(log, played);
  return { ...t, log, played, stats: t.stats || { played: 0, firstTry: 0 } };
}

// A first-pick miss brings the same pattern back SFM_RECALL_GAP cards later,
// in a different symptom when one exists.
function sfmScheduleRecall(deck, pos, symptom) {
  const siblings = SFM_SYMPTOMS.filter(s => s.pattern === symptom.pattern && s.id !== symptom.id);
  const pick = siblings.length ? siblings[Math.floor(Math.random() * siblings.length)].id : symptom.id;
  const at = Math.min(pos + 1 + SFM_RECALL_GAP, deck.length);
  return [...deck.slice(0, at), pick, ...deck.slice(at)];
}

function SignalChain({ cut, basis, lead = "This move cleared" }) {

          const color = cleared ? C.lime : C.amber;
          return (
            <li key={link} style={{ display: "flex", alignItems: "center", gap: 6 }} aria-label={`${link}: ${cleared ? "cleared" : "suspect"}`}>
              <div
                style={{

                <div style={{ fontFamily: MONO_FONT, fontSize: 9, letterSpacing: "1px", color }}>{cleared ? "CLEARED" : "SUSPECT"}</div>

}

// Evidence trail shared by the decision tools: the latest 8 solved cards.
// cells(row) returns the first two columns; Tries and First pick are common.

function SymptomFirstMove({ onResult, onStep }) {
  const C = useC();
  const [t, setT] = useState(sfmLoad);
  const [choosing, setChoosing] = useState(false);
  useEffect(() => setChoosing(false), [t.pos]);
  const ribbonStep = t.pos >= t.deck.length ? null : t.solved ? 5 : choosing || t.tried.length ? 4 : 1;
  useEffect(() => {
    if (onStep) onStep(ribbonStep);
  }, [ribbonStep]);
  const headRef = useRef(null);
  const moved = useRef(false);

  useEffect(() => saveTool(SFM_KEY, t), [t]);
  useEffect(() => {
    if (moved.current && headRef.current) headRef.current.focus();
    moved.current = false;
  }, [t.pos]);

  const done = t.pos >= t.deck.length;
  const card = done ? null : SFM_BY_ID[t.deck[t.pos]];
  const correctIdx = card ? card.options.findIndex(o => o.correct) : -1;
  const lastPick = t.tried[t.tried.length - 1];

  const pick = idx => {
    if (!card || t.solved || t.tried.includes(idx)) return;
    const tried = [...t.tried, idx];
    const option = card.options[idx];
    let { deck, log, stats, played } = t;
    if (!option.correct && t.tried.length === 0) deck = sfmScheduleRecall(deck, t.pos, card);
    if (option.correct) {
      const attempts = tried.length;
      const first = card.options[tried[0]].text;
      const fresh = !played.includes(card.id);
      if (fresh) played = [...played, card.id];
      log = [{ id: card.id, tag: card.tag, symptom: card.symptom, attempts, first, at: new Date().toISOString() }, ...log];
      stats = { played: stats.played + 1, firstTry: stats.firstTry + (attempts === 1 ? 1 : 0) };
      onResult({
        xp: fresh ? SFM_XP_BY_ATTEMPT[attempts - 1] || 0 : 0,
        firstTry: attempts === 1,
        firstPass: fresh && attempts === 1,
        note: { tool: "3.4", tag: card.tag, text: `Symptom → First Move ${card.tag}: ${capFirst(option.text)} — ${option.reason}` },
      });
    }
    setT({ ...t, deck, tried, solved: option.correct, log, stats, played });
  };

  const next = () => {
    moved.current = true;
    setT(s => ({ ...s, ...sfmDeal(s.deck, s.pos + 1) }));
  };

  const restart = () => {
    moved.current = true;
    setT(s => sfmFresh(s.log, s.played));
  };

  useEffect(() => {
    const onKey = e => {
      if (e.altKey || e.ctrlKey || e.metaKey) return;
      const tag = e.target.tagName;
      if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT") return;
      if (/^[1-4]$/.test(e.key) && card && !t.solved) {
        const idx = t.order[Number(e.key) - 1];
        if (idx !== undefined) {
          e.preventDefault();
          pick(idx);
        }
      } else if (e.key === "Enter" && t.solved && tag !== "BUTTON") {
        e.preventDefault();
        next();
      }
    };
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  });

  const progress = (
    <div style={{ display: "flex", flexWrap: "wrap", gap: 8, alignItems: "center" }}>
      <Chip color={C.signal_cyan}>CARD {Math.min(t.pos + 1, t.deck.length)} / {t.deck.length}</Chip>
      <Chip color={C.lime}>FIRST TRY {t.stats.firstTry} / {t.stats.played}</Chip>
      <span style={{ fontSize: 12, color: C.text_dim }}>Keys: 1-4 choose, Enter next</span>
    </div>
  );

  if (done) {
    return (
      <div style={{ display: "grid", gap: 20 }}>
        {progress}
        <Verdict ok title="Deck complete">
          {t.stats.firstTry} of {t.stats.played} cards solved on the first move. Missed patterns came back as new symptoms.
        </Verdict>
        <div>
          <Btn onClick={restart} ariaLabel="Deal a new deck">Deal a new deck</Btn>
        </div>
        <DecisionLog
        title="First-move log"
        headers={["Tag", "Symptom"]}
        log={t.log}
        cells={r => [r.tag, r.symptom]}
        empty="Each solved card is logged here and in Field Notes."
      />
      </div>
    );
  }

  const correct = card.options[correctIdx];
  const wrong = lastPick !== undefined && !t.solved ? card.options[lastPick] : null;
  const consequence = wrong ? COST_CONSEQUENCE[wrong.cost] || COST_FALLBACK : null;

  return (
    <div style={{ display: "grid", gap: 20 }}>
      {progress}

      <section aria-labelledby="sfm-symptom">
        <div style={{ display: "flex", flexWrap: "wrap", gap: 8, alignItems: "center" }}>
          <Chip color={C.signal_cyan}>{card.tag}</Chip>
          <span style={{ fontSize: 13, color: C.text_mute }}>{card.service}</span>
          <Chip color={C.text_dim}>TAG + SERVICE CONSTRUCTED FOR TRAINING</Chip>
        </div>
        <H as="h3" style={{ marginTop: 16 }}>Operator report</H>
        <p
          id="sfm-symptom"
          ref={headRef}
          tabIndex={-1}
          style={{ margin: "6px 0 0", fontFamily: HEAD_FONT, fontWeight: 700, fontSize: 22, letterSpacing: "-0.02em", color: C.text, outline: "none" }}
        >
          {card.symptom}
        </p>
        <Cites cites={[card.source]} />
      </section>

      <SignalChain cut={t.solved ? correct.cut : null} basis={t.solved ? correct.cutBasis : ""} />

      <div role="group" aria-labelledby="sfm-ask" onMouseEnter={() => setChoosing(true)} onFocus={() => setChoosing(true)}>
        <H as="h3" style={{ marginBottom: 10 }}>
          <span id="sfm-ask">Your first move</span>
        </H>
        <div style={{ display: "grid", gap: 8 }}>
          {t.order.map((idx, i) => {
            const state = t.solved ? (idx === correctIdx ? "hit" : "locked") : t.tried.includes(idx) ? "miss" : "idle";
            return <OptionButton key={idx} n={i + 1} option={card.options[idx]} state={state} onPick={() => pick(idx)} />;
          })}
        </div>
      </div>

      <div aria-live="polite">
        {wrong && (
          <Verdict key={lastPick} ok={false} title={consequence.title}>
            <p style={{ margin: 0 }}>{consequence.text}</p>
            <p style={{ margin: "8px 0 0", color: C.text_mute }}>{wrong.reason}</p>
            <Cites cites={wrong.cites} />
            <p style={{ margin: "10px 0 0", fontWeight: 600 }}>Rewind. Pick again.</p>
          </Verdict>
        )}
        {t.solved && (
          <div style={{ display: "grid", gap: 16 }}>
            <Verdict ok title={t.tried.length === 1 ? "First move, first try." : `Found on try ${t.tried.length}.`}>
              <p style={{ margin: 0 }}>{correct.reason}</p>
              <Cites cites={correct.cites} />
              <p style={{ margin: "10px 0 0", color: C.text_mute }}>
                Pattern: <span style={{ fontFamily: MONO_FONT, color: C.signal_cyan }}>{card.pattern}</span>
              </p>
            </Verdict>
            <div>
              <H as="h3">The other moves</H>
              <ul style={{ margin: "10px 0 0", padding: 0, listStyle: "none", display: "grid", gap: 12 }}>
                {card.options.map((o, i) =>
                  o.correct ? null : (
                    <li key={i} style={{ borderLeft: `2px solid ${C.rose}55`, paddingLeft: 12 }}>
                      <div style={{ fontSize: 14, color: C.text }}>
                        {capFirst(o.text)} <Chip color={C.rose} style={{ marginLeft: 6 }}>{(o.cost || "").toUpperCase()}</Chip>
                      </div>
                      <div style={{ fontSize: 13, color: C.text_mute, marginTop: 4 }}>{o.reason}</div>
                      <Cites cites={o.cites} />
                    </li>
                  )
                )}
              </ul>
            </div>
            <div>
              <Btn onClick={next} ariaLabel="Next card">Next card</Btn>
            </div>
          </div>
        )}
      </div>

      <DecisionLog
        title="First-move log"
        headers={["Tag", "Symptom"]}
        log={t.log}
        cells={r => [r.tag, r.symptom]}
        empty="Each solved card is logged here and in Field Notes."
      />
    </div>
  );
}

function tsDeal(deck, pos) {
  const trap = TS_BY_ID[deck[pos]];
  if (!trap) return { deck, pos, choices: [], tried: [], solved: false };
  const others = shuffled(TS_TRAPS.filter(t => t.id !== trap.id)).slice(0, 3).map(t => t.id);
  return { deck, pos, choices: shuffled([trap.id, ...others]), tried: [], solved: false };
}

// "played" works as in tool 3.4: replays earn no XP until Reset progress.
function tsFresh(log, played) {
  return { ...tsDeal(shuffled(TS_TRAPS.map(t => t.id)), 0), log: log || [], played: played || [], stats: { played: 0, firstTry: 0 } };
}

function tsLoad() {
  const t = loadTool(TS_KEY) || loadTool(TS_OLD_KEY);
  const valid =
    t && Array.isArray(t.deck) && t.deck.length && t.deck.every(id => TS_BY_ID[id]) &&
    typeof t.pos === "number" && Array.isArray(t.choices) && t.choices.every(id => TS_BY_ID[id]) &&
    Array.isArray(t.tried);
  const log = t && Array.isArray(t.log) ? t.log : [];
  const played = t && Array.isArray(t.played) ? t.played : [];
  if (!valid) return tsFresh(log, played);
  return { ...t, log, played, stats: t.stats || { played: 0, firstTry: 0 } };
}

// A first-pick miss brings the same trap back TS_RECALL_GAP cards later.
function tsScheduleRecall(deck, pos, id) {
  const at = Math.min(pos + 1 + TS_RECALL_GAP, deck.length);
  return [...deck.slice(0, at), id, ...deck.slice(at)];
}

function TrapSpotter({ onResult }) {
  const C = useC();
  const [t, setT] = useState(tsLoad);
  const headRef = useRef(null);
  const moved = useRef(false);

  useEffect(() => saveTool(TS_KEY, t), [t]);
  useEffect(() => {
    if (moved.current && headRef.current) headRef.current.focus();
    moved.current = false;
  }, [t.pos]);

  const done = t.pos >= t.deck.length;
  const trap = done ? null : TS_BY_ID[t.deck[t.pos]];
  const lastPick = t.tried[t.tried.length - 1];

  const pick = id => {
    if (!trap || t.solved || t.tried.includes(id)) return;
    const tried = [...t.tried, id];
    const ok = id === trap.id;
    let { deck, log, stats, played } = t;
    if (!ok && t.tried.length === 0) deck = tsScheduleRecall(deck, t.pos, trap.id);
    if (ok) {
      const attempts = tried.length;
      const first = TS_BY_ID[tried[0]].trap;
      const fresh = !played.includes(trap.id);
      if (fresh) played = [...played, trap.id];
      log = [{ id: trap.id, trap: trap.trap, attempts, first, at: new Date().toISOString() }, ...log];
      stats = { played: stats.played + 1, firstTry: stats.firstTry + (attempts === 1 ? 1 : 0) };
      onResult({
        xp: fresh ? TS_XP_BY_ATTEMPT[attempts - 1] || 0 : 0,
        firstTry: attempts === 1,
        firstPass: fresh && attempts === 1,
        note: { tool: "1.4", text: `Trap Spotter: ${trap.trap} — ${trap.fix}` },
      });
    }
    setT({ ...t, deck, tried, solved: ok, log, stats, played });
  };

  const next = () => {
    moved.current = true;
    setT(s => ({ ...s, ...tsDeal(s.deck, s.pos + 1) }));
  };

  const restart = () => {
    moved.current = true;
    setT(s => tsFresh(s.log, s.played));
  };

  useEffect(() => {
    const onKey = e => {
      if (e.altKey || e.ctrlKey || e.metaKey) return;
      const tag = e.target.tagName;
      if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT") return;
      if (/^[1-4]$/.test(e.key) && trap && !t.solved) {
        const id = t.choices[Number(e.key) - 1];
        if (id !== undefined) {
          e.preventDefault();
          pick(id);
        }
      } else if (e.key === "Enter" && t.solved && tag !== "BUTTON") {
        e.preventDefault();
        next();
      }
    };
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  });

  const progress = (
    <div style={{ display: "flex", flexWrap: "wrap", gap: 8, alignItems: "center" }}>
      <Chip color={C.signal_cyan}>CARD {Math.min(t.pos + 1, t.deck.length)} / {t.deck.length}</Chip>
      <Chip color={C.lime}>FIRST TRY {t.stats.firstTry} / {t.stats.played}</Chip>
      <span style={{ fontSize: 12, color: C.text_dim }}>Keys: 1-4 choose, Enter next</span>
    </div>
  );

  const log = (
    <DecisionLog
      title="Trap log"
      headers={["Trap", "Scenario"]}
      log={t.log}
      cells={r => [r.id.replace("trap-", "T"), r.trap]}
      empty="Each solved card is logged here and in Field Notes."
    />
  );

  if (done) {
    return (
      <div style={{ display: "grid", gap: 20 }}>
        {progress}
        <Verdict ok title="Deck complete">
          {t.stats.firstTry} of {t.stats.played} traps named on the first pick. Missed traps came back later in the deck.
        </Verdict>
        <div>
          <Btn onClick={restart} ariaLabel="Deal a new deck">Deal a new deck</Btn>
        </div>
        {log}
      </div>
    );
  }

  const wrong = lastPick !== undefined && !t.solved ? TS_BY_ID[lastPick] : null;

  return (
    <div style={{ display: "grid", gap: 20 }}>
      {progress}

      <section aria-labelledby="ts-scenario">
        <H as="h3">Field scenario</H>
        <p
          id="ts-scenario"
          ref={headRef}
          tabIndex={-1}
          style={{ margin: "6px 0 0", fontFamily: HEAD_FONT, fontWeight: 700, fontSize: 22, letterSpacing: "-0.02em", color: C.text, outline: "none" }}
        >
          {trap.looksLike}
        </p>
        <Cites cites={[trap.source]} />
      </section>

      <div role="group" aria-labelledby="ts-ask">
        <H as="h3" style={{ marginBottom: 10 }}>
          <span id="ts-ask">Which trap is this?</span>
        </H>
        <div style={{ display: "grid", gap: 8 }}>
          {t.choices.map((id, i) => {
            const state = t.solved ? (id === trap.id ? "hit" : "locked") : t.tried.includes(id) ? "miss" : "idle";
            return <OptionButton key={id} n={i + 1} option={{ text: TS_BY_ID[id].trap }} state={state} onPick={() => pick(id)} />;
          })}
        </div>
      </div>

      <div aria-live="polite">
        {wrong && (
          <Verdict key={lastPick} ok={false} title="Different trap.">
            <p style={{ margin: 0 }}>
              "{wrong.trap}" looks like this:
            </p>
            <p style={{ margin: "6px 0 0", color: C.text_mute }}>{wrong.looksLike}</p>
            <Cites cites={[wrong.source]} />
            <p style={{ margin: "10px 0 0", fontWeight: 600 }}>Rewind. Pick again.</p>
          </Verdict>
        )}
        {t.solved && (
          <div style={{ display: "grid", gap: 16 }}>
            <Verdict ok title={t.tried.length === 1 ? "Trap named, first try." : `Found on try ${t.tried.length}.`}>
              <H as="h4" color={C.lime}>The fix</H>
              <p style={{ margin: "6px 0 0" }}>{trap.fix}</p>
              <Cites cites={[trap.source]} />
            </Verdict>
            <div>
              <H as="h3">The other choices</H>
              <ul style={{ margin: "10px 0 0", padding: 0, listStyle: "none", display: "grid", gap: 12 }}>
                {t.choices
                  .filter(id => id !== trap.id)
                  .map(id => (
                    <li key={id} style={{ borderLeft: `2px solid ${C.rose}55`, paddingLeft: 12 }}>
                      <div style={{ fontSize: 14, color: C.text }}>{TS_BY_ID[id].trap}</div>
                      <div style={{ fontSize: 13, color: C.text_mute, marginTop: 4 }}>Looks like: {TS_BY_ID[id].looksLike}</div>
                      <Cites cites={[TS_BY_ID[id].source]} />
                    </li>
                  ))}
              </ul>
            </div>
            <div>
              <Btn onClick={next} ariaLabel="Next card">Next card</Btn>
            </div>
          </div>
        )}
      </div>

      {log}
    </div>
  );
}

// One test point per chain link, in chain order.
const SPH_POINTS = [
  { id: "proc", name: "Process (independent indication)" },
  { id: "sens", name: "Sensor / process connection" },
  { id: "xmtr", name: "Transmitter terminals" },
  { id: "jb", name: "Junction box" },
  { id: "card", name: "Card input" },
  { id: "ctrl", name: "Controller PV" },
  { id: "hmi", name: "HMI display" },
];

// Cut quality: the Split-Half Log's Flag formula, in the sheet's order.
function sphCut(before, after) {
  const [isolated, nothing, weak, good] = SH.flags.map(f => f.label);
  if (after <= 1) return isolated;
  if (after >= before) return nothing;
  if (after > before * 0.75) return weak;
  return good;
}

function sphIsGoodCut(flag) {
  return flag === SH.flags[0].label || flag === SH.flags[3].label;
}

function sphReading(s, link) {
  const r = s.readings[SPH_POINTS[link].id];
  return r.statusGood ? r.good : r.bad;
}

function sphRound(idx, attempt) {
  return { idx, attempt, lo: 0, hi: CHAIN.length - 1, probes: [], guess: null, outcome: null };
}

function sphLoad() {
  try {
    localStorage.removeItem(SPH_OLD_KEY);
  } catch (e) {
    // storage blocked
  }
  const t = loadTool(SPH_KEY);
  const r = t && t.round;
  const valid =
    r && Number.isInteger(r.idx) && SPH_SCENARIOS[r.idx] && Number.isInteger(r.lo) && Number.isInteger(r.hi) &&
    Array.isArray(r.probes) && (r.attempt === 1 || r.attempt === 2);
  return { round: valid ? r : sphRound(0, 1), played: t && Array.isArray(t.played) ? t.played : [] };
}

function SphChain({ s, r, onProbe, canProbe }) {
  const C = useC();
  const reduced = useReducedMotion();
  const revealed = r.outcome && r.outcome.correct;
  return (
    <div style={{ overflowX: "auto", paddingBottom: 4 }}>
      <ol aria-label="Diagnostic chain" style={{ margin: 0, padding: 0, listStyle: "none", display: "flex", gap: 6, minWidth: 700 }}>
        {CHAIN.map((link, i) => {
          const probe = r.probes.find(p => p.link === i);
          const isFault = revealed && i === s.faultLink;
          const cleared = !isFault && (i < r.lo || i > r.hi);
          let color = C.text_mute;
          let status = "SUSPECT";
          if (probe) {
            color = probe.good ? C.lime : C.rose;
            status = probe.good ? "GOOD" : "BAD";
          } else if (cleared) {
            color = C.text_dim;
            status = "CLEARED";
          }
          if (isFault) {
            color = C.amber;
            status = "FAULT";
          }
          const clickable = canProbe && !probe;
          return (
            <li key={link} style={{ flex: 1, minWidth: 92 }}>
              <button
                type="button"
                onClick={() => onProbe(i)}
                disabled={!clickable}
                aria-label={`Probe ${i + 1}: ${link}, ${status}${probe ? `, reads ${probe.reading}` : ""}`}
                style={{
                  width: "100%",
                  minHeight: 76,
                  padding: "8px 8px",
                  textAlign: "left",
                  border: `1px solid ${color}`,
                  borderRadius: 4,
                  background: isFault ? `${C.amber}1f` : probe ? `${color}14` : C.bg,
                  boxShadow: isFault ? glow(C.amber) : "none",
                  opacity: cleared && !probe ? 0.55 : 1,
                  cursor: clickable ? "pointer" : "default",
                  transition: transition(reduced, ["border-color", "background", "opacity", "box-shadow"]),
                }}
              >
                <div style={{ fontFamily: MONO_FONT, fontSize: 10, color: C.text_dim }}>{i + 1}</div>
                <div style={{ fontFamily: MONO_FONT, fontSize: 12, color: C.text }}>{link}</div>
                <div style={{ fontFamily: MONO_FONT, fontSize: 9, letterSpacing: "1px", color }}>{status}</div>
                {probe && <div style={{ fontFamily: MONO_FONT, fontSize: 11, color, marginTop: 2 }}>{probe.reading}</div>}
              </button>
            </li>
          );
        })}
      </ol>
    </div>
  );
}

function SplitHalf({ onResult, onStep }) {
  const C = useC();
  const [t, setT] = useState(sphLoad);
  const headRef = useRef(null);
  const moved = useRef(false);
  const r = t.round;
  const s = SPH_SCENARIOS[r.idx];

  useEffect(() => saveTool(SPH_KEY, t), [t]);
  useEffect(() => {
    if (moved.current && headRef.current) headRef.current.focus();
    moved.current = false;
  }, [r.idx, r.attempt, r.probes.length === 0]);

  const used = r.probes.length;
  const canProbe = !r.outcome && used < SPH_BUDGET;
  const guessOpen = !r.outcome && used >= SPH_GUESS_AFTER;
  const processBad = r.probes.some(p => p.link === 0 && !p.good);
  const ribbonStep = r.outcome && r.outcome.correct ? 5 : guessOpen || r.outcome ? 4 : 3;
  useEffect(() => {
    if (onStep) onStep(ribbonStep);
  }, [ribbonStep]);

  const probe = link => {
    if (!canProbe || r.probes.some(p => p.link === link)) return;
    const good = s.readings[SPH_POINTS[link].id].statusGood;
    const lo = good ? Math.max(r.lo, link + 1) : r.lo;
    const hi = good ? r.hi : Math.min(r.hi, link);
    const before = r.hi - r.lo + 1;
    const after = hi - lo + 1;
    const p = { link, good, reading: sphReading(s, link), before, after, flag: sphCut(before, after) };
    setT({ ...t, round: { ...r, lo, hi, probes: [...r.probes, p] } });
  };

  const select = link => {
    if (guessOpen) setT({ ...t, round: { ...r, guess: link } });
  };

  const confirm = link => {
    if (r.outcome || link === null || link === undefined) return;
    const correct = link === s.faultLink;
    let played = t.played;
    if (correct) {
      const fresh = !played.includes(s.id);
      if (fresh) played = [...played, s.id];
      const firstPass = fresh && r.attempt === 1;
      onResult({
        xp: fresh ? (r.attempt === 1 ? SPH_XP_FIRST : SPH_XP_RETRY) : 0,
        firstTry: r.attempt === 1,
        firstPass,
        radar: SPH_RADAR,
        note: {
          tool: "2.4",
          tag: s.tag,
          text: s.isProcessFault
            ? `Split-Half Isolator ${s.tag}: no instrumentation fault, the process is the problem — ${s.faultDescription}`
            : `Split-Half Isolator ${s.tag}: fault isolated to ${CHAIN[s.faultLink]} — ${s.faultDescription}`,
        },
      });
    }
    setT({ ...t, played, round: { ...r, guess: link, outcome: { correct, link } } });
  };

  const go = (idx, attempt) => {
    moved.current = true;
    setT(x => ({ ...x, round: sphRound(idx, attempt) }));
  };
  const nextScenario = () => go((r.idx + 1) % SPH_SCENARIOS.length, 1);
  const retry = () => go(r.idx, 2);

  useEffect(() => {
    const onKey = e => {
      if (e.altKey || e.ctrlKey || e.metaKey) return;
      const tag = e.target.tagName;
      if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT") return;
      if (e.key === "Escape") {
        e.preventDefault();
        nextScenario();
        return;
      }
      if (/^[1-7]$/.test(e.key) && !r.outcome) {
        const link = Number(e.key) - 1;
        e.preventDefault();
        if (canProbe && !r.probes.some(p => p.link === link)) probe(link);
        else select(link);
        return;
      }
      if (e.key === "Enter" && tag !== "BUTTON") {
        if (!r.outcome && guessOpen && r.guess !== null) {
          e.preventDefault();
          confirm(r.guess);
        } else if (r.outcome) {
          e.preventDefault();
          nextScenario();
        }
      }
    };
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  });

  const last = r.probes[r.probes.length - 1];
  const f = s.faultLink;
  const bracket = f === 0
    ? [`${SPH_POINTS[0].name}: ${s.readings.proc.bad} (bad; normal is ${s.readings.proc.good})`]
    : [
        `${SPH_POINTS[f - 1].name}: ${s.readings[SPH_POINTS[f - 1].id].good} (good)`,
        `${SPH_POINTS[f].name}: ${s.readings[SPH_POINTS[f].id].bad} (bad)`,
      ];

  return (
    <div style={{ display: "grid", gap: 20 }}>
      <div style={{ display: "flex", flexWrap: "wrap", gap: 8, alignItems: "center" }}>
        <Chip color={C.signal_cyan}>{s.id}</Chip>
        <Chip color={C.lime}>SOLVED {t.played.length} / {SPH_SCENARIOS.length}</Chip>
        {r.attempt === 2 && <Chip color={C.amber}>RETRY: {SPH_XP_RETRY} XP</Chip>}
        <span style={{ fontSize: 12, color: C.text_dim }}>Keys: 1-7 probe or select, Enter confirm, Esc new scenario</span>
      </div>

      <section aria-labelledby="sph-report">
        <div style={{ display: "flex", flexWrap: "wrap", gap: 8, alignItems: "center" }}>
          <Chip color={C.signal_cyan}>{s.tag}</Chip>
          <span style={{ fontSize: 13, color: C.text_mute }}>{s.service}</span>
          <Chip color={C.amber}>RANGE {s.range}</Chip>
          <Chip color={C.text_dim}>SCENARIO CONSTRUCTED FOR TRAINING</Chip>
        </div>
        <p
          id="sph-report"
          ref={headRef}
          tabIndex={-1}
          style={{ margin: "12px 0 0", fontFamily: HEAD_FONT, fontWeight: 700, fontSize: 22, letterSpacing: "-0.02em", color: C.text, outline: "none" }}
        >
          Operator reports: reading does not match reality.
        </p>
        <Cites cites={[s.rangeSource, "Field Troubleshooting Template Pack.pdf p.4 (mA values and EU formula)"]} />
      </section>

      <div>
        <div style={{ display: "flex", flexWrap: "wrap", gap: 8, alignItems: "center", marginBottom: 10 }}>
          <H as="h3">Diagnostic chain</H>
          <Chip color={used >= SPH_BUDGET ? C.rose : C.signal_cyan}>
            {used} / {SPH_BUDGET} probes used
          </Chip>
          <Chip color={C.amber}>{r.hi - r.lo + 1} suspect</Chip>
        </div>
        <SphChain s={s} r={r} onProbe={probe} canProbe={canProbe} />
      </div>

      <div aria-live="polite">
        {last && !r.outcome && (
          <Verdict key={used} ok={sphIsGoodCut(last.flag)} title={last.flag}>
            <p style={{ margin: 0 }}>
              {SPH_POINTS[last.link].name} reads <span style={{ fontFamily: MONO_FONT }}>{last.reading}</span>:{" "}
              {last.good ? "good" : "bad"}. Suspects {last.before} &rarr; {last.after}.
            </p>
            {!sphIsGoodCut(last.flag) && <p style={{ margin: "8px 0 0", color: C.text_mute }}>{SH.rule}</p>}
            <Cites cites={[`${SH.sources[1]}, Flag column`].concat(sphIsGoodCut(last.flag) ? [] : [SH.sources[0]])} />
          </Verdict>
        )}
        {processBad && !r.outcome && (
          <div style={{ marginTop: 12 }}>
            <Btn color={C.amber} onClick={() => confirm(0)} ariaLabel="Stop: this is not an instrumentation fault">
              STOP: this is not an instrumentation fault
            </Btn>
          </div>
        )}
        {r.outcome && r.outcome.correct && (
          <Verdict ok title={s.isProcessFault ? "Not an instrumentation fault." : `Fault found: ${CHAIN[f]}`}>
            {s.isProcessFault && (
              <p style={{ margin: "0 0 8px" }}>The loop is telling the truth. Stop probing and tell operations the process is the problem.</p>
            )}
            <p style={{ margin: 0, color: C.text_mute }}>Bracket that proves it:</p>
            <ul style={{ margin: "4px 0 0", paddingLeft: 18 }}>
              {bracket.map(b => (
                <li key={b} style={{ fontFamily: MONO_FONT, fontSize: 13 }}>{b}</li>
              ))}
            </ul>
            <p style={{ margin: "10px 0 0" }}>
              <span style={{ color: C.text_mute }}>{s.faultCategory}: </span>
              {s.faultDescription}
            </p>
            <Cites cites={[s.faultSource]} />
          </Verdict>
        )}
        {r.outcome && !r.outcome.correct && (
          <Verdict ok={false} title={`Not ${CHAIN[r.outcome.link]}.`}>
            <p style={{ margin: 0, color: C.text_mute }}>The correct bracket:</p>
            <ul style={{ margin: "4px 0 0", paddingLeft: 18 }}>
              {bracket.map(b => (
                <li key={b} style={{ fontFamily: MONO_FONT, fontSize: 13 }}>{b}</li>
              ))}
            </ul>
            <p style={{ margin: "10px 0 0", fontWeight: 600 }}>Run it again for {SPH_XP_RETRY} XP.</p>
          </Verdict>
        )}
        {r.outcome && (
          <div style={{ display: "flex", flexWrap: "wrap", gap: 10, marginTop: 12 }}>
            {!r.outcome.correct && <Btn onClick={retry} ariaLabel="Retry this scenario">Retry ({SPH_XP_RETRY} XP)</Btn>}
            <Btn variant={r.outcome.correct ? "primary" : "ghost"} onClick={nextScenario} ariaLabel="Next scenario">Next scenario</Btn>
          </div>
        )}
      </div>

      {guessOpen && (
        <div role="group" aria-labelledby="sph-guess">
          <H as="h3" color={C.amber} style={{ marginBottom: 10 }}>
            <span id="sph-guess">Where is the fault?</span>
          </H>
          <div style={{ display: "flex", flexWrap: "wrap", gap: 8 }}>
            {CHAIN.map((link, i) => (
              <Btn
                key={link}
                variant="ghost"
                color={C.amber}
                pressed={r.guess === i}
                onClick={() => select(i)}
                ariaLabel={`Fault at ${link}`}
              >
                <span style={{ fontFamily: MONO_FONT, marginRight: 6 }}>{i + 1}</span>
                {link}
              </Btn>
            ))}
          </div>
          <div style={{ marginTop: 10 }}>
            <Btn color={C.amber} onClick={() => confirm(r.guess)} ariaLabel="Confirm fault location" disabled={r.guess === null}>
              Confirm {r.guess === null ? "" : CHAIN[r.guess]}
            </Btn>
          </div>
        </div>
      )}

      <div>
        <H as="h3">Split-half log</H>
        {r.probes.length === 0 ? (
          <p style={{ margin: "8px 0 0", fontSize: 13, color: C.text_mute }}>Each probe is logged here. Solved scenarios go to Field Notes.</p>
        ) : (
          <div style={{ overflowX: "auto", marginTop: 8 }}>
            <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 13 }}>
              <thead>
                <tr style={{ color: C.text_dim, textAlign: "left" }}>
                  {["Step", "Measure At", "Actual", "Good/Bad", "Cut Quality", "Remaining"].map(h => (
                    <th key={h} scope="col" style={{ padding: "4px 8px", fontWeight: 600, borderBottom: `1px solid ${C.border}` }}>{h}</th>
                  ))}
                </tr>
              </thead>
              <tbody>
                {r.probes.map((p, i) => (
                  <tr key={i}>
                    <td style={{ padding: "4px 8px", fontFamily: MONO_FONT, color: C.text_mute }}>{i + 1}</td>
                    <td style={{ padding: "4px 8px", color: C.text }}>{SPH_POINTS[p.link].name}</td>
                    <td style={{ padding: "4px 8px", fontFamily: MONO_FONT, color: C.signal_cyan, whiteSpace: "nowrap" }}>{p.reading}</td>
                    <td style={{ padding: "4px 8px", color: p.good ? C.lime : C.rose }}>{p.good ? "Good" : "Bad"}</td>
                    <td style={{ padding: "4px 8px", color: sphIsGoodCut(p.flag) ? C.lime : C.rose }}>{p.flag}</td>
                    <td style={{ padding: "4px 8px", fontFamily: MONO_FONT, color: C.text_mute }}>{p.after}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        )}
        <Cites cites={[`${SH.sources[0]}, Form 2 columns`, `${SH.sources[1]}, Flag formula`]} />
      </div>
    </div>
  );
}

// Faults 2 and 4 as named in the spec can't be built from these components
// (STOP has only its NC 11-12 contact) or wouldn't fail (OL between A2 and 0 V
// still opens the series coil path). The tool detects the miswires that do
// produce the spec's consequences and names them by what is actually wrong.
const WIL_QUIZ_NAME = {

  F4: "OL outside the CR coil path",
};
const WIL_SHOWN_CONSEQUENCE = {
  F2: "circuit cannot be stopped from the pushbutton.", // the spec's second clause; the first describes a NO STOP
};

// Test sequence run on Energize, from the spec's Operation section.
const WIL_SEQUENCE = [
  { action: "Power on", set: {}, expect: { cr: false } },
  { action: "Press START", set: { startPressed: true }, expect: { cr: true, m: true } },
  { action: "Release START", set: {}, expect: { cr: true, m: true } },
  { action: "Press STOP", set: { stopPressed: true }, expect: { cr: false, m: false } },
  { action: "Release STOP", set: {}, expect: { cr: false, m: false } },
  { action: "Press START", set: { startPressed: true }, expect: { cr: true, m: true } },
  { action: "Release START", set: {}, expect: { cr: true, m: true } },
  { action: "Trip OL", set: { olTripped: true }, expect: { cr: false, m: false } },
  { action: "Reset OL", set: {}, expect: { cr: false, m: false } },
];

// Internal connections of each component in a given state (spec component list).
function wilElements(s) {
  return [
    { a: "OL95", b: "OL96", closed: !s.olTripped }, // OL, NC
    { a: "S11", b: "S12", closed: !s.stopPressed }, // STOP, NC
    { a: "B13", b: "B14", closed: s.startPressed }, // START, NO
    { a: "CRa13", b: "CRa14", closed: s.cr }, // CR aux (seal-in), NO
    { a: "CR23", b: "CR24", closed: s.cr }, // CR load contact, NO
    { a: "D1A", b: "D1K", closed: true, oneWay: true }, // D1 conducts anode to cathode
  ];
}
const WIL_LOADS = { cr: ["CRA1", "CRA2"], m: ["MA1", "MA2"] };

function wilGraph(wires, s) {
  const adj = {};
  const add = (u, v, key) => (adj[u] = adj[u] || []).push({ to: v, key });
  wires.forEach(([u, v], i) => {
    add(u, v, "w" + i);
    add(v, u, "w" + i);
  });
  wilElements(s).forEach((e, i) => {
    if (!e.closed) return;
    add(e.a, e.b, "e" + i);
    if (!e.oneWay) add(e.b, e.a, "e" + i);
  });
  return adj;
}

function wilReach(adj, from, avoid) {
  const seen = new Set([from]);
  const queue = [from];
  while (queue.length) {
    const u = queue.shift();
    (adj[u] || []).forEach(({ to }) => {
      if (to !== avoid && !seen.has(to)) {
        seen.add(to);
        queue.push(to);
      }
    });
  }
  return seen;
}

// Keys of edges that lie on a path from `from` to `to`. An edge back into
// `from` or out of `to` can't be on a simple path.
function wilPathKeys(adj, from, to) {
  const keys = new Set();
  Object.entries(adj).forEach(([u, edges]) =>
    edges.forEach(({ to: v, key }) => {
      if (v === from || u === to) return;
      if (wilReach(adj, from, v).has(u) && wilReach(adj, v, u).has(to)) keys.add(key);
    })
  );
  return keys;
}

function wilLoadPath(adj, [a, b]) {
  const hot = wilReach(adj, "P+");
  if (hot.has(a) && wilReach(adj, b).has("P-")) return [a, b];
  if (hot.has(b) && wilReach(adj, a).has("P-")) return [b, a];
  return null;
}

// Settle the circuit for one set of inputs, starting from the previous relay
// states (that is what makes the seal-in latch).
function wilSolve(wires, inputs, prev) {
  let s = { ...inputs, cr: !!prev.cr, m: !!prev.m };
  if (!inputs.power) return { ...s, cr: false, m: false, short: false, flow: [], live: [] };
  for (let i = 0; i < 8; i++) {
    const adj = wilGraph(wires, s);
    const hot = wilReach(adj, "P+");
    if (hot.has("P-")) {
      return { ...s, cr: false, m: false, short: true, flow: [...wilPathKeys(adj, "P+", "P-")], live: [...hot] };
    }
    const crPath = wilLoadPath(adj, WIL_LOADS.cr);
    const mPath = wilLoadPath(adj, WIL_LOADS.m);
    const next = { cr: !!crPath, m: !!mPath };
    if (next.cr === s.cr && next.m === s.m) {
      const flow = new Set();
      [crPath, mPath].forEach(p => {
        if (!p) return;
        wilPathKeys(adj, "P+", p[0]).forEach(k => flow.add(k));
        wilPathKeys(adj, p[1], "P-").forEach(k => flow.add(k));
      });
      return { ...s, short: false, flow: [...flow], live: [...hot] };
    }
    s = { ...s, ...next };
  }
  return { ...s, short: false, flow: [], live: [] };
}

function wilRun(wires) {
  let prev = { cr: false, m: false };
  let inputs = { ...WIL_OFF, power: true };
  const runs = [];
  for (const step of WIL_SEQUENCE) {
    inputs = { ...WIL_OFF, power: true, olTripped: inputs.olTripped && step.action !== "Reset OL", ...step.set };
    const r = wilSolve(wires, inputs, prev);
    const pass = !r.short && Object.entries(step.expect).every(([k, v]) => r[k] === v);
    runs.push({
      action: step.action, expect: step.expect, pass,
      cr: r.cr, m: r.m, short: r.short, flow: r.flow, live: r.live,
      startPressed: inputs.startPressed, stopPressed: inputs.stopPressed, olTripped: inputs.olTripped,
    });
    if (r.short) break;
    prev = r;
  }
  return runs;
}

function wilNets(wires) {
  const parent = {};
  const find = x => (parent[x] === undefined || parent[x] === x ? (parent[x] = x) : (parent[x] = find(parent[x])));
  wires.forEach(([a, b]) => (parent[find(a)] = find(b)));
  return find;
}

function wilMatchesDrawing(wires) {
  const find = wilNets(wires);
  const ids = WIL.terminals.map(t => t.id);
  return ids.every(a => ids.every(b => (find(a) === find(b)) === (WIL_NET[a] === WIL_NET[b])));
}

// What the energize run shows, in the order a technician would hit it.
function wilDiagnose(wires, runs) {
  const find = wilNets(wires);
  const wired = id => wires.some(w => w.includes(id));
  const shorted = runs.find(r => r.short);
  if (shorted) return find("D1A") === find("CRA1") && find("D1K") === find("CRA2") ? "F3" : "SHORT";
  const [on0, start, release, stop, , start2, release2, ol] = runs;
  if (on0.cr) return "NO_START";
  if (!start.cr) return "OPEN";
  if (!release.cr) return wired("CRa13") || wired("CRa14") ? "F5" : "F1";
  if (stop.cr) return "F2";
  if (start2 && release2 && release2.cr && ol && ol.cr) return "F4";
  if (!start.m || !release.m) return "M_OPEN";
  if (stop.m) return "M_BYPASS";
  if (!runs.every(r => r.pass)) return "OTHER";
  if (!wilMatchesDrawing(wires)) return "NOT_AS_DRAWN";
  return "OK";
}

const WIL_MESSAGE = {
  SHORT: "+24 V reaches 0 V with no coil in the path: a short. The PSU folds back and nothing runs.",
  NO_START: "CR pulls in before START is pressed: START isn't the only way into the coil path.",
  OPEN: "CR never pulls in: there is no complete path from +24 V through the coil to 0 V.",
  M_OPEN: "CR pulls in but M doesn't: the contactor rung isn't complete.",
  M_BYPASS: "M stays on after CR drops out: M isn't switched by CR contact 23-24.",
  OTHER: "The circuit doesn't follow the operating sequence.",
  NOT_AS_DRAWN: "It runs and latches, but not as drawn.",
};

function wilLoad() {
  const t = loadTool(WIL_KEY);
  const ok = id => !!WIL_T[id];
  const wires = t && Array.isArray(t.wires) ? t.wires.filter(w => Array.isArray(w) && ok(w[0]) && ok(w[1])) : [];
  return {
    wires,
    awarded: t && Array.isArray(t.awarded) ? t.awarded : [],
    latched: !!(t && t.latched),
    identified: t && Array.isArray(t.identified) ? t.identified : [],
    runs: null,
    diag: null,
    quiz: null,
  };
}

function wilWireName(w) {
  return `${WIL_T[w[0]].name} to ${WIL_T[w[1]].name}`;
}

function WireItLive({ onResult }) {
  const C = useC();
  const reduced = useReducedMotion();
  const [t, setT] = useState(wilLoad);
  const [pending, setPending] = useState(null);
  const [inputs, setInputs] = useState(WIL_OFF);
  const [sim, setSim] = useState(() => wilSolve([], WIL_OFF, {}));
  const [phase, setPhase] = useState(null);
  const [from, setFrom] = useState("");
  const [to, setTo] = useState("");
  const [announce, setAnnounce] = useState("");
  const dragFrom = useRef(null);
  const dragged = useRef(false);

  useEffect(() => saveTool(WIL_KEY, { wires: t.wires, awarded: t.awarded, latched: t.latched, identified: t.identified }), [t]);

  const playing = phase !== null && t.runs;
  const view = playing ? t.runs[phase] : sim;
  const flow = new Set(view.flow);
  const live = new Set(view.live);

  const apply = (ni, wires = t.wires) => {
    setInputs(ni);
    setSim(s => wilSolve(wires, ni, s));
  };

  const changeWires = (wires, awarded, message) => {
    setT({ ...t, wires, awarded, runs: null, diag: null, quiz: null });
    setPhase(null);
    setInputs(WIL_OFF);
    setSim(wilSolve(wires, WIL_OFF, {}));
    setAnnounce(message);
  };

  const addWire = (a, b) => {
    if (!a || !b || a === b) return;
    if (t.wires.some(([u, v]) => (u === a && v === b) || (u === b && v === a))) {
      setAnnounce(`${WIL_T[a].name} and ${WIL_T[b].name} are already wired.`);
      return;
    }
    let awarded = t.awarded;
    const net = WIL_NET[a];
    if (net === WIL_NET[b]) {
      const key = [a, b].sort().join("|");
      const inNet = awarded.filter(k => WIL_NET[k.split("|")[0]] === net).length;
      if (!awarded.includes(key) && inNet < WIL.targetNets[net].length - 1) {
        awarded = [...awarded, key];
        onResult({ xp: WIL_XP_WIRE });
      }
    }
    changeWires([...t.wires, [a, b]], awarded, `Wire added: ${WIL_T[a].name} to ${WIL_T[b].name}.`);
  };

  const deleteWire = i => {
    const w = t.wires[i];
    changeWires(t.wires.filter((_, j) => j !== i), t.awarded, `Wire removed: ${wilWireName(w)}.`);
  };

  const clearAll = () => {
    setPending(null);
    changeWires([], t.awarded, "Schematic cleared.");
  };

  const pickTerminal = id => {
    if (playing) return;
    if (pending === null) {
      setPending(id);
      setAnnounce(`${WIL_T[id].name} selected. Pick the other end, or press Escape to cancel.`);
    } else if (pending === id) {
      setPending(null);
      setAnnounce("Wire cancelled.");
    } else {
      addWire(pending, id);
      setPending(null);
    }
  };

  const energize = () => {
    if (playing) return;
    setPending(null);
    const runs = wilRun(t.wires);
    const diag = wilDiagnose(t.wires, runs);
    const summary = runs.map(r => `${r.action}: CR ${r.cr ? "on" : "off"}, M ${r.m ? "on" : "off"}${r.short ? ", SHORT" : ""}`);
    let { latched } = t;
    if (diag === "OK") {
      const fresh = !latched;
      latched = true;
      onResult({
        xp: fresh ? WIL_XP_LATCH : 0,
        firstTry: true,
        firstPass: fresh,
        note: { tool: "1.1", text: `Wire It Live: latched as drawn — ${WIL.operation[0]}` },
      });
    } else {
      onResult({
        xp: 0,
        firstTry: false,
      });
    }
    let quiz = null;
    if (WIL_FAULT[diag]) {
      const others = shuffled(WIL.faults.map(f => f.id).filter(id => id !== diag)).slice(0, 3);
      quiz = { options: shuffled([diag, ...others]), picked: [] };
    }
    setT({ ...t, runs, diag, quiz, latched });
    setInputs(WIL_OFF);
    setPhase(0);
  };

  // Play the energize sequence one step at a time, then hand over to manual control.
  useEffect(() => {
    if (phase === null || !t.runs) return undefined;
    const finish = () => {
      const last = t.runs[t.runs.length - 1];
      const ni = { ...WIL_OFF, power: !last.short };
      setPhase(null);
      setInputs(ni);
      setSim(wilSolve(t.wires, ni, last));
    };
    if (reduced) {
      finish();
      return undefined;
    }
    const id = setTimeout(phase >= t.runs.length - 1 ? finish : () => setPhase(p => p + 1), WIL_STEP_MS);
    return () => clearTimeout(id);
  }, [phase, t.runs]);

  const answer = id => {
    if (!t.quiz || t.quiz.picked.includes(t.diag)) return;
    const picked = [...t.quiz.picked, id];
    let identified = t.identified;
    if (id === t.diag) {
      const fresh = !identified.includes(id) && picked.length === 1;
      if (!identified.includes(id)) identified = [...identified, id];
      onResult({ xp: fresh ? WIL_XP_IDENTIFY : 0, firstTry: picked.length === 1 });
    }
    setT({ ...t, identified, quiz: { ...t.quiz, picked } });
  };

  useEffect(() => {
    const onKey = e => {
      if (e.key === "Escape" && pending !== null) {
        e.preventDefault();
        setPending(null);
        setAnnounce("Wire cancelled.");
      }
    };
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  });

  const hold = (key, value) => {
    if (!inputs.power || playing) return;
    apply({ ...inputs, [key]: value });
  };

  const T = id => WIL_T[id];
  const wiresNeeded = WIL.targetNets.reduce((n, net) => n + net.length - 1, 0);
  const stroke = C.text_mute;
  const contact = (a, b, closed, nc) => {
    const A = T(a);
    const B = T(b);
    if (closed) return <path d={`M${A.x} ${A.y}L${B.x} ${B.y}`} stroke={C.text} strokeWidth="2.5" fill="none" />;
    return <path d={`M${A.x} ${A.y}L${B.x - 6} ${B.y - (nc ? 30 : 20)}`} stroke={stroke} strokeWidth="2.5" fill="none" />;
  };
  const coil = (id, x, y, on) => (
    <g>
      <rect x={x} y={y} width="80" height="36" rx="3" fill={on ? `${C.signal_cyan}26` : C.bg} stroke={on ? C.signal_cyan : stroke} strokeWidth="2.5" />
      <text x={x + 40} y={y + 25} textAnchor="middle" fill={on ? C.signal_cyan : C.text} style={{ font: `20px ${MONO_FONT}` }}>{id}</text>
    </g>
  );
  const label = (x, y, text, size = 15, color = C.text_mute) => (
    <text x={x} y={y} textAnchor="middle" fill={color} style={{ font: `${size}px ${MONO_FONT}` }}>{text}</text>
  );

  const quizDone = t.quiz && t.quiz.picked.includes(t.diag);
  const fault = WIL_FAULT[t.diag];
  const olOpen = view.olTripped;

  return (
    <div style={{ display: "grid", gap: 20 }}>
      <div style={{ display: "flex", flexWrap: "wrap", gap: 8, alignItems: "center" }}>
        <Chip color={C.signal_cyan}>WIRES {t.wires.length} / {wiresNeeded} NEEDED</Chip>
        <Chip color={t.latched ? C.lime : C.text_dim}>{t.latched ? "LATCHED AS DRAWN" : "NOT YET LATCHED"}</Chip>
        <span style={{ fontSize: 12, color: C.text_dim }}>
          Click a terminal, then another, to wire them. Right-click or Delete removes a wire. Tab moves between terminals, Enter selects, Esc cancels.
        </span>
      </div>

      <section aria-labelledby="wil-title">
        <H as="h3">Build this circuit</H>
        <p id="wil-title" style={{ margin: "6px 0 0", fontFamily: HEAD_FONT, fontWeight: 700, fontSize: 22, letterSpacing: "-0.02em", color: C.text }}>
          {WIL.title}
        </p>
        <p style={{ margin: "6px 0 0", fontSize: 13, color: C.text_mute }}>
          Wire the control rung, the flyback diode across the CR coil, and the contactor rung. Then energize it.
        </p>
        <Cites cites={WIL.sources} />
      </section>

      <div style={{ overflowX: "auto", border: `1px solid ${C.border}`, borderRadius: 4, background: C.bg }}>
        <svg viewBox="240 90 1040 660" role="group" aria-label="Schematic" style={{ display: "block", width: "100%", minWidth: 760 }}>
          {/* PSU */}
          <rect x="720" y="104" width="160" height="56" rx="4" fill={C.panel} stroke={view.short ? C.rose : stroke} strokeWidth="2.5" />
          {label(800, 124, view.short ? "FOLDED BACK" : "24 VDC PSU", 15, view.short ? C.rose : C.text_mute)}
          {label(748, 152, "+", 20, C.text)}
          {label(852, 152, "−", 20, C.text)}
          {/* OL, NC 95-96 */}
          {contact("OL95", "OL96", !olOpen, true)}
          <path d="M360 260V242" stroke={stroke} strokeWidth="2.5" />
          {label(330, 222, olOpen ? "OL TRIPPED" : "OL", 20, olOpen ? C.rose : C.text)}
          {/* STOP, NC 11-12 */}
          {contact("S11", "S12", !view.stopPressed, true)}
          <path d="M520 260V242 M494 250V220 M484 220H504" stroke={stroke} strokeWidth="2.5" fill="none" strokeDasharray="0" />
          {label(490, 208, "STOP", 20, view.stopPressed ? C.amber : C.text)}
          {/* START, NO 13-14 */}
          {contact("B13", "B14", view.startPressed, false)}
          <path d="M667 250V220 M657 220H677" stroke={stroke} strokeWidth="2.5" fill="none" />
          {label(670, 208, "START", 20, view.startPressed ? C.amber : C.text)}
          {/* CR coil */}
          {coil("CR", 880, 242, view.cr)}
          {view.cr && label(920, 306, "PULLED IN", 13, C.signal_cyan)}
          {/* CR aux 13-14 */}
          {contact("CRa13", "CRa14", view.cr, false)}
          {label(670, 410, "CR aux (seal-in)")}
          {/* D1 */}
          <path d="M900 360H940 M932 348L908 360L932 372Z M908 348V372" stroke={stroke} strokeWidth="2.5" fill="none" />
          {label(920, 396, "D1 flyback diode")}
          {label(920, 414, "cathode (K) → A1")}
          {/* CR load contact 23-24 */}
          {contact("CR23", "CR24", view.cr, false)}
          {label(670, 466, "CR", 20, C.text)}
          {/* M coil and motor */}
          {coil("M", 880, 482, view.m)}
          <path d="M920 518V650H1130" stroke={stroke} strokeWidth="2.5" fill="none" strokeDasharray="6 6" />
          <circle cx="1176" cy="650" r="44" fill={view.m ? `${C.lime}1f` : C.bg} stroke={view.m ? C.lime : stroke} strokeWidth="2.5" />
          {label(1176, 657, "M", 20, view.m ? C.lime : C.text)}
          {label(1176, 722, view.m ? "MTR-1 RUNNING" : "MTR-1", 18, view.m ? C.lime : C.text)}
          {label(1010, 628, "M main contacts")}
          {label(1000, 674, "(power circuit not shown)")}
          {label(420, 452, "CONTACTOR CIRCUIT", 15, C.text_dim)}

          {/* Wires */}
          {t.wires.map((w, i) => {
            const A = T(w[0]);
            const B = T(w[1]);
            const on = flow.has("w" + i);
            const color = on ? (view.short ? C.rose : C.signal_cyan) : C.text;
            return (
              <g
                key={w.join("-") + i}
                tabIndex={playing ? -1 : 0}
                role="button"
                aria-label={`Wire ${wilWireName(w)}. Press Delete to remove.`}
                onContextMenu={e => {
                  e.preventDefault();
                  if (!playing) deleteWire(i);
                }}
                onKeyDown={e => {
                  if ((e.key === "Delete" || e.key === "Backspace") && !playing) {
                    e.preventDefault();
                    deleteWire(i);
                  }
                }}
                style={{ cursor: "context-menu", outline: "none" }}
              >
                <line x1={A.x} y1={A.y} x2={B.x} y2={B.y} stroke="transparent" strokeWidth="16" />
                <line
                  x1={A.x}
                  y1={A.y}
                  x2={B.x}
                  y2={B.y}
                  stroke={color}
                  strokeWidth={on ? 3.5 : 2.5}
                  strokeLinecap="round"
                  strokeDasharray={on && !reduced ? "10 6" : "none"}
                  style={on && !reduced ? { animation: "flow 0.6s linear infinite" } : undefined}
                />
              </g>
            );
          })}

          {/* Terminals */}
          {WIL.terminals.map(term => {
            const sel = pending === term.id;
            const hot = live.has(term.id) && !view.short;
            return (
              <g
                key={term.id}
                tabIndex={playing ? -1 : 0}
                role="button"
                aria-label={`Terminal ${term.name}${sel ? ", selected" : ""}${hot ? ", voltage present" : ""}`}
                aria-pressed={sel}
                onPointerDown={() => {
                  dragFrom.current = term.id;
                  dragged.current = false;
                }}
                onPointerUp={() => {
                  if (dragFrom.current && dragFrom.current !== term.id && !playing) {
                    addWire(dragFrom.current, term.id);
                    setPending(null);
                    dragged.current = true;
                  }
                  dragFrom.current = null;
                }}
                onClick={() => {
                  if (dragged.current) {
                    dragged.current = false;
                    return;
                  }
                  pickTerminal(term.id);
                }}
                onKeyDown={e => {
                  if (e.key === "Enter" || e.key === " ") {
                    e.preventDefault();
                    pickTerminal(term.id);
                  }
                }}
                style={{ cursor: playing ? "default" : "crosshair", outline: "none" }}
              >
                <circle cx={term.x} cy={term.y} r="18" fill="transparent" />
                {sel && <circle cx={term.x} cy={term.y} r="13" fill="none" stroke={C.amber} strokeWidth="2.5" />}
                <circle cx={term.x} cy={term.y} r="7" fill={hot ? C.signal_cyan : C.bg} stroke={sel ? C.amber : C.text} strokeWidth="2" />
                {term.comp !== "PSU" &&
                  label(term.x, term.y + ((term.comp === "CR" && term.y === 260) || term.comp === "M" || term.comp === "D1" ? -22 : 28), term.label)}
              </g>
            );
          })}
        </svg>
      </div>

      <div aria-live="polite" style={{ fontSize: 13, color: C.text_mute, minHeight: 18 }}>
        {pending ? `From ${WIL_T[pending].name}: pick the other end (Esc cancels).` : announce}
      </div>

      <div style={{ display: "grid", gap: 10 }}>
        <H as="h3">Wire list</H>
        <div style={{ display: "flex", flexWrap: "wrap", gap: 8, alignItems: "center" }}>
          {[
            ["wil-from", "From", from, setFrom],
            ["wil-to", "To", to, setTo],
          ].map(([id, lbl, val, set]) => (
            <label key={id} htmlFor={id} style={{ display: "flex", gap: 6, alignItems: "center", fontSize: 13, color: C.text_mute }}>
              {lbl}
              <select
                id={id}
                value={val}
                onChange={e => set(e.target.value)}
                style={{ minHeight: TOUCH_MIN, background: C.bg, color: C.text, border: `1px solid ${C.border}`, borderRadius: 4, padding: "0 8px", fontFamily: MONO_FONT, fontSize: 13 }}
              >
                <option value="">terminal…</option>
                {WIL.terminals.map(term => (
                  <option key={term.id} value={term.id}>{term.name}</option>
                ))}
              </select>
            </label>
          ))}
          <Btn
            variant="ghost"
            onClick={() => {
              addWire(from, to);
              setTo("");
            }}
            ariaLabel="Add wire from the selected terminals"
            disabled={!from || !to || from === to || playing}
          >
            Add wire
          </Btn>
        </div>
        {t.wires.length > 0 && (
          <ul style={{ margin: 0, padding: 0, listStyle: "none", display: "flex", flexWrap: "wrap", gap: 6 }}>
            {t.wires.map((w, i) => (
              <li key={w.join("-") + i} style={{ display: "flex", alignItems: "center", gap: 4, border: `1px solid ${C.border}`, borderRadius: 4, paddingLeft: 8 }}>
                <span style={{ fontFamily: MONO_FONT, fontSize: 12, color: flow.has("w" + i) ? C.signal_cyan : C.text }}>{WIL_T[w[0]].name} – {WIL_T[w[1]].name}</span>
                <Btn variant="ghost" color={C.rose} onClick={() => deleteWire(i)} ariaLabel={`Remove wire ${wilWireName(w)}`} disabled={playing} style={{ border: "none", padding: "0 10px" }}>
                  ×
                </Btn>
              </li>
            ))}
          </ul>
        )}
      </div>

      <div style={{ display: "grid", gap: 10 }}>
        <H as="h3">Controls</H>
        <div style={{ display: "flex", flexWrap: "wrap", gap: 8 }}>
          <Btn onClick={energize} ariaLabel="Energize and run the test sequence" disabled={playing}>Energize</Btn>
          <Btn
            variant="ghost"
            color={C.amber}
            pressed={view.startPressed}
            disabled={!inputs.power || playing}
            ariaLabel="START pushbutton, hold to press"
            onPointerDown={() => hold("startPressed", true)}
            onPointerUp={() => hold("startPressed", false)}
            onPointerLeave={() => inputs.startPressed && hold("startPressed", false)}
            onKeyDown={e => {
              if ((e.key === " " || e.key === "Enter") && !e.repeat) {
                e.preventDefault();
                hold("startPressed", true);
              }
            }}
            onKeyUp={e => {
              if (e.key === " " || e.key === "Enter") {
                e.preventDefault();
                hold("startPressed", false);
              }
            }}
          >
            Hold START
          </Btn>
          <Btn
            variant="ghost"
            color={C.amber}
            pressed={view.stopPressed}
            disabled={!inputs.power || playing}
            ariaLabel="STOP pushbutton, hold to press"
            onPointerDown={() => hold("stopPressed", true)}
            onPointerUp={() => hold("stopPressed", false)}
            onPointerLeave={() => inputs.stopPressed && hold("stopPressed", false)}
            onKeyDown={e => {
              if ((e.key === " " || e.key === "Enter") && !e.repeat) {
                e.preventDefault();
                hold("stopPressed", true);
              }
            }}
            onKeyUp={e => {
              if (e.key === " " || e.key === "Enter") {
                e.preventDefault();
                hold("stopPressed", false);
              }
            }}
          >
            Hold STOP
          </Btn>
          <Btn
            variant="ghost"
            color={C.rose}
            pressed={inputs.olTripped}
            disabled={!inputs.power || playing}
            onClick={() => hold("olTripped", !inputs.olTripped)}
            ariaLabel={inputs.olTripped ? "Reset the overload" : "Trip the overload"}
          >
            {inputs.olTripped ? "Reset OL" : "Trip OL"}
          </Btn>
          <Btn variant="ghost" disabled={!inputs.power || playing} onClick={() => apply(WIL_OFF)} ariaLabel="Power off">
            Power off
          </Btn>
          <Btn variant="ghost" color={C.rose} disabled={playing || t.wires.length === 0} onClick={clearAll} ariaLabel="Clear all wires">
            Clear wiring
          </Btn>
        </div>
      </div>

      {t.runs && (
        <div aria-live="polite" style={{ display: "grid", gap: 16 }}>
          {!playing && t.diag === "OK" && (
            <Verdict ok title="Energized, latched, and stops as drawn.">
              <ul style={{ margin: 0, paddingLeft: 18, display: "grid", gap: 4 }}>
                {WIL.operation.map(line => (
                  <li key={line}>{line}</li>
                ))}
              </ul>
              <Cites cites={[`${WIL.sources[1]}, Operation`]} />
            </Verdict>
          )}
          {!playing && WIL_MESSAGE[t.diag] && (
            <Verdict ok={false} title={WIL_MESSAGE[t.diag]}>
              {t.diag === "OPEN" && (
                <p style={{ margin: 0 }}>
                  Voltage reaches: {t.runs[1].live.map(id => WIL_T[id].name).join(", ") || "nothing past the PSU"}.
                </p>
              )}
              {t.diag === "NOT_AS_DRAWN" && (
                <>
                  <p style={{ margin: 0 }}>Compare your wiring to the drawing; some connections differ from it.</p>
                  {!t.wires.some(w => w.includes("D1A") || w.includes("D1K")) && <p style={{ margin: "8px 0 0" }}>No flyback diode: {WIL.operation[3]}</p>}
                </>
              )}
              <Cites cites={WIL.sources} />
            </Verdict>
          )}
          {!playing && t.quiz && (
            <div role="group" aria-labelledby="wil-quiz">
              <Verdict ok={quizDone} title={quizDone ? `${WIL_QUIZ_NAME[t.diag] || fault.name}` : "It failed. What's wrong?"}>
                {!quizDone && <p style={{ margin: 0 }}>Read the run below, then name the fault.</p>}
                {quizDone && (
                  <>
                    <p style={{ margin: 0 }}>{capFirst(WIL_SHOWN_CONSEQUENCE[t.diag] || fault.consequence)}</p>
                    <Cites cites={[`${WIL.sources[1]}, Faults to build as edge cases, item ${fault.item}`]} />
                  </>
                )}
              </Verdict>
              <H as="h4" style={{ margin: "12px 0 8px" }}>
                <span id="wil-quiz">Name the fault</span>
              </H>
              <div style={{ display: "grid", gap: 8 }}>
                {t.quiz.options.map((id, i) => {
                  const state = quizDone ? (id === t.diag ? "hit" : "locked") : t.quiz.picked.includes(id) ? "miss" : "idle";
                  return <OptionButton key={id} n={i + 1} option={{ text: WIL_QUIZ_NAME[id] || WIL_FAULT[id].name }} state={state} onPick={() => answer(id)} />;
                })}
              </div>
            </div>
          )}
          <div>
            <H as="h3">Energize log</H>
            <div style={{ overflowX: "auto", marginTop: 8 }}>
              <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 13 }}>
                <thead>
                  <tr style={{ color: C.text_dim, textAlign: "left" }}>
                    {["Step", "Action", "Expected", "CR", "M", "Result"].map(h => (
                      <th key={h} scope="col" style={{ padding: "4px 8px", fontWeight: 600, borderBottom: `1px solid ${C.border}` }}>{h}</th>
                    ))}
                  </tr>
                </thead>
                <tbody>
                  {t.runs.map((r, i) => {
                    const shown = !playing || i <= phase;
                    const exp = Object.entries(r.expect).map(([k, v]) => `${k.toUpperCase()} ${v ? "on" : "off"}`).join(", ");
                    return (
                      <tr key={i} style={{ opacity: shown ? 1 : 0.3, background: playing && i === phase ? `${C.signal_cyan}10` : "transparent" }}>
                        <td style={{ padding: "4px 8px", fontFamily: MONO_FONT, color: C.text_mute }}>{i + 1}</td>
                        <td style={{ padding: "4px 8px", color: C.text }}>{r.action}</td>
                        <td style={{ padding: "4px 8px", color: C.text_mute }}>{exp}</td>
                        <td style={{ padding: "4px 8px", fontFamily: MONO_FONT, color: shown && r.cr ? C.signal_cyan : C.text_dim }}>{shown ? (r.cr ? "ON" : "OFF") : ""}</td>
                        <td style={{ padding: "4px 8px", fontFamily: MONO_FONT, color: shown && r.m ? C.signal_cyan : C.text_dim }}>{shown ? (r.m ? "ON" : "OFF") : ""}</td>
                        <td style={{ padding: "4px 8px", color: r.short ? C.rose : r.pass ? C.lime : C.rose }}>{shown ? (r.short ? "SHORT" : r.pass ? "Pass" : "Fail") : ""}</td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>
            <Cites cites={[`${WIL.sources[1]}, Operation`]} />
          </div>
        </div>
      )}
    </div>
  );
}
