// A path is drawn only where the outcome establishes it: current flowing
// (ok, or through another channel) or a sensor/input pairing that cannot flow.
function ssPathShown(result) {
  if (!result || !Number.isInteger(result.ch)) return null;
  if (result.id === "ok" || result.id === "wrongChannel") return "flow";
  return result.pairing ? "blocked" : null;
}

function SsPath({ mod, result }) {
  const C = useC();
  const reduced = useReducedMotion();
  const ok = ssPathShown(result) === "flow";
  const ch = result.ch;
  if (!ssPathShown(result)) return null;
  // A blocked pairing has no path to draw: the path template names the switch
  // type that belongs to this topology, which is not the sensor landed here.
  if (!ok) return <p aria-label={`Current path, ${mod.module} input ${ch}: none`} style={{ margin: 0, fontFamily: MONO_FONT, fontSize: 11, color: C.rose }}>NO CURRENT: THE PATH DOES NOT COMPLETE</p>;
  const p = ssPath(mod, ch);
  const color = ok ? C.signal_cyan : C.rose;
  return (
    <div style={{ display: "grid", gap: 6 }}>
      <ol aria-label={`Current path, ${mod.module} input ${ch}`} style={{ display: "flex", flexWrap: "wrap", gap: 6, alignItems: "center", margin: 0, padding: 0, listStyle: "none" }}>
        {p.steps.map((name, i) => (
          <li key={i} aria-label={`${name}: ${ok ? "current" : "no current"}`} style={{ display: "flex", alignItems: "center", gap: 6 }}>
            {i > 0 && (
              <svg width="22" height="10" aria-hidden="true">
                <line x1="0" y1="5" x2="22" y2="5" stroke={ok ? C.signal_cyan : C.border} strokeWidth="2" strokeDasharray={ok ? "6 10" : "none"} style={{ animation: ok && !reduced ? "flow 0.8s linear infinite" : "none" }} />
              </svg>
            )}
            <span style={{ padding: "5px 8px", border: `1px solid ${ok ? color : C.border}`, borderRadius: 4, background: ok ? `${color}12` : "transparent", fontSize: 12, color: ok ? C.text : C.text_mute, whiteSpace: "nowrap" }}>{name}</span>
          </li>
        ))}
      </ol>
      {!ok && <p style={{ margin: 0, fontFamily: MONO_FONT, fontSize: 11, color: C.rose }}>NO CURRENT: THE PATH DOES NOT COMPLETE</p>}
      {ok && <p style={{ margin: 0, fontFamily: MONO_FONT, fontSize: 11, color: C.text_mute }}>{p.power}</p>}
    </div>
  );
}

function SourcingSinking({ onResult, onStep }) {
  const C = useC();
  // Ribbon: one step for this tool, 3. Check signal path (user-approved mapping).
  useEffect(() => {
    if (onStep) onStep(3);
  }, []);
  const [t, setT] = useState(ssLoad);
  useEffect(() => saveTool(SS_KEY, t), [t]);
  const s = t.session;
  const ch = SS_CH[s.idx];
  const set = patch => setT(x => ({ ...x, session: { ...x.session, ...patch } }));

  // Rule 9 and 10: each module comes from its own object and must validate.
  const modIds = ch.kind === "wire" ? [ch.module] : ch.modules;
  const mods = modIds.map(ssModule);
  const problems = modIds.flatMap((id, i) => ssValidate(mods[i], id));
  const halted = problems.length > 0;

  const miss = what => ({ misses: s.misses + 1, firstMiss: s.firstMiss || what });
  const fresh = !t.played.includes(ch.id);
  const retryXp = fresh ? SS_XP_RETRY : 0;

  const finish = (landing, pairText) => {
    const clean = s.misses === 0;
    onResult({
      xp: fresh ? (clean ? SS_XP_FIRST : SS_XP_RETRY) : 0,
      firstTry: clean,
      firstPass: fresh && clean,
      radar: SS_RADAR,
      note: { tool: "1.2", tag: null, text: `Sourcing or Sinking?: ${ch.title}: ${pairText}${landing ? `, ${landing}` : ""} — ${SSK.teachingPoint.text}` },
    });
    setT(x => ({
      ...x,
      played: fresh ? [...x.played, ch.id] : x.played,
      log: [{ id: ch.title, pair: `${pairText}${landing ? `; ${landing}` : ""}`, attempts: s.misses + 1, first: s.firstMiss || "clean", at: new Date().toISOString() }, ...x.log],
    }));
  };

  // Wire challenges.
  const mod = ch.kind === "wire" && !halted ? mods[0] : null;
  const sensor = ch.kind === "wire" ? SS_SENSOR[ch.sensor] : null;
  const typeOk = sensor && s.type === sensor.type;
  const topoOk = mod && s.topo === mod.input_topology;
  const allLanded = SS_LEADS.every(l => Number.isInteger(s.assign[l.id]));

  const pickType = v => {
    if (!sensor || typeOk || s.done) return;
    if (v === sensor.type) set({ type: v, typeMiss: null });
    else set({ typeMiss: v, ...miss(`called the sensor ${v}`) });
  };
  const pickTopo = v => {
    if (!mod || !typeOk || topoOk || s.done) return;
    if (v === mod.input_topology) set({ topo: v, topoMiss: null });
    else set({ topoMiss: v, ...miss(`called the module ${v}`) });
  };
  const land = (lead, n) => {
    if (s.done) return;
    const assign = { ...s.assign };
    // A terminal holds one lead in this drill: landing moves any lead already there.
    for (const k of Object.keys(assign)) if (assign[k] === n && k !== lead) delete assign[k];
    if (n === null) delete assign[lead];
    else assign[lead] = n;
    set({ assign, armed: null, result: null });
  };
  const checkWire = () => {
    if (halted || !topoOk || !allLanded || s.done) return;
    const r = ssCheck(mod, sensor, ch.channel, s.assign);
    if (r.id !== "ok") {
      set({ result: r, checks: s.checks + 1, ...miss(SS_OUT[r.id].title.replace(/\.$/, "").toLowerCase()) });
      return;
    }
    const landing = SS_LEADS.map(l => `${l.label} → ${s.assign[l.id]}`).join(", ");
    finish(landing, `${sensor.type} output → ${mod.module} ${mod.input_topology} input, IN ${ch.channel}`);
    set({ result: r, done: true });
  };

  // Match challenge: which module each sensor goes to. Each module takes one sensor.
  const pairFor = sid => s.pairs[sid] || "";
  const setPair = (sid, mid) => {
    if (s.done || !mid) return;
    const other = ch.sensors.find(x => x !== sid);
    const otherMod = ch.modules.find(x => x !== mid);
    set({ pairs: { [sid]: mid, [other]: otherMod }, result: null });
  };
  const matchResults = ch.kind === "match" && !halted && s.result
    ? ch.sensors.map(sid => {
        const m = ssModule(s.pairs[sid]);
        return { sid, mod: m, r: ssCheck(m, SS_SENSOR[sid], ch.channel, ssTableLanding(m, ch.channel)) };
      })
    : null;
  const checkMatch = () => {
    if (halted || s.done || !ch.sensors.every(sid => s.pairs[sid])) return;
    const rs = ch.sensors.map(sid => ssCheck(ssModule(s.pairs[sid]), SS_SENSOR[sid], ch.channel, ssTableLanding(ssModule(s.pairs[sid]), ch.channel)));
    const ok = rs.every(r => r.id === "ok");
    if (!ok) {
      set({ result: { id: "pairing" }, checks: s.checks + 1, ...miss("paired each sensor with the wrong input type") });
      return;
    }
    const pairText = ch.sensors.map(sid => `${SS_SENSOR[sid].type} → ${s.pairs[sid]} ${ssModule(s.pairs[sid]).input_topology}`).join("; ");
    finish("", pairText);
    set({ result: { id: "ok" }, done: true });
  };

  const next = () => setT(x => ({ ...x, session: ssSession((x.session.idx + 1) % SS_CH.length) }));

  useEffect(() => {
    const onKey = e => {
      const tag = l4KeyTarget(e);
      if (tag === null) return;
      if (ch.kind === "wire" && /^[1-2]$/.test(e.key) && !s.done) {
        const i = Number(e.key) - 1;
        if (!typeOk) {
          e.preventDefault();
          pickType(SS_TYPES[i]);
        } else if (!topoOk) {
          e.preventDefault();
          pickTopo(SS_TOPOLOGIES[i]);
        }
      } else if (e.key === "Escape" && s.armed) {
        set({ armed: null });
      } else if (e.key === "Enter" && tag !== "BUTTON") {
        if (s.done) {
          e.preventDefault();
          next();
        } else if (ch.kind === "wire" && topoOk && allLanded) {
          e.preventDefault();
          checkWire();
        } else if (ch.kind === "match" && ch.sensors.every(sid => s.pairs[sid])) {
          e.preventDefault();
          checkMatch();
        }
      }
    };
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  });

  if (halted) {
    return (
      <div style={{ display: "grid", gap: 12 }}>
        <div><TrainingBadge /></div>
        <SsHalt problems={problems} />
      </div>
    );
  }

  const onDropData = (n, data) => {
    if (s.done) return;
    if (ch.kind === "wire" && n !== null && data.startsWith("lead:")) land(data.slice(5), n);
  };
  const landed = mod ? Object.fromEntries(SS_LEADS.filter(l => Number.isInteger(s.assign[l.id])).map(l => [s.assign[l.id], l.label])) : {};
  const out = s.result && SS_OUT[s.result.id];
  const selStyle = { minHeight: TOUCH_MIN, padding: "0 8px", background: C.bg, color: C.text, border: `1px solid ${C.border}`, borderRadius: 4, fontFamily: MONO_FONT, fontSize: 13 };
  const tpCite = (
    <>
      <p style={{ margin: "8px 0 0", fontWeight: 600 }}>{SSK.teachingPoint.text}</p>
      <Cites cites={[SSK.teachingPoint.source]} />
      <p style={{ margin: "6px 0 0", color: C.text_mute }}>{SSK.neutral.text}</p>
    </>
  );
  const trapBlock = (
    <>
      <p style={{ margin: "6px 0 0", color: C.text_mute }}>
        Trap 6, "{SSK.trap.trap}": "{SSK.trap.looksLike}" Fix: "{SSK.trap.fix}"
      </p>
      <Cites cites={[SSK.trap.source]} />
    </>
  );

  return (
    <div style={{ display: "grid", gap: 20 }}>
      <div style={{ display: "flex", flexWrap: "wrap", gap: 8, alignItems: "center" }}>
        <TrainingBadge />
        <Chip color={C.signal_cyan}>CHALLENGE {s.idx + 1} / {SS_CH.length}</Chip>
        <Chip color={C.lime}>CLEARED {t.played.length} / {SS_CH.length}</Chip>
        <span style={{ fontSize: 12, color: C.text_dim }}>
          {ch.kind === "wire" ? "Keys: 1-2 answer, Enter checks the wiring" : "Drag a sensor onto a module, or use the selects; Enter checks"}
        </span>
      </div>
      <p style={{ margin: 0, fontFamily: HEAD_FONT, fontWeight: 700, fontSize: 20, color: C.text }}>{ch.title}</p>

      {ch.kind === "wire" && (
        <>
          <section aria-labelledby="ss-type-h" style={{ display: "grid", gap: 8 }}>
            <H as="h3"><span id="ss-type-h">1. What output does this sensor have?</span></H>
            <SsSensor sensor={sensor} showType={typeOk} />
            <div role="group" aria-labelledby="ss-type-h" style={{ display: "flex", flexWrap: "wrap", gap: 8 }}>
              {SS_TYPES.map((v, i) => (
                <Btn key={v} variant={s.type === v ? "primary" : "ghost"} color={s.typeMiss === v ? C.rose : undefined} pressed={s.type === v} disabled={typeOk} onClick={() => pickType(v)} ariaLabel={`${i + 1}: ${v}`}>
                  {i + 1}: {v}
                </Btn>
              ))}
            </div>
            <div aria-live="polite">
              {s.typeMiss && !typeOk && (
                <Verdict key={`t${s.misses}`} ok={false} title={`Not ${s.typeMiss}.`}>
                  <p style={{ margin: 0 }}>Read which side of the supply the output switch connects OUT to when the target is present, then pick again. Finishing now is worth {retryXp} XP.</p>
                </Verdict>
              )}
            </div>
          </section>

          {typeOk && (
            <section aria-labelledby="ss-topo-h" style={{ display: "grid", gap: 8 }}>
              <H as="h3"><span id="ss-topo-h">2. What kind of input is this module?</span></H>
              {topoOk ? (
                <p style={{ margin: 0, fontSize: 13, color: C.text }}>
                  {mod.module}: "{mod.module_marking}", a {mod.input_topology} input.
                </p>
              ) : (
                <div className="tool-scroll">
                  <PioModule mod={mod} />
                </div>
              )}
              <div role="group" aria-labelledby="ss-topo-h" style={{ display: "flex", flexWrap: "wrap", gap: 8 }}>
                {SS_TOPOLOGIES.map((v, i) => (
                  <Btn key={v} variant={s.topo === v ? "primary" : "ghost"} color={s.topoMiss === v ? C.rose : undefined} pressed={s.topo === v} disabled={topoOk} onClick={() => pickTopo(v)} ariaLabel={`${i + 1}: ${v}`}>
                    {i + 1}: {v === "sinking" ? "Sinking" : "Sourcing"}
                  </Btn>
                ))}
              </div>
              <div aria-live="polite">
                {s.topoMiss && !topoOk && (
                  <Verdict key={`p${s.misses}`} ok={false} title={`Not ${s.topoMiss}.`}>
                    <p style={{ margin: 0 }}>The module face reads "{mod.module_marking}". Pick again. Finishing now is worth {retryXp} XP.</p>
                    <Cites cites={[`${mod.source_publication} ${mod.source_marking}`]} />
                  </Verdict>
                )}
              </div>
            </section>
          )}

          {topoOk && (
            <section aria-labelledby="ss-wire-h" style={{ display: "grid", gap: 10 }}>
              <H as="h3"><span id="ss-wire-h">3. Land the sensor on input {ch.channel}</span></H>
              <p style={{ margin: 0, fontSize: 13, color: C.text_mute }}>
                Drag a lead onto a terminal, or pick a lead and then a terminal. Each lead also has a select below.
              </p>
              <div style={{ display: "grid", gap: 12, gridTemplateColumns: "repeat(auto-fit, minmax(250px, 1fr))", alignItems: "start" }}>
                <SsSensor sensor={sensor} showType assign={s.assign} armed={s.armed} onArm={id => set({ armed: id })} disabled={s.done} />
                <div className="tool-scroll">
                  <PioModule
                    mod={mod}
                    landed={landed}
                    lit={s.result ? s.result.lit ?? null : null}
                    bad={s.result && s.result.at ? s.assign[s.result.at] : null}
                    armed={!!s.armed}
                    onTerm={s.done ? undefined : n => (s.armed ? land(s.armed, n) : null)}
                    onDropData={s.done ? undefined : onDropData}
                  />
                </div>
              </div>
              <div style={{ display: "grid", gap: 8, gridTemplateColumns: "repeat(auto-fit, minmax(180px, 1fr))" }}>
                {SS_LEADS.map(l => (
                  <label key={l.id} style={{ display: "grid", gap: 4, fontSize: 13, color: C.text }}>
                    <span>Lead <span style={{ fontFamily: MONO_FONT, color: C.signal_cyan }}>{l.label}</span> ({l.role})</span>
                    <select
                      value={Number.isInteger(s.assign[l.id]) ? String(s.assign[l.id]) : ""}
                      disabled={s.done}
                      onChange={e => land(l.id, e.target.value === "" ? null : Number(e.target.value))}
                      aria-label={`Lead ${l.label}: terminal`}
                      style={selStyle}
                    >
                      <option value="">Not landed</option>
                      {ssTerminals(mod).map(tm => (
                        <option key={tm.n} value={String(tm.n)}>
                          {tm.n} ({tm.role === "input" ? `IN ${tm.channel}` : tm.role === "supply" ? "V" : "C"})
                        </option>
                      ))}
                    </select>
                  </label>
                ))}
              </div>
              {!s.done && (
                <div>
                  <Btn onClick={checkWire} disabled={!allLanded} ariaLabel="Check the wiring">Check wiring</Btn>
                </div>
              )}
              <ConstructedNote source={`${SSK.leads.source}: sensor and lead labels. Terminals: ${ssCite(mod)}.`} />
            </section>
          )}

          <div aria-live="polite" style={{ display: "grid", gap: 12 }}>
            {ssPathShown(s.result) && (
              <>
                <H as="h3">Where the current goes</H>
                <SsPath mod={mod} result={s.result} />
              </>
            )}
            {s.result && !s.done && out && (
              <Verdict key={s.checks} ok={false} title={out.title}>
                <p style={{ margin: 0 }}>{ssFill(out.text, s.result.fill)}</p>
                {s.result.id === "tableMismatch" && <Cites cites={[`${mod.source_publication} p.${mod.source_page}, ${mod.source_table}`]} />}
                {s.result.pairing && trapBlock}
                <ConstructedNote source={SSK.outcomes.source} />
                <p style={{ margin: "6px 0 0", fontWeight: 600 }}>Move a lead and check again. Finishing now is worth {retryXp} XP.</p>
              </Verdict>
            )}
            {s.done && (
              <Verdict ok title={s.misses === 0 ? "Current path complete, first try." : `Current path complete after ${s.misses} miss${s.misses === 1 ? "" : "es"}.`}>
                <p style={{ margin: 0 }}>
                  {sensor.type} output on the {mod.input_topology} {mod.module}: input {ch.channel} turns on. The Rockwell table pairs input {ch.channel} (terminal {ssTableLanding(mod, ch.channel).out}) with C terminal {ssTableLanding(mod, ch.channel).neg} and V terminal {ssTableLanding(mod, ch.channel).pos}.
                </p>
                <Cites cites={[ssCite(mod)]} />
                {tpCite}
                <ConstructedNote source={`${SSK.paths.source}: current-path wording.`} />
                <div style={{ marginTop: 10 }}>
                  <Btn onClick={next} ariaLabel="Next challenge">Next challenge</Btn>
                </div>
              </Verdict>
            )}
          </div>
        </>
      )}

      {ch.kind === "match" && (
        <>
          <section aria-labelledby="ss-match-h" style={{ display: "grid", gap: 10 }}>
            <H as="h3"><span id="ss-match-h">Pair each sensor with the input it can drive</span></H>
            <p style={{ margin: 0, fontSize: 13, color: C.text_mute }}>
              Both sensors are pre-wired to input {ch.channel} per each module's Rockwell table. Only the pairing is yours.
            </p>
            <div style={{ display: "grid", gap: 12, gridTemplateColumns: "repeat(auto-fit, minmax(250px, 1fr))", alignItems: "start" }}>
              {ch.sensors.map(sid => (
                <div key={sid} style={{ display: "grid", gap: 6 }}>
                  <SsSensor sensor={SS_SENSOR[sid]} showType={false} onDragSensor disabled={s.done} />
                  <label style={{ display: "grid", gap: 4, fontSize: 13, color: C.text }}>
                    <span>{SS_SENSOR[sid].name} goes to</span>
                    <select value={pairFor(sid)} disabled={s.done} onChange={e => setPair(sid, e.target.value)} aria-label={`${SS_SENSOR[sid].name}: module`} style={selStyle}>
                      <option value="" disabled>Choose a module</option>
                      {ch.modules.map(mid => <option key={mid} value={mid}>{mid}</option>)}
                    </select>
                  </label>
                </div>
              ))}
            </div>
            <div style={{ display: "grid", gap: 12, gridTemplateColumns: "repeat(auto-fit, minmax(250px, 1fr))", alignItems: "start" }}>
              {mods.map(m => {
                const sid = ch.sensors.find(x => s.pairs[x] === m.module);
                const mr = matchResults && matchResults.find(x => x.mod.module === m.module);
                const land0 = ssTableLanding(m, ch.channel);
                const tagA = sid === ch.sensors[0] ? "A" : "B";
                const landedM = sid ? { [land0.pos]: `${tagA} +V`, [land0.out]: `${tagA} OUT`, [land0.neg]: `${tagA} 0V` } : {};
                return (
                  <div key={m.module} className="tool-scroll" style={{ display: "grid", gap: 6 }}>
                    <PioModule
                      mod={m}
                      label={`${m.module} module face${sid ? `, ${SS_SENSOR[sid].name} landed` : ""}`}
                      landed={landedM}
                      lit={mr && mr.r.id === "ok" ? mr.r.lit : null}
                      onDropData={s.done ? undefined : (n, data) => data.startsWith("sensor:") && setPair(data.slice(7), m.module)}
                    />
                    {mr && <SsPath mod={m} result={mr.r} />}
                  </div>
                );
              })}
            </div>
            {!s.done && (
              <div>
                <Btn onClick={checkMatch} disabled={!ch.sensors.every(sid => s.pairs[sid])} ariaLabel="Check the pairing">Check pairing</Btn>
              </div>
            )}
            <ConstructedNote source={`${SSK.challenges.source}: sensors and pre-wiring choice. Terminals: ${mods.map(ssCite).join(" / ")}.`} />
          </section>
          <div aria-live="polite" style={{ display: "grid", gap: 12 }}>
            {s.result && !s.done && (
              <Verdict key={s.checks} ok={false} title={SS_OUT.pnpOnSourcing.title}>
                {matchResults.map(x => (
                  <p key={x.sid} style={{ margin: "0 0 4px" }}>
                    {SS_SENSOR[x.sid].name} on {x.mod.module}: {SS_OUT[x.r.id] && x.r.id !== "ok" ? SS_OUT[x.r.id].text : "path complete."}
                  </p>
                ))}
                {trapBlock}
                <ConstructedNote source={SSK.outcomes.source} />
                <p style={{ margin: "6px 0 0", fontWeight: 600 }}>Swap the pairing and check again. Finishing now is worth {retryXp} XP.</p>
              </Verdict>
            )}
            {s.done && (
              <Verdict ok title={s.misses === 0 ? "Both paths complete, first try." : `Both paths complete after ${s.misses} miss${s.misses === 1 ? "" : "es"}.`}>
                {ch.sensors.map(sid => {
                  const m = ssModule(s.pairs[sid]);
                  return (
                    <p key={sid} style={{ margin: "0 0 4px" }}>
                      {SS_SENSOR[sid].name}: {SS_SENSOR[sid].type} output → {m.module}, {m.input_topology} input ("{m.module_marking}").
                    </p>
                  );
                })}
                <Cites cites={mods.map(ssCite)} />
                {tpCite}
                <ConstructedNote source={`${SSK.paths.source}: current-path wording.`} />
                <div style={{ marginTop: 10 }}>
                  <Btn onClick={next} ariaLabel="Next challenge">Next challenge</Btn>
                </div>
              </Verdict>
            )}
          </div>
        </>
      )}

      <DecisionLog
        title="Wiring log"
        headers={["Challenge", "Pairing and landing"]}
        log={t.log}
        cells={r => [r.id, r.pair]}
        empty="Each path you complete is logged here and in Field Notes."
      />
    </div>
  );
}

/* --------------------------------------------------------------------------
   Tool 1.3: Contact Logic Puzzle
   The user's locked contact model (sources/contact-logic-spec.md):
   M1_COIL = STOP AND (START OR M1_AUX_PREV), M1_AUX_NEXT = M1_COIL.
   Every coil value is read from the spec's truth table. Walkthrough: predict
   the coil before each step of the latching sequence. Bench: toggle STOP and
   START, and press Next state to move M1 AUX to the coil.
   -------------------------------------------------------------------------- */

const CL_KEY = STORAGE_KEY + ".contactLogic";
const CL_XP_FIRST = 20;
const CL_XP_RETRY = 8;
const CL_RADAR = 0.5;
const CL_STEPS = CLP.walkthrough.steps;

function clRow(s) {
  return CLP.table.find(r => r.stop === s.stop && r.start === s.start && r.aux === s.aux);
}

function clApply(s, step) {
  if (step.next) return { ...s, aux: clRow(s).coil };
  return { ...s, ...step.change };
}

// Inputs after the first n walkthrough steps.
function clWalkState(n) {
  return CL_STEPS.slice(0, n).reduce(clApply, { ...CLP.walkthrough.start });
}

function clWalkFresh() {
  return { step: 0, misses: 0, firstMiss: null, last: null };
}

function clLoad() {
  const t = loadTool(CL_KEY) || {};
  const w = t.walk;
  const b = t.bench;
  const bit = v => v === 0 || v === 1;
  return {
    mode: t.mode === "bench" ? "bench" : "walk",
    walk: w && Number.isInteger(w.step) && w.step >= 0 && w.step <= CL_STEPS.length ? w : clWalkFresh(),
    bench: b && bit(b.stop) && bit(b.start) && bit(b.aux) ? b : { ...CLP.walkthrough.start },
    played: t.played === true,
    log: Array.isArray(t.log) ? t.log : [],
  };
}

function ClContact({ x, y, nc, closed, powered, label, value }) {
  const C = useC();
  const col = powered && closed ? C.signal_cyan : closed ? C.text_mute : C.text_dim;
  return (
    <g>
      <line x1={x} y1={y - 14} x2={x} y2={y + 14} stroke={col} strokeWidth="3" />
      <line x1={x + 18} y1={y - 14} x2={x + 18} y2={y + 14} stroke={col} strokeWidth="3" />
      {nc && <line x1={x - 4} y1={y + 12} x2={x + 22} y2={y - 12} stroke={col} strokeWidth="2" />}
      {closed && <line x1={x} y1={y} x2={x + 18} y2={y} stroke={col} strokeWidth="2" strokeDasharray="3 3" />}
      <text x={x + 9} y={y - 22} textAnchor="middle" fontFamily={MONO_FONT} fontSize="11" fill={C.text}>{label}</text>
      <text x={x + 9} y={y + 30} textAnchor="middle" fontFamily={MONO_FONT} fontSize="10" fill={col}>{closed ? "CLOSED" : "OPEN"} · {value}</text>
    </g>
  );
}

function ClRung({ s }) {
  const C = useC();
  const a = s.stop === 1;
  const coil = clRow(s).coil === 1;
  const w = on => ({ stroke: on ? C.signal_cyan : C.border, strokeWidth: on ? 3 : 2 });
  return (
    <svg viewBox="0 0 560 200" width="560" height="200" role="img" aria-label={`Rung: STOP ${a ? "closed" : "open"}, START ${s.start ? "closed" : "open"}, M1 AUX ${s.aux ? "closed" : "open"}, M1_COIL ${coil ? "energized" : "off"}`} style={{ display: "block", maxWidth: "100%", height: "auto" }}>
      <line x1="20" y1="20" x2="20" y2="175" stroke={C.signal_cyan} strokeWidth="3" />
      <line x1="540" y1="20" x2="540" y2="175" stroke={C.text_mute} strokeWidth="3" />
      <line x1="20" y1="60" x2="90" y2="60" {...w(true)} />
      <ClContact x={90} y={60} nc closed={a} powered label="STOP (NC)" value={`${s.stop} = ${s.stop ? "released" : "pressed"}`} />
      <line x1="108" y1="60" x2="180" y2="60" {...w(a)} />
      <line x1="180" y1="60" x2="230" y2="60" {...w(a)} />
      <line x1="180" y1="60" x2="180" y2="150" {...w(a)} />
      <line x1="180" y1="150" x2="230" y2="150" {...w(a)} />
      <ClContact x={230} y={60} closed={s.start === 1} powered={a} label="START (NO)" value={`${s.start} = ${s.start ? "pressed" : "released"}`} />
      <ClContact x={230} y={150} closed={s.aux === 1} powered={a} label="M1 AUX (NO)" value={`M1_AUX_PREV ${s.aux}`} />
      {/* START out, M1 AUX out, and the coil feed are one node: live whenever the coil is. */}
      <line x1="248" y1="60" x2="330" y2="60" {...w(coil)} />
      <line x1="248" y1="150" x2="330" y2="150" {...w(coil)} />
      <line x1="330" y1="60" x2="330" y2="150" {...w(coil)} />
      <line x1="330" y1="60" x2="420" y2="60" {...w(coil)} />
      <circle cx="440" cy="60" r="18" fill={coil ? `${C.signal_cyan}22` : "none"} stroke={coil ? C.signal_cyan : C.text_dim} strokeWidth="3" />
      <text x="440" y="30" textAnchor="middle" fontFamily={MONO_FONT} fontSize="11" fill={C.text}>M1_COIL</text>
      <text x="440" y="100" textAnchor="middle" fontFamily={MONO_FONT} fontSize="10" fill={coil ? C.signal_cyan : C.text_dim}>{coil ? "ENERGIZED · 1" : "OFF · 0"}</text>
      <line x1="458" y1="60" x2="540" y2="60" {...w(coil)} />
    </svg>
  );
}

function ClTable({ s }) {
  const C = useC();
  const cur = clRow(s);
  return (
    <div className="tool-scroll">
      <table aria-label="Truth table" style={{ borderCollapse: "collapse", fontSize: 13, minWidth: 440 }}>
        <thead>
          <tr style={{ color: C.text_dim, textAlign: "left" }}>
            {["STOP", "START", "M1AUX", "COIL", ""].map((h, i) => (
              <th key={i} scope="col" style={{ padding: "4px 10px", fontFamily: MONO_FONT, fontWeight: 600, borderBottom: `1px solid ${C.border}` }}>{h}</th>
            ))}
          </tr>
        </thead>
        <tbody>
          {CLP.table.map(r => {
            const on = r === cur;
            return (
              <tr key={`${r.stop}${r.start}${r.aux}`} aria-current={on ? "true" : undefined} style={{ background: on ? `${C.signal_cyan}14` : "transparent", boxShadow: on ? `inset 3px 0 0 ${C.signal_cyan}` : "none" }}>
                {[r.stop, r.start, r.aux].map((v, i) => (
                  <td key={i} style={{ padding: "4px 10px", fontFamily: MONO_FONT, color: on ? C.text : C.text_mute }}>{v}</td>
                ))}
                <td style={{ padding: "4px 10px", fontFamily: MONO_FONT, color: r.coil ? C.lime : C.text_mute }}>→ {r.coil}</td>
                <td style={{ padding: "4px 10px", color: on ? C.text : C.text_mute }}>{r.label}</td>
              </tr>
            );
          })}
        </tbody>
      </table>
    </div>
  );
}

function ContactLogic({ onResult, onStep }) {
  const C = useC();
  // Ribbon: one step for this tool, 4. Split the loop (user-approved mapping).
  useEffect(() => {
    if (onStep) onStep(4);
  }, []);
  const [t, setT] = useState(clLoad);
  useEffect(() => saveTool(CL_KEY, t), [t]);
  const w = t.walk;
  const done = w.step >= CL_STEPS.length;
  const ws = clWalkState(w.step);
  const shown = t.mode === "walk" ? ws : t.bench;
  const step = CL_STEPS[w.step];

  const predict = coil => {
    if (t.mode !== "walk" || done) return;
    const after = clApply(ws, step);
    const row = clRow(after);
    if (coil !== row.coil) {
      setT(x => ({ ...x, walk: { ...x.walk, misses: x.walk.misses + 1, firstMiss: x.walk.firstMiss || `${step.action}: ${coil ? "ON" : "OFF"}`, last: { ok: false, step: w.step, coil, after } } }));
      return;
    }
    const nextStep = w.step + 1;
    const walk = { ...w, step: nextStep, last: { ok: true, step: w.step, row } };
    if (nextStep < CL_STEPS.length) {
      setT(x => ({ ...x, walk }));
      return;
    }
    const fresh = !t.played;
    const clean = w.misses === 0;
    const sealed = CLP.table.find(r => r.stop === 1 && r.start === 0 && r.aux === 1);
    const dropped = CLP.table.find(r => r.stop === 0 && r.start === 0 && r.aux === 1);
    onResult({
      xp: fresh ? (clean ? CL_XP_FIRST : CL_XP_RETRY) : 0,
      firstTry: clean,
      firstPass: fresh && clean,
      radar: CL_RADAR,
      note: { tool: "1.3", tag: "M1", text: `Contact Logic Puzzle M1: sealed in, then dropped — ${sealed.stop} ${sealed.start} ${sealed.aux} → ${sealed.coil} (${sealed.label}); ${dropped.stop} ${dropped.start} ${dropped.aux} → ${dropped.coil} (${dropped.label}).` },
    });
    setT(x => ({
      ...x,
      played: true,
      walk,
      log: [{ id: "M1", seq: CL_STEPS.map(s => s.action.split(" (")[0]).join(" → "), attempts: w.misses + 1, first: w.firstMiss || "clean", at: new Date().toISOString() }, ...x.log],
    }));
  };

  const restart = () => setT(x => ({ ...x, walk: clWalkFresh() }));
  const setMode = mode => setT(x => ({ ...x, mode }));
  const bench = patch => setT(x => ({ ...x, bench: { ...x.bench, ...patch } }));
  const benchNext = () => setT(x => ({ ...x, bench: clApply(x.bench, { next: true }) }));

  useEffect(() => {
    const onKey = e => {
      const tag = l4KeyTarget(e);
      if (tag === null || t.mode !== "walk") return;
      if (!done && (e.key === "1" || e.key === "2")) {
        e.preventDefault();
        predict(e.key === "1" ? 1 : 0);
      } else if (done && e.key === "Enter" && tag !== "BUTTON") {
        e.preventDefault();
        restart();
      }
    };
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  });

  const last = w.last;
  const onoff = v => (v ? "ON" : "OFF");

  return (
    <div style={{ display: "grid", gap: 20 }}>
      <div style={{ display: "flex", flexWrap: "wrap", gap: 8, alignItems: "center" }}>
        <TrainingBadge />
        <Chip color={C.signal_cyan}>{t.mode === "walk" ? `STEP ${Math.min(w.step + 1, CL_STEPS.length)} / ${CL_STEPS.length}` : "BENCH"}</Chip>
        <Chip color={C.lime}>{t.played ? "SEQUENCE CLEARED" : "SEQUENCE OPEN"}</Chip>
        <span style={{ fontSize: 12, color: C.text_dim }}>Keys: 1 predicts ON, 2 predicts OFF</span>
      </div>

      <div role="group" aria-label="Mode" style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
        <Btn variant="ghost" pressed={t.mode === "walk"} onClick={() => setMode("walk")} ariaLabel="Walkthrough mode">Walkthrough</Btn>
        <Btn variant="ghost" pressed={t.mode === "bench"} onClick={() => setMode("bench")} ariaLabel="Bench mode">Bench</Btn>
      </div>

      <section aria-label="Rung" style={{ display: "grid", gap: 6 }}>
        <H as="h3">Rung</H>
        <div className="tool-scroll"><ClRung s={shown} /></div>
        <ConstructedNote source={`${CLP.rung.source}. ${CLP.rung.note}`} />
      </section>

      {t.mode === "walk" ? (
        <section aria-labelledby="cl-step" style={{ display: "grid", gap: 10 }}>
          <H as="h3">Latching sequence</H>
          {!done ? (
            <>
              <p id="cl-step" style={{ margin: 0, fontFamily: HEAD_FONT, fontWeight: 700, fontSize: 20, color: C.text }}>
                Next: {step.action}. Predict M1_COIL after it.
              </p>
              <div role="group" aria-labelledby="cl-step" style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
                <Btn onClick={() => predict(1)} ariaLabel="1: M1_COIL ON">1: ON</Btn>
                <Btn onClick={() => predict(0)} ariaLabel="2: M1_COIL OFF">2: OFF</Btn>
              </div>
            </>
          ) : (
            <p id="cl-step" style={{ margin: 0, fontSize: 14, color: C.text }}>Sequence complete: {CLP.sequence}.</p>
          )}
          <ConstructedNote source={`${CLP.walkthrough.source}. ${CLP.walkthrough.note}`} />
          <div aria-live="polite" style={{ display: "grid", gap: 12 }}>
            {last && !last.ok && (
              <Verdict key={w.misses} ok={false} title={`Not ${onoff(last.coil)}. Trace the rung again.`}>
                <p style={{ margin: 0 }}>
                  After "{CL_STEPS[last.step].action}": STOP {last.after.stop ? "closed (released)" : "open (pressed)"}, START {last.after.start ? "closed (pressed)" : "open (released)"}, M1 AUX {last.after.aux ? "closed" : "open"}.
                </p>
                <p style={{ margin: "4px 0 0", color: C.text_mute }}>{CLP.output}</p>
                <Cites cites={[CLP.source]} />
                <p style={{ margin: "6px 0 0", fontWeight: 600 }}>Finishing now is worth {t.played ? 0 : CL_XP_RETRY} XP.</p>
              </Verdict>
            )}
            {last && last.ok && (
              <Verdict key={`ok-${last.step}`} ok title={`M1_COIL ${onoff(last.row.coil)}: ${last.row.label}.`}>
                <p style={{ margin: 0, fontFamily: MONO_FONT, fontSize: 13 }}>
                  STOP {last.row.stop} · START {last.row.start} · M1AUX {last.row.aux} → COIL {last.row.coil}
                </p>
                {CL_STEPS[last.step].next && <p style={{ margin: "4px 0 0", color: C.text_mute }}>{CLP.state}</p>}
                <Cites cites={[CLP.source]} />
              </Verdict>
            )}
            {done && (
              <Verdict ok title={w.misses === 0 ? "Sealed in and dropped, no misses." : `Sealed in and dropped with ${w.misses} miss${w.misses === 1 ? "" : "es"}.`}>
                <p style={{ margin: 0 }}>{CLP.output}. {CLP.state}.</p>
                <Cites cites={[CLP.source]} />
                <div style={{ marginTop: 10 }}>
                  <Btn variant="ghost" onClick={restart} ariaLabel="Run the sequence again">Run it again</Btn>
                </div>
              </Verdict>
            )}
          </div>
        </section>
      ) : (
        <section aria-label="Bench controls" style={{ display: "grid", gap: 10 }}>
          <H as="h3">Bench</H>
          <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
            <Btn variant="ghost" pressed={t.bench.stop === 0} onClick={() => bench({ stop: t.bench.stop ? 0 : 1 })} ariaLabel={`STOP pushbutton: ${t.bench.stop ? "released, press it" : "pressed, release it"}`}>
              STOP: {t.bench.stop ? "Released (1)" : "Pressed (0)"}
            </Btn>
            <Btn variant="ghost" pressed={t.bench.start === 1} onClick={() => bench({ start: t.bench.start ? 0 : 1 })} ariaLabel={`START pushbutton: ${t.bench.start ? "pressed, release it" : "released, press it"}`}>
              START: {t.bench.start ? "Pressed (1)" : "Released (0)"}
            </Btn>
            <Btn onClick={benchNext} ariaLabel="Next state: M1 AUX follows the coil">Next state</Btn>
          </div>
          <p style={{ margin: 0, fontFamily: MONO_FONT, fontSize: 12, color: C.text_mute }}>
            M1_AUX_PREV {t.bench.aux} → M1_AUX_NEXT {clRow(t.bench).coil}
          </p>
          {CLP.inputs.map(i => (
            <p key={i.tag} style={{ margin: 0, fontSize: 13, color: C.text_mute }}>
              <span style={{ fontFamily: MONO_FONT, color: C.signal_cyan }}>{i.tag}</span>: {i.text}
            </p>
          ))}
          <Cites cites={[CLP.source]} />
        </section>
      )}

      <section aria-label="Truth table" style={{ display: "grid", gap: 6 }}>
        <H as="h3">Truth table</H>
        <ClTable s={shown} />
        <p style={{ margin: 0, fontFamily: MONO_FONT, fontSize: 12, color: C.text_mute }}>{CLP.output} · {CLP.state}</p>
        <Cites cites={[CLP.source]} />
      </section>

      <DecisionLog
        title="Sequence log"
        headers={["Motor", "Sequence"]}
        log={t.log}
        cells={r => [r.id, r.seq]}
        empty="Each sequence you finish is logged here and in Field Notes."
      />
    </div>
  );
}

/* --------------------------------------------------------------------------
   Tool 3.3: Timer Trace
   A normal, non-retentive TON (the user's locked model, sources/
   timer-trace-spec.md, Rockwell 1756-RM018). The simulation only ever sits
   in one of the spec's regions; every chart edge is a region change, logged
   with the region's text. DN is set at the moment ACC reaches PRE, and TT
   falls in the same instant. No RTO, no scan-time behavior.
   -------------------------------------------------------------------------- */

const TT_KEY = STORAGE_KEY + ".timerTrace";
const TT_XP_FIRST = 20;
const TT_XP_RETRY = 8;
const TT_RADAR = 0.5;
const TT_TICK_MS = 50;
const TT_REGION = Object.fromEntries(TTR.regions.map(r => [r.id, r]));
const TT_ROWS = [["rung", "Rung"], ["en", "EN"], ["tt", "TT"], ["dn", "DN"]];

function ttBits(regionId) {
  const r = TT_REGION[regionId];
  return { rung: regionId === "timing" || regionId === "done" ? 1 : 0, en: r.en, tt: r.tt, dn: r.dn };
}

function ttClampPre(v) {
  const n = Math.round(Number(v));
  if (!Number.isFinite(n)) return TTR.preset.default;
  return Math.min(TTR.preset.max, Math.max(TTR.preset.min, n));
}

function ttAcc(g) {
  return g === ">= PRE" ? "≥ PRE" : g;
}

function ttQuizFresh(idx) {
  const g = TTR.quiz.items[idx].given;
  return { idx, pick: { en: g.en, tt: g.tt, dn: g.dn }, misses: 0, firstMiss: null, last: null, solved: false };
}

function ttLoad() {
  const t = loadTool(TT_KEY) || {};
  const q = t.quiz;
  return {
    pre: ttClampPre(t.pre ?? TTR.preset.default),
    quiz: q && TTR.quiz.items[q.idx] && q.pick ? q : ttQuizFresh(0),
    played: Array.isArray(t.played) ? t.played : [],
    log: Array.isArray(t.log) ? t.log : [],
  };
}

function ttSimFresh() {
  return { clock: 0, running: false, rung: 0, since: null, done: false, n: 1, events: [{ n: 1, t: 0, region: "off" }] };
}

function TtChart({ sim, pre }) {
  const C = useC();
  const W = 640, X0 = 70, PW = 556, ROW = 38, TOP = 22;
  const span = Math.max(2.5 * pre, 5000);
  const t1 = Math.max(sim.clock, span);
  const t0 = t1 - span;
  const x = t => X0 + ((t - t0) / span) * PW;
  const H = TOP + ROW * TT_ROWS.length + 22;
  const before = [...sim.events].reverse().find(e => e.t <= t0) || sim.events[0];
  const inWin = sim.events.filter(e => e.t > t0 && e.t <= t1);
  return (
    <svg viewBox={`0 0 ${W} ${H}`} width={W} height={H} role="img" aria-label={`Timing chart, last ${Math.round(span)} ms: ${inWin.map(e => `transition ${e.n} to ${e.region}`).join(", ") || "no transitions"}`} style={{ display: "block", maxWidth: "100%", height: "auto" }}>
      {inWin.map(e => (
        <g key={e.n}>
          <line x1={x(e.t)} y1={TOP - 6} x2={x(e.t)} y2={TOP + ROW * TT_ROWS.length} stroke={C.border} strokeDasharray="3 3" />
          <text x={x(e.t)} y={TOP - 10} textAnchor="middle" fontFamily={MONO_FONT} fontSize="10" fill={C.amber}>{e.n}</text>
        </g>
      ))}
      {TT_ROWS.map(([k, label], i) => {
        const hi = TOP + i * ROW + 8, lo = TOP + i * ROW + 30;
        const y = v => (v ? hi : lo);
        let v = ttBits(before.region)[k];
        let d = `M ${X0} ${y(v)}`;
        for (const e of inWin) {
          const nv = ttBits(e.region)[k];
          d += ` L ${x(e.t)} ${y(v)}`;
          if (nv !== v) d += ` L ${x(e.t)} ${y(nv)}`;
          v = nv;
        }
        d += ` L ${X0 + PW} ${y(v)}`;
        return (
          <g key={k}>
            <text x={8} y={lo - 6} fontFamily={MONO_FONT} fontSize="11" fill={C.text_mute}>{label}</text>
            <line x1={X0} y1={lo} x2={X0 + PW} y2={lo} stroke={C.border} />
            <path d={d} fill="none" stroke={k === "dn" ? C.lime : k === "tt" ? C.amber : C.signal_cyan} strokeWidth="2" />
          </g>
        );
      })}
      <text x={X0} y={H - 4} fontFamily={MONO_FONT} fontSize="10" fill={C.text_dim}>{Math.round(t0)} ms</text>
      <text x={X0 + PW} y={H - 4} textAnchor="end" fontFamily={MONO_FONT} fontSize="10" fill={C.text_dim}>{Math.round(t1)} ms</text>
    </svg>
  );
}

function TimerTrace({ onResult, onStep }) {
  const C = useC();
  // Ribbon: one step for this tool, 5. Prove root cause (user-approved mapping).
  useEffect(() => {
    if (onStep) onStep(5);
  }, []);
  const [t, setT] = useState(ttLoad);
  const [preText, setPreText] = useState(String(t.pre));
  const [sim, setSim] = useState(ttSimFresh);
  useEffect(() => saveTool(TT_KEY, t), [t]);

  // The clock only moves while running. DN is set at since + PRE exactly.
  useEffect(() => {
    if (!sim.running) return undefined;
    let last = performance.now();
    const id = setInterval(() => {
      const now = performance.now();
      const dt = now - last;
      last = now;
      setSim(s => {
        if (!s.running) return s;
        const clock = s.clock + dt;
        if (s.rung && !s.done && clock - s.since >= t.pre) {
          const n = s.n + 1;
          return { ...s, clock, done: true, n, events: [...s.events, { n, t: s.since + t.pre, region: "done" }].slice(-40) };
        }
        return { ...s, clock };
      });
    }, TT_TICK_MS);
    return () => clearInterval(id);
  }, [sim.running, t.pre]);

  const run = () =>
    setSim(s => {
      if (s.rung) return { ...s, running: !s.running };
      const n = s.n + 1;
      return { ...s, rung: 1, since: s.clock, done: false, running: true, n, events: [...s.events, { n, t: s.clock, region: "timing" }].slice(-40) };
    });
  const drop = () =>
    setSim(s => {
      if (!s.rung) return s;
      const n = s.n + 1;
      // The clock keeps its run/pause state, so time passes while the rung is low.
      return { ...s, rung: 0, since: null, done: false, n, events: [...s.events, { n, t: s.clock, region: "drop" }].slice(-40) };
    });
  const commitPre = () => {
    const pre = ttClampPre(preText);
    setPreText(String(pre));
    setT(x => ({ ...x, pre }));
  };

  const region = sim.rung ? (sim.done ? "done" : "timing") : sim.events[sim.events.length - 1].region;
  const bits = ttBits(region);
  const acc = sim.rung ? (sim.done ? "≥ PRE" : `${Math.floor(sim.clock - sim.since)} ms`) : "0 ms";

  // Quiz.
  const q = t.quiz;
  const item = TTR.quiz.items[q.idx];
  const want = ttBits(item.region);
  const setQ = patch => setT(x => ({ ...x, quiz: { ...x.quiz, ...patch } }));
  const flip = k => {
    if (q.solved) return;
    setQ({ pick: { ...q.pick, [k]: q.pick[k] ? 0 : 1 }, last: null });
  };
  const submit = () => {
    if (q.solved) return;
    const wrong = ["en", "tt", "dn"].filter(k => q.pick[k] !== want[k]).length;
    if (wrong) {
      setQ({ misses: q.misses + 1, firstMiss: q.firstMiss || `EN ${q.pick.en} TT ${q.pick.tt} DN ${q.pick.dn}`, last: { ok: false, wrong } });
      return;
    }
    const fresh = !t.played.includes(item.id);
    const clean = q.misses === 0;
    onResult({
      xp: fresh ? (clean ? TT_XP_FIRST : TT_XP_RETRY) : 0,
      firstTry: clean,
      firstPass: fresh && clean,
      radar: TT_RADAR,
      note: { tool: "3.3", tag: TTR.tag, text: `Timer Trace ${TTR.tag}: ${item.event} → EN ${want.en}, TT ${want.tt}, DN ${want.dn} — ${TT_REGION[item.region].text}` },
    });
    setT(x => ({
      ...x,
      played: fresh ? [...x.played, item.id] : x.played,
      log: [{ id: item.id.toUpperCase(), event: item.event, attempts: q.misses + 1, first: q.firstMiss || "clean", at: new Date().toISOString() }, ...x.log],
      quiz: { ...x.quiz, solved: true, last: { ok: true } },
    }));
  };
  const nextQ = () => setT(x => ({ ...x, quiz: ttQuizFresh((x.quiz.idx + 1) % TTR.quiz.items.length) }));

  useEffect(() => {
    const onKey = e => {
      const tag = l4KeyTarget(e);
      if (tag === null) return;
      if (/^[1-3]$/.test(e.key) && !q.solved) {
        e.preventDefault();
        flip(["en", "tt", "dn"][Number(e.key) - 1]);
      } else if (e.key === "Enter" && tag !== "BUTTON") {
        e.preventDefault();
        if (q.solved) nextQ();
        else submit();
      }
    };
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  });

  const Bit = ({ name, v }) => (
    <div style={{ display: "grid", gap: 2, padding: "6px 10px", border: `1px solid ${v ? C.signal_cyan : C.border}`, borderRadius: 4, minWidth: 64 }}>
      <span style={{ fontFamily: MONO_FONT, fontSize: 10, color: C.text_mute }}>{name}</span>
      <span style={{ fontFamily: MONO_FONT, fontSize: 18, color: v ? C.signal_cyan : C.text_dim }}>{v}</span>
    </div>
  );

  const recent = [...sim.events].reverse().slice(0, 6);

  return (
    <div style={{ display: "grid", gap: 20 }}>
      <div style={{ display: "flex", flexWrap: "wrap", gap: 8, alignItems: "center" }}>
        <TrainingBadge />
        <Chip color={C.signal_cyan}>{TTR.tag} · TON</Chip>
        <Chip color={C.lime}>SOLVED {t.played.length} / {TTR.quiz.items.length}</Chip>
        <span style={{ fontSize: 12, color: C.text_dim }}>Keys: 1-3 flip EN / TT / DN, Enter checks</span>
      </div>

      <section aria-labelledby="tt-sim" style={{ display: "grid", gap: 12 }}>
        <H as="h3"><span id="tt-sim">Timer</span></H>
        <div aria-live="off" style={{ display: "flex", flexWrap: "wrap", gap: 8, alignItems: "stretch" }}>
          <Bit name="RUNG_IN" v={bits.rung} />
          <Bit name={`${TTR.tag}.EN`} v={bits.en} />
          <Bit name={`${TTR.tag}.TT`} v={bits.tt} />
          <Bit name={`${TTR.tag}.DN`} v={bits.dn} />
          <div style={{ display: "grid", gap: 2, padding: "6px 10px", border: `1px solid ${C.border}`, borderRadius: 4, minWidth: 150 }}>
            <span style={{ fontFamily: MONO_FONT, fontSize: 10, color: C.text_mute }}>{TTR.tag}.ACC / {TTR.tag}.PRE</span>
            <span aria-label={`ACC ${acc}, PRE ${t.pre} ms`} style={{ fontFamily: MONO_FONT, fontSize: 18, color: sim.done ? C.lime : C.text }}>{acc} / {t.pre} ms</span>
          </div>
        </div>
        <div style={{ display: "flex", flexWrap: "wrap", gap: 8, alignItems: "flex-end" }}>
          <Btn onClick={run} ariaLabel={sim.rung ? (sim.running ? "Pause the clock" : "Resume the clock") : "Run: rung input true"}>
            {sim.rung ? (sim.running ? "Pause" : "Resume") : "Run (rung true)"}
          </Btn>
          <Btn variant="ghost" color={C.rose} onClick={drop} disabled={!sim.rung} ariaLabel="Drop the rung">Drop the rung</Btn>
          <label style={{ display: "grid", gap: 4, fontSize: 12, color: C.text_mute }}>
            {TTR.tag}.PRE (ms, {TTR.preset.min}–{TTR.preset.max})
            <input
              type="number"
              min={TTR.preset.min}
              max={TTR.preset.max}
              step="100"
              value={preText}
              disabled={!!sim.rung}
              onChange={e => setPreText(e.target.value)}
              onBlur={commitPre}
              onKeyDown={e => { if (e.key === "Enter") commitPre(); }}
              aria-label={`${TTR.tag}.PRE in milliseconds`}
              style={{ minHeight: TOUCH_MIN, width: 120, padding: "0 8px", background: C.bg, color: C.text, border: `1px solid ${C.border}`, borderRadius: 4, fontFamily: MONO_FONT, fontSize: 14 }}
            />
          </label>
          {sim.rung ? <span style={{ fontSize: 12, color: C.text_dim, alignSelf: "center" }}>Drop the rung to change PRE.</span> : null}
        </div>
        <div className="tool-scroll"><TtChart sim={sim} pre={t.pre} /></div>
        <div>
          <H as="h4">Transitions</H>
          <ol aria-label="Transition log" style={{ margin: "6px 0 0", padding: 0, listStyle: "none", display: "grid", gap: 4 }}>
            {recent.map(e => (
              <li key={e.n} style={{ display: "flex", gap: 10, fontSize: 13, color: C.text }}>
                <span style={{ fontFamily: MONO_FONT, color: C.amber, minWidth: 22 }}>{e.n}</span>
                <span style={{ fontFamily: MONO_FONT, color: C.text_mute, minWidth: 80 }}>{Math.round(e.t)} ms</span>
                <span>{TT_REGION[e.region].text}</span>
              </li>
            ))}
          </ol>
          <Cites cites={[TTR.source]} />
          <ConstructedNote source={`constructed — training scenario, no source citation. ${TTR.constructed.note}`} />
        </div>
      </section>

      <section aria-labelledby="tt-q" style={{ display: "grid", gap: 10 }}>
        <H as="h3">Predict the next state</H>
        <p style={{ margin: 0, fontFamily: MONO_FONT, fontSize: 13, color: C.text_mute }}>
          Now: RUNG_IN {item.given.rung} · EN {item.given.en} · TT {item.given.tt} · DN {item.given.dn} · ACC {ttAcc(item.given.acc)}
        </p>
        <p id="tt-q" style={{ margin: 0, fontFamily: HEAD_FONT, fontWeight: 700, fontSize: 20, color: C.text }}>
          {item.event.replace(">=", "≥")} What are EN, TT, and DN next?
        </p>
        <div role="group" aria-labelledby="tt-q" style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
          {["en", "tt", "dn"].map((k, i) => (
            <Btn key={k} variant="ghost" pressed={q.pick[k] === 1} disabled={q.solved} onClick={() => flip(k)} ariaLabel={`${i + 1}: ${k.toUpperCase()} is ${q.pick[k]}`}>
              {i + 1}: {k.toUpperCase()} = {q.pick[k]}
            </Btn>
          ))}
          {!q.solved && <Btn onClick={submit} ariaLabel="Check the prediction">Check</Btn>}
        </div>
        <ConstructedNote source={`${TTR.quiz.source}. ${TTR.quiz.note}`} />
        <div aria-live="polite">
          {q.last && !q.last.ok && (
            <Verdict key={q.misses} ok={false} title={`${q.last.wrong} of 3 wrong.`}>
              <p style={{ margin: 0 }}>Which region is the timer in after this event? Match EN, TT, and DN to that region.</p>
              <p style={{ margin: "6px 0 0", fontWeight: 600 }}>Getting it now is worth {t.played.includes(item.id) ? 0 : TT_XP_RETRY} XP.</p>
            </Verdict>
          )}
          {q.solved && (
            <Verdict ok title={`EN ${want.en} · TT ${want.tt} · DN ${want.dn}${q.misses ? `, after ${q.misses} miss${q.misses === 1 ? "" : "es"}` : ""}.`}>
              <p style={{ margin: 0, fontFamily: MONO_FONT, fontSize: 13 }}>{TT_REGION[item.region].text}</p>
              <Cites cites={[TTR.source]} />
              <div style={{ marginTop: 10 }}>
                <Btn onClick={nextQ} ariaLabel="Next question">Next question</Btn>
              </div>
            </Verdict>
          )}
        </div>
      </section>

      <DecisionLog
        title="Prediction log"
        headers={["Question", "Event"]}
        log={t.log}
        cells={r => [r.id, r.event]}
        empty="Each prediction you get right is logged here and in Field Notes."
      />
    </div>
  );
}

// A built tool renders from TOOLS; every other slot is a placeholder.
function ToolSlot({ layer, tool, onTestXP, onResult }) {
  const C = useC();
  const reduced = useReducedMotion();
  const built = TOOLS[tool.id];
  const Tool = built && built.component;
  const [rib, setRib] = useState({ active: null, visited: [] });
  // A step lower than one already reached means the tool started a new round.
  const onStep = n =>
    setRib(r => {
      if (n === r.active) return r;
      if (n === null) return { active: null, visited: [] };
      const newRound = r.visited.length && n < Math.max(...r.visited);
      const visited = newRound ? [n] : r.visited.includes(n) ? r.visited : [...r.visited, n];
      return { active: n, visited };
    });
  return (
    <Panel
      aria-label={`Tool ${tool.id}: ${tool.name}`}
      source={built ? built.source : "pending (tool not built)"}
      style={{ animation: reduced ? "none" : `fadeIn ${DUR_SLOW}ms ease-out`, minWidth: 0 }}
    >
      <header style={{ display: "flex", alignItems: "baseline", gap: 12, flexWrap: "wrap" }}>
        <Chip color={C[layer.accent]}>TOOL {tool.id}</Chip>
        <h3 style={{ margin: 0, fontFamily: HEAD_FONT, fontWeight: 700, fontSize: 22, letterSpacing: "-0.02em", color: C.text }}>
          {tool.name}
        </h3>
        {tool.sub && <span style={{ fontFamily: MONO_FONT, fontSize: 12, color: C.text_mute }}>{tool.sub}</span>}
      </header>
      {Tool ? (
        <div style={{ marginTop: 24 }}>
          {built.ribbon && <DiagnosticRibbon active={rib.active} visited={rib.visited} />}
          <Tool layer={layer} onResult={onResult} onStep={built.ribbon ? onStep : undefined} />
        </div>
      ) : (
        <>
          <p style={{ margin: "28px 0", color: C.text_mute, fontSize: 15 }}>Not yet built.</p>
          <div style={{ display: "flex", alignItems: "center", gap: 10, flexWrap: "wrap" }}>
            <Btn onClick={onTestXP} ariaLabel="Test: add 25 XP">Test: +25 XP</Btn>
            <Chip color={C.amber}>DEV ONLY</Chip>
          </div>
        </>
      )}
    </Panel>
  );
}

function DiagnosticRibbon({ active, visited }) {
  const C = useC();
  const reduced = useReducedMotion();
  const navRef = useRef(null);
  // Center the active step when the ribbon is narrower than its labels.
  // Scrolls the ribbon only, never the page.
  useEffect(() => {
    const nav = navRef.current;
    const li = nav && nav.querySelector('[aria-current="step"]');
    if (!li || nav.scrollWidth <= nav.clientWidth) return;
    const left = li.getBoundingClientRect().left - nav.getBoundingClientRect().left + nav.scrollLeft;
    nav.scrollTo({ left: left - (nav.clientWidth - li.offsetWidth) / 2, behavior: reduced ? "auto" : "smooth" });
  }, [active, reduced]);
  return (
    <nav
      ref={navRef}
      className="diag-ribbon"
      aria-label={`Six-step diagnostic sequence (${DIAG.source})`}
      title={`Six-step diagnostic sequence (${DIAG.source})`}
      style={{ height: 32, boxSizing: "border-box", overflowX: "auto", overflowY: "hidden", borderBottom: `1px solid ${C.border}`, marginBottom: 16 }}
    >
      <ol style={{ display: "flex", height: "100%", margin: 0, padding: 0, listStyle: "none", minWidth: "max-content" }}>
        {DIAG.steps.map(st => {
          const on = st.n === active;
          const done = !on && active !== null && st.n < active && visited.includes(st.n);
          return (
            <li
              key={st.n}
              aria-current={on ? "step" : undefined}
              title={`${st.name}: ${st.text}`}
              className="diag-step"
              style={{
                flex: 1,
                display: "flex",
                alignItems: "center",
                justifyContent: "center",
                whiteSpace: "nowrap",
                fontFamily: MONO_FONT,
                fontSize: 10,
                textTransform: "uppercase",
                color: on ? C.signal_cyan : done ? C.text_dim : C.text_mute,
                borderBottom: `2px solid ${on ? C.signal_cyan : "transparent"}`,
                transition: reduced ? "none" : "color 180ms ease-out, border-color 180ms ease-out",
              }}
            >
              {/* Passed steps get a 1 px underline so they read as passed without relying on color. */}
              <span style={{ paddingBottom: 3, borderBottom: `1px solid ${done ? C.text_mute : "transparent"}` }}>
                {st.n}. {st.name}
              </span>
            </li>
          );
        })}
      </ol>
    </nav>
  );
}

const FIELD_NOTES_KEY = STORAGE_KEY + ".fieldNotes";
const NOTES_EVENT = "techdevlab:fieldnotes";
// Template Pack form that matches each tool's work, for the Markdown export.
const TOOL_FORM = { "2.2": 3, "2.3": 5, "2.4": 2, "3.4": 7 };

function loadNotes() {
  const n = loadTool(FIELD_NOTES_KEY);
  return Array.isArray(n) ? n.filter(x => x && typeof x.text === "string") : [];
}

function toolNameOf(id) {
  for (const l of LAYERS) {
    const t = l.tools.find(x => x.id === id);
    if (t) return t.name;
  }
  return id || "Tool";
}

function logFieldNote(entry) {
  if (!entry || !entry.text) return;
  const note = { at: new Date().toISOString(), tool: entry.tool, toolName: toolNameOf(entry.tool), tag: entry.tag || null, text: entry.text };
  saveTool(FIELD_NOTES_KEY, [...loadNotes(), note]);
  try {
    window.dispatchEvent(new Event(NOTES_EVENT));
  } catch (e) {
    // no event support; the drawer reloads when opened
  }
}

function noteTime(iso) {
  const d = new Date(iso);
  const p = n => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}

function notesMarkdown(notes, state) {
  const today = noteTime(new Date().toISOString()).slice(0, 10);
  const lines = ["# Tech Dev Lab — Field Notes", "", `- Date: ${today}`, `- Level: ${state.level} (${titleOf(state.level)})`, `- XP: ${state.xp}`, ""];
  const ids = [...new Set(notes.map(n => n.tool))].sort((a, b) => String(a).localeCompare(String(b), undefined, { numeric: true }));
  ids.forEach(id => {
    lines.push(`## ${id} ${toolNameOf(id)}`);
    const form = TEMPLATE_FORMS.find(f => f.n === TOOL_FORM[id]);
    if (form) lines.push("", `Template Pack form: ${form.n}. ${form.title} (${form.source})`);
    lines.push("");
    notes.filter(n => n.tool === id).forEach(n => lines.push(`- ${noteTime(n.at)}${n.tag ? ` · ${n.tag}` : ""} · ${n.text}`));
    lines.push("");
  });
  if (!notes.length) lines.push("Nothing logged yet.", "");
  return lines.join("\n");
}

function FieldNotesDrawer({ open, onClose, notes, state, mobile, onClear }) {
  const C = useC();
  const headRef = useRef(null);
  const [armed, setArmed] = useState(false);
  const [msg, setMsg] = useState("");
  useEffect(() => {
    if (open && headRef.current) headRef.current.focus();
    if (!open) {
      setArmed(false);
      setMsg("");
    }
  }, [open]);
  useEffect(() => {
    if (!open) return undefined;
    const onKey = e => {
      if (e.key === "Escape") {
        e.preventDefault();
        onClose();
      }
    };
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  });
  if (!open) return null;

  const exportMd = () => {
    const md = notesMarkdown(notes, state);
    try {
      const url = URL.createObjectURL(new Blob([md], { type: "text/markdown" }));
      const a = document.createElement("a");
      a.href = url;
      a.download = `tech-dev-lab-field-notes-${noteTime(new Date().toISOString()).slice(0, 10)}.md`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
      setMsg("Markdown file saved to your downloads.");
    } catch (e) {
      setMsg("This browser blocked the download.");
    }
  };

  const clear = () => {
    if (!armed) {
      setArmed(true);
      return;
    }
    setArmed(false);
    onClear();
    setMsg("All notes cleared.");
  };

  const shown = [...notes].reverse();
  return (
    <aside
      role="dialog"
      aria-labelledby="fn-title"
      style={{
        position: "fixed",
        top: 0,
        right: 0,
        bottom: 0,
        width: mobile ? "100%" : 380,
        boxSizing: "border-box",
        zIndex: 30,
        display: "flex",
        flexDirection: "column",
        background: C.panel,
        borderLeft: `1px solid ${C.border}`,
        boxShadow: "0 0 40px rgba(0,0,0,0.5)",
        paddingTop: "env(safe-area-inset-top, 0px)",

      }}

      <div style={{ display: "flex", alignItems: "center", gap: 10, padding: "14px 16px", borderBottom: `1px solid ${C.border}` }}>
        <span style={{ color: C.signal_cyan }}>
          <BookIcon />
        </span>
        <h2 id="fn-title" ref={headRef} tabIndex={-1} style={{ margin: 0, flex: 1, fontFamily: HEAD_FONT, fontWeight: 700, fontSize: 18, color: C.text, outline: "none" }}>
          Field Notes
        </h2>
        <Chip color={C.text_mute}>{notes.length}</Chip>
        <Btn variant="ghost" onClick={onClose} ariaLabel="Close Field Notes">Close</Btn>
      </div>
      <div style={{ display: "flex", flexWrap: "wrap", gap: 8, padding: "10px 16px", borderBottom: `1px solid ${C.border}` }}>
        <Btn variant="ghost" onClick={exportMd} ariaLabel="Export notes as Markdown">Export as Markdown</Btn>
        <Btn variant="ghost" color={C.rose} pressed={armed} onClick={clear} disabled={!notes.length} ariaLabel={armed ? "Confirm: clear all notes" : "Clear all notes"}>
          {armed ? "Confirm clear" : "Clear all notes"}
        </Btn>
        <div aria-live="polite" style={{ width: "100%", fontSize: 12, color: C.text_mute, minHeight: 16 }}>{msg}</div>
      </div>
      <div style={{ flex: 1, overflowY: "auto", padding: "12px 16px" }}>
        {shown.length === 0 ? (
          <p style={{ margin: 0, fontSize: 14, color: C.text_mute }}>Nothing logged yet. Every correct decision writes a line here.</p>
        ) : (
          <ol style={{ margin: 0, padding: 0, listStyle: "none", display: "grid", gap: 10 }}>
            {shown.map((n, i) => (
              <li key={n.at + i} style={{ borderLeft: `2px solid ${C.signal_cyan}55`, paddingLeft: 10 }}>
                <div style={{ display: "flex", flexWrap: "wrap", gap: 6, alignItems: "center" }}>

              </li>
            ))}

        )}
      </div>
    </aside>
  );
}

function App() {
  const [state, setState] = useState(load);
  const [toolByLayer, setToolByLayer] = useState({});
  const [resetCount, setResetCount] = useState(0);
  const [notes, setNotes] = useState(loadNotes);
  const [notesOpen, setNotesOpen] = useState(false);
  const [theme, setTheme] = useState(loadTheme);
  const C = THEMES[theme];
  const fadeTimer = useRef(null);
  const mobile = useMediaQuery(`(max-width: ${MOBILE_BREAKPOINT - 1}px)`);
  const reduced = useMediaQuery("(prefers-reduced-motion: reduce)");

  useEffect(() => save(state), [state]);
  useEffect(() => {
    saveTheme(theme);
    document.body.style.background = THEMES[theme].bg;
  }, [theme]);
  // The 200 ms color fade runs only while switching, so no other change animates with it.
  const toggleTheme = () => {
    const root = document.documentElement;
    clearTimeout(fadeTimer.current);
    if (!window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
      root.classList.add("theme-fade");
      fadeTimer.current = setTimeout(() => root.classList.remove("theme-fade"), THEME_FADE_MS + 20);
    }
    setTheme(t => (t === "dark" ? "light" : "dark"));
  };

  // Field Notes live under their own key; notes from earlier builds (kept in
  // the app state) move over once.
  useEffect(() => {
    if (state.fieldNotes && state.fieldNotes.length) {
      const moved = [...state.fieldNotes].reverse().map(n => {
        const rest = Object.entries(n)
          .filter(([k]) => !["at", "tool", "source"].includes(k))
          .map(([k, v]) => `${k}: ${Array.isArray(v) ? v.join("; ") : v}`)
          .join(", ");
        return { at: n.at || new Date().toISOString(), tool: n.tool, toolName: toolNameOf(n.tool), tag: n.tag || null, text: `${toolNameOf(n.tool)}: ${rest}` };
      });
      saveTool(FIELD_NOTES_KEY, [...moved, ...loadNotes()]);
      setNotes(loadNotes());
      setState(s => ({ ...s, fieldNotes: [] }));
    }
  }, []);
  useEffect(() => {
    const refresh = () => setNotes(loadNotes());
    window.addEventListener(NOTES_EVENT, refresh);
    return () => window.removeEventListener(NOTES_EVENT, refresh);
  }, []);
  useEffect(() => {
    const onKey = e => {
      if ((e.ctrlKey || e.metaKey) && !e.altKey && (e.key === "b" || e.key === "B")) {
        e.preventDefault();
        setNotesOpen(o => !o);
      }
      if ((e.ctrlKey || e.metaKey) && !e.altKey && (e.key === "j" || e.key === "J")) {
        e.preventDefault();
        toggleTheme();
      }
    };
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, []);
  // Browsers leave a partly visible control where it is when it takes focus; inside a
  // .tool-scroll box, scroll just far enough to show all of it.
  useEffect(() => {
    const onFocus = e => {
      const box = e.target.closest && e.target.closest(".tool-scroll");
      if (!box) return;
      const b = box.getBoundingClientRect();
      const r = e.target.getBoundingClientRect();
      if (r.left < b.left) box.scrollLeft -= b.left - r.left + 8;
      else if (r.right > b.right) box.scrollLeft += r.right - b.right + 8;
    };
    document.addEventListener("focusin", onFocus);
    return () => document.removeEventListener("focusin", onFocus);
  }, []);
  const clearNotes = () => {
    saveTool(FIELD_NOTES_KEY, []);
    setNotes([]);
  };

  const layer = LAYERS.find(l => l.id === state.activeLayer) || LAYERS[0];
  const toolId = toolByLayer[layer.id] || layer.tools[0].id;
  const tool = layer.tools.find(t => t.id === toolId) || layer.tools[0];

  const selectLayer = id => setState(s => ({ ...s, activeLayer: id }));
  const selectTool = id => setToolByLayer(m => ({ ...m, [layer.id]: id }));
  const toggleMute = () => setState(s => ({ ...s, muted: !s.muted }));
  const reset = () => {
    clearToolStorage();
    setState(DEFAULT_STATE);
    setToolByLayer({});
    setResetCount(n => n + 1);
    setNotes([]);
  };
  const testXP = () => setState(s => awardXP(s, 25));
  // Tools report each solved item here: XP, streak, skill radar, Field Notes.
  // radarAxes: a cross-domain tool (The Bench) credits every axis instead of the current layer.
  const recordResult = ({ xp, firstTry, firstPass, note, radar = RADAR_STEP, radarAxes }) => {
    if (note) logFieldNote(note);
    setState(s => {
      let next = awardXP(s, xp);
      const streak = firstTry === undefined ? s.streak : firstTry ? s.streak + 1 : 0;
      next = { ...next, streak, bestStreak: Math.max(s.bestStreak, streak) };
      if (firstPass) {
        const radarUpdate = {};
        (radarAxes || [layer.id]).forEach(a => {
          radarUpdate[a] = Math.min(100, Math.round((next.skillRadar[a] + radar) * 10) / 10);
        });
        next.skillRadar = { ...next.skillRadar, ...radarUpdate };
      }
      return next;
    });
  };

  const main = (
    <main style={{ padding: mobile ? 16 : 24, display: "grid", gap: 16, alignContent: "start", minWidth: 0 }}>
      <H as="h2" color={C[layer.accent]}>Layer {layer.num} &middot; {layer.name}</H>
      <ToolTabs layer={layer} activeId={tool.id} onSelect={selectTool} />
      <ToolSlot key={`${tool.id}-${resetCount}`} layer={layer} tool={tool} onTestXP={testXP} onResult={recordResult} />
    </main>
  );

  return (
    <ThemeCtx.Provider value={C}>
    <MotionCtx.Provider value={reduced}>
      <div style={{ "--scroll-thumb": C.border, minHeight: "100vh", background: C.bg, color: C.text, fontFamily: UI_FONT }}>
        <StatusStrip state={state} layer={layer} theme={theme} onToggleTheme={toggleTheme} onToggleMute={toggleMute} onReset={reset} onNotes={() => setNotesOpen(true)} notesCount={notes.length} />
        <FieldNotesDrawer open={notesOpen} onClose={() => setNotesOpen(false)} notes={notes} state={state} mobile={mobile} onClear={clearNotes} />
        {mobile ? (
          <div style={{ paddingBottom: 72 }}>
            {main}
            <div style={{ padding: "0 16px 16px" }}>
              <Helper layer={layer} tool={tool} />
            </div>
            <LayerNav active={layer.id} onSelect={selectLayer} mobile />
          </div>
        ) : (
          <div style={{ display: "grid", gridTemplateColumns: "220px minmax(0, 1fr) 300px", minHeight: "calc(100vh - 70px)" }}>
            <LayerNav active={layer.id} onSelect={selectLayer} mobile={false} />
            {main}
            <div style={{ padding: "24px 24px 24px 0" }}>
              <Helper layer={layer} tool={tool} />
            </div>
          </div>
        )}
      </div>
    </MotionCtx.Provider>
    </ThemeCtx.Provider>
  );
}

/* ==========================================================================
   5. RENDER
   ========================================================================== */

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
