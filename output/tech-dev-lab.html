function MoonIcon() {
  return (
    <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true" style={{ display: "block" }}>
      <path d="M13.5 9.6A5.6 5.6 0 0 1 6.4 2.5a5.6 5.6 0 1 0 7.1 7.1z" fill="none" stroke="currentColor" strokeWidth="1.3" strokeLinejoin="round" />
    </svg>
  );
}

function FieldNotesDrawer({ open, onClose, notes, state, mobile, onClear }) {
  const C = useC();
  const headRef = useRef(null);
  const [armed, setArmed] = useState(false);
  const [msg, setMsg] = useState("");
  useEffect(() => {
    if (open && headRef.current) headRef.current.focus();
    if (!open) {
      setArmed(false);
      setMsg("");
    }
  }, [open]);
  useEffect(() => {
    if (!open) return undefined;
    const onKey = e => {
      if (e.key === "Escape") {
        e.preventDefault();
        onClose();
      }
    };
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  });
  if (!open) return null;

  const exportMd = () => {
    const md = notesMarkdown(notes, state);
    try {
      const url = URL.createObjectURL(new Blob([md], { type: "text/markdown" }));
      const a = document.createElement("a");
      a.href = url;
      a.download = `tech-dev-lab-field-notes-${noteTime(new Date().toISOString()).slice(0, 10)}.md`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
      setMsg("Markdown file saved to your downloads.");
    } catch (e) {
      setMsg("This browser blocked the download.");
    }
  };

  const clear = () => {
    if (!armed) {
      setArmed(true);
      return;
    }
    setArmed(false);
    onClear();
    setMsg("All notes cleared.");
  };

  const shown = [...notes].reverse();
  return (
    <aside
      role="dialog"
      aria-labelledby="fn-title"
      style={{
        position: "fixed",
        top: 0,
        right: 0,
        bottom: 0,
        width: mobile ? "100%" : 380,
        boxSizing: "border-box",
        zIndex: 30,
        display: "flex",
        flexDirection: "column",
        background: C.panel,
        borderLeft: `1px solid ${C.border}`,
        boxShadow: "0 0 40px rgba(0,0,0,0.5)",
        paddingTop: "env(safe-area-inset-top, 0px)",
        paddingBottom: "env(safe-area-inset-bottom, 0px)",
      }}
    >
      <div style={{ display: "flex", alignItems: "center", gap: 10, padding: "14px 16px", borderBottom: `1px solid ${C.border}` }}>
        <span style={{ color: C.signal_cyan }}>
          <BookIcon />
        </span>
        <h2 id="fn-title" ref={headRef} tabIndex={-1} style={{ margin: 0, flex: 1, fontFamily: HEAD_FONT, fontWeight: 700, fontSize: 18, color: C.text, outline: "none" }}>
          Field Notes
        </h2>
        <Chip color={C.text_mute}>{notes.length}</Chip>
        <Btn variant="ghost" onClick={onClose} ariaLabel="Close Field Notes">Close</Btn>
      </div>
      <div style={{ display: "flex", flexWrap: "wrap", gap: 8, padding: "10px 16px", borderBottom: `1px solid ${C.border}` }}>
        <Btn variant="ghost" onClick={exportMd} ariaLabel="Export notes as Markdown">Export as Markdown</Btn>
        <Btn variant="ghost" color={C.rose} pressed={armed} onClick={clear} disabled={!notes.length} ariaLabel={armed ? "Confirm: clear all notes" : "Clear all notes"}>
          {armed ? "Confirm clear" : "Clear all notes"}
        </Btn>
        <div aria-live="polite" style={{ width: "100%", fontSize: 12, color: C.text_mute, minHeight: 16 }}>{msg}</div>
      </div>
      <div style={{ flex: 1, overflowY: "auto", padding: "12px 16px" }}>
        {shown.length === 0 ? (
          <p style={{ margin: 0, fontSize: 14, color: C.text_mute }}>Nothing logged yet. Every correct decision writes a line here.</p>
        ) : (
          <ol style={{ margin: 0, padding: 0, listStyle: "none", display: "grid", gap: 10 }}>
            {shown.map((n, i) => (
              <li key={n.at + i} style={{ borderLeft: `2px solid ${C.signal_cyan}55`, paddingLeft: 10 }}>
                <div style={{ display: "flex", flexWrap: "wrap", gap: 6, alignItems: "center" }}>
                  <span style={{ fontFamily: MONO_FONT, fontSize: 11, color: C.text_dim }}>{noteTime(n.at)}</span>
                  <Chip color={C.signal_cyan}>{n.tool} {n.toolName}</Chip>
                  {n.tag && <Chip color={C.amber}>{n.tag}</Chip>}
                </div>
                <div style={{ marginTop: 4, fontSize: 13, lineHeight: 1.45, color: C.text }}>{n.text}</div>
              </li>
            ))}
          </ol>
        )}
      </div>
    </aside>
  );
}

/* ==========================================================================
   4. APP SHELL
   ========================================================================== */

function XPReadout({ xp, level }) {
  const C = useC();
  const floor = LEVEL_XP[level - 1];
  const ceil = LEVEL_XP[level];
  const pct = ceil === undefined ? 100 : Math.round(((xp - floor) / (ceil - floor)) * 100);
  return (
    <div
      style={{
        position: "relative",
        overflow: "hidden",
        padding: "6px 12px",
        border: `1px solid ${C.border}`,
        borderRadius: 4,
        background: C.bg,
        minWidth: 170,
      }}
    >
      <Scanline />
      <div style={{ display: "flex", alignItems: "baseline", gap: 10 }}>
        <span aria-label={`${xp} XP`} style={{ fontFamily: MONO_FONT, fontWeight: 700, fontSize: 18, color: C.signal_cyan }}>
          {String(xp).padStart(4, "0")}
        </span>
        <span style={{ fontFamily: MONO_FONT, fontSize: 11, color: C.text_dim }}>XP</span>
        <span style={{ fontFamily: UI_FONT, fontSize: 12, color: C.text_mute }}>
          <span style={{ fontFamily: MONO_FONT }}>LV{level}</span> {titleOf(level)}
        </span>
      </div>
      <div
        role="progressbar"
        aria-label={ceil === undefined ? "Maximum level reached" : `Progress to level ${level + 1}`}
        aria-valuemin={0}
        aria-valuemax={100}
        aria-valuenow={pct}
        style={{ marginTop: 6, height: 3, background: C.border, borderRadius: 2 }}
      >
        <div style={{ width: `${pct}%`, height: "100%", background: C.signal_cyan, borderRadius: 2 }} />
      </div>
    </div>
  );
}

function ResetButton({ onReset }) {
  const C = useC();
  const [armed, setArmed] = useState(false);
  const timer = useRef(null);
  useEffect(() => () => clearTimeout(timer.current), []);
  const click = () => {
    if (armed) {
      clearTimeout(timer.current);
      setArmed(false);
      onReset();
      return;
    }
    setArmed(true);
    timer.current = setTimeout(() => setArmed(false), 4000);
  };
  return (
    <Btn
      variant="ghost"
      color={C.rose}
      pressed={armed}
      onClick={click}
      ariaLabel={armed ? "Confirm reset: erases all progress" : "Reset progress"}
    >
      {armed ? "Confirm reset" : "Reset"}
    </Btn>
  );
}

function StatusStrip({ state, layer, theme, onToggleTheme, onToggleMute, onReset, onNotes, notesCount }) {
  const C = useC();
  return (
    <header
      style={{
        display: "flex",
        alignItems: "center",
        flexWrap: "wrap",
        gap: 16,
        padding: "12px 20px",
        borderBottom: `1px solid ${C.border}`,
        background: C.panel,
      }}
    >
      <h1 style={{ margin: 0, fontFamily: HEAD_FONT, fontWeight: 700, fontSize: 18, letterSpacing: "-0.02em", color: C.text }}>
        Tech Dev Lab
      </h1>
      <div aria-label="Current layer" style={{ display: "flex", alignItems: "center", gap: 8 }}>
        <Chip color={C[layer.accent]}>L{layer.num}</Chip>
        <span style={{ fontFamily: UI_FONT, fontSize: 13, color: C.text_mute }}>{layer.name}</span>
      </div>
      <div style={{ flex: 1 }} />
      <XPReadout xp={state.xp} level={state.level} />
      <Radar values={state.skillRadar} />
      <Btn variant="ghost" onClick={onNotes} ariaLabel={`Open Field Notes, ${notesCount} entries (Ctrl or Cmd + B)`}>
        <span style={{ display: "inline-flex", alignItems: "center", gap: 8 }}>
          <BookIcon />
          Field Notes
          <span style={{ fontFamily: MONO_FONT, fontSize: 11, color: C.text_dim }}>{notesCount}</span>
        </span>
      </Btn>
      <Btn
        variant="ghost"
        pressed={!state.muted}
        onClick={onToggleMute}
        ariaLabel={state.muted ? "Sound is off. Turn sound on" : "Sound is on. Turn sound off"}
      >
        {state.muted ? "Sound: Off" : "Sound: On"}
      </Btn>
      <Btn
        variant="ghost"
        onClick={onToggleTheme}
        ariaLabel={theme === "dark" ? "Dark mode is on. Switch to light mode (Ctrl or Cmd + J)" : "Light mode is on. Switch to dark mode (Ctrl or Cmd + J)"}
        title={theme === "dark" ? "Switch to light mode (Ctrl/Cmd + J)" : "Switch to dark mode (Ctrl/Cmd + J)"}
      >
        {theme === "dark" ? <SunIcon /> : <MoonIcon />}
      </Btn>
      <ResetButton onReset={onReset} />
    </header>
  );
}

function App() {
  const [state, setState] = useState(load);
  const [toolByLayer, setToolByLayer] = useState({});
  const [resetCount, setResetCount] = useState(0);
  const [notes, setNotes] = useState(loadNotes);
  const [notesOpen, setNotesOpen] = useState(false);
  const [theme, setTheme] = useState(loadTheme);
  const C = THEMES[theme];
  const fadeTimer = useRef(null);
  const mobile = useMediaQuery(`(max-width: ${MOBILE_BREAKPOINT - 1}px)`);
  const reduced = useMediaQuery("(prefers-reduced-motion: reduce)");

  useEffect(() => save(state), [state]);
  useEffect(() => {
    saveTheme(theme);
    document.body.style.background = THEMES[theme].bg;
  }, [theme]);
  // The 200 ms color fade runs only while switching, so no other change animates with it.
  const toggleTheme = () => {
    const root = document.documentElement;
    clearTimeout(fadeTimer.current);
    if (!window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
      root.classList.add("theme-fade");
      fadeTimer.current = setTimeout(() => root.classList.remove("theme-fade"), THEME_FADE_MS + 20);
    }
    setTheme(t => (t === "dark" ? "light" : "dark"));
  };

  // Field Notes live under their own key; notes from earlier builds (kept in
  // the app state) move over once.
  useEffect(() => {
    if (state.fieldNotes && state.fieldNotes.length) {
      const moved = [...state.fieldNotes].reverse().map(n => {
        const rest = Object.entries(n)
          .filter(([k]) => !["at", "tool", "source"].includes(k))
          .map(([k, v]) => `${k}: ${Array.isArray(v) ? v.join("; ") : v}`)
          .join(", ");
        return { at: n.at || new Date().toISOString(), tool: n.tool, toolName: toolNameOf(n.tool), tag: n.tag || null, text: `${toolNameOf(n.tool)}: ${rest}` };
      });
      saveTool(FIELD_NOTES_KEY, [...moved, ...loadNotes()]);
      setNotes(loadNotes());
      setState(s => ({ ...s, fieldNotes: [] }));
    }
  }, []);
  useEffect(() => {
    const refresh = () => setNotes(loadNotes());
    window.addEventListener(NOTES_EVENT, refresh);
    return () => window.removeEventListener(NOTES_EVENT, refresh);
  }, []);
  useEffect(() => {
    const onKey = e => {
      if ((e.ctrlKey || e.metaKey) && !e.altKey && (e.key === "b" || e.key === "B")) {
        e.preventDefault();
        setNotesOpen(o => !o);
      }
      if ((e.ctrlKey || e.metaKey) && !e.altKey && (e.key === "j" || e.key === "J")) {
        e.preventDefault();
        toggleTheme();
      }
    };
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, []);
  const clearNotes = () => {
    saveTool(FIELD_NOTES_KEY, []);
    setNotes([]);
  };

  const layer = LAYERS.find(l => l.id === state.activeLayer) || LAYERS[0];
  const toolId = toolByLayer[layer.id] || layer.tools[0].id;
  const tool = layer.tools.find(t => t.id === toolId) || layer.tools[0];

  const selectLayer = id => setState(s => ({ ...s, activeLayer: id }));
  const selectTool = id => setToolByLayer(m => ({ ...m, [layer.id]: id }));
  const toggleMute = () => setState(s => ({ ...s, muted: !s.muted }));
  const reset = () => {
    clearToolStorage();
    setState(DEFAULT_STATE);
    setToolByLayer({});
    setResetCount(n => n + 1);
    setNotes([]);
  };
  const testXP = () => setState(s => awardXP(s, 25));
  // Tools report each solved item here: XP, streak, skill radar, Field Notes.
  const recordResult = ({ xp, firstTry, firstPass, note, radar = RADAR_STEP }) => {
    if (note) logFieldNote(note);
    setState(s => {
      let next = awardXP(s, xp);
      const streak = firstTry === undefined ? s.streak : firstTry ? s.streak + 1 : 0;
      next = { ...next, streak, bestStreak: Math.max(s.bestStreak, streak) };
      if (firstPass) {
        const v = Math.min(100, Math.round((next.skillRadar[layer.id] + radar) * 10) / 10);
        next.skillRadar = { ...next.skillRadar, [layer.id]: v };
      }
      return next;
    });
  };

  const main = (
    <main style={{ padding: mobile ? 16 : 24, display: "grid", gap: 16, alignContent: "start", minWidth: 0 }}>
      <H as="h2" color={C[layer.accent]}>Layer {layer.num} &middot; {layer.name}</H>
      <ToolTabs layer={layer} activeId={tool.id} onSelect={selectTool} />
      <ToolSlot key={`${tool.id}-${resetCount}`} layer={layer} tool={tool} onTestXP={testXP} onResult={recordResult} />
    </main>
  );

  return (
    <ThemeCtx.Provider value={C}>
    <MotionCtx.Provider value={reduced}>
      <div style={{ minHeight: "100vh", background: C.bg, color: C.text, fontFamily: UI_FONT }}>
        <StatusStrip state={state} layer={layer} theme={theme} onToggleTheme={toggleTheme} onToggleMute={toggleMute} onReset={reset} onNotes={() => setNotesOpen(true)} notesCount={notes.length} />
        <FieldNotesDrawer open={notesOpen} onClose={() => setNotesOpen(false)} notes={notes} state={state} mobile={mobile} onClear={clearNotes} />
        {mobile ? (
          <div style={{ paddingBottom: 72 }}>
            {main}
            <div style={{ padding: "0 16px 16px" }}>
              <Helper layer={layer} tool={tool} />
            </div>
            <LayerNav active={layer.id} onSelect={selectLayer} mobile />
          </div>
        ) : (
          <div style={{ display: "grid", gridTemplateColumns: "220px minmax(0, 1fr) 300px", minHeight: "calc(100vh - 70px)" }}>
            <LayerNav active={layer.id} onSelect={selectLayer} mobile={false} />
            {main}
            <div style={{ padding: "24px 24px 24px 0" }}>
              <Helper layer={layer} tool={tool} />
            </div>
          </div>
        )}
      </div>
    </MotionCtx.Provider>
    </ThemeCtx.Provider>
  );
}

/* ==========================================================================
   5. RENDER
   ========================================================================== */

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
