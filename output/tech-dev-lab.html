<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tech Dev Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@500;700&display=swap">
<script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script crossorigin src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>
<style>
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: #f8fafc; color: #0f172a; height: 100%; }
body { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; -webkit-font-smoothing: antialiased; }
button { font-family: inherit; cursor: pointer; }
::selection { background: #cbd5e1; }
.mono { font-family: 'JetBrains Mono', monospace; }

.app { display: grid; grid-template-rows: auto 1fr auto; height: 100vh; }
.header {
  display: flex; justify-content: space-between; align-items: center;
  padding: 10px 18px; background: #ffffff; border-bottom: 1px solid #e2e8f0;
}
.brand { display: flex; align-items: center; gap: 12px; }
.brand-mark {
  width: 34px; height: 34px; background: #2563eb; color: #ffffff;
  border-radius: 4px; display: grid; place-items: center; font-weight: 700; font-size: 16px;
}
.brand-text h1 { font-size: 15px; font-weight: 700; margin: 0; letter-spacing: 0.5px; }
.brand-text .sub { font-size: 11px; color: #64748b; letter-spacing: 0.5px; text-transform: uppercase; }

.status-strip { display: flex; gap: 18px; align-items: center; font-size: 12px; }
.status-led {
  display: inline-flex; align-items: center; gap: 8px;
  font-family: 'JetBrains Mono', monospace; font-weight: 600;
  padding: 5px 10px; border-radius: 3px; border: 1px solid #e2e8f0; background: #f1f5f9;
}
.led { width: 9px; height: 9px; border-radius: 50%; background: #94a3b8; }
.led.ok { background: #10b981; }
.led.warn { background: #f59e0b; }
.led.fault { background: #ef4444; animation: blink 1s infinite; }
.led.pending { background: #3b82f6; }
@keyframes blink { 50% { opacity: 0.4; } }

.main { display: grid; grid-template-columns: 1fr 380px; min-height: 0; overflow: hidden; }
@media(max-width: 960px) { .main { grid-template-columns: 1fr; grid-template-rows: 1fr auto; } }

.diagram-panel {
  background: #ffffff; position: relative; overflow: auto; padding: 16px;
  border-right: 1px solid #e2e8f0;
}
.diagram-panel svg { display: block; width: 100%; height: auto; max-width: 1000px; margin: 0 auto; }

.instrument-panel {
  background: #f8fafc; display: flex; flex-direction: column;
  overflow: hidden; border-left: 1px solid #e2e8f0;
}

.tp {
  fill: #f1f5f9; stroke: #94a3b8; stroke-width: 1.5; cursor: pointer; transition: all 0.12s;
}
.tp:hover { fill: #e2e8f0; stroke: #64748b; }
.tp.probe-pos { fill: #ef4444; stroke: #b91c1c; }
.tp.probe-neg { fill: #3b82f6; stroke: #1d4ed8; }
.tp-label {
  font-family: 'JetBrains Mono', monospace; font-size: 9px;
  fill: #64748b; pointer-events: none; user-select: none;
}
.tp-label.active { fill: #0f172a; font-weight: 600; }

.wire { stroke: #cbd5e1; stroke-width: 2.5; fill: none; transition: stroke 0.2s; }
.wire.live { stroke: #10b981; }
.wire.broken { stroke: #ef4444; stroke-dasharray: 6 4; }
.wire.high-r { stroke: #f59e0b; }

.tool-tabs {
  display: grid; grid-template-columns: repeat(2, 1fr);
  background: #ffffff; border-bottom: 1px solid #e2e8f0;
}
.tool-tab {
  padding: 11px 8px; background: transparent; border: none; color: #64748b;
  font-size: 12px; font-weight: 600; letter-spacing: 0.6px; text-transform: uppercase;
  border-bottom: 2px solid transparent; transition: all 0.15s;
}
.tool-tab:hover { color: #0f172a; background: #f1f5f9; }
.tool-tab.active { color: #2563eb; border-bottom-color: #2563eb; background: #f8fafc; }

.tool-body { flex: 1; overflow-y: auto; padding: 16px; }
.dmm-body { display: flex; flex-direction: column; gap: 14px; }
.dmm-mode-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; }
.dmm-mode {
  padding: 8px 4px; background: #ffffff; border: 1px solid #cbd5e1;
  color: #475569; font-size: 11px; font-weight: 600; border-radius: 3px;
}
.dmm-mode.active { background: #2563eb; border-color: #2563eb; color: #ffffff; }

.dmm-display {
  background: #f1f5f9; border: 1px solid #cbd5e1; border-radius: 5px;
  padding: 20px 18px; position: relative; min-height: 96px;
  display: flex; flex-direction: column; justify-content: center;
}
.dmm-reading {
  font-family: 'JetBrains Mono', monospace; font-size: 38px; font-weight: 500;
  color: #0f172a; text-align: right; line-height: 1;
}
.dmm-reading.error { color: #ef4444; }
.dmm-reading.stale { color: #94a3b8; }
.dmm-unit { font-family: 'JetBrains Mono', monospace; font-size: 13px; color: #64748b; text-align: right; margin-top: 4px; font-weight: 600; }
.dmm-mode-tag {
  position: absolute; top: 10px; left: 14px;
  font-family: 'JetBrains Mono', monospace; font-size: 10px; color: #64748b; letter-spacing: 1.5px; font-weight: 600;
}

.probe-hint {
  font-size: 11px; color: #475569; line-height: 1.5; padding: 10px;
  background: #ffffff; border-radius: 4px; border-left: 3px solid #cbd5e1;
}
.alert-bar {
  padding: 8px 14px; font-size: 12px; font-family: 'JetBrains Mono', monospace;
  border-radius: 3px; letter-spacing: 0.3px; font-weight: 600;
}
.alert-bar.ok { background: #d1fae5; border: 1px solid #10b981; color: #047857; }
.alert-bar.err { background: #fee2e2; border: 1px solid #ef4444; color: #b91c1c; }
.alert-bar.warn { background: #fef3c7; border: 1px solid #f59e0b; color: #b45309; }
.alert-bar.pending { background: #dbeafe; border: 1px solid #3b82f6; color: #1d4ed8; }

.log-panel {
  border-top: 1px solid #e2e8f0; background: #ffffff;
  max-height: 200px; overflow-y: auto; padding: 10px 14px;
}
.log-title { font-size: 10px; color: #64748b; letter-spacing: 1.5px; font-weight: 700; margin-bottom: 6px; }
.log-entry {
  font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #475569;
  padding: 4px 0; line-height: 1.4; border-bottom: 1px solid #f1f5f9;
}
.log-entry .log-time { color: #94a3b8; margin-right: 8px; }
.log-entry.ok { color: #10b981; font-weight: 500; }
.log-entry.err { color: #ef4444; font-weight: 500; }
.log-entry.warn { color: #f59e0b; font-weight: 500; }
.log-entry.info { color: #2563eb; font-weight: 500; }

.footer {
  background: #ffffff; border-top: 1px solid #e2e8f0;
  padding: 12px 18px; display: grid; grid-template-columns: 1fr 1fr; gap: 16px;
}
@media(max-width: 960px) { .footer { grid-template-columns: 1fr; } }
.footer-section { display: flex; flex-direction: column; gap: 8px; }
.footer-label { font-size: 10px; color: #64748b; letter-spacing: 1.5px; font-weight: 700; text-transform: uppercase; }

.fault-grid, .action-grid { display: flex; flex-wrap: wrap; gap: 6px; }
.btn-action {
  padding: 7px 12px; background: #ffffff; border: 1px solid #cbd5e1;
  color: #0f172a; font-size: 11px; font-weight: 600; border-radius: 3px;
}
.btn-action:hover { background: #f1f5f9; border-color: #94a3b8; }
.btn-action.active-fault { background: #ef4444; border-color: #ef4444; color: #ffffff; }
.btn-action.random { border-color: #2563eb; color: #2563eb; }
.btn-action.random:hover { background: #2563eb; color: #ffffff; }

@keyframes scanline { from { top: 0%; } to { top: 100%; } }
@keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
@keyframes shake { 0%, 100% { transform: translateX(0); } 20% { transform: translateX(-4px); } 40% { transform: translateX(4px); } 60% { transform: translateX(-3px); } 80% { transform: translateX(2px); } }
@keyframes flow { to { stroke-dashoffset: -32; } }
@keyframes shieldPop { 0% { opacity: 0; transform: scale(0.85); } 60% { opacity: 1; transform: scale(1.04); } 100% { opacity: 1; transform: scale(1); } }

/* Diagnostic ribbon: spacing tightens below 1500px so it fits at 1400px. */
.diag-step { letter-spacing: 2px; padding: 0 6px; }
@media (max-width: 1499px) { .diag-step { letter-spacing: 1px; padding: 0 2px; } }

/* Wide tool content (chain, chassis, rung, tables) scrolls inside its panel on narrow windows.
   contain: inline-size stops the fixed-width content from widening the tool grid around it. */
.tool-scroll { overflow-x: auto; min-width: 0; contain: inline-size; }

/* Ribbon and tool scrollbars: thin, shown on hover only. */
.diag-ribbon, .tool-scroll { scrollbar-width: thin; scrollbar-color: transparent transparent; }
.diag-ribbon:hover, .tool-scroll:hover { scrollbar-color: #cbd5e1 transparent; }
.diag-ribbon::-webkit-scrollbar, .tool-scroll::-webkit-scrollbar { height: 6px; background: transparent; }
.diag-ribbon::-webkit-scrollbar-thumb, .tool-scroll::-webkit-scrollbar-thumb { background: transparent; border-radius: 3px; }
.diag-ribbon:hover::-webkit-scrollbar-thumb, .tool-scroll:hover::-webkit-scrollbar-thumb { background: #cbd5e1; }

html.theme-fade, html.theme-fade * { transition: background-color 200ms ease-out, border-color 200ms ease-out, color 200ms ease-out !important; }
</style>
</head>
<body style="margin:0;">
<script>try { if (localStorage.getItem("techDevLab.v3.theme") === "light") document.body.style.background = "#f8fafc"; } catch (e) {}</script>
<div id="root"></div>
<script>

<script type="text/babel">

function App() {

    <div className="app">
      <div className="header">
        <div className="brand">
          <div className="brand-mark">⚙</div>
          <div className="brand-text">
            <h1>TECH DEV LAB</h1>

          </div>

            <rect x="50" y="50" width="300" height="200" fill="none" stroke="#e2e8f0" strokeWidth="2" rx="4"/>
            <text x="200" y="160" textAnchor="middle" fill="#64748b" fontSize="14" fontWeight="600">

        <div className="instrument-panel">
          <div className="tool-tabs">

          </div>

            <div className="dmm-body">

                  <div className="dmm-reading">--.--</div>

        </div>
      </div>
    </div>

ReactDOM.render(<App />, document.getElementById("root"));

</body>
</html>
